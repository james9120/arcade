<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Physics Sandbox</title>
  <style>
    * { box-sizing: border-box; touch-action: none; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0d12;
      color: #eef2f7;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
    .bar {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      display: flex;
      gap: 0.45rem;
      padding: 0.7rem 0.7rem calc(0.7rem + env(safe-area-inset-bottom));
      background: linear-gradient(transparent, #0b0d12 30%);
    }
    button {
      flex: 1;
      min-height: 2.75rem;
      border: 0;
      border-radius: 0.8rem;
      background: #232833;
      color: #eef2f7;
      font: inherit;
      font-weight: 600;
    }
    button.on { background: #7dd3fc; color: #0b0d12; }
    a.back {
      position: fixed;
      top: calc(0.7rem + env(safe-area-inset-top));
      left: 0.7rem;
      color: #9aa3b2;
      text-decoration: none;
      font-size: 0.9rem;
      z-index: 2;
    }
    .hint {
      position: fixed;
      top: calc(0.7rem + env(safe-area-inset-top));
      right: 0.7rem;
      color: #9aa3b2;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <a class="back" href="../../">Arcade</a>
  <div class="hint">tap to drop · drag to throw</div>
  <div class="bar">
    <button id="ball" class="on">Ball</button>
    <button id="box">Box</button>
    <button id="poly">Shape</button>
    <button id="clear">Clear</button>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script>
    const { Engine, Render, Runner, Bodies, Body, Composite, Constraint, Mouse, MouseConstraint, Events } = Matter;

    const engine = Engine.create();
    engine.gravity.y = 1.05;
    const world = engine.world;

    const render = Render.create({
      element: document.body,
      engine,
      options: {
        width: innerWidth,
        height: innerHeight,
        background: "#0b0d12",
        wireframes: false,
        pixelRatio: Math.min(devicePixelRatio || 1, 2)
      }
    });
    Render.run(render);
    const runner = Runner.create();
    Runner.run(runner, engine);

    const wall = (x, y, w, h) => Bodies.rectangle(x, y, w, h, {
      isStatic: true,
      render: { fillStyle: "#1a1f29" }
    });

    function bounds() {
      const w = innerWidth, h = innerHeight;
      Composite.clear(world, false);
      Composite.add(world, [
        wall(w / 2, h + 30, w + 80, 80),
        wall(-30, h / 2, 80, h + 80),
        wall(w + 30, h / 2, 80, h + 80),
        wall(w / 2, -40, w + 80, 80)
      ]);

      const plank = Bodies.rectangle(w * 0.5, h * 0.62, Math.min(w * 0.55, 280), 18, {
        chamfer: { radius: 6 },
        render: { fillStyle: "#8b9bb4" }
      });
      const hinge = Constraint.create({
        bodyA: plank,
        pointA: { x: 0, y: 0 },
        pointB: { x: w * 0.5, y: h * 0.62 },
        stiffness: 1,
        length: 0,
        render: { visible: false }
      });
      const peg = Bodies.circle(w * 0.5, h * 0.62, 8, {
        isStatic: true,
        render: { fillStyle: "#7dd3fc" }
      });
      Composite.add(world, [plank, hinge, peg]);

      const ramp = Bodies.rectangle(w * 0.22, h * 0.78, Math.min(w * 0.5, 220), 16, {
        isStatic: true,
        angle: 0.45,
        chamfer: { radius: 6 },
        render: { fillStyle: "#2a3140" }
      });
      Composite.add(world, ramp);
    }

    const colors = ["#7dd3fc", "#f9a8d4", "#fde68a", "#86efac", "#c4b5fd", "#fda4af"];
    const pick = () => colors[Math.floor(Math.random() * colors.length)];
    let mode = "ball";

    function spawn(x, y) {
      const c = pick();
      let body;
      if (mode === "box") {
        const s = 28 + Math.random() * 26;
        body = Bodies.rectangle(x, y, s, s, {
          chamfer: { radius: 4 },
          restitution: 0.35,
          friction: 0.2,
          render: { fillStyle: c }
        });
      } else if (mode === "poly") {
        body = Bodies.polygon(x, y, 3 + Math.floor(Math.random() * 4), 18 + Math.random() * 16, {
          restitution: 0.4,
          friction: 0.15,
          render: { fillStyle: c }
        });
      } else {
        body = Bodies.circle(x, y, 14 + Math.random() * 16, {
          restitution: 0.72,
          friction: 0.05,
          render: { fillStyle: c }
        });
      }
      Composite.add(world, body);
    }

    const mouse = Mouse.create(render.canvas);
    mouse.pixelRatio = render.options.pixelRatio;
    const mouseConstraint = MouseConstraint.create(engine, {
      mouse,
      constraint: { stiffness: 0.2, render: { visible: false } }
    });
    Composite.add(world, mouseConstraint);
    render.mouse = mouse;

    let dragging = false;
    Events.on(mouseConstraint, "startdrag", () => { dragging = true; });
    Events.on(mouseConstraint, "enddrag", () => { setTimeout(() => { dragging = false; }, 40); });

    render.canvas.addEventListener("pointerup", (e) => {
      if (dragging) return;
      if (e.target !== render.canvas) return;
      const rect = render.canvas.getBoundingClientRect();
      spawn(e.clientX - rect.left, e.clientY - rect.top);
    });

    function setMode(next) {
      mode = next;
      for (const id of ["ball", "box", "poly"]) {
        document.getElementById(id).classList.toggle("on", id === next);
      }
    }
    document.getElementById("ball").onclick = () => setMode("ball");
    document.getElementById("box").onclick = () => setMode("box");
    document.getElementById("poly").onclick = () => setMode("poly");
    document.getElementById("clear").onclick = () => bounds();

    addEventListener("resize", () => {
      render.canvas.width = innerWidth * render.options.pixelRatio;
      render.canvas.height = innerHeight * render.options.pixelRatio;
      render.options.width = innerWidth;
      render.options.height = innerHeight;
      render.bounds.max.x = innerWidth;
      render.bounds.max.y = innerHeight;
      bounds();
    });

    bounds();
    spawn(innerWidth * 0.45, 80);
    spawn(innerWidth * 0.55, 40);
  </script>
</body>
</html>
