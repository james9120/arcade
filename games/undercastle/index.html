<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a080c" />
  <title>Undercastle · s20</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh;
      overflow: hidden; overscroll-behavior: none; touch-action: none;
      background: #0a080c; color: #e8dcc8;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      user-select: none; -webkit-user-select: none;
    }
    #app {
      display: flex; flex-direction: column;
      width: 100%; height: 100%; height: 100dvh;
    }
    #stage { position: relative; flex: 1; min-height: 0; background: #0a080c; }
    canvas {
      display: block; width: 100%; height: 100%;
      touch-action: none;
      image-rendering: pixelated; image-rendering: crisp-edges;
    }
    #home {
      position: absolute;
      left: max(0.55rem, env(safe-area-inset-left, 0px));
      top: max(0.4rem, env(safe-area-inset-top, 0px));
      z-index: 8;
      color: #cbb89a;
      text-decoration: none;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.32rem 0.58rem;
      border-radius: 999px;
      background: rgba(12, 8, 8, 0.62);
      border: 1px solid #4a3824;
      box-shadow: 0 1px 0 #0008, inset 0 1px 0 #6a543888;
      touch-action: manipulation;
    }
    #title {
      position: absolute;
      left: 50%; top: max(0.48rem, env(safe-area-inset-top, 0px));
      transform: translateX(-50%);
      z-index: 3; pointer-events: none;
      font-size: 0.62rem; font-weight: 800;
      letter-spacing: 0.28em; text-transform: uppercase;
      color: #a89070;
      text-shadow: 0 1px 0 #000a;
    }
    #hud {
      position: absolute;
      right: max(0.5rem, env(safe-area-inset-right, 0px));
      top: max(0.38rem, env(safe-area-inset-top, 0px));
      z-index: 4;
      display: flex; align-items: center; gap: 0.45rem;
    }
    #stats {
      display: none;
      pointer-events: none;
      text-align: right;
      font-size: 0.62rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: #9a8670;
      font-variant-numeric: tabular-nums;
      line-height: 1.4;
      text-shadow: 0 1px 2px #000c;
    }
    #mute {
      width: 2.05rem; height: 2.05rem; padding: 0;
      border-radius: 999px;
      border: 1px solid #4a3824;
      background: radial-gradient(circle at 40% 30%, #2c2218, #16110e);
      color: #d4c0a0;
      box-shadow: 0 1px 0 #0008, inset 0 1px 0 #6a543866;
      touch-action: manipulation;
    }
    #mute svg { display: block; margin: 0 auto; }
    #mute.off { color: #7a6a58; }
    #mute.off .wave { display: none; }
    #mute:not(.off) .slash { display: none; }
    #tools {
      display: flex; gap: 0.32rem; align-items: stretch;
      padding: 0.42rem 0.42rem calc(0.48rem + env(safe-area-inset-bottom, 0px));
      padding-left: max(0.42rem, env(safe-area-inset-left, 0px));
      padding-right: max(0.42rem, env(safe-area-inset-right, 0px));
      background:
        linear-gradient(180deg, #3a2c1e 0%, #221810 6%, #140f0c 100%);
      border-top: 1px solid #5a4430;
      box-shadow: inset 0 1px 0 #7a604088, 0 -10px 28px #0006;
    }
    #tools button {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.12rem;
      min-height: 3.35rem;
      padding: 0.28rem 0.1rem 0.3rem;
      border-radius: 0.8rem;
      border: 1px solid #2a2018;
      border-bottom-color: #0e0a08;
      background: linear-gradient(180deg, #2a221a 0%, #181410 100%);
      color: #b8a488;
      font-weight: 800;
      font-size: 0.62rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      box-shadow: inset 0 1px 0 #3e342c, 0 1px 0 #0a0806;
      touch-action: manipulation;
    }
    #tools button svg { width: 1.15rem; height: 1.15rem; display: block; }
    #tools button.on {
      background: linear-gradient(180deg, #6a4218 0%, #3d2410 100%);
      color: #f6e4c0;
      border-color: #e0a848;
      box-shadow:
        inset 0 0 0 1px #e8b860,
        inset 0 1px 0 #f0d090,
        0 0 14px #e0a84844;
    }
    #tools button#clear {
      flex: 0.72;
      color: #c4a090;
      max-width: 4.2rem;
    }
    #tools button#clear.on { color: #f6e4c0; }
    #tools button:active { transform: scale(0.97); }
    #tools .tool-empty {
      flex: 0.88;
      min-width: 2.2rem;
      max-width: 3.4rem;
      min-height: 3.35rem;
      border-radius: 0.8rem;
      border: 1px dashed #3a3028;
      background: #100e0c;
      box-shadow: inset 0 0 0 1px #1c1814;
      pointer-events: none;
    }

    #app:not(.play) #tools { display: none; }
    #app:not(.play) #title, #app:not(.play) #hud, #app:not(.play) #menu, #app:not(.play) #goal {
      visibility: hidden; pointer-events: none;
    }
    #menu {
      position: absolute;
      left: max(5.4rem, calc(env(safe-area-inset-left, 0px) + 4.85rem));
      top: max(0.4rem, env(safe-area-inset-top, 0px));
      z-index: 4;
      color: #cbb89a;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.32rem 0.58rem;
      border-radius: 999px;
      background: rgba(12, 8, 8, 0.62);
      border: 1px solid #4a3824;
      box-shadow: 0 1px 0 #0008, inset 0 1px 0 #6a543888;
      touch-action: manipulation;
    }
    #goal {
      position: absolute;
      left: 50%;
      top: max(1.7rem, calc(env(safe-area-inset-top, 0px) + 1.25rem));
      transform: translateX(-50%);
      z-index: 4;
      pointer-events: none;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #c4a878;
      text-shadow: 0 1px 3px #000c;
      white-space: nowrap;
      max-width: 72%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #goal.gold, #stats.gold {
      color: #f3d78a;
      text-shadow: 0 0 14px #e8b860cc, 0 1px 2px #000c;
    }
    #toast {
      position: absolute;
      left: 50%; top: 42%;
      transform: translate(-50%, -50%);
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #f6e4c0;
      text-shadow: 0 0 18px #e8b860aa, 0 2px 8px #000c;
      transition: opacity 0.25s ease;
      text-align: center;
    }
    #toast.show { opacity: 1; }
    #veil {
      position: absolute; inset: 0; z-index: 6;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 1.2rem 1.1rem 1.4rem;
      background:
        linear-gradient(180deg, rgba(10,8,12,0.28) 0%, rgba(10,8,12,0.55) 38%, rgba(10,8,12,0.82) 100%);
    }
    #app.play #veil { display: none; }
    .wordmark {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #f0e0c4;
      text-shadow: 0 2px 0 #0008, 0 0 28px #e8a04044;
      margin: 0 0 0.35rem;
    }
    .tag {
      margin: 0 0 1.15rem;
      color: #b8a488;
      font-size: 0.86rem;
      letter-spacing: 0.02em;
      text-align: center;
    }
    #stamp {
      display: none;
      margin: -0.35rem 0 0.95rem;
      padding: 0.22rem 0.7rem;
      border: 1px solid #c4a060;
      border-radius: 999px;
      color: #e8c878;
      font-size: 0.58rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      box-shadow: 0 0 16px #e8b86033, inset 0 0 8px #e8b86022;
    }
    #stamp.on { display: inline-block; }
    #menu-stack, #how-card {
      display: flex; flex-direction: column; align-items: center;
      width: min(20.5rem, 100%);
    }
    #app.how #menu-stack { display: none; }
    #app:not(.how) #how-card { display: none; }
    #veil .cta {
      width: 100%;
      min-height: 3.05rem;
      margin: 0 0 0.45rem;
      border-radius: 0.9rem;
      border: 1px solid #5a4030;
      background: linear-gradient(180deg, #3a2a1c 0%, #1c1410 100%);
      color: #f0e0c4;
      font-weight: 800;
      font-size: 0.92rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      box-shadow: inset 0 1px 0 #6a5438, 0 2px 0 #0a0806;
      touch-action: manipulation;
    }
    #veil .cta.primary {
      border-color: #e0a848;
      background: linear-gradient(180deg, #6a4218 0%, #3d2410 100%);
      box-shadow: inset 0 1px 0 #f0d090, 0 0 18px #e0a84833;
    }
    #veil .cta:active { transform: scale(0.98); }
    #veil .row { display: flex; gap: 0.45rem; width: 100%; margin-top: 0.15rem; }
    #veil .row .cta { flex: 1; min-height: 2.7rem; font-size: 0.78rem; }
    #how-card {
      background: rgba(14, 10, 10, 0.78);
      border: 1px solid #5a4430;
      border-radius: 1.15rem;
      padding: 1.2rem 1.05rem 1.05rem;
      box-shadow: inset 0 1px 0 #6a543866, 0 16px 40px #000a;
    }
    #how-card h2 {
      margin: 0 0 0.7rem;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #c4a878;
    }
    #how-card p {
      margin: 0 0 0.45rem;
      color: #e0d0b4;
      font-size: 0.92rem;
      line-height: 1.35;
      text-align: center;
    }
    #how-card p:last-of-type { margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div id="app" class="title">
    <div id="stage">
      <a id="home" href="../../">Arcade</a>
      <button type="button" id="menu">Menu</button>
      <div id="title">Undercastle · s20</div>
      <div id="goal"></div>
      <div id="toast"></div>
      <div id="hud">
        <div id="stats">rooms 0<br>alive 0</div>
        <button type="button" id="mute" aria-label="Mute">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M2.5 6.2h2.1L8 3.6v8.8L4.6 9.8H2.5V6.2z" fill="currentColor"/>
            <path class="wave" d="M10.1 5.2a3.2 3.2 0 010 5.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            <path class="slash" d="M3 13 L13 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <canvas id="c"></canvas>
    </div>
    <nav id="tools">
      <button type="button" data-tool="dig" class="on">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M9.8 2.2l4 4-1.2 1.2-4-4L9.8 2.2z" fill="currentColor"/>
          <path d="M8.2 5.2l2.6 2.6-6.4 6.2H2.2v-2.1L8.2 5.2z" fill="currentColor" opacity="0.85"/>
        </svg>
        Dig
      </button>
      <button type="button" data-tool="soil">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M2 11.2c1.4-3.2 3-5.4 6-5.4s4.6 2.2 6 5.4H2z" fill="currentColor"/>
          <path d="M3.2 11.2h9.6v2.2H3.2z" fill="currentColor" opacity="0.7"/>
        </svg>
        Soil
      </button>
      <button type="button" data-tool="stone">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M3.2 5.2h6.2v6.2H3.2z" fill="currentColor"/>
          <path d="M6.6 3.4h6.2v6.2H6.6z" fill="currentColor" opacity="0.55"/>
        </svg>
        Stone
      </button>
      <button type="button" data-tool="water">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 2.4c2.8 3.2 4.6 5.4 4.6 7.4A4.6 4.6 0 118 2.4z" fill="currentColor"/>
        </svg>
        Water
      </button>
      <div class="tool-empty" aria-hidden="true"></div>
      <button type="button" id="clear" data-tool="clear">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M4 4l8 8M12 4L4 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        Clear
      </button>
    </nav>
    <div id="veil">
      <div id="menu-stack">
        <div class="wordmark">Undercastle</div>
        <p class="tag">Carve a palace from the earth.</p>
        <div id="stamp">Master Builder</div>
        <button type="button" class="cta primary" id="btn-continue">Continue</button>
        <button type="button" class="cta" id="btn-new">New</button>
        <div class="row">
          <button type="button" class="cta" id="btn-how">How</button>
          <button type="button" class="cta" id="btn-mute2">Mute</button>
        </div>
      </div>
      <div id="how-card">
        <h2>How</h2>
        <p>Drag to raise earth. Stone holds the roof.</p>
        <p>Wide halls slump. Pillars do not.</p>
        <p>Dry rooms grow crystals. Wet rooms, mushrooms.</p>
        <button type="button" class="cta primary" id="btn-gotit">Got it</button>
      </div>
    </div>
  </div>
  <script>
(function () {

  "use strict";

  var EMPTY = 0, SOIL = 1, SAND = 2, STONE = 3, WATER = 4, CRYSTAL = 5, MUSHROOM = 6;
  var CELL = 7, PX = 4, GROW = 0.00016;
  var SOLID = [0, 1, 1, 1, 0, 1, 1];

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
  var statsEl = document.getElementById("stats");
  var muteBtn = document.getElementById("mute");
  var buttons = document.querySelectorAll("#tools button");

  var W = 0, H = 0, N = 0, cssW = 0, cssH = 0, dpr = 1;
  var grid, spans, visited, moved, queue, sealed, light, glowR, glowG, glowB, colLight, packed, held;
  var off, offCtx, img, pix, imgW = 0, imgH = 0;

  var tool = "dig";
  var simTick = 0, frameTick = 0;
  var rooms = 0, alive = 0, lastHud = "";
  var painting = false, lastX = -1, lastY = -1;
  var hoverX = 0, hoverY = 0, hoverOn = false;
  var zoom = 1, viewX = 0, viewY = 0;
  var pins = {}, pinching = false, pinchDist0 = 0, pinchZoom0 = 1, pinchFX = 0, pinchFY = 0;
  var shake = 0, caveAcc = 0, caveCool = 0;
  var muted = false;

  var PMAX = 160, pc = 0;
  var px = new Float32Array(PMAX), py = new Float32Array(PMAX);
  var pvx = new Float32Array(PMAX), pvy = new Float32Array(PMAX);
  var plife = new Float32Array(PMAX), pmax = new Float32Array(PMAX);
  var pr = new Uint8Array(PMAX), pg = new Uint8Array(PMAX), pb = new Uint8Array(PMAX);

  var motes = [];
  var audio = null;

  var SAVE_KEY = "undercastle.v1";
  var appEl = document.getElementById("app");
  var goalEl = document.getElementById("goal");
  var toastEl = document.getElementById("toast");
  var stampEl = document.getElementById("stamp");
  var menuBtn = document.getElementById("menu");
  var mute2 = document.getElementById("btn-mute2");
  var screen = "title";
  var playing = false;
  var mode = "sandbox";
  var charterStep = 0;
  var charterDone = false;
  var hallTime = 0;
  var goldFlash = 0;
  var dirty = false;
  var lastSaveAt = 0;
  var lastFrameT = 0;
  var toastT = 0;
  var loadedOnce = false;
  var pendingSave = null;

  var SKY_DAY = 0.25, SKY_NIGHT = 0.75;
  var skyLock = null, skyClock = SKY_DAY, skyCaptureBooted = false;
  try {
    var skyQ = (new URLSearchParams(window.location.search).get("sky") || "").toLowerCase();
    if (skyQ === "day") skyLock = "day";
    else if (skyQ === "night") skyLock = "night";
  } catch (e) {}

  function skyPhase() {
    if (skyLock === "day") return SKY_DAY;
    if (skyLock === "night") return SKY_NIGHT;
    return skyClock;
  }

  function skyDayness() {
    return 0.5 + 0.5 * Math.cos((skyPhase() - SKY_DAY) * Math.PI * 2);
  }

  function sunCell() {
    var d = skyPhase() - SKY_DAY;
    return { x: W * (0.28 + d * 0.50), y: H * (0.08 + d * d * 1.05) };
  }

  function moonCell() {
    var d = skyPhase() - SKY_NIGHT;
    return { x: W * (0.78 + d * 0.46), y: H * (0.10 + d * d * 0.90) };
  }

  function skyPix(px, py) {
    var gx = (px / PX) | 0, gy = (py / PX) | 0;
    if (gx < 0 || gy < 0 || gx >= W || gy >= H) return false;
    var i = gy * W + gx;
    return grid[i] === EMPTY && !sealed[i];
  }

  function clamp8(v) {
    return v < 0 ? 0 : v > 255 ? 255 : v | 0;
  }

  function hash(x, y) {
    var n = ((x * 374761393) + (y * 668265263)) >>> 0;
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    return n >>> 0;
  }

  function alloc() {
    grid = new Uint8Array(N);
    spans = new Uint16Array(N);
    visited = new Uint8Array(N);
    moved = new Uint8Array(N);
    queue = new Int32Array(N);
    sealed = new Uint8Array(N);
    light = new Float32Array(N);
    glowR = new Float32Array(N);
    glowG = new Float32Array(N);
    glowB = new Float32Array(N);
    colLight = new Float32Array(W);
    packed = new Uint8Array(N);
    held = new Uint8Array(N);
    imgW = W * PX;
    imgH = H * PX;
    off = document.createElement("canvas");
    off.width = imgW;
    off.height = imgH;
    offCtx = off.getContext("2d", { alpha: false });
    img = offCtx.createImageData(imgW, imgH);
    pix = img.data;
  }

  function worldHasDirt() {
    var i, n = 0;
    for (i = 0; i < N; i++) {
      if (grid[i] === SOIL || grid[i] === SAND) n++;
    }
    return n >= 80;
  }

  function plantHill() {
    var floorY = H - 3;
    var hillW = Math.max(10, ((W * 48) / 100) | 0);
    var peak = 13;
    var cx = (W >> 1) + ((hash(7, 3) % 5) - 2);
    var half = hillW * 0.5;
    var x, y, i, dx, u, n, h;
    for (x = 0; x < W; x++) {
      dx = (x + 0.5 - cx) / half;
      if (dx < -1 || dx > 1) continue;
      u = dx < 0 ? -dx : dx;
      n = ((hash(x, 29) & 7) - 3) * 0.35;
      h = (peak * (1 - u * u) + n + 0.5) | 0;
      if (h < 1) h = 1;
      if (h > 16) h = 16;
      for (y = floorY - h; y < floorY; y++) {
        if (y < 0) continue;
        i = y * W + x;
        grid[i] = SOIL;
        packed[i] = 255;
      }
    }
  }

  function generate() {
    grid.fill(EMPTY);
    sealed.fill(0);
    if (packed) packed.fill(0);
    var x, y;
    for (y = H - 3; y < H; y++) {
      for (x = 0; x < W; x++) grid[y * W + x] = STONE;
    }
    plantHill();
    pc = 0;
    shake = 0;
    caveAcc = 0;
    caveCool = 0;
    rooms = 0;
    alive = 0;
    hallTime = 0;
    dirty = true;
    seedMotes();
  }

  function seedMotes() {
    motes.length = 0;
    var i, n = 14;
    for (i = 0; i < n; i++) {
      motes.push({
        x: Math.random() * Math.max(W, 1),
        y: Math.random() * Math.max(H * 0.55, 1),
        vx: (Math.random() - 0.5) * 0.015,
        vy: (Math.random() - 0.4) * 0.01,
        ph: Math.random() * 6.28
      });
    }
  }

  function fit() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var cw = canvas.clientWidth;
    var ch = canvas.clientHeight;
    if (cw < 8 || ch < 8) return false;
    cssW = cw;
    cssH = ch;
    canvas.width = (cw * dpr) | 0;
    canvas.height = (ch * dpr) | 0;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
    var nw = Math.max(24, (cw / CELL) | 0);
    var nh = Math.max(24, (ch / CELL) | 0);
    if (nw !== W || nh !== H) {
      var oldG = grid, oldW = W, oldH = H;
      W = nw;
      H = nh;
      N = W * H;
      alloc();
      generate();
      if (oldG && oldW) blitGrid(oldG, oldW, oldH);
      else if (!loadedOnce) {
        loadedOnce = true;
        bootSave();
      }
    }
    clampView();
    return true;
  }

  function blitGrid(src, sw, sh) {
    var cw = Math.min(W, sw), ch = Math.min(H, sh), x, y;
    for (y = 0; y < ch; y++) {
      var sy = sh - ch + y, dy = H - ch + y;
      for (x = 0; x < cw; x++) grid[dy * W + x] = src[sy * sw + x];
    }
  }

      for (x = 0; x < W; x++) {
        i = y * W + x;
        L = light[i];

  function stepParticles() {

      pvy[i] += 0.018;
      py[i] += pvy[i];

        ddy = y + 0.5 - cy;

        fall = 1 - Math.sqrt(d2) / (r + 0.15);

        } else if (tool === "soil") {
          if (fall < 0.52 && (hash(x, y) & 255) > fall * 340) continue;
        } else if (tool === "stone") {
          if (fall < 0.28) continue;
        } else if (fall < 0.22) continue;

        t = grid[i];

          if (t === EMPTY) continue;
          if (t === SOIL && fall < 0.48 && (hash(x, y + 11) & 3) === 0) {
            grid[i] = SAND;
            crumbs++;
          } else {
            grid[i] = EMPTY;
          }
          packed[i] = 0;
          changed++;
        } else if (tool === "soil") {
          if (t === EMPTY || t === SAND || t === WATER || t === SOIL) {
            grid[i] = SOIL;
            packed[i] = 48;
            changed++;
          }
        } else if (tool === "stone") {
          if (t !== STONE) {
            grid[i] = STONE;
            packed[i] = 0;
            changed++;
          }
        } else if (tool === "water") {
          if (t === EMPTY) { grid[i] = WATER; changed++; }
        }
      }
    }
    if (changed) {
      sfxPaint(tool, changed);
      dirty = true;
      if (tool === "dig") {
        spawnDust(cx, cy, Math.min(28, 10 + changed), 255, 236, 190);
        spawnDust(cx, cy, Math.min(16, 6 + (changed >> 1)), 232, 196, 120);

    } catch (e) { return null; }
  }

      refreshPlayLabels();
      return;
    }
    muted = !!data.muted;
    charterDone = !!data.charterDone;
    charterStep = data.charterStep | 0;

    mode = data.mode === "charter" ? "charter" : "sandbox";

    refreshPlayLabels();

  function refreshStamp() {

  function refreshPlayLabels() {

    var neu = document.getElementById("btn-new");

      cont.style.display = has ? "" : "none";
      cont.textContent = "Continue";
    }

      neu.textContent = "New";
    }
  }

  function setScreen(next) {

  function showToast(msg) {

  }

  function flashGold() {
    goldFlash = 1.1;
    statsEl.classList.add("gold");
    goalEl.classList.add("gold");
  }

  function hallStanding() {
    if (N === 0) return false;
    var x, y, i, roofed = 0, collapsing = 0, volume = 0, t;
    for (y = 0; y < H - 1; y++) {
      for (x = 0; x < W; x++) {
        i = y * W + x;
        t = grid[i];
        if ((t === SOIL || t === STONE) && grid[i + W] === EMPTY) {

          if (t === SOIL && spans[i] >= 6 && !nearStone(x, y)) collapsing++;

        if (t === EMPTY && y > 0 && y < H - 3 && SOLID[grid[i - W]]) volume++;
      }
    }
    return volume >= 12 && roofed >= 6 && collapsing === 0;
  }

  function updateGoal() {

      goalEl.textContent = "";

    else if (charterStep === 1) goalEl.textContent = "II  Seal a dry room";
    else if (charterStep === 2) goalEl.textContent = "III  Wet cellar";
    else goalEl.textContent = "Master builder";
  }

  function completeGoal(msg) {
    charterStep++;

      charterStep = 3;
      charterDone = true;
      refreshStamp();
      msg = "Master builder";
    }
    flashGold();
    sfxFanfare();
    showToast(msg);
    dirty = true;
    writeSave();
    updateGoal();
  }

  function stepCharter(dt) {
    if (mode !== "charter" || !playing) return;
    if (charterStep === 0) {
      if (hallStanding()) {
        hallTime += dt;
        if (hallTime >= 10) {
          hallTime = 10;
          completeGoal("The hall stands");
        }
      } else {
        hallTime = Math.max(0, hallTime - dt * 1.6);
      }
      if ((frameTick & 7) === 0) updateGoal();
    } else if (charterStep === 1) {
      var i, hasC = false;
      for (i = 0; i < N; i++) if (grid[i] === CRYSTAL) { hasC = true; break; }
      if (hasC) completeGoal("A crystal is born");
    } else if (charterStep === 2) {
      var j, hasM = false;
      for (j = 0; j < N; j++) if (grid[j] === MUSHROOM) { hasM = true; break; }
      if (hasM) completeGoal("The cellar lives");
    }
  }

  function sfxFanfare() {
    if (!audio || muted) return;

  buttons.forEach(function (btn) {

      d[i] = acc * 6 + (Math.random() * 2 - 1) * 0.25;

    bedF.Q.value = 0.7;

    bedSrc.connect(bedF);
    bedF.connect(bedG);
    bedG.connect(master);

    hum.type = "sine";
    hum.frequency.value = 52;
    var humG = actx.createGain();
    humG.gain.value = 0.012;
    hum.connect(humG);
    humG.connect(master);
    hum.start();

    var lfo = actx.createOscillator();
    lfo.frequency.value = 0.07;
    var lfoG = actx.createGain();
    lfoG.gain.value = 40;
    lfo.connect(lfoG);
    lfoG.connect(bedF.frequency);

    } else if (kind === "stone") {
      tone(t, 88, "triangle", 0.14, 0.12);
      burstNoise(t, 0.04, 400, 0.7, 0.08);
    } else if (kind === "water") {
      burstNoise(t, 0.12, 720, 0.5, 0.1);
    } else {
      burstNoise(t, 0.055, 420, 0.8, 0.1);
      tone(t, 70, "sine", 0.05, 0.08);
    }
  }

    burstNoise(t, Math.min(0.7, 0.28 + n * 0.018), 130, 0.55, 0.1 + Math.min(0.1, n * 0.006));
  }

    var g = ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    src.connect(f);
    f.connect(g);
    g.connect(audio.master);
    src.start(t);
    src.stop(t + dur + 0.02);
  }

  window.addEventListener("resize", fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { endPaint(); writeSave(); }
    if (!audio) return;
    if (document.hidden) audio.ctx.suspend();
    else if (!muted) audio.ctx.resume();
  });

  function frame(now) {
    if (N === 0) fit();
    var dt = lastFrameT ? Math.min(0.05, (now - lastFrameT) / 1000) : 0.016;
    lastFrameT = now || 0;
    if (N > 0) {
      if (!skyLock) {
        skyClock += dt / 90;
        if (skyClock >= 1) skyClock -= 1;
      }
      if (skyLock && !skyCaptureBooted) {
        skyCaptureBooted = true;
      }
      step();
      step();
      if (playing) {
        stepCharter(dt);
        if (dirty && now - lastSaveAt > 3000) writeSave();
      }
      if (goldFlash > 0) {
        goldFlash -= dt;
        if (goldFlash <= 0) {
          goldFlash = 0;
          statsEl.classList.remove("gold");
          goalEl.classList.remove("gold");
        }
      }
      if (toastT > 0) {
        toastT -= dt;
        if (toastT <= 0) toastEl.classList.remove("show");
      }
      render();
      frameTick++;
    }
    requestAnimationFrame(frame);
  }

  if (!fit()) {
    requestAnimationFrame(function retry() {
      if (!fit()) requestAnimationFrame(retry);
    });
  }
  requestAnimationFrame(frame);
})();
  </script>
