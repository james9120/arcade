<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#eaf3f5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Downhill · Endless Ski</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23eaf3f5'/%3E%3Cpath d='M8 48 29 13 40 32 46 23 58 48Z' fill='%23245758'/%3E%3Cpath d='m29 13-8 14 8-3 6 4Z' fill='white'/%3E%3Ccircle cx='48' cy='13' r='5' fill='%23e66c43'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: light; --ink:#193d4a; --muted:#66848d; --accent:#e66c43; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; overscroll-behavior:none; background:#eaf3f5; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); touch-action:none; user-select:none; -webkit-user-select:none; }
    #game { position:fixed; inset:0; width:100%; height:100%; height:100dvh; overflow:hidden; isolation:isolate; }
    canvas { display:block; width:100%; height:100%; touch-action:none; outline:none; }
    .hud { position:absolute; z-index:2; inset:0 0 auto; padding:calc(env(safe-area-inset-top,0px) + 23px) 25px 0; display:flex; justify-content:space-between; pointer-events:none; transition:opacity .3s; font-variant-numeric:tabular-nums; }
    .hud.is-idle { opacity:.42; }
    .label { font-size:9px; font-weight:750; letter-spacing:2.2px; line-height:1.8; }
    .value { font-size:28px; font-weight:760; letter-spacing:-1.2px; line-height:1.15; }
    .unit { font-size:13px; font-weight:550; margin-left:4px; letter-spacing:0; }
    .scorebox { text-align:right; }
    .flow { margin-top:6px; display:flex; gap:7px; align-items:center; justify-content:flex-end; height:14px; }
    #multiplier { font-size:12px; font-weight:850; color:var(--accent); transition:transform .15s; }
    .flow-track { width:45px; height:3px; border-radius:2px; background:rgba(44,85,99,.12); overflow:hidden; }
    #flowFill { display:block; height:100%; width:0; background:var(--accent); border-radius:2px; transition:width .15s linear; }
    #intro { pointer-events:none; position:absolute; z-index:3; top:30%; left:0; width:100%; text-align:center; transition:opacity .24s,transform .35s; }
    #intro.hidden { opacity:0; transform:translateY(-12px); }
    .eyebrow { font-size:9px; font-weight:750; letter-spacing:3px; margin:0 0 13px; opacity:.64; }
    h1 { margin:0; font-size:clamp(45px,14.8vw,78px); line-height:.98; letter-spacing:-3.9px; font-weight:900; }
    .title-dot { color:var(--accent); }
    .instruction { margin:23px 0 0; font-size:16px; font-weight:550; letter-spacing:.15px; }
    .gesture { display:block; width:66px; height:28px; margin:12px auto 0; overflow:visible; }
    .gesture circle { animation:carve 2.7s ease-in-out infinite; }
    @keyframes carve { 0%,100% { transform:translateX(-20px); } 50% { transform:translateX(20px); } }
    #desktopHint { position:absolute; bottom:27px; left:0; width:100%; text-align:center; font-size:10px; font-weight:600; letter-spacing:1.3px; opacity:.55; pointer-events:none; transition:opacity .25s; }
    #desktopHint.hidden { opacity:0; }
    #crash { position:absolute; inset:0; z-index:4; display:flex; align-items:center; justify-content:center; padding:24px; background:linear-gradient(180deg,rgba(237,246,248,0) 8%,rgba(237,246,248,.72) 30%,rgba(237,246,248,.92) 55%,rgba(237,246,248,.14) 100%); opacity:0; visibility:hidden; pointer-events:none; transition:opacity .25s,visibility .25s; }
    #crash.visible { opacity:1; visibility:visible; pointer-events:auto; }
    .result { text-align:center; width:min(100%,310px); transform:translateY(10px); transition:transform .3s; padding-bottom:28px; }
    #crash.visible .result { transform:translateY(0); }
    .result .eyebrow { color:var(--accent); opacity:1; margin-bottom:13px; }
    h2 { font-size:45px; line-height:1.0; font-weight:850; letter-spacing:-2px; margin:0 0 30px; }
    .stats { display:grid; grid-template-columns:1fr 1fr; margin:0 0 30px; }
    .stat + .stat { border-left:1px solid rgba(34,79,92,.16); }
    .stat strong { display:block; font-size:32px; letter-spacing:-1.3px; line-height:1.3; font-variant-numeric:tabular-nums; }
    .stat span { font-size:9px; font-weight:750; letter-spacing:2px; color:var(--muted); }
    #again { appearance:none; -webkit-appearance:none; border:0; border-radius:19px; width:100%; min-height:64px; padding:18px 25px; background:var(--ink); color:#fff; font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing:.2px; cursor:pointer; touch-action:manipulation; box-shadow:0 8px 0 rgba(27,63,76,.09); display:flex; align-items:center; justify-content:space-between; }
    #again:active { transform:translateY(2px); box-shadow:0 5px 0 rgba(27,63,76,.09); }
    #again:focus-visible { outline:3px solid var(--accent); outline-offset:5px; }
    .again-arrow { font-size:25px; color:#f3b990; font-weight:400; line-height:1; }
    #crashDetail { font-size:11px; color:var(--muted); font-weight:550; margin:19px 0 0; }
    @media (hover:none) { #desktopHint { display:none; } }
    @media (max-height:500px) {
      .hud { padding-top:calc(env(safe-area-inset-top,0px) + 13px); }
      .value { font-size:23px; } #intro { top:24%; } h1 { font-size:54px; }
      .eyebrow { margin-bottom:8px; } .instruction { margin-top:15px; } .gesture { margin-top:4px; }
      .result { width:290px; padding:0; } h2 { font-size:34px; margin-bottom:17px; }
      .result .eyebrow { margin-bottom:8px; } .stats { margin-bottom:17px; } .stat strong { font-size:27px; }
      #again { min-height:52px; padding:12px 21px; } #crashDetail { margin-top:11px; }
    }
    @media (prefers-reduced-motion:reduce) { .gesture circle { animation:none; } * { transition:none !important; } }
  </style>
</head>
<body>
<main id="game" aria-label="Downhill endless skiing game">
  <canvas id="slope" tabindex="0" aria-label="Drag left or right to carve. On a keyboard, use the arrow keys or A and D."></canvas>
  <div class="hud is-idle" id="hud" aria-hidden="true">
    <div><div class="label">DISTANCE</div><div class="value"><span id="distance">0</span><span class="unit" id="distanceUnit">m</span></div></div>
    <div class="scorebox"><div class="label">SCORE</div><div class="value" id="score">0</div><div class="flow"><div class="flow-track"><i id="flowFill"></i></div><span id="multiplier">×1</span></div></div>
  </div>
  <div id="intro"><p class="eyebrow">THE MOUNTAIN NEVER ENDS</p><h1>DOWNHILL<span class="title-dot">.</span></h1><p class="instruction">Drag to carve</p><svg class="gesture" viewBox="0 0 66 28" aria-hidden="true"><path d="M7 17 Q33 -1 59 17" fill="none" stroke="#8baab2" stroke-width="1.5" stroke-linecap="round"/><circle cx="33" cy="14" r="4" fill="#e66c43"/></svg></div>
  <div id="desktopHint">DRAG TO CARVE &nbsp; / &nbsp; A D &nbsp; OR &nbsp; ← →</div>
  <section id="crash" aria-label="Run results" aria-hidden="true">
    <div class="result"><p class="eyebrow" id="crashEyebrow">A LITTLE TOO CLOSE</p><h2>One more run.</h2><div class="stats"><div class="stat"><strong id="finalDistance">0 m</strong><span>DISTANCE</span></div><div class="stat"><strong id="finalScore">0</strong><span>SCORE</span></div></div><button id="again" type="button"><span>Again</span><span class="again-arrow" aria-hidden="true">↗</span></button><p id="crashDetail">Fresh snow. A fresh line.</p></div>
  </section>
</main>
<script>
(() => {
  'use strict';

  // All distances are in world metres. The camera looks down the fall line.
  // Simulation uses a fixed step; rendering and input remain independent.
  const canvas = document.getElementById('slope');
  const ctx = canvas.getContext('2d', { alpha:false, desynchronized:true });
  const ui = Object.fromEntries(['hud','intro','desktopHint','distance','distanceUnit','score','multiplier','flowFill','crash','again','finalDistance','finalScore','crashEyebrow','crashDetail'].map(id => [id,document.getElementById(id)]));
  const TAU = Math.PI * 2, STEP = 1/120, BACK = 25, FAR = 215, HALF = 10.4, PLAYER_R = .38;
  const MAX_OBJECTS = 440, MAX_PARTICLES = 155, MAX_TRACKS = 220, MAX_POPUPS = 5;
  const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
  const lerp = (a,b,t) => a+(b-a)*t;
  const smooth = t => { t=clamp(t,0,1); return t*t*(3-2*t); };
  const approach = (a,b,k,dt) => lerp(a,b,1-Math.exp(-k*dt));
  const fmt = new Intl.NumberFormat('en-US', {maximumFractionDigits:0});
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=390,H=844,DPR=1,scale=18,horizon=100,playerY=560,camHeight=25,camX=0;
  let skyCanvas, skyCtx, rng, seed, state='idle', paused=false, lastFrame=0, accumulator=0, hudClock=0;
  let worldZ=0, origin=0, distance=0, score=0, time=0, flow=0, multiplier=1, lastStyle=-10;
  let nextRow=0, nextEvent=0, event=null, nextNaturalJump=0, shake=0, crashTime=0, resultShown=false;
  let finalDistance=0, finalScore=0, trackClock=0, sprayClock=0, fastClock=0, turnClock=0, ambientClock=0;
  let objects=[], route=[], clearings=[], tracks=[], particles=[], popups=[];
  let prevPlayerX=0, prevWorldZ=0;
  let player, stats;
  const input={pointer:null,screenX:0,targetX:0,active:false,keys:new Set()};
  const moods = [
    {snow:[239,247,249],pine:.35,rock:.85,powder:.20,ice:.06},
    {snow:[229,242,244],pine:1.8,rock:.28,powder:.30,ice:.02},
    {snow:[232,242,248],pine:.35,rock:1.6,powder:.12,ice:.09},
    {snow:[244,249,250],pine:.40,rock:.25,powder:1.0,ice:.00},
    {snow:[233,246,247],pine:1.05,rock:.65,powder:.25,ice:.06}
  ];

  function makeRng(s) { return () => { s|=0; s=(s+0x6D2B79F5)|0; let t=Math.imul(s^(s>>>15),1|s); t^=t+Math.imul(t^(t>>>7),61|t); return ((t^(t>>>14))>>>0)/4294967296; }; }
  function hash(n) { let t=Math.imul((n|0)^seed,0x45d9f3b); t=Math.imul(t^(t>>>16),0x45d9f3b); return ((t^(t>>>16))>>>0)/4294967296; }
  const rand=(a,b) => a+rng()*(b-a);
  function freshSeed() { const a=new Uint32Array(1); try { crypto.getRandomValues(a); return a[0]; } catch { return (Date.now()^Math.random()*0xffffffff)>>>0; } }
  function moodAt(z) {
    const p=Math.max(0,z+origin)/390, i=Math.floor(p), t=smooth((p-i-.5)*2);
    const a=moods[i===0?0:Math.floor(hash(i*137+81)*5)], b=moods[Math.floor(hash((i+1)*137+81)*5)];
    return {snow:a.snow.map((v,k)=>lerp(v,b.snow[k],t)),pine:lerp(a.pine,b.pine,t),rock:lerp(a.rock,b.rock,t),powder:lerp(a.powder,b.powder,t),ice:lerp(a.ice,b.ice,t)};
  }
  const difficultyAt = z => 1-Math.exp(-Math.max(0,z+origin)/1900);
  const corridorAt = z => 2.7-.77*difficultyAt(z);

  // A continuous, gently curving exclusion corridor exists through every row.
  // Its maximum slope is .22 m/m (including interpolation); the skier can
  // comfortably exceed that lateral speed even at the fastest difficulty.
  function ensureRoute(to) {
    while(route[route.length-1].z < to) {
      const a=route[route.length-1], dz=rand(13,19);
      let slope=clamp(a.slope*.55+rand(-.12,.12),-.15,.15);
      if(Math.abs(a.x)>5.3) slope=lerp(slope,-Math.sign(a.x)*.13,.68);
      let x=clamp(a.x+slope*dz,-6.2,6.2);
      if(a.z+origin<65) { x=0; slope=0; }
      route.push({z:a.z+dz,x,slope});
    }
  }
  function pathAt(z) {
    for(let i=1;i<route.length;i++) if(route[i].z>=z) {
      const a=route[i-1],b=route[i]; return lerp(a.x,b.x,smooth((z-a.z)/(b.z-a.z)));
    }
    return route[route.length-1].x;
  }
  function protectedByJump(x,z,r) {
    return clearings.some(c=>z>c.from-r && z<c.to+r && Math.abs(x-c.x)<c.width+r);
  }
  function addObstacle(type,x,z,size=1) {
    const r=(type==='tree'?.48:.78)*size, safe=corridorAt(z), line=pathAt(z);
    // Centralized validation applies equally to random objects and special patterns.
    // Extra padding covers the corridor's change across an obstacle's depth.
    if(Math.abs(x-line)<safe+r+.4 || protectedByJump(x,z,r)) return false;
    if(objects.some(o=>(o.type==='tree'||o.type==='rock')&&Math.hypot(o.x-x,o.z-z)<o.r+r+.8)) return false;
    const h=type==='tree'?rand(4.0,6.0)*size:rand(.8,1.35)*size;
    objects.push({type,x,z,r,h,size,variant:rng(),passed:false,nearDone:false,line,safe});
    stats.generated++;
    return true;
  }
  function addJump(z,kind='small',x=pathAt(z)) {
    if(objects.some(o=>o.type==='jump'&&Math.abs(o.z-z)<23)) return false;
    const big=kind==='huge', medium=kind==='medium';
    const w=big?4.0:medium?3.4:2.8, h=big?1.25:medium?.9:.60;
    objects.push({type:'jump',x,z,w,h,depth:big?6:4.1,kind,used:false,r:w/2});
    // Full-speed flight + generous landing room is cleared before later rows spawn.
    // This is a safe optional straight landing, not a compulsory jump over a hazard.
    const c={x,from:z-5,to:z+(big?65:medium?53:42),width:w*.5+2.2};
    clearings.push(c);
    objects=objects.filter(o=>o.type!=='tree'&&o.type!=='rock'||!(o.z>c.from-o.r&&o.z<c.to+o.r&&Math.abs(o.x-x)<c.width+o.r));
    stats.generated++;
    return true;
  }
  function chooseEvent(z) {
    const types=['chute','slalom','bigAir','gap','powder','chain','ridge'];
    const kind=types[Math.floor(rng()*types.length)];
    event={kind,start:z,end:z+rand(78,128),nextFeature:z+8};
    nextEvent=event.end+rand(90,180);
    if(kind==='bigAir') { addJump(z+12,'huge'); event.nextFeature=Infinity; }
  }
  function generate() {
    ensureRoute(worldZ+FAR+105);
    while(nextRow<worldZ+FAR) {
      const z=nextRow, mood=moodAt(z), diff=difficultyAt(z);
      if(z>=nextEvent) chooseEvent(z);
      if(event && z>event.end) event=null;
      const kind=event?.kind, line=pathAt(z), safe=corridorAt(z);
      const starter=z+origin<45;
      if(z>nextNaturalJump && !starter && kind!=='powder' && kind!=='chain' && kind!=='bigAir') {
        const medium=z+origin>250&&rng()<.48;
        addJump(z+3,medium?'medium':'small',clamp(pathAt(z+3)+rand(-1.6,1.6),-7,7));
        nextNaturalJump=z+rand(105,165);
      }
      if(kind==='chain' && z>=event.nextFeature) { addJump(z+2,'small',pathAt(z+2)); event.nextFeature=z+40; }
      if(kind==='gap' && z>=event.nextFeature) {
        addObstacle('rock',line-safe-1.65,z+1,1.6); addObstacle('rock',line+safe+1.65,z+1,1.6);
        event.nextFeature=z+32;
      }
      if(kind==='chute'||kind==='slalom'||kind==='ridge') {
        const type=kind==='ridge'?'rock':'tree';
        const n=kind==='slalom'?3:2;
        for(let k=0;k<n;k++) {
          const side=k%2?-1:1, zz=z+rand(-1,1);
          addObstacle(type,pathAt(zz)+side*(corridorAt(zz)+1.2+rand(0,1.2)),zz,rand(.9,1.22));
        }
      }
      let count=Math.floor(2+mood.pine+mood.rock+diff*2+rand(0,2));
      if(kind==='powder') count=1;
      if(starter) count=2;
      for(let k=0;k<count;k++) {
        const zz=z+rand(-2,3), side=rng()<.5?-1:1;
        let x=rand(-16,16);
        if(starter) x=side*rand(7.2,16);
        if(kind==='slalom') x=line+(Math.floor((z-event.start)/14)%2?1:-1)*rand(4,13);
        addObstacle(rng()<mood.pine/(mood.pine+mood.rock)?'tree':'rock',x,zz,rand(.72,1.18));
      }
      // Scenery is also streamed and culled: no ever-growing decoration layer.
      if(rng()<.75) {
        const side=rng()<.5?-1:1;
        addObstacle(rng()<.66?'tree':'rock',side*rand(19,48),z+rand(-4,4),rand(1.0,1.9));
      }
      if(rng()<.56+mood.powder*.25) objects.push({type:'drift',x:rand(-25,25),z:z+rand(0,7),w:rand(4,12),depth:rand(1,3.5),variant:rng(),r:0});
      if(rng()<mood.ice && !starter) objects.push({type:'ice',x:clamp(line+rand(-5,5),-9,9),z:z+3,w:rand(2.0,3.5),depth:rand(3,6),r:0,variant:rng()});
      nextRow+=rand(10.5,16.5)-diff*2.0;
    }
    objects=objects.filter(o=>o.z>worldZ-17).slice(-MAX_OBJECTS);
    while(route.length>3&&route[1].z<worldZ-26) route.shift();
    clearings=clearings.filter(c=>c.to>worldZ-5);
  }

  function reset(newSeed=freshSeed(),start=true) {
    seed=newSeed>>>0; rng=makeRng(seed);
    state=start?'playing':'idle'; worldZ=0; origin=0; distance=0; score=0; time=0; flow=0; multiplier=1; lastStyle=-10;
    nextRow=20; nextEvent=rand(170,225); nextNaturalJump=68; event=null;
    objects=[]; route=[{z:-40,x:0,slope:0},{z:0,x:0,slope:0}]; clearings=[]; tracks=[]; particles=[]; popups=[];
    shake=0; crashTime=0; resultShown=false; finalDistance=0; finalScore=0; camX=0;
    trackClock=0; sprayClock=0; fastClock=0; turnClock=0; hudClock=0;
    player={x:0,angle:0,speed:11.5,air:0,vy:0,airTime:0,flight:0,trick:null,jumpKind:null,groundLift:0,landSquash:0,ice:false,powder:0,crashRotation:0,crashVX:0};
    stats={generated:0,jumps:0,landings:0,tricks:0,nearMisses:0,crashes:0,carves:0,maxCombo:1,rebases:0,peakObjects:0,peakParticles:0};
    input.pointer=null; input.active=false; input.targetX=0; input.keys.clear();
    accumulator=0; lastFrame=0;
    ui.intro.classList.toggle('hidden',start); ui.desktopHint.classList.toggle('hidden',start);
    ui.hud.classList.toggle('is-idle',!start); ui.crash.classList.remove('visible'); ui.crash.setAttribute('aria-hidden','true');
    generate(); updateHud(true);
  }
  function begin() {
    if(state!=='idle') return;
    state='playing'; ui.intro.classList.add('hidden'); ui.desktopHint.classList.add('hidden'); ui.hud.classList.remove('is-idle');
  }
  function updateHud(force=false) {
    if(!force&&hudClock<.09) return; hudClock=0;
    const d=state==='crashed'?finalDistance:distance, km=d>=10000;
    ui.distance.textContent=km?(d/1000).toFixed(1):fmt.format(Math.floor(d));
    ui.distanceUnit.textContent=km?'km':'m';
    const digits=fmt.format(Math.floor(score));
    ui.score.textContent=digits;
    ui.score.style.fontSize=Math.max(16,(H<500?23:28)-Math.max(0,digits.length-8)*1.5)+'px';
    ui.multiplier.textContent='×'+multiplier;
    ui.flowFill.style.width=(flow)+'%';
  }
  function popup(text,points=0,accent=false,subtitle='') {
    popups.push({text,points,accent,subtitle,age:0,life:1.45,x:player.x});
    if(popups.length>MAX_POPUPS) popups.shift();
  }
  function styleReward(points,energy,label,accent=false,subtitle='') {
    flow=clamp(flow+energy,0,100); multiplier=Math.min(5,1+Math.floor(flow/20)); stats.maxCombo=Math.max(stats.maxCombo,multiplier);
    const earned=Math.round(points*multiplier); score+=earned; lastStyle=time;
    if(label) popup(label,earned,accent,subtitle);
    return earned;
  }
  function emit(x,z,count,power=1,crash=false) {
    for(let i=0;i<count;i++) {
      if(particles.length>=MAX_PARTICLES) particles.shift();
      const a=rand(0,TAU), v=rand(.4,3.2)*power;
      particles.push({x:x+rand(-.35,.35),z:z+rand(-.25,.25),h:rand(.05,.2),vx:Math.cos(a)*v-player.angle*1.7,vz:Math.sin(a)*v-(crash?0:1.4),vy:rand(1,3)*power,age:0,life:rand(.4,.85)*(crash?1.35:1),size:rand(.035,.13)*power});
    }
  }
  function launch(o) {
    o.used=true;
    if(player.air>0||player.speed<10) return;
    const base=o.kind==='huge'?13.5:o.kind==='medium'?10.5:8.1;
    const vy=base*(.79+player.speed/55);
    player.air=.3+o.h*.48; player.vy=vy; player.airTime=0; player.flight=(vy+Math.sqrt(vy*vy+48*player.air))/24;
    player.jumpKind=o.kind;
    player.trick=o.kind==='huge'&&player.speed>21?'BACKFLIP':player.flight>1.12&&player.speed>17?'360':player.flight>.82?'TAIL GRAB':'STRAIGHT AIR';
    player.groundLift=0; stats.jumps++;
    styleReward(o.kind==='huge'?90:45,7,o.kind==='huge'?'BIG AIR':'AIR',true);
    emit(player.x,worldZ-1,9,1.1);
  }
  function land() {
    player.air=0; player.vy=0; player.groundLift=0; player.landSquash=1;
    const tricks={BACKFLIP:480,'360':300,'TAIL GRAB':150,'STRAIGHT AIR':65};
    const trick=player.trick||'STRAIGHT AIR';
    // Automatic tricks always finish upright. A bad landing is a collision with
    // terrain, not a random failure or an undisclosed timing requirement.
    for(const o of objects) {

    // Two softly cut chevrons make the takeoff readable at thumb-sized scale.
    const centerX=(a.x+b.x+c.x+d.x)*.25, centerY=lerp((a.y+b.y)*.5,(c.y+d.y)*.5,.42);
    ctx.strokeStyle='rgba(100,153,171,.48)'; ctx.lineWidth=Math.max(1,p.s*.07); ctx.lineCap='round'; ctx.lineJoin='round';
    for(let k=0;k<2;k++) { ctx.beginPath(); ctx.moveTo(centerX-p.s*.29,centerY+k*p.s*.32); ctx.lineTo(centerX,centerY-p.s*.18+k*p.s*.32); ctx.lineTo(centerX+p.s*.29,centerY+k*p.s*.32); ctx.stroke(); }
  }
  function drawSkier() {
    const ground=project(player.x,0),air=player.air+player.groundLift,p=project(player.x,0,air),unit=scale/18;
    const shadowScale=1+player.air*.035;
    ellipse(ground.x+4*unit+player.air*scale*.15,ground.y+4*unit,15*unit*shadowScale,5.5*unit*shadowScale,`rgba(35,82,112,${.19/(1+player.air*.10)})`,-.13);
    ctx.save(); ctx.translate(p.x,p.y);
    let rotation=player.angle*.82;
    const t=clamp(player.airTime/Math.max(.1,player.flight),0,1);
    if(state==='crashed') {
      rotation=player.crashRotation;
      ctx.translate(0,-Math.abs(Math.sin(crashTime*10))*10*unit*Math.exp(-crashTime*2));
    } else if(player.air>0&&player.trick==='360') rotation+=TAU*smooth(clamp((t-.08)/.79,0,1));
    ctx.rotate(rotation); ctx.scale(unit,unit*(1-player.landSquash*.20));
    if(player.air>0&&player.trick==='BACKFLIP') {
      const f=Math.cos(TAU*smooth(clamp((t-.06)/.83,0,1))); ctx.scale(1,(f<0?-1:1)*Math.max(.23,Math.abs(f)));
    }
    const tuck=player.air>0?Math.sin(Math.PI*t):0, lean=player.angle*5.4;
    const grab=player.air>0&&player.trick==='TAIL GRAB'?tuck:0;
    const hand=side=>({x:lerp(side*(12-tuck*4)+lean,7+lean,side===1?grab:0),y:lerp(-13+tuck*3,7,side===1?grab:0)});
    // Poles trail the hands; skis point into the turn instead of side-sliding.
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.strokeStyle='#456471'; ctx.lineWidth=1.45;
    for(const side of [-1,1]) {
      const {x:hx,y:hy}=hand(side);
      ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(side*(19-tuck*4)+lean,16-tuck*14); ctx.stroke();
      ellipse(side*(19-tuck*4)+lean,16-tuck*14,2,1.1,'#547683');
    }
    for(const side of [-1,1]) {
      ctx.save(); ctx.translate(side*(5.2+tuck*1.7),0); ctx.rotate(side*tuck*.14+(state==='crashed'?side*.3:0));
      rounded(-2.5,-25+3*tuck,5,43-6*tuck,2.5,'#204656'); rounded(-2.1,-25+3*tuck,4.2,9,2,'#f28154');
      rounded(-1.8,8,3.6,6,1,'#acc7ce'); ctx.restore();
    }
    // Knees and hips are slightly articulated as the skier loads an edge.
    ctx.strokeStyle='#243f51'; ctx.lineWidth=6;
    for(const side of [-1,1]) { ctx.beginPath(); ctx.moveTo(lean+side*3.8,-9); ctx.lineTo(side*6+lean*.25,-3-tuck*4); ctx.lineTo(side*5.3,3-tuck*2); ctx.stroke(); }
    rounded(-8+lean,-23+tuck*3,16,17,5,'#d95339');
    poly([[-7+lean,-22+tuck*3],[1+lean,-23+tuck*3],[2+lean,-7],[-6+lean,-8]],'#f17b4b');
    ctx.strokeStyle='#e96a43'; ctx.lineWidth=5.5;
    for(const side of [-1,1]) { const h=hand(side); ctx.beginPath(); ctx.moveTo(side*6+lean,-20+tuck*3); ctx.lineTo(h.x,h.y); ctx.stroke(); ellipse(h.x,h.y,2.8,2.6,'#234452'); }
    // A small contrasting back panel makes the rear-facing silhouette clear.
    rounded(-4+lean,-22+tuck*3,8,10,2.5,'#bd4935');
    ellipse(lean,-25+tuck*3,6.7,6.0,'#254b58');
    ellipse(lean-.6,-28+tuck*3,6.8,5.4,'#efb654');
    ctx.beginPath(); ctx.arc(lean-.7,-29+tuck*3,4.8,Math.PI*1.05,Math.PI*1.80); ctx.strokeStyle='#ffda87'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.restore();
    if(state==='crashed') {
      const s=project(player.x+1.2*(1-Math.exp(-crashTime*3)),0);
      ctx.save(); ctx.translate(s.x,s.y+16*unit); ctx.rotate(-.75-crashTime*.8); rounded(-2*unit,-22*unit,4*unit,43*unit,2*unit,'#244a5c'); rounded(-2*unit,-22*unit,4*unit,8*unit,2*unit,'#f28154'); ctx.restore();
    }
  }
  function drawParticles() {
    for(const q of particles) {
      const p=project(q.x,q.z-worldZ,q.h); if(p.y>H+20||p.x<-20||p.x>W+20) continue;
      const alpha=(1-q.age/q.life)*.78;
      ellipse(p.x,p.y,Math.max(.6,p.s*q.size),Math.max(.5,p.s*q.size*.75),`rgba(255,255,255,${alpha})`);
    }
  }
  function drawPopups() {
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(let i=0;i<popups.length;i++) {
      const p=popups[i], age=p.age, fade=Math.min(1,age/.12)*Math.min(1,(p.life-age)/.4), pos=project(p.x,0);
      const x=clamp(pos.x,90,W-90),y=playerY-87-(age*24)-(popups.length-1-i)*37;
      ctx.globalAlpha=fade;
      ctx.font='800 '+Math.max(11,Math.min(14,W*.032))+'px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
      ctx.lineWidth=4; ctx.strokeStyle='rgba(239,248,250,.80)'; ctx.lineJoin='round'; ctx.strokeText(p.text,x,y);
      ctx.fillStyle=p.accent?'#d8663f':'#3c727d'; ctx.fillText(p.text,x,y);
      ctx.font='650 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif'; ctx.fillStyle='#476a79';
      if(p.points) ctx.fillText('+'+fmt.format(p.points)+(p.subtitle?' · STOMPED':''),x,y+17);
    }
    ctx.globalAlpha=1;
  }
  function drawSpeed() {
    if(state!=='playing'||player.speed<21||reducedMotion) return;
    const strength=clamp((player.speed-21)/10,0,1);
    ctx.strokeStyle=`rgba(255,255,255,${strength*.43})`; ctx.lineWidth=1.2;
    for(let i=0;i<8;i++) {
      const phase=(time*(.6+i*.035)+i*.173)%1, side=i%2?-1:1;
      const x=W*.5+side*(W*.37+phase*W*.16),y=H*(.3+phase*.75);
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+side*phase*6,y+12+phase*22); ctx.stroke();
    }
  }
  function render() {
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.save();
    if(shake>.05&&!reducedMotion) ctx.translate(Math.sin(ambientClock*67)*shake,Math.cos(ambientClock*81)*shake*.65);
    drawSnow();
    for(const o of objects) if(o.type==='drift'||o.type==='ice') drawPatch(o);
    drawTracks();
    const visible=objects.filter(o=>o.type!=='drift'&&o.type!=='ice'&&o.z-worldZ>-16&&o.z-worldZ<FAR);
    visible.sort((a,b)=>b.z-a.z);
    let drawn=false;
    for(const o of visible) {
      if(!drawn&&o.z<=worldZ) { drawSkier(); drawn=true; }
      if(o.type==='tree') drawTree(o); else if(o.type==='rock') drawRock(o); else if(o.type==='jump') drawRamp(o);
    }
    if(!drawn) drawSkier();
    drawParticles(); drawSpeed(); drawPopups(); ctx.restore();
  }
  function frame(stamp) {
    const dt=lastFrame?Math.min((stamp-lastFrame)/1000,.075):0; lastFrame=stamp;
    if(!paused) {
      ambientClock+=dt;
      accumulator+=dt;
      // A long background pause never fast-forwards a player into an obstacle.
      let iterations=0;
      while(accumulator>=STEP&&iterations<10) { update(STEP); accumulator-=STEP; iterations++; }
      render();
    }
    requestAnimationFrame(frame);
  }

  // Pointer capture + one active pointer protects steering from a second thumb.
  function aim(x) { input.screenX=x; input.targetX=clamp(camX+(x-W*.5)/scale,-HALF,HALF); }
  canvas.addEventListener('pointerdown',e=>{
    if(state==='crashed'||input.pointer!==null||e.button>0) return;
    e.preventDefault(); begin(); input.pointer=e.pointerId; input.active=true; aim(e.clientX);
    try { canvas.setPointerCapture(e.pointerId); } catch {}
  });
  canvas.addEventListener('pointermove',e=>{ if(e.pointerId!==input.pointer) return; e.preventDefault(); aim(e.clientX); });
  function release(e) { if(e.pointerId!==input.pointer) return; input.pointer=null; input.active=false; }
  canvas.addEventListener('pointerup',release); canvas.addEventListener('pointercancel',release); canvas.addEventListener('lostpointercapture',release);
  window.addEventListener('keydown',e=>{
    const key=e.key.length===1?e.key.toLowerCase():e.key;
    if(['ArrowLeft','ArrowRight','a','d',' ','Enter'].includes(key)) {
      e.preventDefault();
      if(state==='crashed') { if((key===' '||key==='Enter')&&resultShown) reset(); return; }
      begin(); if(key!==' '&&key!=='Enter') input.keys.add(key);
    }
  });
  window.addEventListener('keyup',e=>input.keys.delete(e.key.length===1?e.key.toLowerCase():e.key));
  window.addEventListener('blur',()=>{input.keys.clear();input.active=false;input.pointer=null;});
  ui.again.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();reset();canvas.focus({preventScroll:true});});
  document.addEventListener('visibilitychange',()=>{paused=document.hidden;lastFrame=0;accumulator=0;input.active=false;input.pointer=null;input.keys.clear();});
  window.addEventListener('resize',resize);
  if(window.visualViewport) window.visualViewport.addEventListener('resize',resize);
  window.addEventListener('contextmenu',e=>e.preventDefault());

  resize(); reset(freshSeed(),false); requestAnimationFrame(frame);

  // Opt-in deterministic inspection hooks for local automated testing only.
  // Normal play has no debug UI, cheats, timers, persistence, or network calls.
  if(new URLSearchParams(location.search).has('test')) {
    window.__downhill={
      start:s=>reset(s===undefined?freshSeed():s,true),
      snapshot:()=>({state,distance,score,multiplier,flow,time,worldZ,origin,player:{...player},counts:{objects:objects.length,tracks:tracks.length,particles:particles.length,route:route.length,clearings:clearings.length,popups:popups.length},stats:{...stats},input:{pointer:input.pointer,active:input.active,targetX:input.targetX},camera:{W,H,scale,playerY,camX},resultShown}),
      step:seconds=>{for(let t=0;t<seconds;t+=STEP) update(STEP); render();},
      autopilot:(metres,maxSeconds=100000)=>{
        const target=distance+metres;
        for(let i=0;i<maxSeconds/STEP&&distance<target&&state==='playing';i++) { input.active=true;input.targetX=pathAt(worldZ+2);update(STEP); }
        input.active=false;render();return window.__downhill.snapshot();
      },
      pathAt, corridorAt,
      objects:()=>objects.map(o=>({...o})),
      route:()=>route.map(o=>({...o})),
      place:(o)=>{const item={size:1,r:.78,h:1,variant:.4,passed:false,nearDone:false,...o};objects.push(item);return item;},
      clear:()=>{objects=[];nextRow=worldZ+FAR+1;},
      player:patch=>Object.assign(player,patch),
      aim:x=>{input.active=true;input.targetX=x;},
      flow:value=>{flow=value;multiplier=Math.min(5,1+Math.floor(flow/20));},
      pause:v=>{paused=v;lastFrame=0;accumulator=0;},
      render,
      validate:()=>({blocked:objects.filter(o=>(o.type==='tree'||o.type==='rock')&&o.line!==undefined&&Math.abs(o.x-o.line)<o.safe+o.r+.399).length,bounded:objects.length<=MAX_OBJECTS&&particles.length<=MAX_PARTICLES&&tracks.length<=MAX_TRACKS&&popups.length<=MAX_POPUPS})
    };
  }
})();
</script>
</body>
</html>
