<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a0706" />
  <title>Slash Pit</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh;
      overflow: hidden; overscroll-behavior: none; touch-action: none;
      background: #0a0706; color: #f3e8de;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      user-select: none; -webkit-user-select: none;
    }
    canvas {
      display: block; width: 100%; height: 100%; touch-action: none;
      image-rendering: pixelated; image-rendering: crisp-edges;
    }
    #hud {
      position: fixed; left: 0; right: 0; top: 0;
      padding: calc(0.55rem + env(safe-area-inset-top, 0px)) 2.6rem 0.4rem 0.9rem;
      pointer-events: none; z-index: 2;
    }
    .hpwrap {
      height: 14px; border-radius: 99px; background: #1a1010;
      border: 1px solid #3a2018; overflow: hidden;
    }
    .hpfill {
      height: 100%; width: 100%;
      background: linear-gradient(90deg, #9b1d20, #e85d04);
      transform-origin: left center;
    }
    .row {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-top: 0.35rem; font-size: 0.72rem; letter-spacing: 0.08em;
      text-transform: uppercase; color: #c4b4a4; gap: 0.4rem;
    }
    #hptext { font-variant-numeric: tabular-nums; }
    #goldtext { color: #fbbf24; font-weight: 700; font-variant-numeric: tabular-nums; }
    #combotext { color: #fde68a; font-weight: 800; min-width: 2.4rem; text-align: center; }
    #clocktext { color: #fde68a; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 0.06em; }
    #roomtext { font-weight: 700; }
    #mutebtn {
      position: fixed; right: 0.55rem;
      top: calc(0.5rem + env(safe-area-inset-top, 0px));
      width: 34px; height: 34px; z-index: 6;
      border: 1px solid #5a3a20; background: rgba(20,10,8,0.88);
      color: #e8d5c0; border-radius: 8px; font-size: 15px; line-height: 1;
      pointer-events: auto; touch-action: manipulation;
    }
    #mutebtn.muted { color: #6a5a50; text-decoration: line-through; }
    #toast {
      position: fixed; left: 50%;
      top: calc(4.1rem + env(safe-area-inset-top, 0px));
      transform: translateX(-50%) translateY(-8px);
      padding: 0.45rem 0.85rem; border-radius: 999px;
      background: rgba(20,10,8,0.88); border: 1px solid #5a3a20;
      font-size: 0.82rem; font-weight: 700; letter-spacing: 0.02em;
      opacity: 0; pointer-events: none; z-index: 3; white-space: nowrap;
      max-width: 92vw; overflow: hidden; text-overflow: ellipsis;
      transition: opacity 0.12s linear, transform 0.12s ease;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #overlay {
      position: fixed; inset: 0 0 calc(150px + env(safe-area-inset-bottom, 0px)) 0;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      text-align: center; padding: max(1.15rem, 5vh) 1.1rem 1.1rem;
      background: radial-gradient(ellipse at center, rgba(6,3,3,0.86) 0%, rgba(6,3,3,0.52) 62%, rgba(6,3,3,0.36) 100%);
      z-index: 4; overflow: auto; -webkit-overflow-scrolling: touch;
      touch-action: pan-y; overscroll-behavior: contain;
    }
    #overlay.hidden { display: none; }
    #overlay.hell {
      background: radial-gradient(ellipse at center, rgba(42,4,4,0.90) 0%, rgba(16,2,2,0.58) 62%, rgba(8,0,0,0.40) 100%);
    }
    #overlay.hell h1 { text-shadow: 0 0 26px #ef444466, 0 4px 0 #3a0c08; }
    .pitheart {
      width: 12px; height: 12px; margin: 0.5rem auto 0; position: relative;
      background: #ef4444; transform: rotate(45deg);
      box-shadow: 0 0 10px #ef444488;
      animation: pitbeat 0.7s ease-in-out infinite;
    }
    .pitheart:before, .pitheart:after {
      content: ""; position: absolute; width: 12px; height: 12px;
      background: #ef4444; border-radius: 50%;
    }
    .pitheart:before { left: -6px; top: 0; }
    .pitheart:after { left: 0; top: -6px; }
    @keyframes pitbeat {
      0%, 100% { transform: rotate(45deg) scale(1); }
      50% { transform: rotate(45deg) scale(1.22); }
    }
    .cape-dot { display: inline-block; width: 0.55rem; height: 0.55rem; margin-right: 0.28rem; vertical-align: -0.05rem; box-shadow: inset 0 0 0 1px #0008; }
    #hud.off { visibility: hidden; }
    #overlay h1 {
      margin: 0; font-size: clamp(2.2rem, 11vw, 3.6rem);
      letter-spacing: 0.08em; line-height: 0.95;
      text-shadow: 0 0 24px #e85d0466, 0 4px 0 #3a0c08;
    }
    #overlay h2 {
      margin: 0; font-size: clamp(1.6rem, 8vw, 2.6rem); letter-spacing: 0.06em;
    }
    #overlay p { margin: 0.55rem 0 0; color: #c4b4a4; line-height: 1.45; max-width: 22rem; }
    #overlay .recap {
      margin-top: 0.7rem; font-size: 0.82rem; color: #e8d5c0;
      max-height: 22vh; overflow: auto; line-height: 1.5;
    }
    #seedline { margin-top: 0.45rem; font-size: 0.72rem; letter-spacing: 0.14em; color: #8a7060; text-transform: uppercase; }
    .btn {
      margin-top: 1.1rem; min-height: 3.1rem; min-width: 12.5rem;
      padding: 0.8rem 1.6rem; border: 0; border-radius: 999px;
      background: #e85d04; color: #1a0800; font-weight: 800;
      font-size: 1.08rem; letter-spacing: 0.04em; touch-action: manipulation;
    }
    .btn:active { transform: scale(0.98); }
    .btn-alt {
      background: #2a2018; color: #e8d5c0; box-shadow: inset 0 0 0 1px #5a3a20;
    }
    .btn-sm { min-width: 8.2rem; min-height: 2.7rem; font-size: 0.92rem; margin-top: 0.55rem; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 0.45rem; justify-content: center; margin-top: 0.35rem; }
    .unlock-grid { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; max-width: 22rem; margin-top: 0.45rem; }
    .unlock-chip {
      padding: 0.42rem 0.62rem; border: 1px solid #5a3a20; background: #1a100c;
      color: #c4b4a4; font-size: 0.7rem; letter-spacing: 0.05em; text-transform: uppercase;
      font-weight: 700; touch-action: manipulation;
    }
    .unlock-chip.on { border-color: #e85d04; color: #fde68a; background: #2a1408; }
    .unlock-chip.lock { opacity: 0.38; }
    #hint { display: none; }
    #pauseov {
      position: fixed; inset: 0 0 calc(150px + env(safe-area-inset-bottom, 0px)) 0;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(6,3,3,0.55); z-index: 7; pointer-events: none; gap: 0.7rem;
      visibility: hidden; opacity: 0;
    }
    #pauseov.hidden, #pauseov[hidden] {
      display: none !important; visibility: hidden; opacity: 0; pointer-events: none;
    }
    #pauseov.on { display: flex; visibility: visible; opacity: 1; }
    #pauseov.on.hidden, #pauseov.on[hidden] {
      display: none !important; visibility: hidden; opacity: 0; pointer-events: none;
    }
    #pauseov.canquit { pointer-events: auto; }
    #pauseov span {
      font-size: clamp(2rem, 10vw, 3.2rem); font-weight: 900; letter-spacing: 0.18em;
      color: #fde68a; text-shadow: 0 4px 0 #3a0c08, 0 0 22px #e85d0466;
    }
    #quitbtn { display: none; margin-top: 0.2rem; pointer-events: auto; }
    #pauseov.canquit #quitbtn { display: inline-block; }
    #seedin {
      margin-top: 0.55rem; width: 12.5rem; min-height: 2.6rem;
      border: 1px solid #5a3a20; background: #1a100c; color: #fde68a;
      font-size: 16px; letter-spacing: 0.18em; text-align: center; text-transform: uppercase;
      font-family: ui-monospace, "SF Mono", Menlo, monospace; font-weight: 800;
      touch-action: manipulation;
    }
    .hexgrid {
      display: grid; grid-template-columns: repeat(4, 2.55rem); gap: 0.35rem;
      justify-content: center; margin-top: 0.55rem;
    }
    .hexkey {
      width: 2.55rem; height: 2.55rem; border: 1px solid #5a3a20; background: #1a100c;
      color: #e8d5c0; font-weight: 800; font-size: 0.95rem; letter-spacing: 0.04em;
      touch-action: manipulation; padding: 0;
    }
    .hexkey.go { background: #e85d04; color: #1a0800; border-color: #e85d04; }
    .statline { margin-top: 0.35rem; font-size: 0.82rem; color: #e8d5c0; letter-spacing: 0.06em; }
    .menu-col {
      display: flex; flex-direction: column; align-items: stretch;
      gap: 0.48rem; margin-top: 0.8rem; width: min(16.5rem, 86vw);
    }
    .menu-col .btn { margin-top: 0; width: 100%; min-width: 0; }
    .menu-col.tight .btn { min-height: 2.7rem; font-size: 0.92rem; }
    .btn-play { min-height: 3.55rem; font-size: 1.2rem; letter-spacing: 0.14em; }
    #overlay > .btn-play { width: min(16.5rem, 86vw); margin-top: 0.85rem; }
    .menu-sub {
      margin-top: 0.7rem !important; margin-bottom: 0;
      font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: #8a7060;
    }
    #deathline {
      margin-top: 0.38rem !important; font-size: 0.78rem; letter-spacing: 0.03em;
      color: #8a7060; font-style: italic; max-width: 20rem;
    }
    .soul-tree {
      width: min(20.4rem, 94vw); margin: 0.65rem auto 0; position: relative;
      image-rendering: pixelated; image-rendering: crisp-edges;
    }
    .tree-crown {
      width: 28px; height: 18px; margin: 0.15rem auto 0;
      background:
        linear-gradient(#166534 0 4px, transparent 4px) 6px 0 / 16px 4px no-repeat,
        linear-gradient(#15803d 0 6px, transparent 6px) 2px 4px / 24px 6px no-repeat,
        linear-gradient(#14532d 0 8px, transparent 8px) 0 10px / 28px 8px no-repeat;
    }
    .tree-trunk {
      width: 8px; height: 16px; margin: 0 auto;
      background: #5a3a20;
      box-shadow: 2px 0 0 #2a1810, -2px 0 0 #3a2418;
    }
    .tree-row { display: flex; justify-content: space-between; gap: 0.32rem; }
    .tree-fork {
      height: 14px; margin: 0 2.15rem 0.08rem;
      border: 3px solid #5a3a20; border-bottom: 0;
      position: relative;
    }
    .tree-fork:before {
      content: ""; position: absolute; left: 50%; top: -3px;
      width: 3px; height: 17px; background: #5a3a20; transform: translateX(-50%);
    }
    .tree-node {
      flex: 1; min-height: 4.05rem; padding: 0.32rem 0.22rem;
      border: 2px solid #5a3a20; background: #1a100c; color: #c4b4a4;
      font-size: 0.6rem; letter-spacing: 0.04em; text-transform: uppercase;
      font-weight: 800; touch-action: manipulation; line-height: 1.2;
    }
    .tree-node.owned { border-color: #e85d04; color: #fde68a; background: #2a1408; }
    .tree-node .tree-name { display: block; }
    .tree-node .tree-desc { display: block; margin-top: 0.12rem; color: #8a7060; font-size: 0.5rem; letter-spacing: 0.03em; font-weight: 700; text-transform: none; }
    .tree-node .tree-cost { display: block; margin-top: 0.16rem; color: #8a7060; font-size: 0.55rem; letter-spacing: 0.06em; }
    .tree-node.owned .tree-cost { color: #86efac; }

    #gbsp {
      --dp: 108px; --bt: 60px; --arm: calc(var(--dp) / 3);
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      image-rendering: pixelated; image-rendering: crisp-edges;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
    }
    #gbsp * { touch-action: none; -webkit-user-select: none; user-select: none; }
    .gb-lip {
      height: 6px;
      background: linear-gradient(#3a3028 0 2px, #1a1410 2px 4px, #0a0806 4px 6px);
      box-shadow: 0 -2px 0 #080604;
    }
    .gb-tray {
      position: relative; display: flex; justify-content: space-between; align-items: flex-end;
      padding: 20px 18px 12px;
      background-color: rgba(14, 10, 9, 0.90);
      background-image:
        linear-gradient(180deg, rgba(255,220,180,0.05) 0 2px, transparent 2px 10px),
        repeating-linear-gradient(90deg, rgba(0,0,0,0.22) 0 2px, transparent 2px 4px),
        repeating-linear-gradient(0deg, rgba(0,0,0,0.14) 0 2px, transparent 2px 4px);
      border-top: 2px solid #2a2018;
      box-shadow: inset 0 2px 0 #4a3a30, inset 0 -2px 0 #080604;
    }
    .gb-legend {
      position: absolute; left: 0; right: 0; top: 6px; text-align: center;
      font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase;
      color: #8a7060; pointer-events: none; font-weight: 700;
    }
    .gb-screw {
      position: absolute; width: 8px; height: 8px; background: #2a221c;
      box-shadow: inset 2px 2px 0 #5a4a40, inset -2px -2px 0 #0a0806, 2px 2px 0 #0a0806;
      pointer-events: none;
    }
    .gb-screw.s1 { left: 8px; top: 10px; }
    .gb-screw.s2 { right: 8px; top: 10px; }
    .gb-left { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 10px; }
    .dpad { width: var(--dp); height: var(--dp); position: relative; filter: drop-shadow(0 4px 0 #080604); }
    .dpad-v, .dpad-h {
      position: absolute; background: #2c3036;
      box-shadow: inset 2px 2px 0 #5a616a, inset -2px -2px 0 #14161a, 0 0 0 2px #0a0808;
    }
    .dpad-v { width: var(--arm); height: var(--dp); left: var(--arm); top: 0; }
    .dpad-h { width: var(--dp); height: var(--arm); left: 0; top: var(--arm); }
    .dpad-nub {
      position: absolute; width: 22px; height: 22px; left: calc(50% - 11px); top: calc(50% - 11px);
      background: #1a1c20; border-radius: 4px; z-index: 2;
      box-shadow: inset 2px 2px 0 #4a5058, inset -2px -2px 0 #0c0c0e, 0 0 0 2px #0a0808;
    }
    .dpad-arr { position: absolute; z-index: 1; pointer-events: none; width: 0; height: 0; }
    .dpad-arr.u { left: calc(50% - 6px); top: 8px; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 8px solid #6a727c; }
    .dpad-arr.d { left: calc(50% - 6px); bottom: 8px; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid #6a727c; }
    .dpad-arr.l { left: 8px; top: calc(50% - 6px); border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-right: 8px solid #6a727c; }
    .dpad-arr.r { right: 8px; top: calc(50% - 6px); border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 8px solid #6a727c; }
    .dpad.press-u .dpad-v { box-shadow: inset 2px 4px 0 #14161a, inset -2px -2px 0 #3a4048, 0 0 0 2px #0a0808; }
    .dpad.press-d .dpad-v { box-shadow: inset 2px 2px 0 #3a4048, inset -2px -4px 0 #14161a, 0 0 0 2px #0a0808; }
    .dpad.press-l .dpad-h { box-shadow: inset 4px 2px 0 #14161a, inset -2px -2px 0 #3a4048, 0 0 0 2px #0a0808; }
    .dpad.press-r .dpad-h { box-shadow: inset 2px 2px 0 #3a4048, inset -4px -2px 0 #14161a, 0 0 0 2px #0a0808; }
    .dpad.press-u .dpad-arr.u { border-bottom-color: #c8d0d8; }
    .dpad.press-d .dpad-arr.d { border-top-color: #c8d0d8; }
    .dpad.press-l .dpad-arr.l { border-right-color: #c8d0d8; }
    .dpad.press-r .dpad-arr.r { border-left-color: #c8d0d8; }
    .gb-right { position: relative; width: 132px; height: var(--dp); margin-top: 10px; }
    .gb-btn {
      position: absolute; width: var(--bt); height: var(--bt); border: 0; padding: 0;
      color: #1a0800; font-weight: 900; font-size: 15px; letter-spacing: 0.06em;
      font-family: ui-monospace, "SF Mono", Menlo, monospace; line-height: var(--bt);
      text-align: center; cursor: pointer; image-rendering: pixelated; border-radius: 50%;
      -webkit-tap-highlight-color: transparent;
    }
    .gb-btn:focus { outline: none; }
    .gb-a {
      right: 0; top: 0; background: #e85d04;
      box-shadow: 0 0 0 3px #1a1008, 0 0 0 5px #0a0706, inset 2px 2px 0 #ffb060, inset -2px -3px 0 #9a3400, 0 4px 0 #3a1400;
      text-shadow: 0 2px 0 #9a3400;
    }
    .gb-b {
      left: 0; bottom: 4px; background: #8a9098; color: #1a1c20;
      box-shadow: 0 0 0 3px #1a1008, 0 0 0 5px #0a0706, inset 2px 2px 0 #c8cdd4, inset -2px -3px 0 #4a5058, 0 4px 0 #2a2c30;
      text-shadow: 0 2px 0 #4a5058;
    }
    .gb-btn.pressed { transform: translateY(3px); filter: brightness(0.82); }
    .gb-a.pressed { box-shadow: 0 0 0 3px #1a1008, 0 0 0 5px #0a0706, inset 2px 3px 0 #9a3400, inset -2px -1px 0 #c85010, 0 1px 0 #3a1400; }
    .gb-b.pressed { box-shadow: 0 0 0 3px #1a1008, 0 0 0 5px #0a0706, inset 2px 3px 0 #4a5058, inset -2px -1px 0 #6a7078, 0 1px 0 #2a2c30; }
    .gb-start {
      align-self: flex-end; margin: 0 0 10px; width: 44px; height: 14px; border: 0; padding: 0;
      background: #2a2420; color: #6a5a50; font-size: 7px; font-weight: 800; letter-spacing: 0.14em;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      box-shadow: inset 2px 2px 0 #0a0806, inset -2px -2px 0 #4a3a30, 0 2px 0 #0a0806;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .gb-start:focus { outline: none; }
    .gb-start.pressed { color: #c4b4a4; box-shadow: inset 2px 2px 0 #0a0806, inset -1px -1px 0 #3a3028; transform: translateY(1px); }
    .gb-mid { display: flex; flex-direction: column; align-items: center; gap: 6px; align-self: flex-end; margin: 0 0 10px; }
    .gb-mid .gb-start { align-self: auto; margin: 0; }
    .gb-bag {
      width: 36px; height: 14px; border: 0; padding: 0;
      background: #2a2420; color: #8a7060; font-size: 7px; font-weight: 800; letter-spacing: 0.12em;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      box-shadow: inset 2px 2px 0 #0a0806, inset -2px -2px 0 #4a3a30, 0 2px 0 #0a0806;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .gb-bag:focus { outline: none; }
    .gb-bag.pressed { color: #c4b4a4; box-shadow: inset 2px 2px 0 #0a0806, inset -1px -1px 0 #3a3028; transform: translateY(1px); }
    #pauseglyph {
      position: fixed; right: 0.55rem;
      top: calc(0.5rem + env(safe-area-inset-top, 0px) + 40px);
      width: 34px; height: 28px; z-index: 6;
      border: 1px solid #5a3a20; background: rgba(20,10,8,0.88);
      color: #e8d5c0; border-radius: 8px; font-size: 11px; line-height: 1;
      pointer-events: auto; touch-action: manipulation; font-weight: 900;
      letter-spacing: 0.02em; display: none;
    }
    #relictray {
      position: fixed; left: 0.55rem;
      top: calc(2.55rem + env(safe-area-inset-top, 0px));
      z-index: 3; pointer-events: auto; touch-action: manipulation;
      font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase;
      color: #8a7060; line-height: 1.3; max-width: 42vw;
      background: rgba(20,10,8,0.72); border: 1px solid #3a2018;
      padding: 3px 6px; border-radius: 4px; display: none;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #relictray .on { color: #fde68a; font-weight: 800; }
    #relictray .off { color: #6a5a50; }
    #relictray.open {
      font-size: 11px; max-width: 54vw; white-space: normal;
      overflow: visible; background: rgba(20,10,8,0.94); border-color: #e85d04;
    }
    #streakline {
      margin-top: 0.4rem; font-size: 0.82rem; font-weight: 800;
      letter-spacing: 0.2em; color: #fde68a;
      text-shadow: 0 0 14px #e85d0488, 0 2px 0 #3a0c08;
      animation: streakpop 0.85s ease-in-out infinite;
    }
    @keyframes streakpop {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.88; }
    }
    #chalhud {
      position: fixed; left: 50%; transform: translateX(-50%);
      top: calc(3.45rem + env(safe-area-inset-top, 0px));
      z-index: 3; pointer-events: none;
      font-size: 1.08rem; font-weight: 900; letter-spacing: 0.16em;
      color: #fde68a; text-shadow: 0 2px 0 #3a0c08, 0 0 12px #fbbf2466;
      display: none; text-transform: uppercase;
    }
    #chalhud.on { display: block; }
    #pacthud {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(162px + env(safe-area-inset-bottom, 0px));
      z-index: 6; display: none; gap: 0.65rem;
      width: min(22.5rem, 94vw); pointer-events: none;
    }

    const rgb = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    const hi = [clamp(rgb[0] + 50, 0, 255), clamp(rgb[1] + 50, 0, 255), clamp(rgb[2] + 50, 0, 255)];
    const rows = ["........","...k....","..kCk...",".kCCCk..","kCCCCCCk",".kCCCk..","..kCk...","...k...."];
    const h = 8, w = 8;
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const g = c.getContext("2d");
    const img = g.createImageData(w, h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const ch = rows[y][x];
        if (ch === ".") continue;
        const col = ch === "k" ? [12, 10, 12] : (ch === "C" && (x + y) % 3 === 0 ? hi : rgb);
        const i = (y * w + x) * 4;
        img.data[i] = col[0]; img.data[i+1] = col[1]; img.data[i+2] = col[2]; img.data[i+3] = 255;
      }
    }
    g.putImageData(img, 0, 0);
    return { c: c, f: c, w: w, h: h };
  }

  function padBottom(rows, h) {
    const w = rows[0].length;
    const empty = new Array(w + 1).join(".").slice(0, w);
    const trimmed = rows.slice();
    while (trimmed.length && trimmed[trimmed.length - 1].indexOf("k") < 0 && trimmed[trimmed.length - 1].indexOf("R") < 0 && trimmed[trimmed.length - 1].indexOf("E") < 0) {
      trimmed.pop();
    }
    while (trimmed.length < h) trimmed.unshift(empty);
    return trimmed.slice(-h);
  }

  function seeded(n) {
    let s = (n * 1103515245 + 12345) & 0x7fffffff;
    return function () {
      s = (s * 1103515245 + 12345) & 0x7fffffff;
      return s / 0x7fffffff;
    };
  }

  function makeTile(kind, theme, variant) {
    const c = document.createElement("canvas");
    c.width = 16; c.height = 16;
    const g = c.getContext("2d");
    const rand = seeded(variant * 97 + kind.length * 13 + theme.floor[0].charCodeAt(1));
    function p(x, y, col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); }
    if (kind === "floor") {
      const cols = theme.floor;
      g.fillStyle = cols[variant % cols.length];
      g.fillRect(0, 0, 16, 16);
      g.fillStyle = cols[(variant + 1) % cols.length];
      g.fillRect(1, 1, 6, 6);
      g.fillRect(9, 8, 6, 6);
      g.fillStyle = cols[(variant + 2) % cols.length];
      g.fillRect(9, 1, 6, 5);
      g.fillRect(1, 9, 6, 5);
      g.fillStyle = cols[3];
      g.fillRect(0, 0, 16, 1);
      g.fillRect(0, 7, 16, 1);
      g.fillRect(0, 15, 16, 1);
      g.fillRect(0, 0, 1, 16);
      g.fillRect(8, 0, 1, 16);
      g.fillRect(15, 0, 1, 16);
      for (let i = 0; i < 10; i++) p((rand() * 16) | 0, (rand() * 16) | 0, cols[(i + variant) % cols.length]);
      if (variant === 2) {
        g.fillStyle = "rgba(0,0,0,0.35)";
        g.fillRect(3, 3, 1, 5); g.fillRect(3, 6, 4, 1); g.fillRect(6, 6, 1, 3);
      }
      if (variant === 3) {
        g.fillStyle = "rgba(90,12,12,0.4)";
        g.fillRect(10, 10, 3, 2); g.fillRect(11, 9, 2, 3);
      }
    } else if (kind === "wall") {
      const cols = theme.wall;
      g.fillStyle = cols[1];
      g.fillRect(0, 0, 16, 16);
      const shift = (variant % 2) * 8;
      const rowsY = [0, 5, 10, 15];
      g.fillStyle = cols[0];
      for (let i = 0; i < rowsY.length; i++) g.fillRect(0, rowsY[i], 16, 1);
      g.fillRect(shift, 0, 1, 5);
      g.fillRect((shift + 8) % 16, 5, 1, 5);
      g.fillRect(shift, 10, 1, 5);
      g.fillStyle = cols[3];
      g.fillRect(0, 0, 16, 2);
      g.fillStyle = cols[2];
      g.fillRect(1, 1, 14, 1);
      for (let i = 0; i < 14; i++) p((rand() * 16) | 0, (rand() * 16) | 0, cols[2 + (i % 2) % cols.length]);
      g.fillStyle = "rgba(0,0,0,0.25)";
      g.fillRect(0, 14, 16, 2);
    } else if (kind === "rug") {
      g.fillStyle = theme.rug[2];
      g.fillRect(0, 0, 16, 16);
      g.fillStyle = theme.rug[0];
      g.fillRect(1, 1, 14, 14);
      g.fillStyle = theme.rug[1];
      g.fillRect(3, 3, 10, 10);
      g.fillStyle = theme.rug[2];
      g.fillRect(7, 1, 2, 14);
      g.fillRect(1, 7, 14, 2);
    } else if (kind === "grate") {
      g.fillStyle = theme.grate[0];
      g.fillRect(0, 0, 16, 16);
      g.fillStyle = theme.grate[1];
      for (let y = 2; y < 16; y += 4)
        for (let x = 2; x < 16; x += 4) g.fillRect(x, y, 2, 2);
      g.fillStyle = theme.grate[2];
      g.fillRect(0, 0, 16, 1);
      g.fillRect(0, 0, 1, 16);
    } else if (kind === "ritual") {
      g.fillStyle = theme.floor[0];
      g.fillRect(0, 0, 16, 16);
      g.fillStyle = theme.ritual[0];
      g.fillRect(1, 1, 14, 14);
      g.fillStyle = theme.ritual[1];
      g.fillRect(3, 3, 10, 10);
      g.fillStyle = theme.ritual[2];
      g.fillRect(0, 7, 16, 1);
      g.fillRect(7, 0, 1, 16);
      p(2, 2, theme.ritual[2]); p(13, 2, theme.ritual[2]);
      p(2, 13, theme.ritual[2]); p(13, 13, theme.ritual[2]);
      p(7, 3, theme.ritual[2]); p(8, 3, theme.ritual[2]);

  function tilesFor(themeName) {
    if (tileCache[themeName]) return tileCache[themeName];

      wall: [0, 1, 2, 3].map(function (i) { return makeTile("wall", th, i); }),
      rug: makeTile("rug", th, 0),
      grate: makeTile("grate", th, 0),
      ritual: makeTile("ritual", th, 1),
      door: makeTile("door", th, 0)
    };
    tileCache[themeName] = pack;
    return pack;
  }

  function biomeFor(n) {
    if (n <= 40) return BIOMES[Math.min(4, ((n - 1) / 8) | 0)];
    if (n <= 48) return "ice";
    if (n <= 56) return "void";
    if (n <= 64) return "mire";
    return DEEP_BIOMES[(rng() * DEEP_BIOMES.length) | 0];
  }

  function isSolidChar(ch) {
    return ch === "#" || ch === "*" || ch === "P";
  }

  function transformLayout(rows, flipH, vary) {
    let grid = rows.map(function (r) { return r.split(""); });
    if (flipH) grid = grid.map(function (r) { return r.reverse(); });
    const h = grid.length, w = grid[0].length;
    if (vary) {
      for (let ty = 1; ty < h - 1; ty++) {
        for (let tx = 1; tx < w - 1; tx++) {
          const ch = grid[ty][tx];
          if (ch === "P" && rng() < 0.28) grid[ty][tx] = ".";
          else if (ch === "+" && rng() < 0.35) grid[ty][tx] = ".";
          else if (ch === "." && rng() < 0.035 && !isSolidChar(grid[ty - 1][tx])) {
            if (ty === 1 || ty === h - 2) grid[ty][tx] = "*";
          }
        }
      }
    }
    return grid;
  }

  function buildMap(n, forced) {
    layoutId = (forced && forced.layout) || (n === 1 ? "hall" : spick(LAYOUT_IDS));
    const themeName = (forced && forced.theme) || (n === 1 ? "ember" : biomeFor(n));
    const flipH = !forced && n > 1 && rng() < 0.5;
    THEME = THEMES[themeName] || THEMES.ember;
    THEME._name = themeName;
    MAP = transformLayout(LAYOUTS[layoutId] || LAYOUTS.hall, flipH, n > 1 && !forced);
    const width = MAP.reduce(function (m, r) { return Math.max(m, r.length); }, 0);
    MAP = MAP.map(function (r) {
      while (r.length < width) r.push("#");
      return r.slice(0, width);
    });
    COLS = MAP[0].length;
    ROWS = MAP.length;
    spawnTile = { x: COLS * 0.5, y: ROWS - 2.5 };
    doorTile = { x: COLS * 0.5, y: 1.5 };
    torches = [];
    for (let ty = 0; ty < ROWS; ty++) {
      for (let tx = 0; tx < COLS; tx++) {
        if (MAP[ty][tx] === "S") spawnTile = { x: tx + 0.5, y: ty + 0.5 };
        if (MAP[ty][tx] === "D") doorTile = { x: tx + 0.5, y: ty + 0.5 };
        if (MAP[ty][tx] === "*") torches.push({ x: tx + 0.5, y: ty + 0.22 });
      }
    }
    fitMap();
  }

  function fitMap() {
    if (!MAP.length) return;
    const topPad = 86 + (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("env(safe-area-inset-top)")) || 0);
    const deck = document.getElementById("gbsp");
    const botPad = deck ? Math.max(148, deck.offsetHeight) : 168;
    let t = Math.floor(Math.min((W - 8) / COLS, (H - topPad - botPad) / ROWS));
    t = Math.max(16, t - (t % 2));
    TILE = t;
    mapW = COLS * TILE;
    mapH = ROWS * TILE;
    mapX = Math.floor((W - mapW) / 2);
    mapY = Math.floor(topPad + Math.max(0, (H - topPad - botPad - mapH) / 2));
  }

  function solidAt(x, y) {
    const tx = Math.floor(x), ty = Math.floor(y);
    if (ty < 0 || ty >= ROWS || tx < 0 || tx >= COLS) return true;
    return isSolidChar(MAP[ty][tx]);
  }
  function blockedBox(x, y, r) {
    return solidAt(x - r, y - r) || solidAt(x + r, y - r) || solidAt(x - r, y + r) || solidAt(x + r, y + r) || solidAt(x, y);
  }
  function clampToWalkable(x, y) {
    x = clamp(x, 0.35, COLS - 0.35);
    y = clamp(y, 0.35, ROWS - 0.35);
    if (!solidAt(x, y)) return { x: x, y: y };
    let best = { x: spawnTile.x, y: spawnTile.y }, bd = 99;
    for (let ty = 0; ty < ROWS; ty++) {
      for (let tx = 0; tx < COLS; tx++) {
        if (isSolidChar(MAP[ty][tx])) continue;
        const cx = tx + 0.5, cy = ty + 0.5;
        const d = Math.hypot(cx - x, cy - y);
        if (d < bd) { bd = d; best = { x: cx, y: cy }; }
      }
    }
    return best;
  }
  function resolve(e) {
    const r = e.cr || 0.28;
    if (!blockedBox(e.x, e.y, r)) return;
    if (!blockedBox(e.x, e.y, 0.05)) {
      if (solidAt(e.x + r, e.y)) e.x = Math.floor(e.x + r) - r - 0.01;
      if (solidAt(e.x - r, e.y)) e.x = Math.floor(e.x - r) + 1 + r + 0.01;
      if (solidAt(e.x, e.y + r)) e.y = Math.floor(e.y + r) - r - 0.01;
      if (solidAt(e.x, e.y - r)) e.y = Math.floor(e.y - r) + 1 + r + 0.01;
      return;
    }
    const c = clampToWalkable(e.x, e.y);
    e.x = c.x; e.y = c.y;
  }
  function tryMove(e, nx, ny) {
    const r = e.cr || 0.28;
    if (!blockedBox(nx, ny, r)) { e.x = nx; e.y = ny; return; }
    if (!blockedBox(nx, e.y, r)) { e.x = nx; return; }
    if (!blockedBox(e.x, ny, r)) { e.y = ny; return; }
  }
  function keepInArena() {
    resolve(player);
    enemies.forEach(resolve);
  }

  function resize() {
    const v = viewSize();
    W = v.w; H = v.h;
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
    fitMap();
    if (phase === "fight" || phase === "loot" || phase === "shop" || phase === "event") keepInArena();
  }

  function screenToWorld(px, py) {
    return { x: (px - mapX) / TILE, y: (py - mapY) / TILE };

    });

    recap = [];

    comboT = 0;

    const wdef = START_WEAPONS.filter(function (w) { return w.id === unlocks.weapon; })[0] || START_WEAPONS[0];
    if (wdef && wdef.dmg) {
      player.dmg += wdef.dmg;
      const extra = WEAPONS.filter(function (w) { return w.name === wdef.name; })[0] || {};
      slots.weapon = {
        kind: "weapon",
        rarity: wdef.need >= 24 ? "epic" : wdef.need >= 16 ? "rare" : wdef.need >= 8 ? "common" : "junk",
        name: wdef.name, dmg: wdef.dmg,
        special: wdef.special || extra.special,
        onSlash: extra.onSlash
      };
      recap.push("START · " + wdef.name);
      markRarePlus(slots.weapon);
    }
    const rdef = START_RELICS.filter(function (r) { return r.id === unlocks.relic; })[0];
    if (rdef && relicUnlocked(rdef.id)) {
      if (rdef.stat === "leech") player.leech += rdef.v;
      if (rdef.stat === "crit") player.crit += rdef.v;
      if (rdef.stat === "speed") player.speed += rdef.v;
      if (rdef.stat === "hp") { player.maxhp += rdef.v; player.hp += rdef.v; }
      slots.relic = { kind: "relic", rarity: rdef.r || "common", name: rdef.name, stat: rdef.stat, v: rdef.v };
      recap.push("START · " + rdef.name);
      markRarePlus(slots.relic);
    }
    recap.push("CLASS · " + klass.name.toUpperCase());
    player._glassApplied = false;
    player.iceVx = 0; player.iceVy = 0; player.parryWin = 0;

        const ch = MAP[ty][tx];
        if (ch !== "#" && ch !== "*") continue;

        const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];

    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const dx = e.x - player.x, dy = e.y - player.y;
      const raw = Math.hypot(dx, dy) || 0.001;
      const d = raw - e.r;
      if (d > reach) continue;
      const dot = (dx * fx + dy * fy) / raw;
      const s = d + (dot > 0.2 ? 0 : 1.55) + (dot > 0.55 ? -0.35 : 0);
      if (s < score) { score = s; best = e; }
    }
    return best;
  }

  function interactOrSlash() {
    if (player.dead) return;
    if (phase === "shop" && shop) {
      let nearest = shop.sel, nd = 99, ref = false;
      for (let i = 0; i < shop.goods.length; i++) {
        const d = dist(player.x, player.y, shop.goods[i].x, shop.goods[i].y);
        if (d < nd) { nd = d; nearest = i; ref = false; }
      }
      if (shop.refresh && !shop.refresh.used) {
        const d = dist(player.x, player.y, shop.refresh.x, shop.refresh.y);
        if (d < nd) { nd = d; nearest = shop.goods.length; ref = true; }
      }
      shop.sel = nearest;
      if (ref) { if (nd < 1.4) tryRefresh(); return; }
      if (nd < 1.35) { tryBuy(shop.sel); return; }
      tryBuy(shop.sel);
      return;
    }
    if (phase === "event" && rest && !rest.used) {
      let nearest = rest.sel, nd = 99;
      for (let i = 0; i < rest.opts.length; i++) {
        const d = dist(player.x, player.y, rest.opts[i].x, rest.opts[i].y);
        if (d < nd) { nd = d; nearest = i; }
      }
      rest.sel = nearest;
      if (nd < 1.4) { useRest(rest.opts[rest.sel].id); return; }
    }
    if (phase === "event" && wheel && !wheel.used) {
      spinWheel();
      return;
    }
    if (phase === "event" && shrine && !shrine.used) {
      let nearest = shrine.sel, nd = 99;
      for (let i = 0; i < shrine.opts.length; i++) {
        const d = dist(player.x, player.y, shrine.opts[i].x, shrine.opts[i].y);
        if (d < nd) { nd = d; nearest = i; }
      }
      shrine.sel = nearest;
      if (nd < 1.4) { useShrine(shrine.opts[shrine.sel].id); return; }
    }
    if (phase === "event" && pact && !pact.used) {
      let nearest = pact.sel, nd = 99;
      for (let i = 0; i < pact.opts.length; i++) {
        const d = dist(player.x, player.y, pact.opts[i].x, pact.opts[i].y);
        if (d < nd) { nd = d; nearest = i; }
      }
      pact.sel = nearest;
      if (nd < 2.1) { usePact(pact.opts[pact.sel].id); return; }
    }
    facingSlash();
  }

  function facingSlash() {
    if (player.slashCd > 0 || player.dead) return;
    if (phase !== "fight" && phase !== "loot") return;
    if (combo >= 8) { doFinisher(); return; }
    const feel = weaponFeel();
    const fx = Math.cos(player.face), fy = Math.sin(player.face);
    player.flip = fx < 0;
    if (phase === "fight") {
      const t = bestSlashTarget();
      if (t && dist(player.x, player.y, t.x, t.y) <= slashReach() + 1.15) {
        dashStrike(t);
        if (dist(player.x, player.y, t.x, t.y) <= slashReach()) player.dash = null;
        return;
      }
    }
    beginSlash(0.28, 1);
    sfx("slash");
    fireSlashWave();
    slashBolts();
    tryCrackSecret();
    trySmashTablet();
    const hitR = slashReach() * (feel.heavy ? 1.05 : feel.fast ? 0.78 : 0.88);
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const dx = e.x - player.x, dy = e.y - player.y;
      const d = Math.hypot(dx, dy) || 0.001;
      if (d > hitR + e.r) continue;
      if ((dx * fx + dy * fy) / d > feel.cone) {
        const crit = rng() < player.crit;
        hitEnemy(e, slashDmg(crit), crit);
      }
    }
    burst(player.x + fx * 0.55, player.y + fy * 0.55, "#fb923c", feel.fire ? 7 : 4);
    if (feel.fire) burst(player.x + fx * 0.8, player.y + fy * 0.8, "#f97316", 4);
  }

  function startCharge() {
    if (player.dead) return;
    if (phase === "shop" || phase === "event") { interactOrSlash(); return; }
    if (phase !== "fight" && phase !== "loot") return;
    if (player.charging) return;
    player.charging = true;
    player.chargeT = 0;
    player.chargeReady = false;
  }
  function releaseCharge() {
    if (!player.charging) return;
    const ready = player.chargeReady;
    player.charging = false;
    player.chargeT = 0;
    player.chargeReady = false;
    if (player.dead) return;
    if (ready) doChargeSlash();
    else interactOrSlash();
  }
  function doChargeSlash() {
    if (player.dead || player.slashCd > 0) return;
    if (phase !== "fight" && phase !== "loot") return;
    const fx = Math.cos(player.face || 0), fy = Math.sin(player.face || 0);
    player.flip = fx < 0;
    const feel = beginSlash(0.5, 1.2);
    player.heavy = 0.38;
    tryMove(player, player.x + fx * 0.95, player.y + fy * 0.95);
    sfx("slash");
    beep(150, 0.14, "sawtooth", 0.07, 55);
    shake = Math.max(shake, 8);
    hitstop = 0.04;
    punchCam(2.6, fx, fy);
    screenFlash(0.14, "253,230,138");
    fireSlashWave();
    slashBolts();
    tryCrackSecret();
    trySmashTablet();
    const hitR = slashReach() * (feel.heavy ? 1.7 : feel.fast ? 1.4 : 1.55);
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const dx = e.x - player.x, dy = e.y - player.y;
      const d = Math.hypot(dx, dy) || 0.001;
      if (d > hitR + e.r) continue;
      if ((dx * fx + dy * fy) / d > (feel.heavy ? -0.42 : feel.fast ? -0.14 : -0.28)) {
        const crit = rng() < player.crit + 0.08;
        hitEnemy(e, Math.round(slashDmg(crit) * 1.8), crit);
        if (depth > 1) e.burn = Math.max(e.burn || 0, 2.5);
      }
    }
    burst(player.x + fx * 0.75, player.y + fy * 0.75, "#fde68a", 12);
    burst(player.x + fx * 1.15, player.y + fy * 1.15, "#fb923c", 8);
  }

  function parryWindow() {
    return pickedClass === "rogue" ? 0.16 : 0.12;
  }
  function tryParry() {
    if (paused || player.dead || phase !== "fight") return false;
    const win = parryWindow();
    let best = null, bd = 2.55;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (e.hp <= 0 || !e.wind || e.wind <= 0 || e.wind > win) continue;
      const d = dist(player.x, player.y, e.x, e.y);
      if (d < bd && d < (e.range || 1) + player.r + 1.2) { bd = d; best = e; }
    }
    if (!best) return false;
    best.wind = 0;
    best.atk = (best.cd || 1) + 0.4;
    best.stun = 0.72;
    best.vuln = (best.type === "knight" || best.type === "warden") ? 1.15 : 0.9;
    if (best.slam) best.slam = null;
    if (best.casting) { best.casting = false; best.teleT = 1.5; }
    player.slashCd = 0;
    player.parryWin = 0.48;
    player.iframes = Math.max(player.iframes, 0.2);
    player.dodgeCd = Math.max(player.dodgeCd, 0.24);
    screenFlash(0.16, "103,232,249");
    parryFlash = 0.2;
    burst(best.x, best.y, "#67e8f9", 16);
    burst(player.x, player.y, "#e0f2fe", 8);
    floats.push({ x: best.x, y: best.y - 0.65, t: 0.7, text: "PARRY", col: "#67e8f9" });
    sfx("clang");
    vibe(18);
    beep(880, 0.05, "square", 0.06);
    beep(240, 0.08, "triangle", 0.05, 120);
    shake = Math.max(shake, 5);
    return true;
  }
  function padDodge() {
    const st = stickNow();
    let dx, dy;
    if (st.on) { dx = st.x; dy = st.y; }
    else if (lastStick.x !== 0 || lastStick.y !== 0) { dx = lastStick.x; dy = lastStick.y; }

  function esc(s) {
    return String(s).replace(/[&<>]/g, function (ch) {
      return ch === "&" ? "&amp;" : ch === "<" ? "&lt;" : "&gt;";
    });
  }

  function burst(x, y, col, n) {
    for (let i = 0; i < n; i++) {
      const a = rnd(0, Math.PI * 2);
      const s = rnd(1.2, 4.6);
      parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: rnd(0.25, 0.5), col: col, r: rnd(1, 2.4) });
    }
  }

  function tapAt(px, py) {
    if (paused && inRun()) { togglePause(); return; }
    if (paused) hidePauseOverlay();
    if (!inRun()) return;
    const w = screenToWorld(px, py);
    for (let i = gems.length - 1; i >= 0; i--) {
      if (dist(w.x, w.y, gems[i].x, gems[i].y) < 1.15) { pickup(gems[i]); return; }
    }
    if (shop) {
      if (shop.refresh && !shop.refresh.used && dist(w.x, w.y, shop.refresh.x, shop.refresh.y) < 1.15) {
        shop.sel = shop.goods.length;
        tryRefresh();
        return;
      }
      for (let i = 0; i < shop.goods.length; i++) {
        if (dist(w.x, w.y, shop.goods[i].x, shop.goods[i].y) < 1.1) {
          shop.sel = i;
          tryBuy(i);
          return;
        }
      }
    }
    if (rest && !rest.used) {
      for (let i = 0; i < rest.opts.length; i++) {
        if (dist(w.x, w.y, rest.opts[i].x, rest.opts[i].y) < 1.15) {
          rest.sel = i;
          useRest(rest.opts[i].id);
          return;
        }
      }
    }
    if (wheel && !wheel.used && dist(w.x, w.y, wheel.x, wheel.y) < 1.4) {
      spinWheel();
      return;
    }
    if (shrine && !shrine.used) {
      for (let i = 0; i < shrine.opts.length; i++) {
        if (dist(w.x, w.y, shrine.opts[i].x, shrine.opts[i].y) < 1.15) {
          shrine.sel = i;
          useShrine(shrine.opts[i].id);
          return;
        }
      }
    }
    if (pact && !pact.used) {
      for (let i = 0; i < pact.opts.length; i++) {
        if (dist(w.x, w.y, pact.opts[i].x, pact.opts[i].y) < 2.15) {
          pact.sel = i;
          usePact(pact.opts[i].id);
          return;
        }
      }
    }
    if ((phase === "loot" || phase === "shop" || phase === "event") && branchDoors) {
      if (dist(w.x, w.y, branchDoors.left.x, branchDoors.left.y) < 1.5) { nextRoom("left"); return; }
      if (dist(w.x, w.y, branchDoors.right.x, branchDoors.right.y) < 1.5) { nextRoom("right"); return; }
    }
    if ((phase === "loot" || phase === "shop" || phase === "event") && exitGate && dist(w.x, w.y, exitGate.x, exitGate.y) < 1.5) {
      nextRoom();
      return;
    }
    if (secret && !secret.opened && dist(w.x, w.y, secret.tx + 0.5, secret.ty + 0.5) < 1.15) {
      openSecret();
      return;
    }
    if (phase === "fight") {
      if (chest && chest.mimic && dist(w.x, w.y, chest.x, chest.y) < 1.2) { triggerMimic(); return; }
      let best = null, bd = 1.65;
      for (let i = 0; i < enemies.length; i++) {
        const d = dist(w.x, w.y, enemies[i].x, enemies[i].y) - enemies[i].r;
        if (d < bd) { bd = d; best = enemies[i]; }
      }
      if (best) { dashStrike(best); return; }
    }
    const c = clampToWalkable(w.x, w.y);
    player.tx = c.x; player.ty = c.y;
    player.dash = null;
  }

  function onPtrDown(e) {
    if (ptr.id !== null && ptr.id !== e.pointerId) return;
    ptr.down = true; ptr.id = e.pointerId;
    ptr.x = ptr.sx = e.clientX; ptr.y = ptr.sy = e.clientY; ptr.t = performance.now();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  }
  function onPtrMove(e) {
    if (!ptr.down || e.pointerId !== ptr.id) return;
    ptr.x = e.clientX; ptr.y = e.clientY;
    e.preventDefault();
  }
  function onPtrUp(e) {

  function updateFamiliar(dt) {
    if (!familiar || player.dead) return;
    familiar.bob += dt;
    const tx = player.x - 0.72, ty = player.y - 0.52;
    familiar.x += (tx - familiar.x) * Math.min(1, dt * 5.4);
    familiar.y += (ty - familiar.y) * Math.min(1, dt * 5.4);
    if (phase !== "fight") return;
    familiar.peck = (familiar.peck || 0) - dt;
    if (familiar.peck > 0) return;
    let best = null, bd = 3.35;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (e.hp <= 0) continue;
      const d = dist(familiar.x, familiar.y, e.x, e.y);
      if (d < bd) { bd = d; best = e; }
    }
    if (!best) return;
    familiar.peck = 1.6;
    familiar.x += (best.x - familiar.x) * 0.32;
    familiar.y += (best.y - familiar.y) * 0.32;
    if (best.splitGuard > 0) return;
    if (best.type === "wisp" && !best.glow) return;
    const dmg = Math.max(2, 3 + ((depth / 5) | 0));
    best.hp -= dmg;
    best.flash = 0.1;
    dmgFloat(best.x, best.y - 0.45, "" + dmg, "#c4b5fd", 0.5);
    burst(best.x, best.y, "#a78bfa", 4);
    beep(640, 0.04, "square", 0.03, 380);
    if (maybeBossPhase(best)) return;
    if (best.hp <= 0) killEnemy(best);
  }
  function updateEnemy(e, dt) {

    e.vuln = Math.max(0, e.vuln - dt);

    if (e.stun > 0) {
      e.stun -= dt;
      e.flash = Math.max(e.flash, 0.06);
      return;
    }
    if (e.slow > 0) {
      e.slow -= dt;

      if (Math.floor(player.x) !== hz.tx || Math.floor(player.y) !== hz.ty) continue;
      if (hz.type === "slime") applyStatus("slow", 1.5);
      else if (hz.type === "spike") {

    for (let i = 0; i < enemies.length; i++) {
      for (let j = i + 1; j < enemies.length; j++) {

        const d2 = dist(a.x, a.y, b.x, b.y);

        if (d2 < min && d2 > 0.01) {

  function blit(s, wx, wy, flip, doFlash, scale) {
    if (!s) return;
    const sc = TILE / 16 * (scale || 1);
    const dw = s.w * sc, dh = s.h * sc;
    const px = sx(wx) - dw / 2;
    const py = sy(wy) - dh + sc * 2;
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    if (flip) {
      ctx.translate(sx(wx), 0);
      ctx.scale(-1, 1);
      ctx.translate(-sx(wx), 0);
    }
    ctx.drawImage(s.c, px, py, dw, dh);
    if (doFlash) {
      ctx.globalAlpha = 0.9;
      ctx.drawImage(s.f, px, py, dw, dh);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    return { px: px, py: py, dw: dw, dh: dh };
  }

  function footShadow(wx, wy, span) {

  function drawHpPip(wx, wy, hp, max, above, tag) {

    const x = sx(wx) - w / 2, y = sy(wy) - above;
    ctx.fillStyle = "#0a0606";
    ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
    ctx.fillStyle = "#3a1510";
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = "#e85d04";
    ctx.fillRect(x, y, w * clamp(hp / max, 0, 1), h);
    if (tag) {
      ctx.font = "800 8px ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "bottom";
      ctx.fillStyle = "#3a2010";
      ctx.fillText(tag, sx(wx) + 1, y - 1);
      ctx.fillStyle = "#fde68a";
      ctx.fillText(tag, sx(wx), y - 2);

  function isBorder(tx, ty) {
    return tx === 0 || ty === 0 || tx === COLS - 1 || ty === ROWS - 1;

  function drawTileImg(img, tx, ty) {

  function drawCracks(tx, ty) {
    const h = (tx * 928371 + ty * 193829) >>> 0;

    ctx.fillStyle = "rgba(0,0,0,0.28)";
    const x0 = x + (h % (TILE - 6)) + 2;
    const y0 = y + ((h >> 4) % (TILE - 6)) + 2;
    ctx.fillRect(x0, y0, 1, 4);
    ctx.fillRect(x0, y0 + 2, 3, 1);
    if ((h & 3) === 0) ctx.fillRect(x0 + 2, y0 + 2, 1, 3);

  function drawBlood(tx, ty) {
    if (!THEME || (THEME._name !== "blood" && THEME._name !== "hell" && THEME._name !== "ash")) {
      const h0 = (tx * 7 + ty * 17) >>> 0;
      if ((h0 & 15) !== 0) return;
    }
    const h = (tx * 48271 + ty * 11909) >>> 0;
    if (THEME && THEME._name === "ember" && (h & 7) > 1) return;
    if (THEME && THEME._name === "moss" && (h & 7) > 0) return;
    if (THEME && (THEME._name === "ice" || THEME._name === "void" || THEME._name === "mire") && (h & 7) > 2) return;
    const x = sx(tx), y = sy(ty);
    ctx.fillStyle = THEME && THEME._name === "moss" ? "rgba(40,70,20,0.35)"
      : (THEME && THEME._name === "ice" ? "rgba(180,220,240,0.22)"
      : (THEME && THEME._name === "void" ? "rgba(80,30,110,0.35)"
      : (THEME && THEME._name === "mire" ? "rgba(20,50,18,0.42)" : "rgba(120,16,16,0.4)")));
    const x0 = x + (h % (TILE - 5));

  function drawSlamZone(slam) {
    if (!slam) return;
    const k = 1 - slam.t / (slam.dur || 0.75);
    const r = slam.r;
    const pulse = 0.35 + k * 0.55;
    for (let ty = 0; ty < ROWS; ty++) {
      for (let tx = 0; tx < COLS; tx++) {
        if (isSolidChar(MAP[ty][tx])) continue;
        const cx = tx + 0.5, cy = ty + 0.5;
        if (Math.hypot(cx - slam.x, cy - slam.y) > r) continue;
        ctx.fillStyle = "rgba(180,16,16," + (0.16 + pulse * 0.28) + ")";
        ctx.fillRect(sx(tx), sy(ty), TILE, TILE);
        ctx.fillStyle = "rgba(255,60,50," + (0.2 + pulse * 0.35) + ")";
        ctx.fillRect(sx(tx) + 1, sy(ty) + 1, TILE - 2, 2);
        ctx.fillRect(sx(tx) + 1, sy(ty) + TILE - 3, TILE - 2, 2);
        ctx.fillRect(sx(tx) + 1, sy(ty) + 1, 2, TILE - 2);
        ctx.fillRect(sx(tx) + TILE - 3, sy(ty) + 1, 2, TILE - 2);

      ctx.fillRect(x + TILE * 0.48, y + 10, 2, 5);
      ctx.fillRect(x + TILE * 0.38, y + 14, 5, 2);
      ctx.fillStyle = "rgba(12,6,6,0.75)";
      ctx.fillRect(x + TILE * 0.36, y + 5, 1, 11);
      ctx.fillStyle = "rgba(167,139,250," + (0.2 + pulse * 0.35) + ")";
      ctx.fillRect(x + TILE * 0.3, y + 3, 1, 3);

  function drawMapFloor() {

      for (let tx = 0; tx < COLS; tx++) {
        const ch = MAP[ty][tx];

        else if (ch === "~") drawTileImg(pack.rug, tx, ty);
        else if (ch === "+") drawTileImg(pack.grate, tx, ty);
        else if (ch === "D") {

          ctx.fillStyle = THEME.wall[2];
          ctx.fillRect(sx(tx) + TILE * 0.18 - gap, sy(ty) - TILE * 0.28, TILE * 0.28, TILE * 1.05);
          ctx.fillRect(sx(tx) + TILE * 0.54 + gap, sy(ty) - TILE * 0.28, TILE * 0.28, TILE * 1.05);
          ctx.fillStyle = THEME.wall[3];
          ctx.fillRect(sx(tx) + TILE * 0.18 - gap, sy(ty) - TILE * 0.28, 3, TILE * 1.05);
          ctx.fillRect(sx(tx) + TILE * 0.79 + gap, sy(ty) - TILE * 0.28, 3, TILE * 1.05);
        } else if (ch === "P") drawTileImg(pack.floor[tileVar(tx, ty)], tx, ty);
        else {
          drawTileImg(pack.floor[tileVar(tx, ty)], tx, ty);
          drawCracks(tx, ty);
          drawBlood(tx, ty);
          if (THEME && THEME._name === "moss" && ((tx + ty) % 3 === 0)) {
            ctx.fillStyle = "rgba(180,220,200,0.09)";
            ctx.fillRect(sx(tx) + 2, sy(ty) + TILE * 0.58, TILE - 4, 3);
            ctx.fillStyle = "rgba(220,255,230,0.07)";
            ctx.fillRect(sx(tx) + 4, sy(ty) + TILE * 0.6, TILE * 0.38, 2);
          }
          if (THEME && THEME._name === "ice" && ((tx * 3 + ty) & 3) === 0) {
            ctx.fillStyle = "rgba(224,252,255,0.16)";
            ctx.fillRect(sx(tx) + (tx * 5 + ty) % (TILE - 4), sy(ty) + (ty * 7) % (TILE - 4), 2, 2);

            ctx.fillRect(sx(tx) + 4, sy(ty) + TILE * 0.6, TILE * 0.42, 2);

        }
      }
    }
    for (let i = 0; i < hazards.length; i++) {
      const hz = hazards[i];
      const x = sx(hz.tx), y = sy(hz.ty);
      if (hz.tele > 0) {
        const a = 0.2 + 0.35 * Math.sin(tick * 14);
        ctx.strokeStyle = hz.type === "slime" ? "rgba(74,222,128," + a + ")" : "rgba(248,113,113," + a + ")";
        ctx.lineWidth = 2;
        ctx.strokeRect(x + 2, y + 2, TILE - 4, TILE - 4);
        ctx.fillStyle = hz.type === "slime" ? "rgba(74,222,128," + (a * 0.25) + ")" : "rgba(220,38,38," + (a * 0.22) + ")";
        ctx.fillRect(x + 4, y + 4, TILE - 8, TILE - 8);
      } else if (hz.type === "spike") {

        ctx.fillRect(x + 3, y + TILE * 0.55, TILE - 6, TILE * 0.28);
        ctx.fillStyle = "#fda4af";
        ctx.fillRect(x + TILE * 0.22, y + TILE * 0.28, 3, TILE * 0.4);
        ctx.fillRect(x + TILE * 0.48, y + TILE * 0.18, 3, TILE * 0.5);
        ctx.fillRect(x + TILE * 0.7, y + TILE * 0.32, 3, TILE * 0.36);
        ctx.fillStyle = "#fff1f2";
        ctx.fillRect(x + TILE * 0.48, y + TILE * 0.16, 2, 3);
      } else {
        const a = 0.28 + 0.1 * Math.sin(tick * 5 + hz.x);
        ctx.fillStyle = "rgba(74,222,128," + a + ")";
        ctx.fillRect(x + 2, y + TILE * 0.35, TILE - 4, TILE * 0.5);
        ctx.fillStyle = "rgba(167,243,208," + (a + 0.1) + ")";
        ctx.fillRect(x + TILE * 0.28, y + TILE * 0.42, TILE * 0.4, TILE * 0.22);
      }
    }
    for (let i = 0; i < bloodStains.length; i++) {
      const st = bloodStains[i];
      const a = clamp(st.t / 11, 0, 1) * 0.55;
      const x = sx(st.x), y = sy(st.y);
      ctx.fillStyle = "rgba(120,16,16," + a + ")";
      ctx.fillRect(x - 5, y - 2, 7, 3);
      ctx.fillRect(x - 1, y - 5, 3, 6);
      ctx.fillRect(x + 2, y - 1, 4, 2);
    }
    let minx = 99, miny = 99, maxx = 0, maxy = 0, found = 0;
    for (let ty = 0; ty < ROWS; ty++) {
      for (let tx = 0; tx < COLS; tx++) {
        if (MAP[ty][tx] !== "o") continue;
        found++;
        if (tx < minx) minx = tx; if (ty < miny) miny = ty;
        if (tx > maxx) maxx = tx; if (ty > maxy) maxy = ty;
      }
    }
    if (found > 4) {
      const cx = sx((minx + maxx + 1) * 0.5);
      const cy = sy((miny + maxy + 1) * 0.5);
      const r = Math.max(TILE, (maxx - minx + 1) * TILE * 0.42);
      ctx.strokeStyle = "rgba(220,36,36,0.55)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      for (let i = 0; i <= 5; i++) {
        const a = -Math.PI / 2 + i * Math.PI * 2 * 2 / 5;
        const x = cx + Math.cos(a) * r * 0.92;
        const y = cy + Math.sin(a) * r * 0.92;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }

  function drawBorderWalls() {
    const pack = tilesFor(THEME._name);
    for (let ty = 0; ty < ROWS; ty++) {

  function drawLighting() {
    if (!lightCvs || lightCvs.width !== canvas.width || lightCvs.height !== canvas.height) {
      lightCvs = document.createElement("canvas");
      lightCvs.width = canvas.width;
      lightCvs.height = canvas.height;
      lightCtx = lightCvs.getContext("2d");
      lightCacheKey = "";
    }
    const busy = enemies.length > 12;
    const px = player.x != null ? ((player.x * 2) | 0) : 0;
    const py = player.y != null ? ((player.y * 2) | 0) : 0;
    const key = px + "," + py + "," + (exitGate ? 1 : 0) + "," + (THEME && THEME._name) + "," + (hasMut("darkness") ? 1 : 0);
    lightSkip++;
    const reuse = lightCacheKey === key && lightSkip % (busy ? 4 : 2) !== 0;
    if (!reuse) {
      lightCacheKey = key;
      const g = lightCtx;
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.imageSmoothingEnabled = true;
      g.clearRect(0, 0, W, H);
      g.fillStyle = THEME && THEME._name === "void" ? "rgba(2,0,6,0.90)" : (THEME && THEME._name === "mire" ? "rgba(2,8,4,0.90)" : "rgba(5,2,3,0.80)");
      g.fillRect(0, 0, W, H);
      g.globalCompositeOperation = "destination-out";
      function punch(x, y, rad, str) {
        const grd = g.createRadialGradient(x, y, rad * 0.08, x, y, rad);
        grd.addColorStop(0, "rgba(0,0,0," + str + ")");
        grd.addColorStop(0.45, "rgba(0,0,0," + (str * 0.5) + ")");
        grd.addColorStop(1, "rgba(0,0,0,0)");
        g.fillStyle = grd;
        g.beginPath();
        g.arc(x, y, rad, 0, Math.PI * 2);
        g.fill();
      }
      for (let i = 0; i < torches.length; i++) {
        const tch = torches[i];
        const flick = busy ? 0.94 : (0.9 + Math.sin(tick * 9 + i * 1.7) * 0.08 + Math.sin(tick * 17 + i) * 0.04);
        const dark = (hasMut("darkness") ? 0.58 : 1) * (THEME && THEME._name === "mire" ? 0.72 : 1);
        punch(sx(tch.x), sy(tch.y + 0.2), TILE * 3.4 * flick * dark, 0.95);
      }
      const darkP = (hasMut("darkness") ? 0.58 : 1) * (THEME && THEME._name === "mire" ? 0.72 : 1);
      if (phase !== "title" && player.x != null) punch(sx(player.x), sy(player.y - 0.4), TILE * 2.4 * darkP, 0.7);
      if (exitGate) punch(sx(exitGate.x), sy(exitGate.y), TILE * 2.1 * darkP, 0.75);
      g.globalCompositeOperation = "source-over";
    }
    ctx.drawImage(lightCvs, 0, 0, W, H);
    if (reuse && busy) return;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < torches.length; i++) {
      const tch = torches[i];
      const flick = 0.55 + Math.sin(tick * 8 + i * 2.1) * 0.12;
      const x = sx(tch.x), y = sy(tch.y + 0.15);
      const rad = TILE * 2.2 * flick;
      const grd = ctx.createRadialGradient(x, y, 2, x, y, rad);
      if (THEME && THEME._name === "mire") {
        grd.addColorStop(0, "rgba(120,180,70," + (0.16 * flick) + ")");
        grd.addColorStop(0.4, "rgba(40,80,30," + (0.08 * flick) + ")");
        grd.addColorStop(1, "rgba(20,40,16,0)");
      } else {
        grd.addColorStop(0, "rgba(255,160,50," + (0.22 * flick) + ")");
        grd.addColorStop(0.4, "rgba(232,93,4," + (0.10 * flick) + ")");
        grd.addColorStop(1, "rgba(232,93,4,0)");
      }
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(x, y, rad, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function heroSprite() {
    if (Math.sin(player.face || 0) < -0.48 && player.slashAnim <= 0.35 && spr.heroBack) return spr.heroBack;
    if (player.slashAnim > 0.35) return spr.heroSlash;
    if (player.walkT > 0) {
      const f = ((player.walkT * 8) | 0) % 4;
      return f === 0 ? spr.heroW1 : f === 1 ? spr.heroW2 : f === 2 ? spr.heroW3 : spr.heroW4;
    }
    const bob = Math.sin(tick * 3) > 0.3;
    return bob ? spr.hero : spr.heroW4;
  }

  function drawHeroAt(wx, wy, flip, flashAmt, alpha, slashAmt) {
    ctx.save();
    if (alpha != null) ctx.globalAlpha = alpha;
    const ghost = player.iframes > 0 && ((tick * 20) | 0) % 2 === 0 && alpha == null;
    if (ghost) ctx.globalAlpha = 0.4;
    footShadow(wx, wy, 0.7);
    if (THEME && (THEME._name === "moss" || THEME._name === "mire") && alpha == null) {
      ctx.fillStyle = THEME._name === "mire" ? "rgba(50,90,40,0.22)" : "rgba(170,220,190,0.16)";
      ctx.fillRect(sx(wx) - 9, sy(wy) + 2, 18, 5);
      ctx.fillStyle = THEME._name === "mire" ? "rgba(140,200,90,0.1)" : "rgba(220,255,230,0.1)";
      ctx.fillRect(sx(wx) - 4, sy(wy) + 3, 9, 2);
    }
    blit(heroSprite(), wx, wy, flip, flashAmt > 0);
    if (finishSpin > 0) {
      const fr = finishSpin > 0.5 ? spr.spin1 : spr.spin2;
      blit(fr, wx, wy - 0.12, false, false, 1.4);
      blit(fr, wx, wy - 0.12, true, false, 1.15);
    } else if (slashAmt > 0) {
      const feel = weaponFeel();
      const fr = slashAmt > 0.66 ? spr.slash1 : slashAmt > 0.33 ? spr.slash2 : spr.slash3;
      const ox = (flip ? -0.85 : 0.85) * (feel.heavy ? 1.12 : feel.fast ? 0.78 : 1);
      const sc = (player.heavy > 0 ? 1.45 : 1) * feel.slashScale * (feel.epic ? 1.08 : 1);
      blit(fr, wx + ox, wy - 0.15, flip, false, sc);
      if (player.heavy > 0 || feel.heavy) blit(fr, wx + ox * 1.25, wy - 0.35, flip, false, 1.2 * feel.slashScale);
      if (feel.fire) {
        ctx.globalAlpha = 0.4 * slashAmt;
        ctx.fillStyle = "#fb923c";
        ctx.beginPath();
        ctx.arc(sx(wx + ox * 0.65), sy(wy - 0.18), TILE * 0.32 * feel.slashScale, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
    if (player.charging) {
      const ready = player.chargeReady;
      const pulse = 0.45 + Math.sin(tick * (ready ? 14 : 8)) * 0.35;
      ctx.globalAlpha = pulse;
      blit(spr.star, wx + 0.38, wy - 0.95, false, false);
      blit(spr.star, wx - 0.32, wy - 0.7, false, false);
      if (ready) blit(spr.star, wx, wy - 1.15, false, false);
      ctx.globalAlpha = 1;
      ctx.fillStyle = ready ? "rgba(253,230,138,0.85)" : "rgba(251,191,36,0.55)";
      const cx = sx(wx), cy = sy(wy) - TILE * 0.85;
      ctx.fillRect(cx - 1, cy - 3, 2, 2);
      ctx.fillRect(cx + 4, cy - 1, 2, 2);
      ctx.fillRect(cx - 5, cy, 2, 2);
    }
    ctx.restore();
  }
  function drawStatusIcons(wx, wy) {
    const icons = [];
    if (player.poison > 0) icons.push("#4ade80");
    if (player.burn > 0) icons.push("#fb923c");
    if (player.slow > 0) icons.push("#94a3b8");
    if (player.cursed) icons.push("#a78bfa");
    if (player.pactRage > 0) icons.push("#ef4444");
    if (!icons.length) return;
    const baseX = sx(wx) - (icons.length - 1) * 5;
    const baseY = sy(wy) - TILE * 1.22;
    for (let i = 0; i < icons.length; i++) {
      ctx.fillStyle = icons[i];
      ctx.fillRect(baseX + i * 10 - 2, baseY, 5, 5);
      ctx.fillStyle = "#1a0a08";
      ctx.fillRect(baseX + i * 10, baseY + 1, 2, 3);
    }
  }
  function drawPlayer() {
    if (player.x == null) return;
    drawHeroAt(player.x, player.y, player.flip, player.flash, null, player.slashAnim);
    drawStatusIcons(player.x, player.y);
  }

  function enemySprite(e) {
    if (e.type === "slime") { const f = ((e.bob * 5.2) | 0) % 3; return f === 0 ? spr.slime1 : f === 1 ? spr.slime2 : (spr.slime3 || spr.slime1); }
    if (e.type === "bat") return Math.sin(e.bob * 10) > 0 ? spr.bat1 : spr.bat2;
    if (e.type === "spitter") return (e.wind > 0 || e.atk > e.cd * 0.75) ? spr.spit2 : spr.spit1;
    if (e.type === "knight" || e.type === "warden") {
      if (e.wind > 0 || (e.slam && e.slam.t > 0.25)) return spr.knight2;
      return (((e.bob * 4) | 0) % 2 && spr.knight3) ? spr.knight3 : spr.knight1;
    }
    if (e.type === "bomber") return (e.boom > 0 || Math.sin(e.bob * 7) > 0) ? spr.bomber2 : spr.bomber1;
    if (e.type === "mimic") return Math.sin(e.bob * 5) > 0 ? spr.mimic : spr.chestC;
    if (e.type === "brute") {
      if (e.wind > 0) return spr.bruteAtk;
      if (e.atk > e.cd * 0.7) return spr.brute;
      const f = ((e.bob * 4) | 0) % 3;
      return f === 1 ? spr.bruteW : (f === 2 && spr.bruteW2 ? spr.bruteW2 : spr.brute);
    }
    if (e.type === "shade") return (e.wind > 0) ? spr.knight2 : spr.knight1;
    if (e.type === "wisp") return e.glow ? spr.wisp2 : spr.wisp1;
    if (e.type === "leaper") return e.hopT > 0 ? spr.leaper2 : (e.hopWind > 0 ? spr.leaper3 : spr.leaper1);
    if (e.type === "golem") return (e.slam && e.slam.t > 0.2) ? spr.golemSlam : spr.golem;
    if (e.type === "boneking") return (e.slam && e.slam.t > 0.2) ? spr.bonekingSlam : spr.boneking;
    if (e.type === "ashwitch") return (e.wind > 0 || e.casting) ? spr.ashwitchCast : spr.ashwitch;
    if (e.type === "hollowtwin") return (e.slam && e.slam.t > 0.2) ? spr.hollowSlam : spr.hollow;
    if (e.type === "heart") return Math.sin((e.pulse || 0) * 7) > 0.15 ? spr.heartPulse : spr.heart;
    return (e.slam && e.slam.t > 0.2) ? spr.bossSlam : spr.boss;
  }

  function drawShieldGleam(e, scale) {
    if (shieldOpen(e)) return;
    const fx = Math.cos(e.face || 0), fy = Math.sin(e.face || 0);
    const gx = sx(e.x + fx * 0.42 * (scale || 1));
    const gy = sy(e.y - 0.38 + fy * 0.32);
    const gleam = 0.5 + Math.sin(tick * 9 + e.bob) * 0.4;
    ctx.save();
    ctx.fillStyle = "rgba(186, 214, 240, " + (0.55 + gleam * 0.4) + ")";
    ctx.fillRect(gx - 4, gy - 8, 8, 16);
    ctx.fillStyle = "rgba(255, 255, 255, " + (0.45 + gleam * 0.5) + ")";
    ctx.fillRect(gx - 2, gy - 6, 3, 5);
    ctx.fillRect(gx + 1, gy - 1, 2, 7);
    ctx.fillStyle = "rgba(125, 211, 252, " + (0.35 + gleam * 0.35) + ")";
    ctx.fillRect(gx - 5, gy - 3, 2, 8);
    ctx.restore();
  }
  function drawEnemy(e) {
    if (e.slam) drawSlamZone(e.slam);
    if (e.type === "ashwitch" && e.casting && e.puddleX != null) {
      drawSlamZone({ x: e.puddleX, y: e.puddleY, t: Math.max(0.05, e.wind), dur: 0.5, r: 0.9 });
    }
    if (e.boom > 0) {
      const k = 1 - e.boom / 0.7;
      const radPx = TILE * 2.25;
      ctx.save();
      ctx.fillStyle = "rgba(251,80,40," + (0.08 + k * 0.14) + ")";
      ctx.beginPath();
      ctx.arc(sx(e.x), sy(e.y) - 6, radPx, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(255,90,40," + (0.55 + k * 0.4) + ")";
      ctx.lineWidth = 3 + k * 2;
      ctx.beginPath();
      ctx.arc(sx(e.x), sy(e.y) - 6, radPx, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    const span = e.type === "boss" || e.type === "boneking" || e.type === "heart" ? 1.35 : (e.type === "warden" || e.type === "golem" || e.type === "hollowtwin") ? 1.25 : (e.type === "brute" || e.type === "knight" || e.type === "mimic") ? 1.05 : 0.7;
    if (e.type === "leaper" && e.hopMark && (e.hopWind > 0 || e.hopT > 0)) {
      const mk = e.hopMark;
      const k = e.hopWind > 0 ? 1 - e.hopWind / 0.48 : 1;
      const rw = TILE * (0.38 + k * 0.42);
      const rh = TILE * (0.16 + k * 0.16);
      const mx = sx(mk.x), my = sy(mk.y);
      ctx.fillStyle = "rgba(0,0,0," + (0.28 + k * 0.34) + ")";
      ctx.fillRect(mx - rw, my - rh * 0.45, rw * 2, rh);
      ctx.strokeStyle = "rgba(74,222,128," + (0.4 + k * 0.45 + 0.15 * Math.sin(tick * 18)) + ")";
      ctx.lineWidth = 2;
      ctx.strokeRect(mx - rw, my - rh * 0.45, rw * 2, rh);
    }
    const hopLift = e.hopH || 0;
    footShadow(e.x, e.y, span * (e.affix === "giant" ? 1.3 : 1) * (hopLift > 0 ? 0.72 + hopLift * 0.12 : 1));
    if (e.wind > 0) {
      ctx.save();
      ctx.strokeStyle = "rgba(255,244,200," + (0.5 + 0.45 * Math.sin(tick * 22)) + ")";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(sx(e.x), sy(e.y) + 3, TILE * (0.34 + e.r * 0.14), 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    const s = enemySprite(e);
    const hurt = e.flash > 0 || e.wind > 0;
    const guardOpen = (e.type === "knight" || e.type === "warden") && shieldOpen(e);
    let escale = e.type === "warden" ? 1.5 : (e.type === "boneking" ? 1.15 : (e.type === "golem" ? 1.2 : (e.type === "hollowtwin" ? (e.twin ? 0.82 : 1.08) : (e.type === "heart" ? 1.62 + Math.sin((e.pulse || 0) * 6.2) * 0.1 : 1))));
    if (e.affix === "giant") escale *= 1.3;
    if (e.type === "shade") ctx.globalAlpha = 0.42;
    blit(s, e.x, e.y - hopLift, e.flip, (hurt && e.flash > 0) || guardOpen, escale);
    if (e.type === "shade") ctx.globalAlpha = 1;
    if (guardOpen) {
      ctx.save();
      ctx.globalAlpha = 0.4 + 0.28 * Math.sin(tick * 16);
      blit(s, e.x, e.y, e.flip, true, escale * 1.04);
      ctx.restore();
    } else if (e.wind > 0 && e.type !== "boss") {
      ctx.globalAlpha = 0.55;
      blit(s, e.x, e.y - hopLift, e.flip, true, escale);
      ctx.globalAlpha = 1;
    }
    if (e.frost) {
      ctx.strokeStyle = "rgba(125,211,252,0.55)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sx(e.x), sy(e.y) - TILE * 0.3, TILE * 0.38, 0, Math.PI * 2);
      ctx.stroke();
    }
    if (e.burn > 0) {
      ctx.fillStyle = "rgba(251,146,60," + (0.26 + 0.16 * Math.sin(tick * 14)) + ")";
      ctx.beginPath();
      ctx.arc(sx(e.x), sy(e.y) - TILE * 0.32, TILE * 0.2, 0, Math.PI * 2);
      ctx.fill();
    }
    if (e.type === "wisp" && e.glow) {
      ctx.save();
      ctx.fillStyle = "rgba(196,181,253," + (0.16 + 0.1 * Math.sin(tick * 10)) + ")";
      ctx.beginPath();
      ctx.arc(sx(e.x), sy(e.y) - TILE * 0.35, TILE * 0.55, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(233,213,255,0.9)";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(sx(e.x), sy(e.y) - TILE * 0.35, TILE * 0.48, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    if (e.type === "knight" || e.type === "warden") drawShieldGleam(e, escale);
    if (e.elite) blit(spr.star, e.x - (e.affixTag ? 0.36 : 0), e.y - hopLift - 1.15, false, false);
    const above = (s.h * (TILE / 16) * escale) + 6;
    drawHpPip(e.x, e.y - hopLift, e.hp, e.maxhp, above, e.affixTag);
  }

  function drawChest() {
    if (!chest) return;
    footShadow(chest.x, chest.y, 0.7);
    if (chest.vault && !chest.open) {
      ctx.fillStyle = "rgba(251,191,36," + (0.16 + 0.1 * Math.sin(tick * 8)) + ")";

      ctx.arc(sx(chest.x), sy(chest.y) - TILE * 0.18, TILE * 0.55, 0, Math.PI * 2);
