<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a0706" />
  <title>Slash Pit</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh;
      overflow: hidden; overscroll-behavior: none; touch-action: none;
      background: #0a0706; color: #f3e8de;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      user-select: none; -webkit-user-select: none;
    }
    canvas {
      display: block; width: 100%; height: 100%; touch-action: none;
      image-rendering: pixelated; image-rendering: crisp-edges;
    }
    #hud {
      position: fixed; left: 0; right: 0; top: 0;
      padding: calc(0.55rem + env(safe-area-inset-top, 0px)) 2.6rem 0.4rem 0.9rem;
      pointer-events: none; z-index: 2;
    }
    .hpwrap {
      height: 14px; border-radius: 99px; background: #1a1010;
      border: 1px solid #3a2018; overflow: hidden;
    }
    .hpfill {
      height: 100%; width: 100%;
      background: linear-gradient(90deg, #9b1d20, #e85d04);
      transform-origin: left center;
    }
    .row {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-top: 0.35rem; font-size: 0.72rem; letter-spacing: 0.08em;
      text-transform: uppercase; color: #c4b4a4; gap: 0.4rem;
    }
    #hptext { font-variant-numeric: tabular-nums; }
    #goldtext { color: #fbbf24; font-weight: 700; font-variant-numeric: tabular-nums; }
    #combotext { color: #fde68a; font-weight: 800; min-width: 2.4rem; text-align: center; }
    #roomtext { font-weight: 700; }
    #mutebtn {
      position: fixed; right: 0.55rem;
      top: calc(0.5rem + env(safe-area-inset-top, 0px));
      width: 34px; height: 34px; z-index: 6;
      border: 1px solid #5a3a20; background: rgba(20,10,8,0.88);
      color: #e8d5c0; border-radius: 8px; font-size: 15px; line-height: 1;
      pointer-events: auto; touch-action: manipulation;
    }
    #mutebtn.muted { color: #6a5a50; text-decoration: line-through; }
    #toast {
      position: fixed; left: 50%;
      top: calc(4.1rem + env(safe-area-inset-top, 0px));
      transform: translateX(-50%) translateY(-8px);
      padding: 0.45rem 0.85rem; border-radius: 999px;
      background: rgba(20,10,8,0.88); border: 1px solid #5a3a20;
      font-size: 0.82rem; font-weight: 700; letter-spacing: 0.02em;
      opacity: 0; pointer-events: none; z-index: 3; white-space: nowrap;
      max-width: 92vw; overflow: hidden; text-overflow: ellipsis;
      transition: opacity 0.12s linear, transform 0.12s ease;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #overlay {
      position: fixed; inset: 0 0 calc(150px + env(safe-area-inset-bottom, 0px)) 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 1.2rem 1.1rem 0.8rem;
      background: radial-gradient(ellipse at center, rgba(6,3,3,0.86) 0%, rgba(6,3,3,0.52) 62%, rgba(6,3,3,0.36) 100%);
      z-index: 4; overflow: auto;
    }
    #overlay.hidden { display: none; }
    #hud.off { visibility: hidden; }
    #overlay h1 {
      margin: 0; font-size: clamp(2.2rem, 11vw, 3.6rem);
      letter-spacing: 0.08em; line-height: 0.95;
      text-shadow: 0 0 24px #e85d0466, 0 4px 0 #3a0c08;
    }
    #overlay h2 {
      margin: 0; font-size: clamp(1.6rem, 8vw, 2.6rem); letter-spacing: 0.06em;
    }
    #overlay p { margin: 0.55rem 0 0; color: #c4b4a4; line-height: 1.45; max-width: 22rem; }
    #overlay .recap {
      margin-top: 0.7rem; font-size: 0.82rem; color: #e8d5c0;
      max-height: 22vh; overflow: auto; line-height: 1.5;
    }
    #seedline { margin-top: 0.45rem; font-size: 0.72rem; letter-spacing: 0.14em; color: #8a7060; text-transform: uppercase; }
    .btn {
      margin-top: 1.1rem; min-height: 3.1rem; min-width: 12.5rem;
      padding: 0.8rem 1.6rem; border: 0; border-radius: 999px;
      background: #e85d04; color: #1a0800; font-weight: 800;
      font-size: 1.08rem; letter-spacing: 0.04em; touch-action: manipulation;
    }
    .btn:active { transform: scale(0.98); }
    .btn-alt {
      background: #2a2018; color: #e8d5c0; box-shadow: inset 0 0 0 1px #5a3a20;
    }
    .btn-sm { min-width: 8.2rem; min-height: 2.7rem; font-size: 0.92rem; margin-top: 0.55rem; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 0.45rem; justify-content: center; margin-top: 0.35rem; }
    .unlock-grid { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; max-width: 22rem; margin-top: 0.45rem; }
    .unlock-chip {
      padding: 0.42rem 0.62rem; border: 1px solid #5a3a20; background: #1a100c;
      color: #c4b4a4; font-size: 0.7rem; letter-spacing: 0.05em; text-transform: uppercase;
      font-weight: 700; touch-action: manipulation;
    }
    .unlock-chip.on { border-color: #e85d04; color: #fde68a; background: #2a1408; }
    .unlock-chip.lock { opacity: 0.38; }
    #hint { display: none; }
    #pauseov {
      position: fixed; inset: 0 0 calc(150px + env(safe-area-inset-bottom, 0px)) 0;
      display: none; align-items: center; justify-content: center;
      background: rgba(6,3,3,0.55); z-index: 7; pointer-events: none;
    }
    #pauseov.on { display: flex; }
    #pauseov span {
      font-size: clamp(2rem, 10vw, 3.2rem); font-weight: 900; letter-spacing: 0.18em;
      color: #fde68a; text-shadow: 0 4px 0 #3a0c08, 0 0 22px #e85d0466;
    }
    #seedin {
      margin-top: 0.55rem; width: 12.5rem; min-height: 2.6rem;
      border: 1px solid #5a3a20; background: #1a100c; color: #fde68a;
      font-size: 16px; letter-spacing: 0.18em; text-align: center; text-transform: uppercase;
      font-family: ui-monospace, "SF Mono", Menlo, monospace; font-weight: 800;
      touch-action: manipulation;
    }
    .hexgrid {
      display: grid; grid-template-columns: repeat(4, 2.55rem); gap: 0.35rem;
      justify-content: center; margin-top: 0.55rem;
    }
    .hexkey {
      width: 2.55rem; height: 2.55rem; border: 1px solid #5a3a20; background: #1a100c;
      color: #e8d5c0; font-weight: 800; font-size: 0.95rem; letter-spacing: 0.04em;
      touch-action: manipulation; padding: 0;
    }
    .hexkey.go { background: #e85d04; color: #1a0800; border-color: #e85d04; }
    .statline { margin-top: 0.35rem; font-size: 0.82rem; color: #e8d5c0; letter-spacing: 0.06em; }

    #gbsp {
      --dp: 108px; --bt: 60px; --arm: calc(var(--dp) / 3);
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      image-rendering: pixelated; image-rendering: crisp-edges;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
    }
    #gbsp * { touch-action: none; -webkit-user-select: none; user-select: none; }
    .gb-lip {
      height: 6px;
      background: linear-gradient(#3a3028 0 2px, #1a1410 2px 4px, #0a0806 4px 6px);
      box-shadow: 0 -2px 0 #080604;
    }
    .gb-tray {
      position: relative; display: flex; justify-content: space-between; align-items: flex-end;
      padding: 20px 18px 12px;
      background-color: rgba(14, 10, 9, 0.90);
      background-image:
        linear-gradient(180deg, rgba(255,220,180,0.05) 0 2px, transparent 2px 10px),
        repeating-linear-gradient(90deg, rgba(0,0,0,0.22) 0 2px, transparent 2px 4px),
        repeating-linear-gradient(0deg, rgba(0,0,0,0.14) 0 2px, transparent 2px 4px);
      border-top: 2px solid #2a2018;
      box-shadow: inset 0 2px 0 #4a3a30, inset 0 -2px 0 #080604;
    }
    .gb-legend {
      position: absolute; left: 0; right: 0; top: 6px; text-align: center;
      font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase;
      color: #8a7060; pointer-events: none; font-weight: 700;
    }
    .gb-screw {
      position: absolute; width: 8px; height: 8px; background: #2a221c;
      box-shadow: inset 2px 2px 0 #5a4a40, inset -2px -2px 0 #0a0806, 2px 2px 0 #0a0806;
      pointer-events: none;
    }
    .gb-screw.s1 { left: 8px; top: 10px; }
    .gb-screw.s2 { right: 8px; top: 10px; }
    .gb-left { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 10px; }
    .dpad { width: var(--dp); height: var(--dp); position: relative; filter: drop-shadow(0 4px 0 #080604); }
    .dpad-v, .dpad-h {
      position: absolute; background: #2c3036;
      box-shadow: inset 2px 2px 0 #5a616a, inset -2px -2px 0 #14161a, 0 0 0 2px #0a0808;
    }
    .dpad-v { width: var(--arm); height: var(--dp); left: var(--arm); top: 0; }
    .dpad-h { width: var(--dp); height: var(--arm); left: 0; top: var(--arm); }
    .dpad-nub {
      position: absolute; width: 22px; height: 22px; left: calc(50% - 11px); top: calc(50% - 11px);
      background: #1a1c20; border-radius: 4px; z-index: 2;
      box-shadow: inset 2px 2px 0 #4a5058, inset -2px -2px 0 #0c0c0e, 0 0 0 2px #0a0808;
    }
    .dpad-arr { position: absolute; z-index: 1; pointer-events: none; width: 0; height: 0; }
    .dpad-arr.u { left: calc(50% - 6px); top: 8px; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 8px solid #6a727c; }
    .dpad-arr.d { left: calc(50% - 6px); bottom: 8px; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid #6a727c; }
    .dpad-arr.l { left: 8px; top: calc(50% - 6px); border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-right: 8px solid #6a727c; }
    .dpad-arr.r { right: 8px; top: calc(50% - 6px); border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 8px solid #6a727c; }
    .dpad.press-u .dpad-v { box-shadow: inset 2px 4px 0 #14161a, inset -2px -2px 0 #3a4048, 0 0 0 2px #0a0808; }
    .dpad.press-d .dpad-v { box-shadow: inset 2px 2px 0 #3a4048, inset -2px -4px 0 #14161a, 0 0 0 2px #0a0808; }
    .dpad.press-l .dpad-h { box-shadow: inset 4px 2px 0 #14161a, inset -2px -2px 0 #3a4048, 0 0 0 2px #0a0808; }
    .dpad.press-r .dpad-h { box-shadow: inset 2px 2px 0 #3a4048, inset -4px -2px 0 #14161a, 0 0 0 2px #0a0808; }
    .dpad.press-u .dpad-arr.u { border-bottom-color: #c8d0d8; }
    .dpad.press-d .dpad-arr.d { border-top-color: #c8d0d8; }
    .dpad.press-l .dpad-arr.l { border-right-color: #c8d0d8; }
    .dpad.press-r .dpad-arr.r { border-left-color: #c8d0d8; }
    .gb-right { position: relative; width: 132px; height: var(--dp); margin-top: 10px; }
    .gb-btn {
      position: absolute; width: var(--bt); height: var(--bt); border: 0; padding: 0;
      color: #1a0800; font-weight: 900; font-size: 15px; letter-spacing: 0.06em;
      font-family: ui-monospace, "SF Mono", Menlo, monospace; line-height: var(--bt);
      text-align: center; cursor: pointer; image-rendering: pixelated; border-radius: 50%;
      -webkit-tap-highlight-color: transparent;
    }
    .gb-btn:focus { outline: none; }
    .gb-a {
      right: 0; top: 0; background: #e85d04;
      box-shadow: 0 0 0 3px #1a1008, 0 0 0 5px #0a0706, inset 2px 2px 0 #ffb060, inset -2px -3px 0 #9a3400, 0 4px 0 #3a1400;
      text-shadow: 0 2px 0 #9a3400;
    }
    .gb-b {
      left: 0; bottom: 4px; background: #8a9098; color: #1a1c20;
      box-shadow: 0 0 0 3px #1a1008, 0 0 0 5px #0a0706, inset 2px 2px 0 #c8cdd4, inset -2px -3px 0 #4a5058, 0 4px 0 #2a2c30;
      text-shadow: 0 2px 0 #4a5058;
    }
    .gb-btn.pressed { transform: translateY(3px); filter: brightness(0.82); }
    .gb-a.pressed { box-shadow: 0 0 0 3px #1a1008, 0 0 0 5px #0a0706, inset 2px 3px 0 #9a3400, inset -2px -1px 0 #c85010, 0 1px 0 #3a1400; }
    .gb-b.pressed { box-shadow: 0 0 0 3px #1a1008, 0 0 0 5px #0a0706, inset 2px 3px 0 #4a5058, inset -2px -1px 0 #6a7078, 0 1px 0 #2a2c30; }
    .gb-start {
      align-self: flex-end; margin: 0 0 10px; width: 44px; height: 14px; border: 0; padding: 0;
      background: #2a2420; color: #6a5a50; font-size: 7px; font-weight: 800; letter-spacing: 0.14em;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      box-shadow: inset 2px 2px 0 #0a0806, inset -2px -2px 0 #4a3a30, 0 2px 0 #0a0806;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .gb-start:focus { outline: none; }
    .gb-start.pressed { color: #c4b4a4; box-shadow: inset 2px 2px 0 #0a0806, inset -1px -1px 0 #3a3028; transform: translateY(1px); }
    @media (max-height: 540px) {
      #gbsp { --dp: 84px; --bt: 48px; }
      .gb-legend { display: none; }
      .gb-tray { padding: 6px 14px 8px; }
      .gb-right { width: 108px; }
      .gb-btn { font-size: 13px; }
      .gb-start { display: none; }
      #overlay { inset: 0 0 calc(110px + env(safe-area-inset-bottom, 0px)) 0; }
    }
    @media (max-width: 340px) {
      #gbsp { --dp: 96px; --bt: 52px; }
      .gb-tray { padding: 8px 10px 10px; }
      .gb-right { width: 116px; }
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <button id="mutebtn" type="button" aria-label="Mute">♪</button>
  <div id="hud">
    <div class="hpwrap"><div class="hpfill" id="hpfill"></div></div>
    <div class="row">
      <span id="hptext">100 / 100</span>
      <span id="goldtext">0 G</span>
      <span id="combotext"></span>
      <span id="roomtext">DEPTH 1</span>
    </div>
  </div>
  <div id="toast"></div>
  <div id="pauseov"><span>PAUSED</span></div>
  <div id="hint">D-PAD MOVE · A SLASH · HOLD A CHARGE · B DODGE</div>
  <div id="gbsp">
    <div class="gb-lip"></div>
    <div class="gb-tray">
      <div class="gb-screw s1"></div>
      <div class="gb-screw s2"></div>
      <div class="gb-legend">D-PAD MOVE · A SLASH · HOLD A CHARGE · B DODGE</div>
      <div class="gb-left">
        <div id="dpad" class="dpad">
          <div class="dpad-v"></div>
          <div class="dpad-h"></div>
          <div class="dpad-nub"></div>
          <div class="dpad-arr u"></div>
          <div class="dpad-arr d"></div>
          <div class="dpad-arr l"></div>
          <div class="dpad-arr r"></div>
        </div>
      </div>
      <button type="button" id="gbstart" class="gb-start">START</button>
      <div class="gb-right">
        <button type="button" id="btnB" class="gb-btn gb-b">B</button>
        <button type="button" id="btnA" class="gb-btn gb-a">A</button>
      </div>
    </div>
  </div>
  <div id="overlay">
    <h1>SLASH PIT</h1>
    <p>One thumb. Dash-strike. Grab loot. Don't get slammed.</p>
    <p id="bestline"></p>
    <p id="seedline"></p>
    <button class="btn" id="enterbtn" type="button">TAP TO ENTER</button>
  </div>
  <script>
(function () {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const hpfill = document.getElementById("hpfill");
  const hptext = document.getElementById("hptext");
  const goldtext = document.getElementById("goldtext");
  const combotext = document.getElementById("combotext");
  const roomtext = document.getElementById("roomtext");
  const toastEl = document.getElementById("toast");
  const overlay = document.getElementById("overlay");
  const hint = document.getElementById("hint");
  const hud = document.getElementById("hud");
  const muteBtn = document.getElementById("mutebtn");
  const BEST_KEY = "slashpit-best";

  const RELICS = [

  const START_RELICS = [
    { id: "leech", name: "Leech Fang", need: 4, cost: 18, stat: "leech", v: 0.08, desc: "+8% leech", r: "common" },

  function bake(rows) {
    const h = rows.length, w = rows[0].length;
    const c = document.createElement("canvas");
    const f = document.createElement("canvas");
    c.width = f.width = w;
    c.height = f.height = h;
    const g = c.getContext("2d");
    const gf = f.getContext("2d");
    const img = g.createImageData(w, h);
    const fl = gf.createImageData(w, h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const col = PAL[rows[y][x]];
        if (!col) continue;
        const i = (y * w + x) * 4;
        img.data[i] = col[0]; img.data[i+1] = col[1]; img.data[i+2] = col[2]; img.data[i+3] = 255;
        fl.data[i] = 255; fl.data[i+1] = 255; fl.data[i+2] = 255; fl.data[i+3] = 255;
      }
    }
    g.putImageData(img, 0, 0);
    gf.putImageData(fl, 0, 0);
    return { c: c, f: f, w: w, h: h };
  }

    const h = 8, w = 8;
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const g = c.getContext("2d");
    const img = g.createImageData(w, h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const ch = rows[y][x];
        if (ch === ".") continue;
        const col = ch === "k" ? [12, 10, 12] : (ch === "C" && (x + y) % 3 === 0 ? hi : rgb);
        const i = (y * w + x) * 4;

  function padBottom(rows, h) {
    const w = rows[0].length;
    const empty = new Array(w + 1).join(".").slice(0, w);
    const trimmed = rows.slice();
    while (trimmed.length && trimmed[trimmed.length - 1].indexOf("k") < 0 && trimmed[trimmed.length - 1].indexOf("R") < 0 && trimmed[trimmed.length - 1].indexOf("E") < 0) {
      trimmed.pop();
    }
    while (trimmed.length < h) trimmed.unshift(empty);
    return trimmed.slice(-h);
  }

  function seeded(n) {
    let s = (n * 1103515245 + 12345) & 0x7fffffff;
    return function () {
      s = (s * 1103515245 + 12345) & 0x7fffffff;
      return s / 0x7fffffff;
    };
  }

  function makeTile(kind, theme, variant) {
    const c = document.createElement("canvas");
    c.width = 16; c.height = 16;
    const g = c.getContext("2d");
    const rand = seeded(variant * 97 + kind.length * 13 + theme.floor[0].charCodeAt(1));
    function p(x, y, col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); }
    if (kind === "floor") {
      const cols = theme.floor;
      g.fillStyle = cols[variant % cols.length];
      g.fillRect(0, 0, 16, 16);
      g.fillStyle = cols[(variant + 1) % cols.length];
      g.fillRect(1, 1, 6, 6);
      g.fillRect(9, 8, 6, 6);
      g.fillStyle = cols[(variant + 2) % cols.length];
      g.fillRect(9, 1, 6, 5);
      g.fillRect(1, 9, 6, 5);
      g.fillStyle = cols[3];
      g.fillRect(0, 0, 16, 1);
      g.fillRect(0, 7, 16, 1);
      g.fillRect(0, 15, 16, 1);
      g.fillRect(0, 0, 1, 16);
      g.fillRect(8, 0, 1, 16);
      g.fillRect(15, 0, 1, 16);
      for (let i = 0; i < 10; i++) p((rand() * 16) | 0, (rand() * 16) | 0, cols[(i + variant) % cols.length]);
      if (variant === 2) {
        g.fillStyle = "rgba(0,0,0,0.35)";
        g.fillRect(3, 3, 1, 5); g.fillRect(3, 6, 4, 1); g.fillRect(6, 6, 1, 3);
      }
      if (variant === 3) {
        g.fillStyle = "rgba(90,12,12,0.4)";
        g.fillRect(10, 10, 3, 2); g.fillRect(11, 9, 2, 3);
      }
    } else if (kind === "wall") {
      const cols = theme.wall;
      g.fillStyle = cols[1];
      g.fillRect(0, 0, 16, 16);
      const shift = (variant % 2) * 8;
      const rowsY = [0, 5, 10, 15];
      g.fillStyle = cols[0];
      for (let i = 0; i < rowsY.length; i++) g.fillRect(0, rowsY[i], 16, 1);
      g.fillRect(shift, 0, 1, 5);
      g.fillRect((shift + 8) % 16, 5, 1, 5);
      g.fillRect(shift, 10, 1, 5);
      g.fillStyle = cols[3];
      g.fillRect(0, 0, 16, 2);
      g.fillStyle = cols[2];
      g.fillRect(1, 1, 14, 1);
      for (let i = 0; i < 14; i++) p((rand() * 16) | 0, (rand() * 16) | 0, cols[2 + (i % 2) % cols.length]);
      g.fillStyle = "rgba(0,0,0,0.25)";
      g.fillRect(0, 14, 16, 2);
    } else if (kind === "rug") {
      g.fillStyle = theme.rug[2];
      g.fillRect(0, 0, 16, 16);
      g.fillStyle = theme.rug[0];
      g.fillRect(1, 1, 14, 14);
      g.fillStyle = theme.rug[1];
      g.fillRect(3, 3, 10, 10);
      g.fillStyle = theme.rug[2];
      g.fillRect(7, 1, 2, 14);
      g.fillRect(1, 7, 14, 2);
    } else if (kind === "grate") {
      g.fillStyle = theme.grate[0];
      g.fillRect(0, 0, 16, 16);
      g.fillStyle = theme.grate[1];
      for (let y = 2; y < 16; y += 4)
        for (let x = 2; x < 16; x += 4) g.fillRect(x, y, 2, 2);
      g.fillStyle = theme.grate[2];
      g.fillRect(0, 0, 16, 1);
      g.fillRect(0, 0, 1, 16);
    } else if (kind === "ritual") {
      g.fillStyle = theme.floor[0];
      g.fillRect(0, 0, 16, 16);
      g.fillStyle = theme.ritual[0];
      g.fillRect(1, 1, 14, 14);
      g.fillStyle = theme.ritual[1];
      g.fillRect(3, 3, 10, 10);
      g.fillStyle = theme.ritual[2];
      g.fillRect(0, 7, 16, 1);
      g.fillRect(7, 0, 1, 16);
      p(2, 2, theme.ritual[2]); p(13, 2, theme.ritual[2]);
      p(2, 13, theme.ritual[2]); p(13, 13, theme.ritual[2]);
      p(7, 3, theme.ritual[2]); p(8, 3, theme.ritual[2]);
      p(4, 12, theme.ritual[2]); p(11, 12, theme.ritual[2]);
      p(7, 7, theme.ritual[2]); p(8, 8, theme.ritual[2]);
    } else if (kind === "door") {
      g.fillStyle = "#080404";
      g.fillRect(0, 0, 16, 16);
      g.fillStyle = theme.wall[2];
      g.fillRect(0, 0, 3, 16);
      g.fillRect(13, 0, 3, 16);
      g.fillStyle = theme.wall[3];
      g.fillRect(0, 0, 16, 2);
    }
    return c;
  }

  function tilesFor(themeName) {
    if (tileCache[themeName]) return tileCache[themeName];
    const th = THEMES[themeName];
    const pack = {
      floor: [0, 1, 2, 3].map(function (i) { return makeTile("floor", th, i); }),
      wall: [0, 1, 2, 3].map(function (i) { return makeTile("wall", th, i); }),
      rug: makeTile("rug", th, 0),
      grate: makeTile("grate", th, 0),
      ritual: makeTile("ritual", th, 1),
      door: makeTile("door", th, 0)
    };
    tileCache[themeName] = pack;
    return pack;
  }

  }

  function buildPack(n) {
    if (n === 1) return { list: ["slime", "slime"], fast: false, chest: false, elite: false };
    if (n % 8 === 0) return { list: ["boss"], fast: false, chest: false, elite: false };
    const count = Math.min(7, 2 + ((n - 1) / 3 | 0) + (rng() < 0.35 ? 1 : 0));
    const pool = ["slime"];
    if (n >= 2) pool.push("bat");
    if (n >= 3) pool.push("spitter", "slime");
    if (n >= 4) pool.push("brute", "wisp");
    if (n >= 5) pool.push("bomber");
    if (n >= 6) pool.push("knight");
    if (n >= 7) pool.push("golem");
    if (n >= 10) pool.push("bat", "spitter", "knight", "wisp");
    if (n >= 18) pool.push("bomber", "brute", "knight", "golem");
    const list = [];
    for (let i = 0; i < count; i++) list.push(spick(pool));
    return { list: list, fast: n >= 5 && rng() < 0.45, chest: n >= 3 && rng() < 0.34, elite: false };
  }

  function startRoom(n) {
    depth = n;
    titleMobs = [];
    ghosts = [];
    shots = [];
    coins = [];
    shop = null;
    shrine = null;
    chest = null;
    exitGate = null;
    enemies = [];
    gems = [];
    secret = null;
    puddles = [];
    bombs = [];
    hazards = [];
    doorAnim = 0;
    paused = false;
    setPaused(false);
    roomKind = decideKind(n);
    lastKind = roomKind;
    const forced = n === 1 ? { layout: "hall", theme: "ember" }
      : (roomKind === "shop" ? { layout: "chamber" }
      : (roomKind === "warden" ? { layout: "arena" } : null));
    buildMap(n, forced);
    player.x = spawnTile.x; player.y = spawnTile.y;
    player.tx = null; player.ty = null; player.dash = null;
    player.charging = false; player.chargeT = 0; player.chargeReady = false; player.heavy = 0;
    player.iframes = Math.max(player.iframes, n === 1 ? 1.05 : 0.85);
    player.vx = 0; player.vy = 0;
    combo = Math.min(combo, 3);

    if (roomKind === "shop") {
      phase = "shop";
      openShop();
      banner = { t: 1.0, text: "SHOP" };
      sfx("shop");
      stopDrone();
    } else if (roomKind === "event") {
      const ev = spick(["shrine", "mimic", "elite"]);
      if (ev === "shrine") {
        phase = "event";
        const a = clampToWalkable(COLS * 0.32, ROWS * 0.48);
        const b = clampToWalkable(COLS * 0.68, ROWS * 0.48);
        const c = clampToWalkable(COLS * 0.5, ROWS * 0.64);
        shrine = {
          used: false, sel: 0,
          opts: [
            { id: "heal", name: "HEAL", x: a.x, y: a.y },
            { id: "gamble", name: "GAMBLE", x: b.x, y: b.y },
            { id: "curse", name: "CURSE", x: c.x, y: c.y }
          ]
        };
        exitGate = { x: doorTile.x, y: doorTile.y };
        doorAnim = 0.55;
        banner = { t: 1.1, text: "SHRINE" };
        stopDrone();
      } else if (ev === "mimic") {
        phase = "fight";
        const p = clampToWalkable(COLS * 0.5, ROWS * 0.48);
        chest = { x: p.x, y: p.y, open: false, t: 0, mimic: true };
        banner = { t: 1.0, text: "CHEST?" };
        startDrone();
      } else {
        phase = "fight";
        const et = rng() < 0.5 ? "brute" : (depth >= 2 ? "bat" : "brute");
        spawnEnemy(et, COLS * 0.5, ROWS * 0.4, false, true);
        if (depth >= 6) spawnEnemy("slime", COLS * 0.35, ROWS * 0.46, false, false);
        banner = { t: 1.1, text: "ELITE" };
        startDrone();
      }
    } else if (roomKind === "warden") {
      phase = "fight";
      spawnEnemy("warden", COLS * 0.5, ROWS * 0.42, false, false);
      banner = { t: 1.2, text: "WARDEN" };
      startDrone();
    } else if (roomKind === "boss") {
      phase = "fight";
      const bt = bossTypeFor(n);
      lastBoss = bt;
      spawnEnemy(bt, COLS * 0.5, ROWS * 0.42, false, false);
      banner = { t: 1.25, text: bossTitle(bt) };
      startDrone();
    } else {
      phase = "fight";
      const plan = buildPack(n);
      const count = plan.list.length;
      for (let i = 0; i < count; i++) {
        const ang = -Math.PI / 2 + (i - (count - 1) / 2) * 0.85;
        const rad = 1.8 + count * 0.15;
        spawnEnemy(plan.list[i], COLS * 0.5 + Math.cos(ang) * rad, ROWS * 0.38 + Math.sin(ang) * 0.9, plan.fast, false);
      }
      if (plan.chest) {
        const side = rng() < 0.5 ? 2.5 : COLS - 2.5;
        const p = clampToWalkable(side, ROWS * 0.58);
        chest = { x: p.x, y: p.y, open: false, t: 0 };
      }
      banner = { t: 1.0, text: "DEPTH " + n };
      startDrone();
      if (layoutId === "treasury") {
        spawnGem(COLS * 0.28, ROWS * 0.36, makeItem("junk"));
        spawnGem(COLS * 0.72, ROWS * 0.36, makeItem("common"));
        addGold(6 + ((n / 2) | 0), COLS * 0.5, ROWS * 0.52);
      }
    }
    placeSecret();
    placeHazards();
    if (n >= 8) unlockAch("depth8");
    if (n >= 16) unlockAch("depth16");
    syncHud();
  }

  function placeSecret() {
    secret = null;
    if (depth === 1 || roomKind === "shop") return;
    if (rng() > 0.34) return;
    const cands = [];
    for (let ty = 0; ty < ROWS; ty++) {
      for (let tx = 0; tx < COLS; tx++) {
        const ch = MAP[ty][tx];
        if (ch !== "#" && ch !== "*") continue;
        if (tx === 0 || ty === 0 || tx === COLS - 1 || ty === ROWS - 1) continue;
        const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
        for (let i = 0; i < dirs.length; i++) {
          const nx = tx + dirs[i][0], ny = ty + dirs[i][1];
          if (ny < 0 || ny >= ROWS || nx < 0 || nx >= COLS) continue;
          const nch = MAP[ny][nx];
          if (isSolidChar(nch) || nch === "D" || nch === "S") continue;
          cands.push({ tx: tx, ty: ty });
          break;
        }
      }
    }
    if (!cands.length) return;
    const inner = cands.filter(function (c) {
      return MAP[c.ty][c.tx] === "#" && c.tx > 0 && c.ty > 0 && c.tx < COLS - 1 && c.ty < ROWS - 1;
    });
    const pool = inner.length ? inner : cands;
    const c = pool[(rng() * pool.length) | 0];
    secret = { tx: c.tx, ty: c.ty, opened: false };
  }
  function openSecret() {
    if (!secret || secret.opened) return;
    secret.opened = true;
    const was = MAP[secret.ty][secret.tx];
    MAP[secret.ty][secret.tx] = ".";
    if (was === "*") {
      torches = torches.filter(function (t) {
        return Math.floor(t.x) !== secret.tx || Math.abs(t.y - (secret.ty + 0.22)) > 0.45;
      });
    }
    const px = secret.tx + 0.5, py = secret.ty + 0.5;
    burst(px, py, "#d8b4fe", 14);
    sfx("pickup");
    showToast("SECRET", "#d8b4fe");
    if (rng() < 0.48) {
      const want = depth >= 8 ? "rare" : "common";
      const pool = RELICS.filter(function (r) { return r.r === want; });
      const base = spick(pool.length ? pool : RELICS);
      spawnGem(px, py, Object.assign({ kind: "relic", rarity: base.r }, base));
    } else addGold(12 + depth * 2, px, py);
    unlockAch("secret");
    bumpStat("secrets", 1);
  }
  function tryCrackSecret() {
    if (!secret || secret.opened) return false;
    const dx = (secret.tx + 0.5) - player.x;
    const dy = (secret.ty + 0.5) - player.y;
    const d = Math.hypot(dx, dy);
    if (d > 1.9) return false;
    const fx = Math.cos(player.face || 0), fy = Math.sin(player.face || 0);
    if (d > 0.05 && (dx * fx + dy * fy) / d < 0.08) return false;
    openSecret();
    return true;
  }

  function placeHazards() {
    hazards = [];
    if (depth === 1 || roomKind === "shop") return;
    const biome = THEME && THEME._name;
    let kind = null;
    if (biome === "blood" || biome === "hell") kind = "spike";
    else if (biome === "moss") kind = "slime";
    if (!kind) return;
    let count = 1 + ((depth / 7) | 0) + (rng() < 0.4 ? 1 : 0);
    if (roomKind === "boss" || roomKind === "warden") count = Math.min(2, count);
    count = Math.min(4, count);
    const spots = [];
    for (let ty = 1; ty < ROWS - 1; ty++) {
      for (let tx = 1; tx < COLS - 1; tx++) {
        const ch = MAP[ty][tx];
        if (isSolidChar(ch) || ch === "D" || ch === "S" || ch === "P") continue;
        const cx = tx + 0.5, cy = ty + 0.5;
        if (dist(cx, cy, spawnTile.x, spawnTile.y) < 2.1) continue;
        if (dist(cx, cy, doorTile.x, doorTile.y) < 1.6) continue;
        if (chest && dist(cx, cy, chest.x, chest.y) < 1.2) continue;
        spots.push({ tx: tx, ty: ty, x: cx, y: cy });
      }
    }
    for (let i = 0; i < count && spots.length; i++) {
      const idx = (rng() * spots.length) | 0;
      const s = spots.splice(idx, 1)[0];
      hazards.push({ type: kind, tx: s.tx, ty: s.ty, x: s.x, y: s.y, tele: 0.85, tick: 0 });
    }
  }

  function setPaused(on) {
    paused = !!on;
    const el = document.getElementById("pauseov");
    if (el) el.classList.toggle("on", paused);
    if (paused) {
      player.charging = false;
      player.chargeT = 0;
      player.chargeReady = false;
    }
  }
  function togglePause() {
    if (player.dead) return;
    if (phase !== "fight" && phase !== "loot" && phase !== "shop" && phase !== "event") return;
    setPaused(!paused);
    if (paused) showToast("PAUSED", "#fde68a");
  }
  function parseSeedHex(s) {
    s = String(s || "").replace(/[^0-9a-fA-F]/g, "").slice(0, 8);
    if (!s) return null;
    const n = parseInt(s, 16);
    if (!isFinite(n)) return null;
    return n >>> 0;
  }

  function openShop() {
    const items = [];
    items.push(makeItem());
    items.push(makeItem(depth >= 8 ? "common" : null));
    if (rng() < 0.55) {
      items.push({ kind: "flask", rarity: "common", name: "Heart Flask", heal: 36 + ((depth / 4) | 0) * 6 });
    } else {
      items.push(makeItem(depth >= 12 ? "rare" : "common"));
    }
    const spots = [
      clampToWalkable(COLS * 0.28, ROWS * 0.48),
      clampToWalkable(COLS * 0.50, ROWS * 0.42),
      clampToWalkable(COLS * 0.72, ROWS * 0.48)
    ];
    shop = {
      sel: 0,
      keeper: clampToWalkable(COLS * 0.5, ROWS * 0.30),
      goods: items.map(function (it, i) {
        return { item: it, price: itemPrice(it, depth), bought: false, x: spots[i].x, y: spots[i].y };
      })
    };
    exitGate = { x: doorTile.x, y: doorTile.y };
    doorAnim = 0.55;
  }

  function tryBuy(i) {
    if (shopActLatch > 0) return;
    if (!shop || !shop.goods[i] || shop.goods[i].bought) return;
    shopActLatch = 0.28;
    const g = shop.goods[i];
    if (gold < g.price) {
      showToast("NEED " + g.price + " G", "#fda4af");
      sfx("clang");
      return;
    }
    gold -= g.price;
    g.bought = true;
    applyItem(g.item);
    unlockAch("shopspend");
    sfx("buy");
    burst(g.x, g.y, "#fbbf24", 10);
    syncHud();
  }

  function useShrine(id) {
    if (shopActLatch > 0) return;
    if (!shrine || shrine.used) return;
    shopActLatch = 0.3;
    shrine.used = true;
    if (id === "heal") {
      const add = Math.round(player.maxhp * 0.42);
      player.hp = Math.min(player.maxhp, player.hp + add);
      showToast("SHRINE HEALS +" + add, "#86efac");
      sfx("pickup");
    } else if (id === "curse") {
      player.cursed = true;
      applyItem(makeItem("epic"));
      showToast("CURSED · EPIC", "#d8b4fe");
      sfx("hurt");
      screenFlash(0.16, "168,85,247");
    } else {
      const cost = Math.max(8, Math.round(player.maxhp * 0.2));
      player.hp = Math.max(1, player.hp - cost);
      applyItem(makeItem("rare"));
      showToast("BLOOD PRICE −" + cost, "#fda4af");
      sfx("hurt");
    }
    burst(player.x, player.y, "#fbbf24", 12);
    syncHud();
  }

  function triggerMimic() {
    if (!chest || !chest.mimic) return;
    const x = chest.x, y = chest.y;
    chest = null;
    spawnEnemy("mimic", x, y, true, false);
    banner = { t: 0.8, text: "MIMIC" };
    showToast("IT BITES", "#fda4af");
    sfx("hurt");
    startDrone();
  }

  function clearRoom() {
    phase = "loot";
    stopDrone();
    sfx("clear");
    spawnGem(COLS * 0.5 + srnd(-0.8, 0.8), ROWS * 0.48 + srnd(-0.5, 0.5), makeItem());
    if (rng() < 0.32) {
      spawnGem(COLS * 0.5 + srnd(-1.4, 1.4), ROWS * 0.42 + srnd(-0.4, 0.4), makeItem());
    }
    if (roomKind === "boss") {
      if (!chest || chest.mimic) {
        const p = clampToWalkable(COLS * 0.5, ROWS * 0.56);
        chest = { x: p.x, y: p.y, open: false, t: 0.55, epic: true };
      } else {
        chest.epic = true;
      }
    }
    if (chest && !chest.open && !chest.mimic) {
      chest.open = true;
      chest.t = 0.5;
      spawnGem(chest.x, chest.y - 0.45, makeItem(chest.epic ? "epic" : "rare"));
      burst(chest.x, chest.y, chest.epic ? "#d8b4fe" : "#fbbf24", 14);
      if (chest.epic) showToast("BOSS CHEST", "#d8b4fe");
    }
    if (layoutId === "treasury") {
      spawnGem(COLS * 0.35, ROWS * 0.44, makeItem());
      spawnGem(COLS * 0.65, ROWS * 0.44, makeItem("common"));
      addGold(10 + depth, COLS * 0.5, ROWS * 0.4);
    }
    exitGate = { x: doorTile.x, y: doorTile.y };
    doorAnim = 0.55;
    let fell = "CLEAR";
    if (roomKind === "warden") fell = "WARDEN FELLED";
    else if (roomKind === "boss") {
      const live = enemies[0];
      fell = "LORD FELLED";
      if (lastBoss === "boneking") fell = "KING FELLED";
      else if (lastBoss === "ashwitch") fell = "WITCH FELLED";
    }
    banner = { t: 0.7, text: fell };
  }

  function nextRoom() {
    gems.forEach(function (g) { applyItem(g.item); });
    gems = [];
    startRoom(depth + 1);
  }

  function goldFor(e) {
    let base = 4;
    if (e.type === "bat") base = 5;
    if (e.type === "spitter") base = 6;
    if (e.type === "brute" || e.type === "knight") base = 9;
    if (e.type === "bomber") base = 7;
    if (e.type === "wisp") base = 7;
    if (e.type === "golem") base = 16;
    if (e.type === "mimic") base = 18;
    if (e.type === "warden") base = 24;
    if (e.type === "boss" || e.type === "boneking" || e.type === "ashwitch") base = 42;
    base = Math.round(base * (1 + depth * 0.08));
    if (e.elite) base = Math.round(base * 3);
    return Math.max(1, (base * (0.7 + rng() * 0.6)) | 0);
  }

  function explodeBomber(e) {
    const rad = 1.85;
    burst(e.x, e.y, "#fb923c", 18);
    shake = Math.max(shake, 9);
    screenFlash(0.14, "251,146,60");
    sfx("boom");
    floats.push({ x: e.x, y: e.y - 0.4, t: 0.7, text: "BOOM", col: "#fb923c" });
    if (dist(player.x, player.y, e.x, e.y) < rad + player.r) {
      hurtPlayer(Math.round(12 + depth * 0.6), player.x - e.x, player.y - e.y, "poison");
    }
    enemies.forEach(function (o) {
      if (o === e || o.hp <= 0) return;
      if (dist(o.x, o.y, e.x, e.y) < rad) {
        o.hp -= 10;
        o.flash = 0.1;
        if (o.hp <= 0) killEnemy(o);
      }
    });
    enemies = enemies.filter(function (x) { return x !== e; });
    addGold(goldFor(e), e.x, e.y);
    if (!enemies.length && phase === "fight") clearRoom();
  }

  function killEnemy(e) {
    if (e.boom > 0) return;
    if (e.type === "bomber" && !e._boomed) {
      e._boomed = true;
      e.boom = 0.55;
      e.hp = 1;
      e.speed = 0;
      e.wind = 0;
      floats.push({ x: e.x, y: e.y - 0.5, t: 0.6, text: "!", col: "#fb923c" });
      return;
    }
    const col = e.type === "slime" ? "#4ade80" : e.type === "bat" ? "#a78bfa" : e.type === "wisp" ? "#c4b5fd" : e.type === "golem" ? "#a8a29e" : e.type === "spitter" ? "#2dd4bf" : e.type === "knight" || e.type === "warden" ? "#cbd5e1" : e.type === "bomber" ? "#fb923c" : e.type === "mimic" ? "#fbbf24" : e.type === "brute" ? "#c2410c" : e.type === "ashwitch" ? "#fb923c" : e.type === "boneking" ? "#e2e8f0" : "#9b1d20";
    burst(e.x, e.y, col, isBossType(e.type) ? 22 : 12);
    bloodBurst(e.x, e.y, isBossType(e.type) ? 18 : 10);
    floats.push({ x: e.x, y: e.y - 0.4, t: 0.7, text: "POP", col: "#ffe8a3" });
    shake = Math.max(shake, isBossType(e.type) ? 10 : 5);
    addGold(goldFor(e), e.x, e.y);
    unlockAch("firstkill");
    if (e.elite) {
      spawnGem(e.x, e.y - 0.3, makeItem("rare"));
      showToast("ELITE DROP", "#fde68a");
      unlockAch("elite");
    }
    if (e.type === "warden") {
      spawnGem(e.x, e.y - 0.35, makeItem("rare"));
      showToast("WARDEN RELIC", "#7dd3fc");
    }
    if (isBossType(e.type)) {
      applyItem(Object.assign({ kind: "weapon", rarity: "epic" }, spick(WEAPONS.filter(function (i) { return i.r === "epic"; }))));
      applyItem(makeItem("rare"));
    }
    if (e.type === "boneking") {
      for (let i = 0; i < enemies.length; i++) {
        const b = enemies[i];
        if (b === e || b.type !== "bat") continue;
        burst(b.x, b.y, "#a78bfa", 8);
        bloodBurst(b.x, b.y, 5);
        floats.push({ x: b.x, y: b.y - 0.3, t: 0.5, text: "ASH", col: "#e2e8f0" });
      }
      enemies = enemies.filter(function (x) { return x !== e && x.type !== "bat"; });
    } else {
      enemies = enemies.filter(function (x) { return x !== e; });
    }
    bumpStat("kills", 1);
    if (!enemies.length && phase === "fight") clearRoom();
  }

  function hurtPlayer(dmg, ox, oy, src) {
    if (player.iframes > 0 || player.dead) return;
    if (player.cursed) dmg = Math.round(dmg * 1.35);
    player.hp -= dmg;
    player.iframes = 0.35;
    player.flash = 0.18;
    screenFlash(0.12, src === "poison" ? "74,222,128" : src === "burn" ? "251,146,60" : "255,50,36");
    shake = Math.max(shake, 7);
    combo = 0; comboT = 0;
    sfx("hurt");
    if (src === "poison") applyStatus("poison", 3.2);
    else if (src === "burn" || (THEME && THEME._name === "ember")) applyStatus("burn", 2.4);
    if (THEME && THEME._name === "ash") applyStatus("slow", 2.2);
    const len = Math.hypot(ox, oy) || 1;
    tryMove(player, player.x + (ox / len) * 0.7, player.y + (oy / len) * 0.7);
    player.dash = null;
    floats.push({ x: player.x, y: player.y - 0.7, t: 0.7, text: "" + dmg, col: "#fda4af" });
    if (player.hp <= 0) {
      player.hp = 0;
      player.dead = true;
      dieRun();
    }
    syncHud();
  }

  function knightBlocked(e) {
    if (e.type !== "knight" && e.type !== "warden") return false;
    if (e.vuln > 0) return false;
    const fx = Math.cos(e.face || 0), fy = Math.sin(e.face || 0);
    const dx = player.x - e.x, dy = player.y - e.y;
    return (dx * fx + dy * fy) > 0.12;
  }

  function bumpCombo() {
    combo += 1;
    comboT = 1.2;
    if (combo >= 10) unlockAch("combo10");
    syncHud();
  }

  function slashDmg(crit) {
    let dmg = player.dmg * (crit ? 1.6 : 1);
    if (combo >= 5) dmg *= 1.25;
    return Math.round(dmg);
  }

  function doSlash(target) {
    if (player.slashCd > 0) return;
    player.slashCd = 0.28;
    player.slashAnim = 1;
    player.face = Math.atan2(target.y - player.y, target.x - player.x);
    player.flip = target.x < player.x;
    sfx("slash");
    fireSlashWave();
    tryCrackSecret();
    const crit = rng() < player.crit;
    const dmg = slashDmg(crit);
    hitEnemy(target, dmg, crit);
    enemies.forEach(function (e) {
      if (e === target) return;
      if (dist(e.x, e.y, target.x, target.y) < 1.25) hitEnemy(e, Math.max(1, (dmg * 0.5) | 0), false);
    });
  }

  function hitEnemy(e, dmg, crit) {
    if (e.boom > 0 || e._boomed && e.hp <= 1) return;
    if (e.type === "wisp" && !e.glow) {
      floats.push({ x: e.x, y: e.y - 0.5, t: 0.5, text: "PHASE", col: "#c4b5fd" });
      sfx("clang");
      return;
    }
    if ((e.type === "knight" || e.type === "warden") && knightBlocked(e)) {
      floats.push({ x: e.x, y: e.y - 0.55, t: 0.55, text: "CLANG", col: "#cbd5e1" });
      sfx("clang");
      shake = Math.max(shake, 2);
      return;
    }
    e.hp -= dmg;
    e.flash = 0.12;
    bumpCombo();
    sfx("hit");
    const ang = Math.atan2(e.y - player.y, e.x - player.x);
    tryMove(e, e.x + Math.cos(ang) * 0.28, e.y + Math.sin(ang) * 0.28);
    if (player.leech > 0) {
      player.hp = Math.min(player.maxhp, player.hp + dmg * player.leech);
    }
    floats.push({
      x: e.x + rnd(-0.2, 0.2), y: e.y - e.r - 0.25, t: 0.75,
      text: crit ? dmg + "!" : "" + dmg,
      col: crit ? "#fde68a" : "#fff7ed"
    });
    burst(e.x, e.y, crit ? "#fde68a" : "#fb923c", crit ? 8 : 5);
    shake = Math.max(shake, crit ? 6 : 3);
    screenFlash(player.heavy > 0 ? 0.1 : 0.05, crit || player.heavy > 0 ? "253,230,138" : "251,146,60");
    if (player.heavy > 0) hitstop = Math.max(hitstop, 0.04);
    syncHud();
    if (e.hp <= 0) killEnemy(e);
  }

  function dashStrike(e) {
    player.dash = e;
    player.tx = e.x; player.ty = e.y;
    if (dist(player.x, player.y, e.x, e.y) <= player.slashR) doSlash(e);
  }

  function dodge(dx, dy) {
    if (paused || player.dodgeCd > 0 || player.dead || phase === "title") return;
    player.charging = false; player.chargeT = 0; player.chargeReady = false;
    const len = Math.hypot(dx, dy) || 1;
    const dsp = player.dodgeSpd || 14.5;
    player.vx = (dx / len) * dsp;
    player.vy = (dy / len) * dsp;
    player.iframes = Math.max(player.iframes, 0.22);
    player.dodgeCd = player.dodgeMax;
    player.dodging = 0.18;
    player.dash = null;
    player.tx = null;
    player.face = Math.atan2(dy, dx);
    player.flip = dx < 0;
    dropDodgeBomb();
    burst(player.x, player.y, "#67e8f9", 6);
    ghosts.push({ x: player.x, y: player.y, t: 0.2, flip: player.flip });
    sfx("dodge");
  }

  function stickNow() {
    let x = pad.x + (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
    let y = pad.y + (keys.d ? 1 : 0) - (keys.u ? 1 : 0);
    x = x < -1 ? -1 : x > 1 ? 1 : x;
    y = y < -1 ? -1 : y > 1 ? 1 : y;
    const on = x !== 0 || y !== 0;
    if (on && x && y) {
      const inv = 1 / Math.hypot(x, y);
      return { x: x * inv, y: y * inv, on: true };
    }
    return { x: x, y: y, on: on };
  }

  function refreshPadVisuals() {
    const dpad = document.getElementById("dpad");
    const aEl = document.getElementById("btnA");
    const bEl = document.getElementById("btnB");
    if (!dpad) return;
    const sxv = pad.x + (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
    const syv = pad.y + (keys.d ? 1 : 0) - (keys.u ? 1 : 0);
    dpad.classList.toggle("press-u", syv < 0);
    dpad.classList.toggle("press-d", syv > 0);
    dpad.classList.toggle("press-l", sxv < 0);
    dpad.classList.toggle("press-r", sxv > 0);
    if (aEl) aEl.classList.toggle("pressed", pad.a || keys.a);
    if (bEl) bEl.classList.toggle("pressed", pad.b || keys.b);
  }

  function bestSlashTarget() {
    const fx = Math.cos(player.face), fy = Math.sin(player.face);
    const reach = player.slashR + 1.05;
    let best = null, score = 1e9;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const dx = e.x - player.x, dy = e.y - player.y;
      const raw = Math.hypot(dx, dy) || 0.001;
      const d = raw - e.r;
      if (d > reach) continue;
      const dot = (dx * fx + dy * fy) / raw;
      const s = d + (dot > 0.2 ? 0 : 1.55) + (dot > 0.55 ? -0.35 : 0);
      if (s < score) { score = s; best = e; }
    }
    return best;
  }

  function interactOrSlash() {
    if (player.dead) return;
    if (phase === "shop" && shop) {
      let nearest = shop.sel, nd = 99;
      for (let i = 0; i < shop.goods.length; i++) {
        const d = dist(player.x, player.y, shop.goods[i].x, shop.goods[i].y);
        if (d < nd) { nd = d; nearest = i; }
      }
      shop.sel = nearest;
      if (nd < 1.35) { tryBuy(shop.sel); return; }
      tryBuy(shop.sel);
      return;
    }
    if (phase === "event" && shrine && !shrine.used) {
      let nearest = shrine.sel, nd = 99;
      for (let i = 0; i < shrine.opts.length; i++) {
        const d = dist(player.x, player.y, shrine.opts[i].x, shrine.opts[i].y);
        if (d < nd) { nd = d; nearest = i; }
      }
      shrine.sel = nearest;
      if (nd < 1.4) { useShrine(shrine.opts[shrine.sel].id); return; }
    }
    facingSlash();
  }

  function facingSlash() {
    if (player.slashCd > 0 || player.dead) return;
    if (phase !== "fight" && phase !== "loot") return;
    const fx = Math.cos(player.face), fy = Math.sin(player.face);
    player.flip = fx < 0;
    if (phase === "fight") {
      const t = bestSlashTarget();
      if (t && dist(player.x, player.y, t.x, t.y) <= player.slashR + 1.15) {
        dashStrike(t);
        if (dist(player.x, player.y, t.x, t.y) <= player.slashR) player.dash = null;
        return;
      }
    }
    player.slashCd = 0.28;
    player.slashAnim = 1;
    sfx("slash");
    fireSlashWave();
    tryCrackSecret();
    const hitR = player.slashR * 0.88;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const dx = e.x - player.x, dy = e.y - player.y;
      const d = Math.hypot(dx, dy) || 0.001;
      if (d > hitR + e.r) continue;
      if ((dx * fx + dy * fy) / d > 0.18) {
        const crit = rng() < player.crit;
        hitEnemy(e, slashDmg(crit), crit);
      }
    }
    burst(player.x + fx * 0.55, player.y + fy * 0.55, "#fb923c", 4);
  }

  function startCharge() {
    if (player.dead) return;
    if (phase === "shop" || phase === "event") { interactOrSlash(); return; }
    if (phase !== "fight" && phase !== "loot") return;
    if (player.charging) return;
    player.charging = true;
    player.chargeT = 0;
    player.chargeReady = false;
  }
  function releaseCharge() {
    if (!player.charging) return;
    const ready = player.chargeReady;
    player.charging = false;
    player.chargeT = 0;
    player.chargeReady = false;
    if (player.dead) return;
    if (ready) doChargeSlash();
    else interactOrSlash();
  }
  function doChargeSlash() {
    if (player.dead || player.slashCd > 0) return;
    if (phase !== "fight" && phase !== "loot") return;
    const fx = Math.cos(player.face || 0), fy = Math.sin(player.face || 0);
    player.flip = fx < 0;
    player.slashCd = 0.5;
    player.slashAnim = 1.2;
    player.heavy = 0.38;
    tryMove(player, player.x + fx * 0.95, player.y + fy * 0.95);
    sfx("slash");
    beep(150, 0.14, "sawtooth", 0.07, 55);
    shake = Math.max(shake, 8);
    hitstop = 0.04;
    screenFlash(0.14, "253,230,138");
    fireSlashWave();
    tryCrackSecret();
    const hitR = player.slashR * 1.55;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const dx = e.x - player.x, dy = e.y - player.y;
      const d = Math.hypot(dx, dy) || 0.001;
      if (d > hitR + e.r) continue;
      if ((dx * fx + dy * fy) / d > -0.28) {
        const crit = rng() < player.crit + 0.08;
        hitEnemy(e, Math.round(slashDmg(crit) * 1.8), crit);
        if (depth > 1) e.burn = Math.max(e.burn || 0, 2.5);
      }
    }
    burst(player.x + fx * 0.75, player.y + fy * 0.75, "#fde68a", 12);
    burst(player.x + fx * 1.15, player.y + fy * 1.15, "#fb923c", 8);
  }

  function padDodge() {
    const st = stickNow();
    let dx, dy;
    if (st.on) { dx = st.x; dy = st.y; }
    else if (lastStick.x !== 0 || lastStick.y !== 0) { dx = lastStick.x; dy = lastStick.y; }
    else { dx = Math.cos(player.face || 0); dy = Math.sin(player.face || 0); }
    dodge(dx, dy);
  }

  function syncHud() {
    const pct = player.maxhp ? clamp(player.hp / player.maxhp, 0, 1) : 0;
    hpfill.style.transform = "scaleX(" + pct + ")";
    hptext.textContent = Math.max(0, Math.ceil(player.hp)) + " / " + Math.ceil(player.maxhp);
    goldtext.textContent = gold + " G";
    combotext.textContent = combo >= 2 ? "x" + combo : "";
    roomtext.textContent = (ngPlus ? "NG+ " : "") + "DEPTH " + depth;
  }

  function startRun(seed, opts) {
    ensureAudio();
    if (seed == null) seed = (Math.random() * 0xffffffff) >>> 0;
    runSeed = seed >>> 0;
    rng = makeRng(runSeed);
    ngPlus = !!(opts && opts.deeper);
    lastKind = "combat";
    setPaused(false);
    overlay.classList.add("hidden");
    hud.classList.remove("off");
    hint.style.opacity = "1";
    titleMode = "main";
    bumpStat("runs", 1);
    runEnded = false;
    resetPlayer();
    startRoom(ngPlus ? 9 : 1);
    syncHud();
    if (ngPlus) unlockAch("ngplus");
    showToast(ngPlus ? "DEEPER · SEED " + seedLabel(runSeed) : "SEED " + seedLabel(runSeed), ngPlus ? "#d8b4fe" : "#c4b4a4");
    setTimeout(checkSetBonus, 900);
  }

  function copySeed() {
    const s = seedLabel(runSeed);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(s).then(function () { showToast("SEED COPIED", "#86efac"); }).catch(function () { showToast(s, "#fde68a"); });
    } else {
      showToast(s, "#fde68a");
    }
  }

  function dieRun() {
    const first = !runEnded;
    runEnded = true;
    phase = "dead";
    stopDrone();
    if (first) {
      sfx("death");
      saveBest(depth);
      if (depth > runStats.best) { runStats.best = depth; saveStats(); }
    }
    const gained = depth + ((gold / 10) | 0);
    if (first) {
      unlocks.souls += gained;
      saveUnlocks(unlocks);
    }
    hud.classList.add("off");
    hint.style.opacity = "0";
    overlay.classList.remove("hidden");
    const best = Math.max(depth, bestDepth());
    const nextW = START_WEAPONS.filter(function (w) { return w.need > 0 && best < w.need; })[0];
    const unlockProg = "Unlocks " + unlockCount() + "/" + unlockTotal() +
      (nextW ? " · next blade at depth " + nextW.need : " · all blades unlocked");
    overlay.innerHTML =
      "<h2>YOU DIED</h2>" +
      "<p>Depth " + depth + " · " + gold + " G · Best " + best + "</p>" +
      "<p id='seedline'>SEED " + seedLabel(runSeed) + " · +" + gained + " souls (" + unlocks.souls + ")</p>" +
      "<p>" + esc(unlockProg) + "</p>" +
      (recap.length ? "<div class='recap'>" + recap.map(esc).join("<br>") + "</div>" : "<p>No loot this run.</p>") +
      "<div class='btn-row'><button class='btn btn-sm' id='again' type='button'>PLAY AGAIN</button>" +
      "<button class='btn btn-alt btn-sm' id='daily' type='button'>DAILY</button>" +
      "<button class='btn btn-alt btn-sm' id='copyseed' type='button'>COPY SEED</button>" +
      "<button class='btn btn-alt btn-sm' id='enterseed' type='button'>ENTER SEED</button></div>";
    document.getElementById("again").addEventListener("click", function (ev) { ev.stopPropagation(); startRun(); });
    document.getElementById("daily").addEventListener("click", function (ev) { ev.stopPropagation(); startRun(dailySeed()); });
    document.getElementById("copyseed").addEventListener("click", function (ev) { ev.stopPropagation(); copySeed(); });
    document.getElementById("enterseed").addEventListener("click", function (ev) { ev.stopPropagation(); seedFrom = "dead"; renderSeedPad(); });
  }

  function esc(s) {
    return String(s).replace(/[&<>]/g, function (ch) {
      return ch === "&" ? "&amp;" : ch === "<" ? "&lt;" : "&gt;";
    });
  }

  function burst(x, y, col, n) {
    for (let i = 0; i < n; i++) {
      const a = rnd(0, Math.PI * 2);
      const s = rnd(1.2, 4.6);
      parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: rnd(0.25, 0.5), col: col, r: rnd(1, 2.4) });
    }
  }

  function tapAt(px, py) {
    if (paused) { togglePause(); return; }
    if (phase !== "fight" && phase !== "loot" && phase !== "shop" && phase !== "event") return;
    const w = screenToWorld(px, py);
    for (let i = gems.length - 1; i >= 0; i--) {
      if (dist(w.x, w.y, gems[i].x, gems[i].y) < 1.15) { pickup(gems[i]); return; }
    }
    if (shop) {
      for (let i = 0; i < shop.goods.length; i++) {
        if (dist(w.x, w.y, shop.goods[i].x, shop.goods[i].y) < 1.1) {
          shop.sel = i;
          tryBuy(i);
          return;
        }
      }
    }
    if (shrine && !shrine.used) {
      for (let i = 0; i < shrine.opts.length; i++) {
        if (dist(w.x, w.y, shrine.opts[i].x, shrine.opts[i].y) < 1.15) {
          shrine.sel = i;
          useShrine(shrine.opts[i].id);
          return;
        }
      }
    }
    if ((phase === "loot" || phase === "shop" || phase === "event") && exitGate && dist(w.x, w.y, exitGate.x, exitGate.y) < 1.5) {
      nextRoom();
      return;
    }
    if (secret && !secret.opened && dist(w.x, w.y, secret.tx + 0.5, secret.ty + 0.5) < 1.15) {
      openSecret();
      return;
    }
    if (phase === "fight") {
      if (chest && chest.mimic && dist(w.x, w.y, chest.x, chest.y) < 1.2) { triggerMimic(); return; }
      let best = null, bd = 1.65;
      for (let i = 0; i < enemies.length; i++) {
        const d = dist(w.x, w.y, enemies[i].x, enemies[i].y) - enemies[i].r;
        if (d < bd) { bd = d; best = enemies[i]; }
      }
      if (best) { dashStrike(best); return; }
    }
    const c = clampToWalkable(w.x, w.y);
    player.tx = c.x; player.ty = c.y;
    player.dash = null;
  }

  function onPtrDown(e) {
    if (ptr.id !== null && ptr.id !== e.pointerId) return;
    ptr.down = true; ptr.id = e.pointerId;
    ptr.x = ptr.sx = e.clientX; ptr.y = ptr.sy = e.clientY; ptr.t = performance.now();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  }
  function onPtrMove(e) {
    if (!ptr.down || e.pointerId !== ptr.id) return;
    ptr.x = e.clientX; ptr.y = e.clientY;
    e.preventDefault();
  }
  function onPtrUp(e) {
    if (e.pointerId !== ptr.id) return;
    const dx = e.clientX - ptr.sx, dy = e.clientY - ptr.sy;
    const dt = performance.now() - ptr.t;
    ptr.down = false; ptr.id = null;
    if (phase === "title" || phase === "dead" || phase === "win") return;
    if (Math.hypot(dx, dy) > 36 && dt < 420) dodge(dx, dy);
    else tapAt(e.clientX, e.clientY);
    e.preventDefault();
  }

  canvas.addEventListener("pointerdown", onPtrDown, { passive: false });
  canvas.addEventListener("pointermove", onPtrMove, { passive: false });
  canvas.addEventListener("pointerup", onPtrUp, { passive: false });
  canvas.addEventListener("pointercancel", onPtrUp, { passive: false });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });

  function pressActionA() {
    if (paused) { togglePause(); return; }
    if (phase === "title") {
      if (titleMode === "unlocks" || titleMode === "stats") return;
      if (titleMode === "seed") { confirmSeed(); return; }
      startRun();
      return;
    }
    if (phase === "dead" || phase === "win") { startRun(); return; }
    if (phase === "shop" || phase === "event") { interactOrSlash(); return; }
    startCharge();
  }
  function pressActionB() {
    if (paused) { togglePause(); return; }
    if (phase === "title") {
      if (titleMode === "unlocks" || titleMode === "stats" || titleMode === "seed") {
        if (titleMode === "seed" && seedFrom === "dead") { dieRun(); return; }
        titleMode = "main";
        renderTitle();
        return;
      }
      startRun();
      return;
    }
    if (phase === "dead" || phase === "win") { startRun(); return; }
    padDodge();
  }

  (function bindPad() {
    const dpad = document.getElementById("dpad");
    const aEl = document.getElementById("btnA");
    const bEl = document.getElementById("btnB");
    const startEl = document.getElementById("gbstart");
    const root = document.getElementById("gbsp");

    function halt(e) { e.preventDefault(); e.stopPropagation(); }

    function setDpadFromEvent(e) {
      const r = dpad.getBoundingClientRect();
      const dx = e.clientX - (r.left + r.width * 0.5);
      const dy = e.clientY - (r.top + r.height * 0.5);
      const dead = Math.max(10, r.width * 0.11);
      let x = 0, y = 0;
      if (Math.abs(dx) > dead) x = dx > 0 ? 1 : -1;
      if (Math.abs(dy) > dead) y = dy > 0 ? 1 : -1;
      if (!x && !y && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
        if (Math.abs(dx) >= Math.abs(dy)) x = dx > 0 ? 1 : -1;
        else y = dy > 0 ? 1 : -1;
      }
      pad.x = x; pad.y = y;
      if (x || y) { lastStick.x = x; lastStick.y = y; }
      if ((phase === "shop" || phase === "event") && x && shopNavLatch <= 0) {
        nudgeSelect(x);
        shopNavLatch = 0.18;
      }
      refreshPadVisuals();
    }
    function clearDpad() {
      pad.x = 0; pad.y = 0; pad.id = null;
      refreshPadVisuals();
    }
    dpad.addEventListener("pointerdown", function (e) {
      halt(e);
      pad.id = e.pointerId;
      try { dpad.setPointerCapture(e.pointerId); } catch (err) {}
      setDpadFromEvent(e);
    }, { passive: false });
    dpad.addEventListener("pointermove", function (e) {
      if (pad.id !== e.pointerId) return;
      halt(e);
      setDpadFromEvent(e);
    }, { passive: false });
    function dpadUp(e) {
      if (pad.id !== null && e.pointerId !== pad.id) return;
      halt(e);
      clearDpad();
    }
    dpad.addEventListener("pointerup", dpadUp, { passive: false });
    dpad.addEventListener("pointercancel", dpadUp, { passive: false });

    function holdBtn(el, which) {
      el.addEventListener("pointerdown", function (e) {
        halt(e);
        try { el.setPointerCapture(e.pointerId); } catch (err) {}
        pad[which] = true;
        refreshPadVisuals();
        if (which === "a") pressActionA();
        else pressActionB();
      }, { passive: false });
      function up(e) {
        halt(e);
        pad[which] = false;
        refreshPadVisuals();
        if (which === "a") releaseCharge();
      }
      el.addEventListener("pointerup", up, { passive: false });
      el.addEventListener("pointercancel", up, { passive: false });
    }
    holdBtn(aEl, "a");
    holdBtn(bEl, "b");

    startEl.addEventListener("pointerdown", function (e) {
      halt(e);
      startEl.classList.add("pressed");
      startDidMute = false;
      startHoldTimer = setTimeout(function () {
        startDidMute = true;
        toggleMute();
      }, 450);
    }, { passive: false });
    function startUp(e) {
      halt(e);
      startEl.classList.remove("pressed");
      clearTimeout(startHoldTimer);
      if (startDidMute) return;
      if (phase === "fight" || phase === "loot" || phase === "shop" || phase === "event") togglePause();
      else if (phase === "title" && titleMode === "main") startRun();
      else if (phase === "title" && titleMode === "seed") confirmSeed();
      else if (phase === "dead" || phase === "win") startRun();
    }
    startEl.addEventListener("pointerup", startUp, { passive: false });
    startEl.addEventListener("pointercancel", startUp, { passive: false });
    root.addEventListener("contextmenu", halt, { passive: false });
    root.addEventListener("touchstart", function (e) { e.preventDefault(); }, { passive: false });
  })();

  function nudgeSelect(dir) {
    if (phase === "shop" && shop) {
      shop.sel = (shop.sel + (dir > 0 ? 1 : -1) + shop.goods.length) % shop.goods.length;
    } else if (phase === "event" && shrine && !shrine.used) {
      shrine.sel = (shrine.sel + (dir > 0 ? 1 : -1) + shrine.opts.length) % shrine.opts.length;
    }
  }

  function keyDir(code, down) {
    if (code === "ArrowUp" || code === "KeyW") keys.u = down;
    else if (code === "ArrowDown" || code === "KeyS") keys.d = down;
    else if (code === "ArrowLeft" || code === "KeyA") keys.l = down;
    else if (code === "ArrowRight" || code === "KeyD") keys.r = down;
    else return false;
    if (down) {
      const st = stickNow();
      if (st.on) { lastStick.x = st.x; lastStick.y = st.y; }
      if ((code === "ArrowLeft" || code === "KeyA" || code === "ArrowRight" || code === "KeyD") && shopNavLatch <= 0) {
        if (code === "ArrowLeft" || code === "KeyA") nudgeSelect(-1);
        else nudgeSelect(1);
        shopNavLatch = 0.16;
      }
    }
    refreshPadVisuals();
    return true;
  }

  window.addEventListener("keydown", function (e) {
    if (e.repeat && (e.code === "Space" || e.code === "KeyX" || e.code === "KeyK" || e.code === "KeyZ" || e.code === "KeyJ" || e.code === "Enter")) {
      e.preventDefault();
      return;
    }
    if (e.code === "KeyM") { e.preventDefault(); toggleMute(); return; }
    if (keyDir(e.code, true)) { e.preventDefault(); return; }
    const isA = e.code === "Space" || e.code === "KeyX" || e.code === "KeyK";
    const isB = e.code === "KeyZ" || e.code === "KeyJ";
    const isStart = e.code === "Enter";
    if (isA) {
      e.preventDefault();
      keys.a = true;
      refreshPadVisuals();
      pressActionA();
    } else if (isB) {
      e.preventDefault();

      pressActionB();
    } else if (isStart) {

      if (phase === "fight" || phase === "loot" || phase === "shop" || phase === "event") togglePause();
      else if (phase === "title" && titleMode === "main") startRun();
      else if (phase === "title" && titleMode === "seed") confirmSeed();
      else if (phase === "dead" || phase === "win") startRun();
    }
  });

  function updateEnemy(e, dt) {
    e.bob += dt;
    e.flash = Math.max(0, e.flash - dt);
    e.vuln = Math.max(0, e.vuln - dt);
    if (e.burn > 0) {
      e.burn -= dt;
      e.burnTick = (e.burnTick || 0) - dt;
      if (e.burnTick <= 0) {
        e.burnTick = 0.5;
        e.hp -= 3;
        e.flash = 0.08;
        floats.push({ x: e.x, y: e.y - e.r - 0.2, t: 0.45, text: "3", col: "#fb923c" });
        if (e.hp <= 0) { killEnemy(e); return; }
      }
    }
    if (e.boom > 0) {
      e.boom -= dt;
      if (e.boom <= 0) explodeBomber(e);
      return;
    }
    const dx = player.x - e.x, dy = player.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    e.flip = dx < 0;
    if (e.type !== "spitter") e.face = Math.atan2(dy, dx);

    if (e.type === "wisp") {
      e.glowT -= dt;
      if (e.glowT <= 0) {
        e.glow = e.glow ? 0 : 1;
        e.glowT = e.glow ? 0.82 : 1.28;
        if (e.glow) burst(e.x, e.y, "#c4b5fd", 5);
      }
      e.x += (dx / d) * e.speed * dt;
      e.y += (dy / d) * e.speed * dt;
      e.x = clamp(e.x, 0.45, COLS - 0.45);
      e.y = clamp(e.y, 0.45, ROWS - 0.45);
      e.atk = Math.max(0, e.atk - dt);
      if (e.atk <= 0 && d < e.range + player.r + 0.15) {
        e.wind = 0.18;
        e.atk = e.cd;
      }
      if (e.wind > 0) {
        e.wind -= dt;
        if (e.wind <= 0 && dist(player.x, player.y, e.x, e.y) < e.range + player.r + 0.22) {
          hurtPlayer(e.dmg, player.x - e.x, player.y - e.y);
        }
      }
      return;
    }

    if (e.type === "golem") {
      if (!e.slam) {
        e.slamT -= dt;
        if (e.slamT <= 0) {
          e.slam = { x: e.x, y: e.y, t: 0.72, dur: 0.72, r: 2.05 };
          e.slamT = 2.9;
          e.wind = 0.72;
        }
      } else {
        e.slam.t -= dt;
        if (e.slam.t <= 0) {
          shake = Math.max(shake, 10);
          screenFlash(0.14, "168,162,158");
          burst(e.x, e.y, "#a8a29e", 16);
          if (dist(player.x, player.y, e.x, e.y) < e.slam.r + 0.2) {
            hurtPlayer(e.dmg, player.x - e.x, player.y - e.y);
          }
          e.slam = null;
          e.wind = 0;
          e.atk = e.cd;
        }
      }
      if (!e.slam) {
        e.atk = Math.max(0, e.atk - dt);
        if (d > e.range + player.r * 0.3) {
          tryMove(e, e.x + (dx / d) * e.speed * dt, e.y + (dy / d) * e.speed * dt);
        }
      }
      resolve(e);
      return;
    }

    if (e.type === "ashwitch") {
      e.face = Math.atan2(dy, dx);
      e.teleT = (e.teleT == null ? 2.4 : e.teleT) - dt;
      if (e.teleT <= 0.5 && !e.casting) {
        e.casting = true;
        e.wind = 0.5;
        e.puddleX = player.x;
        e.puddleY = player.y;
      }
      if (e.casting) {
        e.wind -= dt;
        if (e.wind <= 0) {
          puddles.push({ x: e.x, y: e.y, t: 3.4, r: 0.95, tick: 0.2 });
          burst(e.x, e.y, "#fb923c", 10);
          const dest = clampToWalkable(srnd(1.6, COLS - 1.6), srnd(2.0, ROWS - 2.2));
          e.x = dest.x; e.y = dest.y;
          burst(e.x, e.y, "#a78bfa", 10);
          puddles.push({ x: e.puddleX || player.x, y: e.puddleY || player.y, t: 2.5, r: 0.8, tick: 0.15 });
          e.casting = false;
          e.teleT = 2.7;
          e.wind = 0;
          screenFlash(0.1, "251,146,60");
        }
        resolve(e);
        return;
      }
      const pref = 2.6;
      if (d < pref - 0.4) tryMove(e, e.x - (dx / d) * e.speed * dt, e.y - (dy / d) * e.speed * dt);
      else if (d > pref + 0.8) tryMove(e, e.x + (dx / d) * e.speed * dt, e.y + (dy / d) * e.speed * dt);
      e.atk = Math.max(0, e.atk - dt);
      if (e.atk <= 0 && d < 6.4) {
        shots.push({ x: e.x, y: e.y - 0.25, vx: (dx / d) * 3.1, vy: (dy / d) * 3.1, dmg: e.dmg, life: 2.2, burn: true });
        e.atk = e.cd;
      }
      resolve(e);
      return;
    }

    if (e.type === "boss" || e.type === "warden" || e.type === "boneking") {
      if (e.type === "boneking") {
        e.summonT = (e.summonT == null ? 2.6 : e.summonT) - dt;
        if (e.summonT <= 0) {
          e.summonT = 3.3;
          let bats = 0;
          for (let i = 0; i < enemies.length; i++) if (enemies[i].type === "bat") bats++;
          if (bats < 3) {
            spawnEnemy("bat", e.x + srnd(-1.1, 1.1), e.y + srnd(-0.5, 0.7), true, false);
            floats.push({ x: e.x, y: e.y - 0.8, t: 0.6, text: "RISE", col: "#e2e8f0" });
          }
        }
      }
      if (!e.slam) {
        e.slamT -= dt;
        if (e.slamT <= 0) {
          const st = e.type === "warden" ? 0.62 : 0.75;
          e.slam = { x: player.x, y: player.y, t: st, dur: st, r: e.type === "warden" ? 1.65 : 2.15 };
          e.slamT = e.type === "warden" ? 2.6 : 3;
        }
      } else {
        e.slam.t -= dt;
        if (e.slam.t <= 0) {
          shake = Math.max(shake, e.type === "warden" ? 9 : 11);
          screenFlash(0.16, "239,68,68");
          burst(e.slam.x, e.slam.y, "#ef4444", e.type === "warden" ? 12 : 16);
          if (dist(player.x, player.y, e.slam.x, e.slam.y) < e.slam.r + 0.22) {
            hurtPlayer(e.dmg, player.x - e.slam.x, player.y - e.slam.y);
          }
          e.slam = null;
        }
      }
    }

    if (e.type === "spitter") {
      e.face = Math.atan2(dy, dx);
      const pref = 3.15;
      if (d < pref - 0.45) tryMove(e, e.x - (dx / d) * e.speed * dt, e.y - (dy / d) * e.speed * dt);
      else if (d > pref + 0.7) tryMove(e, e.x + (dx / d) * e.speed * dt, e.y + (dy / d) * e.speed * dt);
      e.atk = Math.max(0, e.atk - dt);
      if (e.atk <= 0 && d < 6.2) {
        shots.push({ x: e.x, y: e.y - 0.2, vx: (dx / d) * 3.4, vy: (dy / d) * 3.4, dmg: e.dmg, life: 2.4, poison: true });
        e.atk = e.cd;
        e.wind = 0.12;
      }
      resolve(e);
      return;
    }

    if (e.type === "bat") {
      e.swoopT -= dt;
      if (e.swoopT <= 0) {
        e.swoopT = 0.55 + Math.random() * 0.35;
        const side = Math.random() < 0.5 ? -1 : 1;
        e.sx = player.x + side * (0.6 + Math.random() * 1.1);
        e.sy = player.y + (Math.random() - 0.55) * 1.4;
      }
      const bx = e.sx - e.x, by = e.sy - e.y;
      const bd = Math.hypot(bx, by) || 1;
      tryMove(e, e.x + (bx / bd) * e.speed * dt, e.y + (by / bd) * e.speed * dt);
      if (d < e.range + player.r && e.atk <= 0) {
        e.wind = 0.16;
        e.atk = e.cd;
      }
      if (e.wind > 0) {
        e.wind -= dt;
        if (e.wind <= 0 && dist(player.x, player.y, e.x, e.y) < e.range + player.r + 0.2) {
          hurtPlayer(e.dmg, player.x - e.x, player.y - e.y);
        }
      } else e.atk = Math.max(0, e.atk - dt);
      resolve(e);
      return;
    }

    if (e.type === "knight") {
      if (e.wind > 0) {
        e.wind -= dt;
        if (e.wind <= 0) {
          if (dist(player.x, player.y, e.x, e.y) < e.range + player.r + 0.38) {
            hurtPlayer(e.dmg, player.x - e.x, player.y - e.y);
          }
          e.vuln = 0.5;
          e.atk = e.cd;
        }
      } else {
        e.atk = Math.max(0, e.atk - dt);
        if (d > e.range + player.r * 0.25) {
          tryMove(e, e.x + (dx / d) * e.speed * dt, e.y + (dy / d) * e.speed * dt);
        } else if (e.atk <= 0) {
          e.wind = 0.42;
        }
      }
      resolve(e);
      return;
    }

    if (e.wind > 0) {
      e.wind -= dt;
      if (e.wind <= 0) {
        if (dist(player.x, player.y, e.x, e.y) < e.range + player.r + 0.18) {
          hurtPlayer(e.dmg, player.x - e.x, player.y - e.y);
        }
        e.atk = e.cd;
        if (e.type === "warden") e.vuln = 0.55;
      }
    } else {
      e.atk = Math.max(0, e.atk - dt);
      if (d > e.range + player.r * 0.4) {
        tryMove(e, e.x + (dx / d) * e.speed * dt, e.y + (dy / d) * e.speed * dt);
      } else if (e.atk <= 0 && !e.slam) {
        e.wind = e.type === "boss" || e.type === "boneking" ? 0.38 : e.type === "warden" ? 0.4 : 0.28;
      }
    }
    resolve(e);
  }

  function update(dt) {
    tick += dt;
    shopNavLatch = Math.max(0, shopNavLatch - dt);
    shopActLatch = Math.max(0, shopActLatch - dt);
    if (toastT > 0) {
      toastT -= dt;
      if (toastT <= 0) toastEl.classList.remove("show");
    }
    if (paused) return;
    if (doorAnim > 0) doorAnim = Math.max(0, doorAnim - dt);
    if (banner.t > 0) banner.t -= dt;
    shake = Math.max(0, shake - dt * 22);
    flash = Math.max(0, flash - dt * 3);
    if (comboT > 0) {
      comboT -= dt;
      if (comboT <= 0) { combo = 0; syncHud(); }
    }

    if (embers.length < 22) {
      embers.push({ x: rnd(0, W), y: rnd(0, H * 0.7), vy: -rnd(8, 22), vx: rnd(-6, 6), t: rnd(1.5, 4), r: rnd(1, 2) });
    }
    for (let i = embers.length - 1; i >= 0; i--) {
      const m = embers[i];
      m.x += m.vx * dt; m.y += m.vy * dt; m.t -= dt;
      if (m.t <= 0) embers.splice(i, 1);
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.t -= dt; p.vy += 2.4 * dt;
      if (p.t <= 0) parts.splice(i, 1);
    }
    for (let i = floats.length - 1; i >= 0; i--) {
      floats[i].y -= 0.85 * dt; floats[i].t -= dt;
      if (floats[i].t <= 0) floats.splice(i, 1);
    }
    gems.forEach(function (g) { g.t += dt; });
    coins.forEach(function (c) { c.t += dt; });
    if (chest && chest.t > 0) chest.t -= dt;
    titleMobs.forEach(function (m) { m.bob += dt; });

    if (phase !== "fight" && phase !== "loot" && phase !== "shop" && phase !== "event") return;
    if (player.dead) return;

    player.slashCd = Math.max(0, player.slashCd - dt);
    player.slashAnim = Math.max(0, player.slashAnim - dt * 3.4);
    player.dodgeCd = Math.max(0, player.dodgeCd - dt);
    player.iframes = Math.max(0, player.iframes - dt);
    player.flash = Math.max(0, player.flash - dt);
    player.heavy = Math.max(0, (player.heavy || 0) - dt);
    if (player.charging) {
      player.chargeT += dt;
      if (player.chargeT >= 0.4 && !player.chargeReady) {
        player.chargeReady = true;
        burst(player.x, player.y - 0.3, "#fde68a", 7);
        beep(520, 0.06, "square", 0.05);
        beep(780, 0.08, "square", 0.04);
      }
      if (player.chargeReady && ((tick * 18) | 0) % 3 === 0) {
        parts.push({
          x: player.x + rnd(-0.35, 0.35), y: player.y - rnd(0.15, 0.85),
          vx: rnd(-0.5, 0.5), vy: rnd(-1.4, -0.2), t: 0.28, col: "#fde68a", r: 1.6
        });
      }
    }
    if (player.epicPulse) {
      player.epicPulseT += dt;
      if (player.epicPulseT >= 4) {
        player.epicPulseT = 0;
        const heal = Math.max(3, Math.round(player.maxhp * 0.03));
        player.hp = Math.min(player.maxhp, player.hp + heal);
        burst(player.x, player.y, "#d8b4fe", 9);
        floats.push({ x: player.x, y: player.y - 0.7, t: 0.7, text: "+" + heal, col: "#d8b4fe" });
        syncHud();
      }
    }
    if (player.poison > 0) {
      player.poison -= dt;
      player.poisonTick -= dt;
      if (player.poisonTick <= 0) { player.poisonTick = 0.65; tickDot("poison"); }
    }
    if (player.burn > 0) {
      player.burn -= dt;
      player.burnTick -= dt;
      if (player.burnTick <= 0) { player.burnTick = 0.5; tickDot("burn"); }
    }
    if (player.slow > 0) player.slow -= dt;

    let moving = false;
    if (player.dodging > 0) {
      player.dodging -= dt;
      tryMove(player, player.x + player.vx * dt, player.y + player.vy * dt);
      moving = true;
    } else {
      const st = stickNow();
      if (st.on) {
        lastStick.x = st.x; lastStick.y = st.y;
        player.face = Math.atan2(st.y, st.x);
        player.flip = st.x < 0;
        if (!player.dash) {
          player.tx = player.x + st.x * 1.55;
          player.ty = player.y + st.y * 1.55;
        }
      } else if (stickWasOn && !player.dash) {
        player.tx = null;
        player.ty = null;
      }
      stickWasOn = st.on;
      if (pad.b || keys.b) padDodge();
      refreshPadVisuals();

      if (player.dash && player.dash.hp > 0) {
        player.tx = player.dash.x; player.ty = player.dash.y;
        const d = dist(player.x, player.y, player.dash.x, player.dash.y);
        if (d <= player.slashR) {
          doSlash(player.dash);
          player.dash = null;
          player.tx = null;
        }
      } else if (player.dash && player.dash.hp <= 0) {
        player.dash = null;
      }
      if (player.tx != null) {
        const dx = player.tx - player.x, dy = player.ty - player.y;
        const d = Math.hypot(dx, dy);
        const slowM = player.slow > 0 ? 0.55 : 1;
        const spd = (player.dash ? player.speed * 2.6 : player.speed) * slowM;
        if (d < 0.12) { player.x = player.tx; player.y = player.ty; player.tx = null; }
        else {
          tryMove(player, player.x + (dx / d) * spd * dt, player.y + (dy / d) * spd * dt);
          player.face = Math.atan2(dy, dx);
          player.flip = dx < 0;
          moving = true;
        }
      }
    }
    if (moving) {
      player.walkT += dt;
      const stw = stickNow();
      if (stw.on && player.dodging <= 0 && !player.dash) {
        stepDustT -= dt;
        if (stepDustT <= 0) {
          stepDustT = 0.15;
          parts.push({
            x: player.x + rnd(-0.12, 0.12), y: player.y + 0.08,
            vx: rnd(-0.5, 0.5), vy: rnd(-0.15, 0.25),
            t: 0.28, col: "#8a7060", r: rnd(1.4, 2.4)
          });
        }
      }
    } else player.walkT = 0;

    for (let i = gems.length - 1; i >= 0; i--) {
      if (dist(player.x, player.y, gems[i].x, gems[i].y) < 0.72) pickup(gems[i]);
    }
    if ((phase === "loot" || phase === "shop" || phase === "event") && exitGate && dist(player.x, player.y, exitGate.x, exitGate.y) < 0.95) {
      nextRoom();
      return;
    }
    if (chest && chest.mimic && dist(player.x, player.y, chest.x, chest.y) < 0.85) {
      triggerMimic();
    }

    for (let i = shots.length - 1; i >= 0; i--) {
      const s = shots[i];
      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
      if (s.life <= 0 || solidAt(s.x, s.y)) { shots.splice(i, 1); continue; }
      if (s.friendly) {
        let hit = false;
        for (let j = 0; j < enemies.length; j++) {
          const e = enemies[j];
          if (e.hp <= 0) continue;
          if (dist(s.x, s.y, e.x, e.y) < e.r + 0.28) {
            hitEnemy(e, s.dmg, false);
            hit = true;
          }
        }
        if (hit) shots.splice(i, 1);
        continue;
      }
      if (dist(s.x, s.y, player.x, player.y) < player.r + 0.18) {
        hurtPlayer(s.dmg, player.x - s.x, player.y - s.y, s.poison ? "poison" : (s.burn ? "burn" : null));
        if (s.burn) applyStatus("burn", 2.4);
        shots.splice(i, 1);
      }
    }

    for (let i = puddles.length - 1; i >= 0; i--) {
      const pdl = puddles[i];
      pdl.t -= dt;
      if (pdl.t <= 0) { puddles.splice(i, 1); continue; }
      if (dist(player.x, player.y, pdl.x, pdl.y) < pdl.r + player.r * 0.4) {
        applyStatus("burn", 2.2);
        pdl.tick = (pdl.tick || 0) - dt;
        if (pdl.tick <= 0) { pdl.tick = 0.55; tickDot("burn"); }
      }
    }
    for (let i = bombs.length - 1; i >= 0; i--) {
      const b = bombs[i];
      b.t -= dt;
      if (b.t > 0) continue;
      burst(b.x, b.y, "#fb923c", 14);
      shake = Math.max(shake, 7);
      screenFlash(0.12, "251,146,60");
      sfx("boom");
      for (let j = 0; j < enemies.length; j++) {
        const o = enemies[j];
        if (o.hp <= 0) continue;
        if (dist(o.x, o.y, b.x, b.y) < b.r + o.r) hitEnemy(o, b.dmg, false);
      }
      bombs.splice(i, 1);
    }
    for (let i = bloodStains.length - 1; i >= 0; i--) {
      bloodStains[i].t -= dt;
      if (bloodStains[i].t <= 0) bloodStains.splice(i, 1);
    }

    for (let i = 0; i < hazards.length; i++) {
      const hz = hazards[i];
      if (hz.tele > 0) { hz.tele -= dt; continue; }
      if (Math.floor(player.x) !== hz.tx || Math.floor(player.y) !== hz.ty) continue;
      if (hz.type === "slime") applyStatus("slow", 1.5);
      else if (hz.type === "spike") {
        hz.tick = (hz.tick || 0) - dt;
        if (hz.tick <= 0) {

    if (phase !== "fight") return;

    for (let i = 0; i < enemies.length; i++) updateEnemy(enemies[i], dt);

    for (let i = 0; i < enemies.length; i++) {
      for (let j = i + 1; j < enemies.length; j++) {
        const a = enemies[i], b = enemies[j];
        const d2 = dist(a.x, a.y, b.x, b.y);
        const min = a.r + b.r - 0.06;
        if (d2 < min && d2 > 0.01) {
          const nx = (b.x - a.x) / d2, ny = (b.y - a.y) / d2;
          const push = (min - d2) * 0.5;
          tryMove(a, a.x - nx * push, a.y - ny * push);
          tryMove(b, b.x + nx * push, b.y + ny * push);

  }
  function blit(s, wx, wy, flip, doFlash, scale) {
    if (!s) return;

  function footShadow(wx, wy, span) {

  function drawHpPip(wx, wy, hp, max, above) {

  function isBorder(tx, ty) {

  function drawBlood(tx, ty) {

  function drawSlamZone(slam) {
    if (!slam) return;

    const r = slam.r;
    const pulse = 0.35 + k * 0.55;

        const cx = tx + 0.5, cy = ty + 0.5;
        if (Math.hypot(cx - slam.x, cy - slam.y) > r) continue;
        ctx.fillStyle = "rgba(180,16,16," + (0.16 + pulse * 0.28) + ")";
        ctx.fillRect(sx(tx), sy(ty), TILE, TILE);
        ctx.fillStyle = "rgba(255,60,50," + (0.2 + pulse * 0.35) + ")";

  function drawMapFloor() {
    const pack = tilesFor(THEME._name);
    for (let ty = 0; ty < ROWS; ty++) {
      for (let tx = 0; tx < COLS; tx++) {
        const ch = MAP[ty][tx];
        if (ch === "#" || ch === "*") continue;
        if (ch === "o") drawTileImg(pack.ritual, tx, ty);
        else if (ch === "~") drawTileImg(pack.rug, tx, ty);
        else if (ch === "+") drawTileImg(pack.grate, tx, ty);
        else if (ch === "D") {
          drawTileImg(pack.door, tx, ty);
          ctx.fillStyle = THEME.wall[2];
          ctx.fillRect(sx(tx), sy(ty) - TILE * 0.55, TILE, TILE * 0.55);
          ctx.fillStyle = THEME.wall[3];
          ctx.fillRect(sx(tx) + 2, sy(ty) - TILE * 0.45, TILE - 4, 3);
