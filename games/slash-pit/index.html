    if (chest.open && chest.t > 0) {
      ctx.fillStyle = "rgba(251,191,36," + (chest.t * 0.55) + ")";
      ctx.fillRect(sx(chest.x) - TILE * 0.35, sy(chest.y) - TILE * 0.7, TILE * 0.7, TILE * 0.35);
    }
  }

  function drawGem(g) {
    const hop = g.hop ? Math.sin(Math.min(1, g.t / 0.35) * Math.PI) * 0.45 : 0;
    const bob = Math.sin(g.t * 5) * 0.08;
    footShadow(g.x, g.y, 0.4);
    const s = spr.gems[g.rarity] || spr.gems.common;
    blit(s, g.x, g.y - bob - hop, false, false);
  }

  function drawShopRefresh() {
    if (!shop || !shop.refresh) return;
    const r = shop.refresh;
    footShadow(r.x, r.y, 0.5);
    if (r.used) {
      ctx.globalAlpha = 0.35;
      blit(spr.coin, r.x, r.y, false, false);
      ctx.globalAlpha = 1;
      ctx.fillStyle = "#6a5a50";
      ctx.font = "700 9px ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.fillText("SOLD", sx(r.x), sy(r.y) + TILE * 0.4);
      return;
    }
    const bob = Math.sin(tick * 5) * 0.06;
    blit(spr.coin, r.x, r.y - bob, false, false);
    if (shop.sel === shop.goods.length) {
      ctx.strokeStyle = "#fbbf24";
      ctx.lineWidth = 2;
      ctx.strokeRect(sx(r.x) - TILE * 0.5, sy(r.y) - TILE * 0.85, TILE, TILE * 1.15);
    }
    ctx.fillStyle = gold >= r.price ? "#fbbf24" : "#fda4af";
    ctx.font = "700 10px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    ctx.fillText("REROLL " + r.price + "G", sx(r.x), sy(r.y) + TILE * 0.4);
  }
  function drawFamiliar() {
    if (!familiar) return;
    footShadow(familiar.x, familiar.y, 0.32);
    const s = Math.sin(familiar.bob * 10) > 0 ? spr.bat1 : spr.bat2;
    blit(s, familiar.x, familiar.y, familiar.x > (player.x || familiar.x), false, 0.7);
  }
  function drawShopGood(g, i) {
    footShadow(g.x, g.y, 0.55);
    if (g.bought) {
      ctx.globalAlpha = 0.35;
      blit(spr.gems[g.item.rarity] || spr.gems.common, g.x, g.y, false, false);
      ctx.globalAlpha = 1;
      return;
    }
    const bob = Math.sin(tick * 4 + i) * 0.08;
    blit(spr.gems[g.item.rarity] || spr.gems.common, g.x, g.y - bob, false, false);
    if (shop && shop.sel === i) {
      ctx.strokeStyle = "#fbbf24";
      ctx.lineWidth = 2;
      ctx.strokeRect(sx(g.x) - TILE * 0.55, sy(g.y) - TILE * 1.15, TILE * 1.1, TILE * 1.35);
    }
    ctx.fillStyle = gold >= g.price ? "#fbbf24" : "#fda4af";
    ctx.font = "700 10px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    ctx.fillText(g.price + "G", sx(g.x), sy(g.y) + TILE * 0.35);
    ctx.fillStyle = "#e8d5c0";
    ctx.font = "700 9px ui-sans-serif, system-ui";
    ctx.fillText(g.item.name, sx(g.x), sy(g.y) + TILE * 0.58);
  }

  function drawTablet(tb) {
    const x = sx(tb.x), y = sy(tb.y);
    footShadow(tb.x, tb.y, 0.5);
    ctx.fillStyle = "#3a322c";
    ctx.fillRect(x - 8, y - 16, 16, 18);
    ctx.fillStyle = "#5a4a3c";
    ctx.fillRect(x - 6, y - 14, 12, 14);
    ctx.fillStyle = "#c4b4a4";
    ctx.fillRect(x - 4, y - 11, 8, 1);
    ctx.fillRect(x - 4, y - 8, 8, 1);
    ctx.fillRect(x - 3, y - 5, 6, 1);
    const pulse = 0.35 + Math.sin(tick * 5 + tb.x) * 0.2;
    ctx.fillStyle = "rgba(253,230,138," + pulse + ")";
    ctx.fillRect(x - 2, y - 18, 4, 2);
  }
  function drawWheel() {
    if (!wheel) return;
    const x = sx(wheel.x), y = sy(wheel.y);
    const R = Math.round(TILE * 1.12);
    const cols = ["#4ade80", "#fbbf24", "#a78bfa", "#fb923c"];
    const labs = ["HP", "G", "X", "E"];
    const TAU = Math.PI * 2;
    footShadow(wheel.x, wheel.y, 0.95);
    for (let py = -R; py <= R; py += 2) {
      for (let px = -R; px <= R; px += 2) {
        if (px * px + py * py > R * R) continue;
        let a = Math.atan2(px, -py) - wheel.ang;
        a = ((a % TAU) + TAU) % TAU;
        ctx.fillStyle = cols[(a / (TAU / 4)) | 0];
        ctx.fillRect(x + px, y + py, 2, 2);
      }
    }
    ctx.fillStyle = "#1a1008";
    ctx.fillRect(x - R - 1, y - 1, R * 2 + 2, 2);
    ctx.fillRect(x - 1, y - R - 1, 2, R * 2 + 2);
    ctx.fillStyle = "#f3e8de";
    ctx.fillRect(x - 3, y - 3, 6, 6);
    ctx.fillStyle = "#fde68a";
    ctx.fillRect(x - 4, y - R - 8, 8, 4);
    ctx.fillRect(x - 2, y - R - 4, 4, 4);
    ctx.font = "800 8px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    for (let i = 0; i < 4; i++) {
      const mid = (i + 0.5) * (TAU / 4) + wheel.ang;
      const lx = x + Math.sin(mid) * (R * 0.55);
      const ly = y - Math.cos(mid) * (R * 0.55);
      ctx.fillStyle = "#1a1008";
      ctx.fillText(labs[i], lx, ly + 3);
    }
    if (!wheel.used && !wheel.spinning) {
      ctx.fillStyle = "#fde68a";
      ctx.font = "800 10px ui-sans-serif, system-ui";
      ctx.fillText("SPIN", x, y + R + 14);
    } else if (wheel.used) {
      ctx.fillStyle = "#8a7060";
      ctx.font = "700 9px ui-sans-serif, system-ui";
      ctx.fillText("DONE", x, y + R + 14);
    }
  }
  function drawShrineOpt(o, i) {
    footShadow(o.x, o.y, 0.7);
    blit(spr.shrine, o.x, o.y, false, false);
    if (shrine && shrine.sel === i && !shrine.used) {
      ctx.strokeStyle = "#fde68a";
      ctx.lineWidth = 2;
      ctx.strokeRect(sx(o.x) - TILE * 0.55, sy(o.y) - TILE * 1.1, TILE * 1.1, TILE * 1.3);
    }
    ctx.fillStyle = shrine && shrine.used ? "#6a5a50" : "#fde68a";
    ctx.font = "800 10px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    ctx.fillText(o.name, sx(o.x), sy(o.y) + TILE * 0.4);
  }

  function drawArch(door, side) {
    const x = sx(door.x), y = sy(door.y);
    const pulse = 0.55 + Math.sin(tick * 6 + (side === "L" ? 0 : 2)) * 0.45;
    const safe = side === "L";
    ctx.fillStyle = safe ? ("rgba(134,239,172," + (0.12 * pulse) + ")") : ("rgba(253,164,175," + (0.12 * pulse) + ")");
    ctx.fillRect(x - TILE * 0.72, y - TILE * 1.2, TILE * 1.44, TILE * 1.75);
    ctx.fillStyle = safe ? "#2a4a32" : "#4a2020";
    ctx.fillRect(x - TILE * 0.58, y - TILE * 0.98, 6, TILE * 1.38);
    ctx.fillRect(x + TILE * 0.58 - 6, y - TILE * 0.98, 6, TILE * 1.38);
    ctx.fillRect(x - TILE * 0.58, y - TILE * 1.08, TILE * 1.16, 6);
    ctx.fillStyle = safe ? "#3a6a44" : "#6a3030";
    ctx.fillRect(x - TILE * 0.5, y - TILE * 1.02, 3, TILE * 1.28);
    ctx.fillRect(x + TILE * 0.5 - 3, y - TILE * 1.02, 3, TILE * 1.28);
    ctx.fillStyle = safe ? "#86efac" : "#fda4af";
    ctx.fillRect(x - TILE * 0.42, y - TILE * 1.14, TILE * 0.84, 3);
    ctx.fillRect(x - 3, y - TILE * 1.2, 6, 3);
    ctx.font = "800 10px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    ctx.fillText(door.label, x, y + TILE * 0.7);
    ctx.font = "700 8px ui-sans-serif, system-ui";
    ctx.fillStyle = "#e8d5c0";
    ctx.fillText(door.hint, x, y + TILE * 0.92);
  }

  function drawCampfire(f) {
    footShadow(f.x, f.y, 0.7);
    const s = ((tick * 8) | 0) % 2 ? spr.fire1 : spr.fire2;
    blit(s, f.x, f.y, false, false);
    const glow = 0.25 + Math.sin(tick * 9) * 0.12;
    ctx.fillStyle = "rgba(251,146,60," + glow + ")";
    ctx.fillRect(sx(f.x) - TILE * 0.45, sy(f.y) - TILE * 0.15, TILE * 0.9, TILE * 0.28);
  }

  function drawRestOpt(o, i) {
    footShadow(o.x, o.y, 0.55);
    ctx.fillStyle = "#3a2a18";
    ctx.fillRect(sx(o.x) - 10, sy(o.y) - 8, 20, 10);
    ctx.fillStyle = "#5a3a20";
    ctx.fillRect(sx(o.x) - 8, sy(o.y) - 6, 16, 6);
    if (rest && rest.sel === i && !rest.used) {
      ctx.strokeStyle = "#fde68a";
      ctx.lineWidth = 2;
      ctx.strokeRect(sx(o.x) - TILE * 0.55, sy(o.y) - TILE * 0.7, TILE * 1.1, TILE * 1.05);
    }
    ctx.fillStyle = rest && rest.used ? "#6a5a50" : "#fde68a";
    ctx.font = "800 10px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    ctx.fillText(o.name, sx(o.x), sy(o.y) + TILE * 0.42);
  }

  function drawPactOpt(o, i) {
    const x = sx(o.x), y = sy(o.y);
    const w = TILE * 2.4, h = TILE * 1.2;
    const on = pact && pact.sel === i && !pact.used;
    ctx.fillStyle = o.id === "take" ? "rgba(127,29,29,0.9)" : "rgba(42,32,24,0.9)";
    ctx.fillRect(x - w * 0.5, y - h * 0.5, w, h);
    ctx.strokeStyle = on ? "#fde68a" : (o.id === "take" ? "#ef4444" : "#8a7060");
    ctx.lineWidth = on ? 3 : 2;
    ctx.strokeRect(x - w * 0.5, y - h * 0.5, w, h);
    ctx.fillStyle = pact && pact.used ? "#6a5a50" : (o.id === "take" ? "#fda4af" : "#e8d5c0");
    ctx.font = "800 14px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    ctx.fillText(o.name, x, y + 5);
  }

  function draw() {
    const ox = (Math.random() - 0.5) * shake;
    const oy = (Math.random() - 0.5) * shake;
    const punch = camPunch > 4 ? 4 : camPunch;
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.translate(ox + camPx * punch, oy + camPy * punch);
    ctx.fillStyle = THEME ? THEME.fog : "#0a0706";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#080506";
    ctx.fillRect(0, 0, W, mapY);
    ctx.fillRect(0, mapY + mapH, W, H);

    if (MAP.length) {
      drawMapFloor();
      enemies.forEach(function (e) { if (e.slam) drawSlamZone(e.slam); });
      if (branchDoors) {
        drawArch(branchDoors.left, "L");
        drawArch(branchDoors.right, "R");
      } else if (exitGate) {
        const pulse = 0.55 + Math.sin(tick * 6) * 0.45;
        ctx.fillStyle = "rgba(251,191,36," + (0.12 * pulse) + ")";
        ctx.fillRect(sx(exitGate.x) - TILE * 0.7, sy(exitGate.y) - TILE * 0.2, TILE * 1.4, TILE * 1.1);
        ctx.strokeStyle = "rgba(251,191,36," + (0.45 + 0.4 * pulse) + ")";
        ctx.lineWidth = 2;
        ctx.strokeRect(sx(exitGate.x) - TILE * 0.55, sy(exitGate.y) - TILE * 0.85, TILE * 1.1, TILE * 1.5);
        ctx.fillStyle = "#fbbf24";
        ctx.font = "700 10px ui-sans-serif, system-ui";
        ctx.textAlign = "center";
        ctx.fillText(runHorde ? "FIGHT" : "NEXT", sx(exitGate.x), sy(exitGate.y) + TILE * 0.85);
      }
      drawBorderWalls();
    }

    const list = [];
    if (MAP.length) {
      const pack = tilesFor(THEME._name);
      for (let ty = 0; ty < ROWS; ty++) {
        for (let tx = 0; tx < COLS; tx++) {
          const ch = MAP[ty][tx];
          if (ch === "P") {
            list.push({ y: ty + 0.95, draw: function () {
              footShadow(tx + 0.5, ty + 0.95, 0.7);
              blit(spr.pillar, tx + 0.5, ty + 1.05, false, false);
            }});
          } else if ((ch === "#" || ch === "*") && (!isBorder(tx, ty) || ty === ROWS - 1)) {
            list.push({ y: ty + 0.98, draw: function () { drawWallTile(tx, ty, pack); } });
          }
        }
      }
    }
    if (chest) list.push({ y: chest.y, draw: drawChest });
    gems.forEach(function (g) { list.push({ y: g.y, draw: function () { drawGem(g); } }); });
    if (shop) shop.goods.forEach(function (g, i) { list.push({ y: g.y, draw: function () { drawShopGood(g, i); } }); });
    if (shop && shop.keeper) list.push({ y: shop.keeper.y, draw: function () {
      footShadow(shop.keeper.x, shop.keeper.y, 0.7);
      blit(spr.keeper, shop.keeper.x, shop.keeper.y, false, false);
    }});
    if (shop && shop.refresh) list.push({ y: shop.refresh.y, draw: drawShopRefresh });
    if (wheel) list.push({ y: wheel.y, draw: drawWheel });
    if (shrine) shrine.opts.forEach(function (o, i) { list.push({ y: o.y, draw: function () { drawShrineOpt(o, i); } }); });
    if (pact) pact.opts.forEach(function (o, i) { list.push({ y: o.y, draw: function () { drawPactOpt(o, i); } }); });
    if (rest) {
      list.push({ y: rest.fire.y, draw: function () { drawCampfire(rest.fire); } });
      rest.opts.forEach(function (o, i) { list.push({ y: o.y, draw: function () { drawRestOpt(o, i); } }); });
    }
    tablets.forEach(function (tb) {
      if (tb.smashed) return;
      list.push({ y: tb.y, draw: function () { drawTablet(tb); } });
    });
    enemies.forEach(function (e) { list.push({ y: e.y, draw: function () { drawEnemy(e); } }); });
    titleMobs.forEach(function (m) {
      list.push({ y: m.y, draw: function () {
        footShadow(m.x, m.y, m.type === "brute" ? 1.05 : 0.7);
        const s = m.type === "brute" ? (((m.bob * 3) | 0) % 3 === 1 ? spr.bruteW : (((m.bob * 3) | 0) % 3 === 2 && spr.bruteW2 ? spr.bruteW2 : spr.brute))
          : (((m.bob * 5.2) | 0) % 3 === 0 ? spr.slime1 : (((m.bob * 5.2) | 0) % 3 === 1 ? spr.slime2 : (spr.slime3 || spr.slime1)));
        blit(s, m.x, m.y, m.flip, false);
      }});
    });
    ghosts.forEach(function (gh) {
      list.push({ y: gh.y, draw: function () {
        drawHeroAt(gh.x, gh.y, gh.flip, 0, clamp(gh.t * 4, 0, 0.45), 0);
      }});
    });
    if (familiar) list.push({ y: familiar.y, draw: drawFamiliar });
    if (player.y != null) list.push({ y: player.y, draw: drawPlayer });
    list.sort(function (a, b) { return a.y - b.y; });
    list.forEach(function (it) { it.draw(); });

    puddles.forEach(function (pdl) {
      const a = 0.22 + 0.18 * Math.sin(tick * 8 + pdl.x);
      const mire = pdl.kind === "mire";
      ctx.fillStyle = mire ? "rgba(74,222,128," + a + ")" : "rgba(232,93,4," + a + ")";
      const pr = pdl.r * TILE;
      ctx.fillRect(sx(pdl.x) - pr, sy(pdl.y) - pr * 0.45, pr * 2, pr * 0.9);
      ctx.fillStyle = mire ? "rgba(190,255,170," + (a + 0.08) + ")" : "rgba(253,230,138," + (a + 0.1) + ")";
      ctx.fillRect(sx(pdl.x) - pr * 0.4, sy(pdl.y) - pr * 0.2, pr * 0.8, pr * 0.35);
    });
    bombs.forEach(function (b) {
      const k = 1 - b.t / 0.4;
      ctx.fillStyle = "#fb923c";
      ctx.fillRect(sx(b.x) - 4, sy(b.y) - 6, 8, 8);
      ctx.fillStyle = "#fde68a";
      ctx.fillRect(sx(b.x) - 2, sy(b.y) - 4, 4, 4);
      ctx.strokeStyle = "rgba(251,146,60," + (0.4 + k * 0.5) + ")";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sx(b.x), sy(b.y) - 2, TILE * (0.4 + k * 0.7), 0, Math.PI * 2);
      ctx.stroke();
    });
    shots.forEach(function (s) {
      if (s.wave) {
        ctx.fillStyle = "#7dd3fc";
        ctx.fillRect(sx(s.x) - 7, sy(s.y) - 4, 14, 8);
        ctx.fillStyle = "#e0f2fe";
        ctx.fillRect(sx(s.x) - 3, sy(s.y) - 2, 8, 4);
      } else if (s.burn) {
        ctx.fillStyle = "#fb923c";
        ctx.fillRect(sx(s.x) - 3, sy(s.y) - 3, 6, 6);
        ctx.fillStyle = "#fde68a";
        ctx.fillRect(sx(s.x) - 1, sy(s.y) - 1, 3, 3);
      } else if (s.bolt) {
        ctx.fillStyle = "rgba(45,212,191,0.38)";
        ctx.beginPath();
        ctx.arc(sx(s.x), sy(s.y), 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#2dd4bf";
        ctx.fillRect(sx(s.x) - 4, sy(s.y) - 4, 8, 8);
        ctx.fillStyle = "#ecfdf5";
        ctx.fillRect(sx(s.x) - 2, sy(s.y) - 2, 4, 4);
      } else {
        ctx.fillStyle = "#5eead4";
        ctx.fillRect(sx(s.x) - 3, sy(s.y) - 3, 6, 6);
        ctx.fillStyle = "#ecfdf5";
        ctx.fillRect(sx(s.x) - 1, sy(s.y) - 1, 3, 3);
      }
    });
    parts.forEach(function (p) {
      ctx.globalAlpha = clamp(p.t * 3, 0, 1);
      ctx.fillStyle = p.col;
      const s = Math.max(1, p.r);
      ctx.fillRect(sx(p.x) - s / 2, sy(p.y) - s / 2, s, s);
      ctx.globalAlpha = 1;
    });
    floats.forEach(function (f) {
      ctx.globalAlpha = clamp(f.t * 2, 0, 1);
      ctx.fillStyle = "#1a0a08";
      ctx.font = "800 14px ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.fillText(f.text, sx(f.x) + 1, sy(f.y) + 1);
      ctx.fillStyle = f.col;
      ctx.fillText(f.text, sx(f.x), sy(f.y));
      ctx.globalAlpha = 1;
    });
    if (combo >= 2 && (phase === "fight" || phase === "loot")) {
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = combo >= 8 ? "#fb923c" : (combo >= 5 ? "#fde68a" : "#e8d5c0");
      ctx.font = "800 16px ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.fillText(combo >= 8 ? "x" + combo + " FINISHER" : ("x" + combo + (combo >= 5 ? " COMBO" : "")), sx(player.x), sy(player.y) - TILE * 1.35);
      ctx.globalAlpha = 1;
    }
    if (banner.t > 0) {
      ctx.globalAlpha = clamp(banner.t * 2, 0, 0.92);
      const by = mapY + TILE * 1.6;
      ctx.fillStyle = "rgba(10,4,4,0.72)";
      ctx.fillRect(mapX + TILE, by - 22, mapW - TILE * 2, 32);
      ctx.fillStyle = "#3a2018";
      ctx.fillRect(mapX + TILE, by - 22, mapW - TILE * 2, 2);
      ctx.fillRect(mapX + TILE, by + 8, mapW - TILE * 2, 2);
      ctx.fillStyle = "#fff7ed";
      ctx.font = "800 26px ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.fillText(banner.text, W * 0.5, by + 4);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    if (MAP.length) drawLighting();
    if (enemies.length <= 12) embers.forEach(function (m) {
      ctx.globalAlpha = clamp(m.t, 0, 1) * 0.45;
      ctx.fillStyle = "#e85d04";
      ctx.fillRect(m.x, m.y, m.r, m.r);
      ctx.globalAlpha = 1;
    });
    iceSpark.forEach(function (sp) {
      ctx.globalAlpha = clamp(sp.t * 2, 0, 0.85);
      ctx.fillStyle = "#e0f2fe";
      ctx.fillRect(sx(sp.x), sy(sp.y), 2, 2);
      ctx.fillStyle = "#7dd3fc";
      ctx.fillRect(sx(sp.x) + 1, sy(sp.y) - 1, 1, 1);
      ctx.globalAlpha = 1;
    });
    voidMotes.forEach(function (m) {
      ctx.globalAlpha = clamp(m.t, 0, 1) * 0.4;
      ctx.fillStyle = "#6b21a8";
      ctx.fillRect(m.x, m.y, m.r, m.r);
      ctx.globalAlpha = 1;
    });
    mireBubbles.forEach(function (b) {
      ctx.globalAlpha = clamp(b.t * 1.4, 0, 0.55);
      ctx.fillStyle = "#4ade80";
      ctx.fillRect(sx(b.x), sy(b.y), b.r, b.r);
      ctx.fillStyle = "#166534";
      ctx.fillRect(sx(b.x) + 1, sy(b.y) - 1, 1, 1);
      ctx.globalAlpha = 1;
    });
    if (parryFlash > 0) {
      ctx.fillStyle = "rgba(103,232,249," + (parryFlash * 0.35) + ")";
      ctx.fillRect(0, 0, W, H);
    }
    if (flash > 0) {
      ctx.fillStyle = "rgba(" + (flashCol || "255,50,36") + "," + (flash * 0.28) + ")";
      ctx.fillRect(0, 0, W, H);
    }
    if (phase === "fight" || phase === "loot" || phase === "shop" || phase === "event") drawMinimap();
    if (!player.dead && player.maxhp && player.hp / player.maxhp < 0.3 &&
        (phase === "fight" || phase === "loot" || phase === "shop" || phase === "event")) {
      const a = 0.2 + 0.2 * (0.5 + 0.5 * Math.sin(tick * 7));
      ctx.strokeStyle = "rgba(220, 24, 24, " + a + ")";
      ctx.lineWidth = 10;
      ctx.strokeRect(5, 5, W - 10, H - 10);
      ctx.strokeStyle = "rgba(255, 70, 50, " + (a * 0.55) + ")";
      ctx.lineWidth = 4;
      ctx.strokeRect(13, 13, W - 26, H - 26);
    }
    if (player.dodging > 0 && (phase === "fight" || phase === "loot" || phase === "shop" || phase === "event")) {
      ctx.strokeStyle = player.dashTrail ? "rgba(251,146,60,0.55)" : "rgba(103,232,249,0.4)";
      ctx.lineWidth = 2;
      ctx.strokeRect(sx(player.x) - 16, sy(player.y) - 28, 32, 32);
    }
    if (wipeT > 0) {
      const k = wipeT / 0.2;
      const cx = W * 0.5, cy = H * 0.42;
      const maxR = Math.hypot(W, H) * 0.65;
      const r = maxR * (1 - k);
      ctx.save();
      ctx.fillStyle = "#000";
      ctx.beginPath();
      ctx.rect(0, 0, W, H);
      if (r > 2) ctx.arc(cx, cy, r, 0, Math.PI * 2, true);
      ctx.fill("evenodd");
      ctx.restore();
    }
  }

  function drawMinimap() {
    if (!MAP.length || player.dead) return;
    const hist = roomPath.slice(-8);
    const cell = 3;
    const pad = 3;
    const mw = Math.max(COLS * cell + pad * 2, hist.length * 10 + pad * 2);
    const mh = ROWS * cell + pad * 2 + 20;
    const deck = document.getElementById("gbsp");
    const bot = deck ? Math.max(140, deck.offsetHeight) : 168;
    const x = 8;
    const y = H - bot - mh - 6;
    ctx.fillStyle = "rgba(10,6,6,0.78)";
    ctx.fillRect(x, y, mw, mh);
    ctx.strokeStyle = "#5a3a20";
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, mw - 1, mh - 1);
    for (let ty = 0; ty < ROWS; ty++) {
      for (let tx = 0; tx < COLS; tx++) {
        const ch = MAP[ty][tx];
        let col = "#1a1210";
        if (ch === "." || ch === "S" || ch === "+" || ch === "~" || ch === "o") col = "#3a2a22";
        if (ch === "D") col = "#fbbf24";
        for (let hi = 0; hi < hazards.length; hi++) {
          if (hazards[hi].tx === tx && hazards[hi].ty === ty) col = hazards[hi].type === "slime" ? "#4ade80" : "#f87171";
        }
        if (secret && !secret.opened && secret.tx === tx && secret.ty === ty) col = "#a78bfa";
        ctx.fillStyle = col;
        ctx.fillRect(x + pad + tx * cell, y + pad + ty * cell, cell, cell);
      }
    }
    for (let i = 0; i < enemies.length; i++) {
      ctx.fillStyle = "#ef4444";
      ctx.fillRect(x + pad + Math.floor(enemies[i].x) * cell, y + pad + Math.floor(enemies[i].y) * cell, cell, cell);
    }
    if (player.x != null) {
      ctx.fillStyle = "#67e8f9";
      ctx.fillRect(x + pad + Math.floor(player.x) * cell, y + pad + Math.floor(player.y) * cell, cell, cell);
    }
    ctx.fillStyle = "#c4b4a4";
    ctx.font = "700 8px ui-sans-serif, system-ui";
    ctx.textAlign = "left";
    ctx.fillText((roomKind || "ROOM").toUpperCase(), x + pad, y + mh - 12);
    ctx.font = "800 8px ui-monospace, ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    for (let i = 0; i < hist.length; i++) {
      const ch = hist[i];
      const last = i === hist.length - 1;
      ctx.fillStyle = last
        ? (ch === "!" ? "#fda4af" : ch === "B" ? "#fb923c" : ch === "S" || ch === "V" ? "#fbbf24" : ch === "R" ? "#86efac" : ch === "E" ? "#c4b5fd" : "#fde68a")
        : "#6a5a50";
      ctx.fillText(ch, x + pad + 5 + i * 10, y + mh - 3);
    }
  }

  function loop(ts) {
    if (!last) last = ts;
    let dt = (ts - last) / 1000;
    last = ts;
    if (dt > 0.05) dt = 0.05;
    const rawDt = dt;
    if (hitstop > 0) {
      hitstop -= rawDt;
      if (hitstop < 0) hitstop = 0;
      draw();
      pid = requestAnimationFrame(loop);
      return;
    }
    if (killCam > 0 && !paused) {
      killCam -= rawDt;
      dt = rawDt * 0.22;
      if (killCam < 0) killCam = 0;
    }
    for (let i = ghosts.length - 1; i >= 0; i--) {
      ghosts[i].t -= dt;
      if (ghosts[i].t <= 0) ghosts.splice(i, 1);
    }
    update(dt);
    if (pendingClear && killCam <= 0 && !paused) {
      pendingClear = false;
      clearRoom();
    }
    draw();
    pid = requestAnimationFrame(loop);
  }

  function snapshotHero() {
    HERO_CAPE_KEYS.forEach(function (k) {
      if (spr[k] && !heroBase[k]) heroBase[k] = spr[k];
    });
  }
  function nearRgb(r, g, b, tgt) {
    return Math.abs(r - tgt[0]) < 10 && Math.abs(g - tgt[1]) < 10 && Math.abs(b - tgt[2]) < 10;
  }
  function remapCape(src, cap) {
    const c = document.createElement("canvas");
    c.width = src.w; c.height = src.h;
    const g = c.getContext("2d");
    g.drawImage(src.c, 0, 0);
    const img = g.getImageData(0, 0, src.w, src.h);
    const lite = PAL.C, dark = PAL.c;
    for (let y = 0; y < src.h; y++) {
      for (let x = 0; x < src.w; x++) {
        const i = (y * src.w + x) * 4;
        if (img.data[i + 3] < 10) continue;
        const r = img.data[i], gg = img.data[i + 1], bb = img.data[i + 2];
        if (nearRgb(r, gg, bb, lite)) { img.data[i] = cap.lite[0]; img.data[i + 1] = cap.lite[1]; img.data[i + 2] = cap.lite[2]; }
        else if (nearRgb(r, gg, bb, dark)) { img.data[i] = cap.dark[0]; img.data[i + 1] = cap.dark[1]; img.data[i + 2] = cap.dark[2]; }
      }
    }
    g.putImageData(img, 0, 0);
    return { c: c, f: src.f, w: src.w, h: src.h };
  }
  function applyCape(id) {
    const cap = capeDef(capeUnlocked(id) ? id : "cyan");
    capeId = cap.id;
    snapshotHero();
    HERO_CAPE_KEYS.forEach(function (k) {
      if (heroBase[k]) spr[k] = remapCape(heroBase[k], cap);
    });
  }

  loadMute();
  loadVibrate();
  loadDmgNums();
  hidePauseOverlay();
  initSprites();
  initExtraSprites();
  applyCape(capeId);
  const pauseEl = document.getElementById("pauseov");
  if (pauseEl) {
    pauseEl.addEventListener("click", function (e) {
      if (e.target && (e.target.id === "quitbtn" || (e.target.closest && e.target.closest("#quitbtn")))) {
        e.stopPropagation();
        if (runPractice || runHorde) quitToTitle();
        return;
      }
      if (paused && inRun()) togglePause();
    });
  }
  resize();
  showTitle();
  pid = requestAnimationFrame(loop);
})();

  </script>
</body>
</html>
