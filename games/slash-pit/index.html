<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a0706" />
  <title>Slash Pit</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      background: #0a0706;
      color: #f3e8de;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #hud {
      position: fixed;
      left: 0; right: 0; top: 0;
      padding: calc(0.55rem + env(safe-area-inset-top, 0px)) 0.9rem 0.4rem;
      pointer-events: none;
      z-index: 2;
    }
    .hpwrap {
      height: 14px;
      border-radius: 99px;
      background: #1a1010;
      border: 1px solid #3a2018;
      overflow: hidden;
    }
    .hpfill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #9b1d20, #e85d04);
      transform-origin: left center;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 0.35rem;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #c4b4a4;
    }
    #hptext { font-variant-numeric: tabular-nums; }
    #toast {
      position: fixed;
      left: 50%;
      top: calc(4.1rem + env(safe-area-inset-top, 0px));
      transform: translateX(-50%) translateY(-8px);
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      background: rgba(20,10,8,0.88);
      border: 1px solid #5a3a20;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      opacity: 0;
      pointer-events: none;
      z-index: 3;
      white-space: nowrap;
      max-width: 92vw;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: opacity 0.12s linear, transform 0.12s ease;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #overlay {
      position: fixed;
      inset: 0 0 calc(150px + env(safe-area-inset-bottom, 0px)) 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem 1.25rem 1rem;
      background: radial-gradient(ellipse at center, rgba(6,3,3,0.82) 0%, rgba(6,3,3,0.48) 62%, rgba(6,3,3,0.34) 100%);
      z-index: 4;
    }
    #overlay.hidden { display: none; }
    #hud.off { visibility: hidden; }
    #overlay h1 {
      margin: 0;
      font-size: clamp(2.4rem, 12vw, 3.6rem);
      letter-spacing: 0.08em;
      line-height: 0.95;
      text-shadow: 0 0 24px #e85d0466, 0 4px 0 #3a0c08;
    }
    #overlay h2 {
      margin: 0;
      font-size: clamp(1.8rem, 9vw, 2.6rem);
      letter-spacing: 0.06em;
    }
    #overlay p {
      margin: 0.7rem 0 0;
      color: #c4b4a4;
      line-height: 1.45;
      max-width: 22rem;
    }
    #overlay .recap {
      margin-top: 0.85rem;
      font-size: 0.86rem;
      color: #e8d5c0;
      max-height: 28vh;
      overflow: auto;
      line-height: 1.55;
    }
    .btn {
      margin-top: 1.5rem;
      min-height: 3.3rem;
      min-width: 13.5rem;
      padding: 0.9rem 2rem;
      border: 0;
      border-radius: 999px;
      background: #e85d04;
      color: #1a0800;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 0.04em;
      touch-action: manipulation;
    }
    .btn:active { transform: scale(0.98); }
    #hint { display: none; }

    /* ===== Game Boy SP control deck ===== */
    #gbsp {
      --dp: 108px;
      --bt: 60px;
      --arm: calc(var(--dp) / 3);
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 5;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }
    #gbsp * { touch-action: none; -webkit-user-select: none; user-select: none; }
    .gb-lip {
      height: 6px;
      background:
        linear-gradient(#3a3028 0 2px, #1a1410 2px 4px, #0a0806 4px 6px);
      box-shadow: 0 -2px 0 #080604;
    }
    .gb-tray {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 20px 18px 12px;
      background-color: rgba(14, 10, 9, 0.90);
      background-image:
        linear-gradient(180deg, rgba(255,220,180,0.05) 0 2px, transparent 2px 10px),
        repeating-linear-gradient(90deg, rgba(0,0,0,0.22) 0 2px, transparent 2px 4px),
        repeating-linear-gradient(0deg, rgba(0,0,0,0.14) 0 2px, transparent 2px 4px);
      border-top: 2px solid #2a2018;
      box-shadow: inset 0 2px 0 #4a3a30, inset 0 -2px 0 #080604;
    }
    .gb-legend {
      position: absolute;
      left: 0; right: 0; top: 6px;
      text-align: center;
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #8a7060;
      pointer-events: none;
      font-weight: 700;
    }
    .gb-screw {
      position: absolute;
      width: 8px; height: 8px;
      background: #2a221c;
      box-shadow: inset 2px 2px 0 #5a4a40, inset -2px -2px 0 #0a0806, 2px 2px 0 #0a0806;
      pointer-events: none;
    }
    .gb-screw.s1 { left: 8px; top: 10px; }
    .gb-screw.s2 { right: 8px; top: 10px; }
    .gb-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
    }
    .dpad {
      width: var(--dp);
      height: var(--dp);
      position: relative;
      filter: drop-shadow(0 4px 0 #080604);
    }
    .dpad-v, .dpad-h {
      position: absolute;
      background: #2c3036;
      box-shadow:
        inset 2px 2px 0 #5a616a,
        inset -2px -2px 0 #14161a,
        0 0 0 2px #0a0808;
    }
    .dpad-v {
      width: var(--arm);
      height: var(--dp);
      left: var(--arm);
      top: 0;
    }
    .dpad-h {
      width: var(--dp);
      height: var(--arm);
      left: 0;
      top: var(--arm);
    }
    .dpad-nub {
      position: absolute;
      width: 22px; height: 22px;
      left: calc(50% - 11px);
      top: calc(50% - 11px);
      background: #1a1c20;
      border-radius: 4px;
      box-shadow:
        inset 2px 2px 0 #4a5058,
        inset -2px -2px 0 #0c0c0e,
        0 0 0 2px #0a0808;
      z-index: 2;
    }
    .dpad-arr {
      position: absolute;
      z-index: 1;
      pointer-events: none;
      width: 0; height: 0;
    }
    .dpad-arr.u {
      left: calc(50% - 6px); top: 8px;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 8px solid #6a727c;
    }
    .dpad-arr.d {
      left: calc(50% - 6px); bottom: 8px;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid #6a727c;
    }
    .dpad-arr.l {
      left: 8px; top: calc(50% - 6px);
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-right: 8px solid #6a727c;
    }
    .dpad-arr.r {
      right: 8px; top: calc(50% - 6px);
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 8px solid #6a727c;
    }
    .dpad.press-u .dpad-v {
      box-shadow: inset 2px 4px 0 #14161a, inset -2px -2px 0 #3a4048, 0 0 0 2px #0a0808;
    }
    .dpad.press-d .dpad-v {
      box-shadow: inset 2px 2px 0 #3a4048, inset -2px -4px 0 #14161a, 0 0 0 2px #0a0808;
    }
    .dpad.press-l .dpad-h {
      box-shadow: inset 4px 2px 0 #14161a, inset -2px -2px 0 #3a4048, 0 0 0 2px #0a0808;
    }
    .dpad.press-r .dpad-h {
      box-shadow: inset 2px 2px 0 #3a4048, inset -4px -2px 0 #14161a, 0 0 0 2px #0a0808;
    }
    .dpad.press-u .dpad-arr.u { border-bottom-color: #c8d0d8; }
    .dpad.press-d .dpad-arr.d { border-top-color: #c8d0d8; }
    .dpad.press-l .dpad-arr.l { border-right-color: #c8d0d8; }
    .dpad.press-r .dpad-arr.r { border-left-color: #c8d0d8; }

    .gb-right {
      position: relative;
      width: 132px;
      height: var(--dp);
      margin-top: 10px;
    }
    .gb-btn {
      position: absolute;
      width: var(--bt);
      height: var(--bt);
      border: 0;
      padding: 0;
      color: #1a0800;
      font-weight: 900;
      font-size: 15px;
      letter-spacing: 0.06em;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      line-height: var(--bt);
      text-align: center;
      cursor: pointer;
      image-rendering: pixelated;
      border-radius: 50%;
      -webkit-tap-highlight-color: transparent;
    }
    .gb-btn:focus { outline: none; }
    .gb-a {
      right: 0; top: 0;
      background: #e85d04;
      box-shadow:
        0 0 0 3px #1a1008,
        0 0 0 5px #0a0706,
        inset 2px 2px 0 #ffb060,
        inset -2px -3px 0 #9a3400,
        0 4px 0 #3a1400;
      text-shadow: 0 2px 0 #9a3400;
    }
    .gb-b {
      left: 0; bottom: 4px;
      background: #8a9098;
      color: #1a1c20;
      box-shadow:
        0 0 0 3px #1a1008,
        0 0 0 5px #0a0706,
        inset 2px 2px 0 #c8cdd4,
        inset -2px -3px 0 #4a5058,
        0 4px 0 #2a2c30;
      text-shadow: 0 2px 0 #4a5058;
    }
    .gb-btn.pressed {
      transform: translateY(3px);
      filter: brightness(0.82);
    }
    .gb-a.pressed {
      box-shadow:
        0 0 0 3px #1a1008,
        0 0 0 5px #0a0706,
        inset 2px 3px 0 #9a3400,
        inset -2px -1px 0 #c85010,
        0 1px 0 #3a1400;
    }
    .gb-b.pressed {
      box-shadow:
        0 0 0 3px #1a1008,
        0 0 0 5px #0a0706,
        inset 2px 3px 0 #4a5058,
        inset -2px -1px 0 #6a7078,
        0 1px 0 #2a2c30;
    }
    .gb-start {
      align-self: flex-end;
      margin: 0 0 10px;
      width: 44px;
      height: 14px;
      border: 0;
      padding: 0;
      background: #2a2420;
      color: #6a5a50;
      font-size: 7px;
      font-weight: 800;
      letter-spacing: 0.14em;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      box-shadow: inset 2px 2px 0 #0a0806, inset -2px -2px 0 #4a3a30, 0 2px 0 #0a0806;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .gb-start:focus { outline: none; }
    .gb-start.pressed {
      color: #c4b4a4;
      box-shadow: inset 2px 2px 0 #0a0806, inset -1px -1px 0 #3a3028;
      transform: translateY(1px);
    }

    @media (max-height: 540px) {
      #gbsp { --dp: 84px; --bt: 48px; }
      .gb-legend { display: none; }
      .gb-tray { padding: 6px 14px 8px; }
      .gb-right { width: 108px; }
      .gb-btn { font-size: 13px; }
      .gb-start { display: none; }
      #overlay { inset: 0 0 calc(110px + env(safe-area-inset-bottom, 0px)) 0; }
    }
    @media (max-width: 340px) {
      #gbsp { --dp: 96px; --bt: 52px; }
      .gb-tray { padding: 8px 10px 10px; }
      .gb-right { width: 116px; }
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="hpwrap"><div class="hpfill" id="hpfill"></div></div>
    <div class="row">
      <span id="hptext">100 / 100</span>
      <span id="roomtext">ROOM 1 / 8</span>
    </div>
  </div>
  <div id="toast"></div>
  <div id="hint">D-PAD MOVE · A SLASH · B DODGE</div>
  <div id="gbsp">
    <div class="gb-lip"></div>
    <div class="gb-tray">
      <div class="gb-screw s1"></div>
      <div class="gb-screw s2"></div>
      <div class="gb-legend">D-PAD MOVE · A SLASH · B DODGE</div>
      <div class="gb-left">
        <div id="dpad" class="dpad">
          <div class="dpad-v"></div>
          <div class="dpad-h"></div>
          <div class="dpad-nub"></div>
          <div class="dpad-arr u"></div>
          <div class="dpad-arr d"></div>
          <div class="dpad-arr l"></div>
          <div class="dpad-arr r"></div>
        </div>
      </div>
      <button type="button" id="gbstart" class="gb-start">START</button>
      <div class="gb-right">
        <button type="button" id="btnB" class="gb-btn gb-b">B</button>
        <button type="button" id="btnA" class="gb-btn gb-a">A</button>
      </div>
    </div>
  </div>
  <div id="overlay">
    <h1>SLASH PIT</h1>
    <p>One thumb. Dash-strike. Grab loot. Don't get slammed.</p>
    <p id="bestline"></p>
    <button class="btn" id="enterbtn" type="button">TAP TO ENTER</button>
  </div>
  <script>
(function () {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const hpfill = document.getElementById("hpfill");
  const hptext = document.getElementById("hptext");
  const roomtext = document.getElementById("roomtext");
  const toastEl = document.getElementById("toast");
  const overlay = document.getElementById("overlay");
  const hint = document.getElementById("hint");
  const hud = document.getElementById("hud");
  const BEST_KEY = "slashpit-best";

  const RARITY = {
    junk:   { w: 40, label: "JUNK",   color: "#c4c0b8" },
    common: { w: 35, label: "COMMON", color: "#86efac" },
    rare:   { w: 18, label: "RARE",   color: "#7dd3fc" },
    epic:   { w: 7,  label: "EPIC",   color: "#d8b4fe" }
  };
  const WEAPONS = [
    { r: "junk", name: "Rusty Nail", dmg: 3 },
    { r: "junk", name: "Bent Spike", dmg: 4 },
    { r: "junk", name: "Dull Shard", dmg: 3 },
    { r: "common", name: "Iron Fang", dmg: 6 },
    { r: "common", name: "Pit Knife", dmg: 7 },
    { r: "common", name: "Bone Spike", dmg: 6 },
    { r: "rare", name: "Blood Axe", dmg: 12 },
    { r: "rare", name: "Ember Cleaver", dmg: 11 },
    { r: "rare", name: "Widow Blade", dmg: 13 },
    { r: "epic", name: "Hellfang", dmg: 18 },
    { r: "epic", name: "Soul Reaver", dmg: 16 },
    { r: "epic", name: "Ash Reaper", dmg: 17 }
  ];
  const ARMORS = [
    { r: "junk", name: "Rag Wrap", hp: 8 },
    { r: "junk", name: "Scrap Plate", hp: 10 },
    { r: "junk", name: "Twine Vest", hp: 8 },
    { r: "common", name: "Iron Hide", hp: 16 },
    { r: "common", name: "Bone Mail", hp: 18 },
    { r: "common", name: "Pit Leather", hp: 15 },
    { r: "rare", name: "Ember Plate", hp: 28 },
    { r: "rare", name: "Blood Mail", hp: 30 },
    { r: "rare", name: "Scale Guard", hp: 26 },
    { r: "epic", name: "Pit Carapace", hp: 45 },
    { r: "epic", name: "Infernal Shell", hp: 42 },
    { r: "epic", name: "Void Mail", hp: 40 }
  ];
  const RELICS = [
    { r: "junk", name: "Frayed Charm", stat: "crit", v: 0.03 },
    { r: "junk", name: "Lucky Pebble", stat: "leech", v: 0.04 },
    { r: "junk", name: "Worn Anklet", stat: "speed", v: 0.35 },
    { r: "common", name: "Swift Band", stat: "speed", v: 0.75 },
    { r: "common", name: "Crit Tooth", stat: "crit", v: 0.06 },
    { r: "common", name: "Leech Chip", stat: "leech", v: 0.06 },
    { r: "rare", name: "Leech Stone", stat: "leech", v: 0.10 },
    { r: "rare", name: "Ghost Step", stat: "dodge", v: 0.18 },
    { r: "rare", name: "Ember Band", stat: "speed", v: 1.1 },
    { r: "epic", name: "Pit Crown", stat: "crit", v: 0.12 },
    { r: "epic", name: "Void Heart", stat: "leech", v: 0.16 },
    { r: "epic", name: "Ash Greaves", stat: "speed", v: 1.5 },
    { r: "epic", name: "Blink Dust", stat: "dodge", v: 0.28 }
  ];

  /* speed relics were +px/s; now tile-units/s so values are scaled down */

  let W = 390, H = 844, dpr = 1;
  let TILE = 32, COLS = 11, ROWS = 15, mapX = 0, mapY = 0, mapW = 0, mapH = 0;
  let MAP = [];
  let THEME = null;
  let phase = "title";
  let room = 1;
  let last = 0;
  let shake = 0;
  let flash = 0;
  let banner = { t: 0, text: "" };
  let toastT = 0;
  let pid = 0;
  let tick = 0;
  let spawnTile = { x: 5.5, y: 12.5 };
  let doorTile = { x: 5.5, y: 1.5 };

  const player = {};
  let enemies = [];
  let gems = [];
  let chest = null;
  let exitGate = null;
  let floats = [];
  let parts = [];
  let embers = [];
  let recap = [];
  let slots = { weapon: null, armor: null };
  let titleMobs = [];
  let tileCache = {};
  let spr = {};
  let torches = [];
  let ghosts = [];
  let lightCvs = null, lightCtx = null;

  const ptr = { down: false, x: 0, y: 0, sx: 0, sy: 0, t: 0, id: null };
  const pad = { x: 0, y: 0, id: null, a: false, b: false };
  const keys = { u: false, d: false, l: false, r: false, a: false, b: false };
  const lastStick = { x: 1, y: 0 };
  let stickWasOn = false;

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function pick(a) { return a[(Math.random() * a.length) | 0]; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }

  function bestRoom() {
    try { return +localStorage.getItem(BEST_KEY) || 0; } catch (e) { return 0; }
  }
  function saveBest(n) {
    try {
      const p = bestRoom();
      if (n > p) localStorage.setItem(BEST_KEY, String(n));
    } catch (e) {}
  }

  function viewSize() {
    const vv = window.visualViewport;
    return { w: vv ? vv.width : window.innerWidth, h: vv ? vv.height : window.innerHeight };
  }

  /* ========== PIXEL SPRITES ========== */
  const PAL = {
    ".": null,
    " ": null,
    "k": [12, 10, 12],
    "K": [36, 28, 30],
    "s": [78, 90, 104],
    "S": [132, 148, 164],
    "h": [210, 222, 232],
    "c": [14, 100, 122],
    "C": [34, 211, 238],
    "w": [224, 252, 255],
    "b": [36, 24, 72],
    "B": [68, 46, 118],
    "o": [168, 72, 28],
    "O": [110, 48, 20],
    "g": [42, 168, 78],
    "G": [18, 88, 42],
    "l": [110, 230, 150],
    "e": [92, 36, 18],
    "E": [176, 72, 32],
    "r": [212, 104, 48],
    "R": [168, 22, 28],
    "d": [88, 10, 14],
    "y": [251, 191, 36],
    "q": [255, 80, 60],
    "f": [255, 120, 36],
    "F": [255, 210, 90],
    "m": [72, 58, 52],
    "M": [96, 78, 70],
    "t": [128, 108, 96],
    "a": [96, 58, 28],
    "A": [176, 104, 36],
    "p": [255, 255, 255]
  };

  function bake(rows) {
    const h = rows.length, w = rows[0].length;
    const c = document.createElement("canvas");
    const f = document.createElement("canvas");
    c.width = f.width = w;
    c.height = f.height = h;
    const g = c.getContext("2d");
    const gf = f.getContext("2d");
    const img = g.createImageData(w, h);
    const fl = gf.createImageData(w, h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const col = PAL[rows[y][x]];
        if (!col) continue;
        const i = (y * w + x) * 4;
        img.data[i] = col[0]; img.data[i+1] = col[1]; img.data[i+2] = col[2]; img.data[i+3] = 255;
        fl.data[i] = 255; fl.data[i+1] = 255; fl.data[i+2] = 255; fl.data[i+3] = 255;
      }
    }
    g.putImageData(img, 0, 0);
    gf.putImageData(fl, 0, 0);
    return { c: c, f: f, w: w, h: h };
  }

  function bakeGem(hex) {
    const n = parseInt(hex.slice(1), 16);
    const rgb = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    const hi = [clamp(rgb[0] + 50, 0, 255), clamp(rgb[1] + 50, 0, 255), clamp(rgb[2] + 50, 0, 255)];
    const rows = [
      "........",
      "...k....",
      "..kCk...",
      ".kCCCk..",
      "kCCCCCCk",
      ".kCCCk..",
      "..kCk...",
      "...k...."
    ];
    const h = 8, w = 8;
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const g = c.getContext("2d");
    const img = g.createImageData(w, h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const ch = rows[y][x];
        if (ch === ".") continue;
        const col = ch === "k" ? [12, 10, 12] : (ch === "C" && (x + y) % 3 === 0 ? hi : rgb);
        const i = (y * w + x) * 4;
        img.data[i] = col[0]; img.data[i+1] = col[1]; img.data[i+2] = col[2]; img.data[i+3] = 255;
      }
    }
    g.putImageData(img, 0, 0);
    return { c: c, f: c, w: w, h: h };
  }

  function seeded(n) {
    let s = (n * 1103515245 + 12345) & 0x7fffffff;
    return function () {
      s = (s * 1103515245 + 12345) & 0x7fffffff;
      return s / 0x7fffffff;
    };
  }

  function makeTile(kind, theme, variant) {
    const c = document.createElement("canvas");
    c.width = 16; c.height = 16;
    const g = c.getContext("2d");
    const rand = seeded(variant * 97 + kind.length * 13 + theme.floor[0].charCodeAt(1));
    function p(x, y, col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); }
    if (kind === "floor") {
      const cols = theme.floor;
      g.fillStyle = cols[variant % cols.length];
      g.fillRect(0, 0, 16, 16);
      g.fillStyle = cols[(variant + 1) % cols.length];
      g.fillRect(1, 1, 6, 6);
      g.fillRect(9, 8, 6, 6);
      g.fillStyle = cols[(variant + 2) % cols.length];
      g.fillRect(9, 1, 6, 5);
      g.fillRect(1, 9, 6, 5);
      g.fillStyle = cols[3];
      g.fillRect(0, 0, 16, 1);
      g.fillRect(0, 7, 16, 1);
      g.fillRect(0, 15, 16, 1);
      g.fillRect(0, 0, 1, 16);
      g.fillRect(8, 0, 1, 16);
      g.fillRect(15, 0, 1, 16);
      for (let i = 0; i < 10; i++) p((rand() * 16) | 0, (rand() * 16) | 0, cols[(i + variant) % cols.length]);
      if (variant === 2) {
        g.fillStyle = "rgba(0,0,0,0.35)";
        g.fillRect(3, 3, 1, 5); g.fillRect(3, 6, 4, 1); g.fillRect(6, 6, 1, 3);
      }
      if (variant === 3) {
        g.fillStyle = "rgba(90,12,12,0.4)";
        g.fillRect(10, 10, 3, 2); g.fillRect(11, 9, 2, 3);
      }
    } else if (kind === "wall") {
      const cols = theme.wall;
      g.fillStyle = cols[1];
      g.fillRect(0, 0, 16, 16);
      const shift = (variant % 2) * 8;
      const rowsY = [0, 5, 10, 15];
      g.fillStyle = cols[0];
      for (let i = 0; i < rowsY.length; i++) g.fillRect(0, rowsY[i], 16, 1);
      g.fillRect(shift, 0, 1, 5);
      g.fillRect((shift + 8) % 16, 5, 1, 5);
      g.fillRect(shift, 10, 1, 5);
      g.fillStyle = cols[3];
      g.fillRect(0, 0, 16, 2);
      g.fillStyle = cols[2];
      g.fillRect(1, 1, 14, 1);
      for (let i = 0; i < 14; i++) p((rand() * 16) | 0, (rand() * 16) | 0, cols[2 + (i % 2) % cols.length]);
      g.fillStyle = "rgba(0,0,0,0.25)";
      g.fillRect(0, 14, 16, 2);
    } else if (kind === "rug") {
      g.fillStyle = theme.rug[2];
      g.fillRect(0, 0, 16, 16);
      g.fillStyle = theme.rug[0];
      g.fillRect(1, 1, 14, 14);
      g.fillStyle = theme.rug[1];
      g.fillRect(3, 3, 10, 10);
      g.fillStyle = theme.rug[2];
      g.fillRect(7, 1, 2, 14);
      g.fillRect(1, 7, 14, 2);
    } else if (kind === "grate") {
      g.fillStyle = theme.grate[0];
      g.fillRect(0, 0, 16, 16);
      g.fillStyle = theme.grate[1];
      for (let y = 2; y < 16; y += 4)
        for (let x = 2; x < 16; x += 4) g.fillRect(x, y, 2, 2);
      g.fillStyle = theme.grate[2];
      g.fillRect(0, 0, 16, 1);
      g.fillRect(0, 0, 1, 16);
    } else if (kind === "ritual") {
      g.fillStyle = theme.floor[0];
      g.fillRect(0, 0, 16, 16);
      g.fillStyle = theme.ritual[0];
      g.fillRect(1, 1, 14, 14);
      g.fillStyle = theme.ritual[1];
      g.fillRect(3, 3, 10, 10);
      g.fillStyle = theme.ritual[2];
      g.fillRect(0, 7, 16, 1);
      g.fillRect(7, 0, 1, 16);
      p(2, 2, theme.ritual[2]); p(13, 2, theme.ritual[2]);
      p(2, 13, theme.ritual[2]); p(13, 13, theme.ritual[2]);
      p(7, 3, theme.ritual[2]); p(8, 3, theme.ritual[2]);
      p(4, 12, theme.ritual[2]); p(11, 12, theme.ritual[2]);
      p(7, 7, theme.ritual[2]); p(8, 8, theme.ritual[2]);
    } else if (kind === "door") {
      g.fillStyle = "#080404";
      g.fillRect(0, 0, 16, 16);
      g.fillStyle = theme.wall[2];
      g.fillRect(0, 0, 3, 16);
      g.fillRect(13, 0, 3, 16);
      g.fillStyle = theme.wall[3];
      g.fillRect(0, 0, 16, 2);
    }
    return c;
  }

  function tilesFor(themeName) {
    if (tileCache[themeName]) return tileCache[themeName];
    const th = THEMES[themeName];
    const pack = {
      floor: [0, 1, 2, 3].map(function (i) { return makeTile("floor", th, i); }),
      wall: [0, 1, 2, 3].map(function (i) { return makeTile("wall", th, i); }),
      rug: makeTile("rug", th, 0),
      grate: makeTile("grate", th, 0),
      ritual: makeTile("ritual", th, 1),
      door: makeTile("door", th, 0)
    };
    tileCache[themeName] = pack;
    return pack;
  }

  function roomMeta(n) {
    if (n === 1) return { layout: "hall", theme: "ember" };
    if (n === 2) return { layout: "hall", theme: "ember" };
    if (n === 3) return { layout: "chamber", theme: "moss" };
    if (n === 4) return { layout: "chamber", theme: "moss" };
    if (n === 5) return { layout: "chamber", theme: "blood" };
    if (n === 6) return { layout: "pillars", theme: "blood" };
    if (n === 7) return { layout: "pillars", theme: "ash" };
    return { layout: "arena", theme: "hell" };
  }

  function isSolidChar(ch) {
    return ch === "#" || ch === "*" || ch === "P";
  }

  function buildMap(n) {
    const meta = roomMeta(n || 1);
    THEME = THEMES[meta.theme];
    THEME._name = meta.theme;
    MAP = LAYOUTS[meta.layout].map(function (row) { return row.split(""); });
    /* fix arena row that may be ragged */
    const width = MAP.reduce(function (m, r) { return Math.max(m, r.length); }, 0);
    MAP = MAP.map(function (r) {
      while (r.length < width) r.push("#");
      return r.slice(0, width);
    });
    COLS = MAP[0].length;
    ROWS = MAP.length;
    spawnTile = { x: COLS * 0.5, y: ROWS - 2.5 };
    doorTile = { x: COLS * 0.5, y: 1.5 };
    torches = [];
    for (let ty = 0; ty < ROWS; ty++) {
      for (let tx = 0; tx < COLS; tx++) {
        if (MAP[ty][tx] === "S") spawnTile = { x: tx + 0.5, y: ty + 0.5 };
        if (MAP[ty][tx] === "D") doorTile = { x: tx + 0.5, y: ty + 0.5 };
        if (MAP[ty][tx] === "*") torches.push({ x: tx + 0.5, y: ty + 0.22 });
      }
    }
    fitMap();
  }

  function fitMap() {
    if (!MAP.length) return;
    const topPad = 86 + (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("env(safe-area-inset-top)")) || 0);
    const deck = document.getElementById("gbsp");
    const botPad = deck ? Math.max(148, deck.offsetHeight) : 168;
    let t = Math.floor(Math.min((W - 8) / COLS, (H - topPad - botPad) / ROWS));
    t = Math.max(16, t - (t % 2));
    TILE = t;
    mapW = COLS * TILE;
    mapH = ROWS * TILE;
    mapX = Math.floor((W - mapW) / 2);
    mapY = Math.floor(topPad + Math.max(0, (H - topPad - botPad - mapH) / 2));
  }

  function solidAt(x, y) {
    const tx = Math.floor(x), ty = Math.floor(y);
    if (ty < 0 || ty >= ROWS || tx < 0 || tx >= COLS) return true;
    return isSolidChar(MAP[ty][tx]);
  }

  function blockedBox(x, y, r) {
    return solidAt(x - r, y - r) || solidAt(x + r, y - r) || solidAt(x - r, y + r) || solidAt(x + r, y + r) || solidAt(x, y);
  }

  function clampToWalkable(x, y) {
    x = clamp(x, 0.35, COLS - 0.35);
    y = clamp(y, 0.35, ROWS - 0.35);
    if (!solidAt(x, y)) return { x: x, y: y };
    let best = { x: spawnTile.x, y: spawnTile.y }, bd = 99;
    for (let ty = 0; ty < ROWS; ty++) {
      for (let tx = 0; tx < COLS; tx++) {
        if (isSolidChar(MAP[ty][tx])) continue;
        const cx = tx + 0.5, cy = ty + 0.5;
        const d = Math.hypot(cx - x, cy - y);
        if (d < bd) { bd = d; best = { x: cx, y: cy }; }
      }
    }
    return best;
  }

  function resolve(e) {
    const r = e.cr || 0.28;
    if (!blockedBox(e.x, e.y, r)) return;
    if (!blockedBox(e.x, e.y, 0.05)) {
      if (solidAt(e.x + r, e.y)) e.x = Math.floor(e.x + r) - r - 0.01;
      if (solidAt(e.x - r, e.y)) e.x = Math.floor(e.x - r) + 1 + r + 0.01;
      if (solidAt(e.x, e.y + r)) e.y = Math.floor(e.y + r) - r - 0.01;
      if (solidAt(e.x, e.y - r)) e.y = Math.floor(e.y - r) + 1 + r + 0.01;
      return;
    }
    const c = clampToWalkable(e.x, e.y);
    e.x = c.x; e.y = c.y;
  }

  function tryMove(e, nx, ny) {
    const r = e.cr || 0.28;
    if (!blockedBox(nx, ny, r)) { e.x = nx; e.y = ny; return; }
    if (!blockedBox(nx, e.y, r)) { e.x = nx; return; }
    if (!blockedBox(e.x, ny, r)) { e.y = ny; return; }
  }

  function keepInArena() {
    resolve(player);
    enemies.forEach(resolve);
  }

  function resize() {
    const v = viewSize();
    W = v.w; H = v.h;
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
    fitMap();
    if (phase === "fight" || phase === "loot") keepInArena();
  }

  function sx(x) { return mapX + x * TILE; }
  function sy(y) { return mapY + y * TILE; }
  function screenToWorld(px, py) {
    return { x: (px - mapX) / TILE, y: (py - mapY) / TILE };
  }

  function resetPlayer() {
    Object.assign(player, {
      x: spawnTile.x, y: spawnTile.y, tx: null, ty: null,
      r: 0.42, cr: 0.28, hp: 100, maxhp: 100, dmg: 14,
      speed: 5.8, crit: 0.08, leech: 0,
      slashR: 2.05, slashCd: 0, slashAnim: 0,
      dodgeCd: 0, dodgeMax: 0.65, dodging: 0,
      iframes: 0.45, vx: 0, vy: 0, face: 0,
      dash: null, flash: 0, dead: false, walkT: 0, flip: false
    });
    slots = { weapon: null, armor: null };
    recap = [];
  }

  function rollRarity(min) {
    const order = ["junk", "common", "rare", "epic"];
    const minI = min ? order.indexOf(min) : 0;
    let pool = [];
    let total = 0;
    for (let i = minI; i < order.length; i++) {
      const id = order[i];
      pool.push({ id: id, w: RARITY[id].w });
      total += RARITY[id].w;
    }
    let n = Math.random() * total;
    for (let i = 0; i < pool.length; i++) {
      n -= pool[i].w;
      if (n <= 0) return pool[i].id;
    }
    return pool[pool.length - 1].id;
  }

  function makeItem(min) {
    const r = rollRarity(min);
    const kind = pick(["weapon", "armor", "relic"]);
    const table = kind === "weapon" ? WEAPONS : kind === "armor" ? ARMORS : RELICS;
    const pool = table.filter(function (it) { return it.r === r; });
    const base = pick(pool.length ? pool : table);
    return Object.assign({ kind: kind, rarity: r }, base);
  }

  function itemBonus(it) {
    if (it.kind === "weapon") return "+" + it.dmg + " dmg";
    if (it.kind === "armor") return "+" + it.hp + " hp";
    if (it.stat === "speed") return "+" + it.v + " spd";
    if (it.stat === "crit") return "+" + Math.round(it.v * 100) + "% crit";
    if (it.stat === "leech") return "+" + Math.round(it.v * 100) + "% leech";
    if (it.stat === "dodge") return "-" + Math.round(it.v * 100) + "% dodge cd";
    return "";
  }

  function applyItem(it) {
    let used = true;
    if (it.kind === "weapon") {
      if (slots.weapon && it.dmg <= slots.weapon.dmg) {
        player.dmg += Math.max(1, (it.dmg * 0.4) | 0);
        used = "auto";
      } else {
        if (slots.weapon) player.dmg -= slots.weapon.dmg;
        player.dmg += it.dmg;
        slots.weapon = it;
      }
    } else if (it.kind === "armor") {
      if (slots.armor && it.hp <= slots.armor.hp) {
        const add = Math.max(2, (it.hp * 0.4) | 0);
        player.maxhp += add;
        player.hp += add;
        used = "auto";
      } else {
        const prev = slots.armor ? slots.armor.hp : 0;
        const diff = it.hp - prev;
        player.maxhp += diff;
        player.hp += Math.max(0, diff);
        slots.armor = it;
      }
    } else {
      if (it.stat === "speed") player.speed += it.v;
      if (it.stat === "crit") player.crit += it.v;
      if (it.stat === "leech") player.leech += it.v;
      if (it.stat === "dodge") player.dodgeMax = Math.max(0.28, player.dodgeMax * (1 - it.v));
    }
    recap.push(RARITY[it.rarity].label + " · " + it.name);
    showToast(RARITY[it.rarity].label + " · " + it.name + "  " + itemBonus(it), RARITY[it.rarity].color);
    return used;
  }

  function showToast(msg, color) {
    toastEl.textContent = msg;
    toastEl.style.color = color || "#f3e8de";
    toastEl.style.borderColor = color || "#5a3a20";
    toastEl.classList.add("show");
    toastT = 1.4;
  }

  function spawnGem(x, y, item) {
    const c = clampToWalkable(x, y);
    gems.push({
      x: c.x, y: c.y, item: item, t: 0, hop: 0.35,
      color: RARITY[item.rarity].color,
      rarity: item.rarity
    });
  }

  function pickup(g) {
    applyItem(g.item);
    burst(g.x, g.y, g.color, 10);
    gems = gems.filter(function (x) { return x !== g; });
  }

  function enemyDef(type) {
    if (type === "slime") return { type: "slime", hp: 22, dmg: 8, speed: 1.95, r: 0.38, cr: 0.26, range: 0.78, cd: 0.9 };
    if (type === "brute") return { type: "brute", hp: 48, dmg: 14, speed: 1.28, r: 0.55, cr: 0.36, range: 0.98, cd: 1.15 };
    return { type: "boss", hp: 220, dmg: 22, speed: 1.48, r: 0.82, cr: 0.48, range: 1.18, cd: 1.05, slam: 3 };
  }

  function spawnEnemy(type, x, y, fast) {
    const d = enemyDef(type);
    const c = clampToWalkable(x, y);
    const e = Object.assign({}, d, {
      x: c.x, y: c.y, maxhp: d.hp, atk: 0, wind: 0,
      flash: 0, slamT: d.slam || 0, slam: null, bob: rnd(0, 6.2), flip: false
    });
    if (fast) e.speed *= 1.2;
    enemies.push(e);
  }

  function roomPlan(n) {
    if (n === 1 || n === 2) return { list: ["slime", "slime"], fast: false, chest: false };
    if (n === 3) return { list: ["slime", "slime", "brute"], fast: false, chest: true };
    if (n === 4) return { list: ["slime", "brute", "brute"], fast: false, chest: false };
    if (n === 5) return { list: ["slime", "slime", "brute", "brute"], fast: true, chest: false };
    if (n === 6) return { list: ["slime", "slime", "brute", "brute"], fast: true, chest: true };
    if (n === 7) return { list: ["brute", "brute", "brute"], fast: false, chest: false };
    return { list: ["boss"], fast: false, chest: false };
  }

  function startRoom(n) {
    room = n;
    phase = "fight";
    titleMobs = [];
    ghosts = [];
    buildMap(n);
    enemies = [];
    gems = [];
    chest = null;
    exitGate = null;
    player.x = spawnTile.x; player.y = spawnTile.y;
    player.tx = null; player.ty = null; player.dash = null;
    player.iframes = Math.max(player.iframes, 0.4);
    player.vx = 0; player.vy = 0;
    const plan = roomPlan(n);
    const count = plan.list.length;
    for (let i = 0; i < count; i++) {
      const ang = -Math.PI / 2 + (i - (count - 1) / 2) * 0.85;
      const rad = 1.8 + count * 0.15;
      spawnEnemy(
        plan.list[i],
        COLS * 0.5 + Math.cos(ang) * rad,
        ROWS * 0.38 + Math.sin(ang) * 0.9,
        plan.fast
      );
    }
    if (plan.chest) {
      const side = n === 3 ? 2.5 : COLS - 2.5;
      const p = clampToWalkable(side, ROWS * 0.58);
      chest = { x: p.x, y: p.y, open: false, t: 0 };
    }
    banner = { t: 1.1, text: n === 8 ? "PIT LORD" : "ROOM " + n };
    syncHud();
  }

  function clearRoom() {
    phase = "loot";
    spawnGem(COLS * 0.5 + rnd(-0.8, 0.8), ROWS * 0.48 + rnd(-0.5, 0.5), makeItem());
    if (Math.random() < 0.3) {
      spawnGem(COLS * 0.5 + rnd(-1.4, 1.4), ROWS * 0.42 + rnd(-0.4, 0.4), makeItem());
    }
    if (chest && !chest.open) {
      chest.open = true;
      chest.t = 0.5;
      spawnGem(chest.x, chest.y - 0.45, makeItem("rare"));
      burst(chest.x, chest.y, "#fbbf24", 14);
    }
    exitGate = { x: doorTile.x, y: doorTile.y };
    banner = { t: 0.7, text: "CLEAR" };
  }

  function nextRoom() {
    gems.forEach(function (g) { applyItem(g.item); });
    gems = [];
    if (room >= 8) { winRun(); return; }
    startRoom(room + 1);
  }

  function killEnemy(e) {
    burst(e.x, e.y, e.type === "slime" ? "#4ade80" : e.type === "brute" ? "#c2410c" : "#9b1d20", e.type === "boss" ? 22 : 12);
    floats.push({ x: e.x, y: e.y - 0.4, t: 0.7, text: "POP", col: "#ffe8a3" });
    shake = Math.max(shake, e.type === "boss" ? 10 : 5);
    enemies = enemies.filter(function (x) { return x !== e; });
    if (e.type === "boss") {
      applyItem(Object.assign({ kind: "weapon", rarity: "epic" }, pick(WEAPONS.filter(function (i) { return i.r === "epic"; }))));
      applyItem(makeItem("rare"));
      winRun();
      return;
    }
    if (!enemies.length && phase === "fight") clearRoom();
  }

  function hurtPlayer(dmg, ox, oy) {
    if (player.iframes > 0 || player.dead) return;
    player.hp -= dmg;
    player.iframes = 0.35;
    player.flash = 0.18;
    flash = 0.12;
    shake = Math.max(shake, 7);
    const len = Math.hypot(ox, oy) || 1;
    tryMove(player, player.x + (ox / len) * 0.7, player.y + (oy / len) * 0.7);
    player.dash = null;
    floats.push({ x: player.x, y: player.y - 0.7, t: 0.7, text: "" + dmg, col: "#fda4af" });
    if (player.hp <= 0) {
      player.hp = 0;
      player.dead = true;
      dieRun();
    }
    syncHud();
  }

  function doSlash(target) {
    if (player.slashCd > 0) return;
    player.slashCd = 0.28;
    player.slashAnim = 1;
    player.face = Math.atan2(target.y - player.y, target.x - player.x);
    player.flip = target.x < player.x;
    const crit = Math.random() < player.crit;
    let dmg = player.dmg * (crit ? 1.6 : 1);
    dmg = Math.round(dmg);
    hitEnemy(target, dmg, crit);
    enemies.forEach(function (e) {
      if (e === target) return;
      if (dist(e.x, e.y, target.x, target.y) < 1.25) hitEnemy(e, Math.max(1, (dmg * 0.5) | 0), false);
    });
  }

  function hitEnemy(e, dmg, crit) {
    e.hp -= dmg;
    e.flash = 0.12;
    const ang = Math.atan2(e.y - player.y, e.x - player.x);
    tryMove(e, e.x + Math.cos(ang) * 0.28, e.y + Math.sin(ang) * 0.28);
    if (player.leech > 0) {
      player.hp = Math.min(player.maxhp, player.hp + dmg * player.leech);
    }
    floats.push({
      x: e.x + rnd(-0.2, 0.2), y: e.y - e.r - 0.25, t: 0.75,
      text: crit ? dmg + "!" : "" + dmg,
      col: crit ? "#fde68a" : "#fff7ed"
    });
    burst(e.x, e.y, crit ? "#fde68a" : "#fb923c", crit ? 8 : 5);
    shake = Math.max(shake, crit ? 6 : 3);
    syncHud();
    if (e.hp <= 0) killEnemy(e);
  }

  function dashStrike(e) {
    player.dash = e;
    player.tx = e.x; player.ty = e.y;
    if (dist(player.x, player.y, e.x, e.y) <= player.slashR) doSlash(e);
  }

  function dodge(dx, dy) {
    if (player.dodgeCd > 0 || player.dead || phase === "title") return;
    const len = Math.hypot(dx, dy) || 1;
    player.vx = (dx / len) * 14.5;
    player.vy = (dy / len) * 14.5;
    player.iframes = Math.max(player.iframes, 0.22);
    player.dodgeCd = player.dodgeMax;
    player.dodging = 0.18;
    player.dash = null;
    player.tx = null;
    player.face = Math.atan2(dy, dx);
    player.flip = dx < 0;
    burst(player.x, player.y, "#67e8f9", 6);
    ghosts.push({ x: player.x, y: player.y, t: 0.2, flip: player.flip });
  }

  function stickNow() {
    let x = pad.x + (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
    let y = pad.y + (keys.d ? 1 : 0) - (keys.u ? 1 : 0);
    x = x < -1 ? -1 : x > 1 ? 1 : x;
    y = y < -1 ? -1 : y > 1 ? 1 : y;
    const on = x !== 0 || y !== 0;
    if (on && x && y) {
      const inv = 1 / Math.hypot(x, y);
      return { x: x * inv, y: y * inv, on: true };
    }
    return { x: x, y: y, on: on };
  }

  function refreshPadVisuals() {
    const dpad = document.getElementById("dpad");
    const aEl = document.getElementById("btnA");
    const bEl = document.getElementById("btnB");
    if (!dpad) return;
    const sx = pad.x + (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
    const sy = pad.y + (keys.d ? 1 : 0) - (keys.u ? 1 : 0);
    dpad.classList.toggle("press-u", sy < 0);
    dpad.classList.toggle("press-d", sy > 0);
    dpad.classList.toggle("press-l", sx < 0);
    dpad.classList.toggle("press-r", sx > 0);
    if (aEl) aEl.classList.toggle("pressed", pad.a || keys.a);
    if (bEl) bEl.classList.toggle("pressed", pad.b || keys.b);
  }

  function bestSlashTarget() {
    const fx = Math.cos(player.face), fy = Math.sin(player.face);
    const reach = player.slashR + 1.05;
    let best = null, score = 1e9;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const dx = e.x - player.x, dy = e.y - player.y;
      const raw = Math.hypot(dx, dy) || 0.001;
      const d = raw - e.r;
      if (d > reach) continue;
      const dot = (dx * fx + dy * fy) / raw;
      const s = d + (dot > 0.2 ? 0 : 1.55) + (dot > 0.55 ? -0.35 : 0);
      if (s < score) { score = s; best = e; }
    }
    return best;
  }

  function facingSlash() {
    if (player.slashCd > 0 || player.dead) return;
    if (phase !== "fight" && phase !== "loot") return;
    const fx = Math.cos(player.face), fy = Math.sin(player.face);
    player.flip = fx < 0;
    if (phase === "fight") {
      const t = bestSlashTarget();
      if (t && dist(player.x, player.y, t.x, t.y) <= player.slashR + 1.15) {
        dashStrike(t);
        if (dist(player.x, player.y, t.x, t.y) <= player.slashR) player.dash = null;
        return;
      }
    }
    player.slashCd = 0.28;
    player.slashAnim = 1;
    const hitR = player.slashR * 0.88;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const dx = e.x - player.x, dy = e.y - player.y;
      const d = Math.hypot(dx, dy) || 0.001;
      if (d > hitR + e.r) continue;
      if ((dx * fx + dy * fy) / d > 0.18) {
        const crit = Math.random() < player.crit;
        hitEnemy(e, Math.round(player.dmg * (crit ? 1.6 : 1)), crit);
      }
    }
    burst(player.x + fx * 0.55, player.y + fy * 0.55, "#fb923c", 4);
  }

  function padDodge() {
    const st = stickNow();
    let dx, dy;
    if (st.on) { dx = st.x; dy = st.y; }
    else if (lastStick.x !== 0 || lastStick.y !== 0) { dx = lastStick.x; dy = lastStick.y; }
    else { dx = Math.cos(player.face || 0); dy = Math.sin(player.face || 0); }
    dodge(dx, dy);
  }

  function syncHud() {
    const pct = player.maxhp ? clamp(player.hp / player.maxhp, 0, 1) : 0;
    hpfill.style.transform = "scaleX(" + pct + ")";
    hptext.textContent = Math.max(0, Math.ceil(player.hp)) + " / " + Math.ceil(player.maxhp);
    roomtext.textContent = "ROOM " + room + " / 8";
  }

  function startRun() {
    overlay.classList.add("hidden");
    hud.classList.remove("off");
    hint.style.opacity = "1";
    resetPlayer();
    startRoom(1);
    syncHud();
  }

  function dieRun() {
    phase = "dead";
    saveBest(room);
    hud.classList.add("off");
    hint.style.opacity = "0";
    overlay.classList.remove("hidden");
    overlay.innerHTML =
      "<h2>YOU DIED</h2>" +
      "<p>Room " + room + " / 8 · Best " + Math.max(room, bestRoom()) + "</p>" +
      (recap.length ? "<div class='recap'>" + recap.map(esc).join("<br>") + "</div>" : "<p>No loot this run.</p>") +
      "<button class='btn' id='again' type='button'>PLAY AGAIN</button>";
    document.getElementById("again").addEventListener("click", function (ev) {
      ev.stopPropagation();
      startRun();
    });
  }

  function winRun() {
    phase = "win";
    saveBest(8);
    hud.classList.add("off");
    hint.style.opacity = "0";
    overlay.classList.remove("hidden");
    overlay.innerHTML =
      "<h2>PIT CLEARED</h2>" +
      "<p>The Pit Lord is ash. Loot recap:</p>" +
      (recap.length ? "<div class='recap'>" + recap.map(esc).join("<br>") + "</div>" : "<p>Empty pockets, full glory.</p>") +
      "<button class='btn' id='again' type='button'>PLAY AGAIN</button>";
    document.getElementById("again").addEventListener("click", function (ev) {
      ev.stopPropagation();
      startRun();
    });
  }

  function esc(s) {
    return String(s).replace(/[&<>]/g, function (ch) {
      return ch === "&" ? "&amp;" : ch === "<" ? "&lt;" : "&gt;";
    });
  }

  function burst(x, y, col, n) {
    for (let i = 0; i < n; i++) {
      const a = rnd(0, Math.PI * 2);
      const s = rnd(1.2, 4.6);
      parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: rnd(0.25, 0.5), col: col, r: rnd(1, 2.4) });
    }
  }

  function tapAt(px, py) {
    if (phase !== "fight" && phase !== "loot") return;
    const w = screenToWorld(px, py);
    for (let i = gems.length - 1; i >= 0; i--) {
      if (dist(w.x, w.y, gems[i].x, gems[i].y) < 1.15) { pickup(gems[i]); return; }
    }
    if (phase === "loot" && exitGate && dist(w.x, w.y, exitGate.x, exitGate.y) < 1.5) {
      nextRoom();
      return;
    }
    if (phase === "fight") {
      let best = null, bd = 1.65;
      for (let i = 0; i < enemies.length; i++) {
        const d = dist(w.x, w.y, enemies[i].x, enemies[i].y) - enemies[i].r;
        if (d < bd) { bd = d; best = enemies[i]; }
      }
      if (best) { dashStrike(best); return; }
    }
    const c = clampToWalkable(w.x, w.y);
    player.tx = c.x; player.ty = c.y;
    player.dash = null;
  }

  function onPtrDown(e) {
    if (ptr.id !== null && ptr.id !== e.pointerId) return;
    ptr.down = true; ptr.id = e.pointerId;
    ptr.x = ptr.sx = e.clientX; ptr.y = ptr.sy = e.clientY; ptr.t = performance.now();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  }
  function onPtrMove(e) {
    if (!ptr.down || e.pointerId !== ptr.id) return;
    ptr.x = e.clientX; ptr.y = e.clientY;
    e.preventDefault();
  }
  function onPtrUp(e) {
    if (e.pointerId !== ptr.id) return;
    const dx = e.clientX - ptr.sx, dy = e.clientY - ptr.sy;
    const dt = performance.now() - ptr.t;
    ptr.down = false; ptr.id = null;
    if (phase === "title") return;
    if (phase === "dead" || phase === "win") return;
    if (Math.hypot(dx, dy) > 36 && dt < 420) dodge(dx, dy);
    else tapAt(e.clientX, e.clientY);
    e.preventDefault();
  }

  canvas.addEventListener("pointerdown", onPtrDown, { passive: false });
  canvas.addEventListener("pointermove", onPtrMove, { passive: false });
  canvas.addEventListener("pointerup", onPtrUp, { passive: false });
  canvas.addEventListener("pointercancel", onPtrUp, { passive: false });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });

  (function bindPad() {
    const dpad = document.getElementById("dpad");
    const aEl = document.getElementById("btnA");
    const bEl = document.getElementById("btnB");
    const startEl = document.getElementById("gbstart");
    const root = document.getElementById("gbsp");

    function halt(e) {
      e.preventDefault();
      e.stopPropagation();
    }

    function setDpadFromEvent(e) {
      const r = dpad.getBoundingClientRect();
      const dx = e.clientX - (r.left + r.width * 0.5);
      const dy = e.clientY - (r.top + r.height * 0.5);
      const dead = Math.max(10, r.width * 0.11);
      let x = 0, y = 0;
      if (Math.abs(dx) > dead) x = dx > 0 ? 1 : -1;
      if (Math.abs(dy) > dead) y = dy > 0 ? 1 : -1;
      if (!x && !y && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
        if (Math.abs(dx) >= Math.abs(dy)) x = dx > 0 ? 1 : -1;
        else y = dy > 0 ? 1 : -1;
      }
      pad.x = x; pad.y = y;
      if (x || y) { lastStick.x = x; lastStick.y = y; }
      refreshPadVisuals();
    }

    function clearDpad() {
      pad.x = 0; pad.y = 0; pad.id = null;
      refreshPadVisuals();
    }

    dpad.addEventListener("pointerdown", function (e) {
      halt(e);
      pad.id = e.pointerId;
      try { dpad.setPointerCapture(e.pointerId); } catch (err) {}
      setDpadFromEvent(e);
    }, { passive: false });
    dpad.addEventListener("pointermove", function (e) {
      if (pad.id !== e.pointerId) return;
      halt(e);
      setDpadFromEvent(e);
    }, { passive: false });
    function dpadUp(e) {
      if (pad.id !== null && e.pointerId !== pad.id) return;
      halt(e);
      clearDpad();
    }
    dpad.addEventListener("pointerup", dpadUp, { passive: false });
    dpad.addEventListener("pointercancel", dpadUp, { passive: false });

    function holdBtn(el, which) {
      el.addEventListener("pointerdown", function (e) {
        halt(e);
        try { el.setPointerCapture(e.pointerId); } catch (err) {}
        pad[which] = true;
        refreshPadVisuals();
        if (phase === "title" || phase === "dead" || phase === "win") { startRun(); return; }
        if (which === "a") facingSlash();
        else padDodge();
      }, { passive: false });
      function up(e) {
        halt(e);
        pad[which] = false;
        refreshPadVisuals();
      }
      el.addEventListener("pointerup", up, { passive: false });
      el.addEventListener("pointercancel", up, { passive: false });
    }
    holdBtn(aEl, "a");
    holdBtn(bEl, "b");

    startEl.addEventListener("pointerdown", function (e) {
      halt(e);
      startEl.classList.add("pressed");
      if (phase === "title" || phase === "dead" || phase === "win") startRun();
    }, { passive: false });
    function startUp(e) {
      halt(e);
      startEl.classList.remove("pressed");
    }
    startEl.addEventListener("pointerup", startUp, { passive: false });
    startEl.addEventListener("pointercancel", startUp, { passive: false });

    root.addEventListener("contextmenu", halt, { passive: false });
    root.addEventListener("touchstart", function (e) { e.preventDefault(); }, { passive: false });
  })();

  function keyDir(code, down) {
    if (code === "ArrowUp" || code === "KeyW") keys.u = down;
    else if (code === "ArrowDown" || code === "KeyS") keys.d = down;
    else if (code === "ArrowLeft" || code === "KeyA") keys.l = down;
    else if (code === "ArrowRight" || code === "KeyD") keys.r = down;
    else return false;
    if (down) {
      const st = stickNow();
      if (st.on) { lastStick.x = st.x; lastStick.y = st.y; }
    }
    refreshPadVisuals();
    return true;
  }

  window.addEventListener("keydown", function (e) {
    if (e.repeat && (e.code === "Space" || e.code === "KeyX" || e.code === "KeyK" || e.code === "KeyZ" || e.code === "KeyJ" || e.code === "Enter")) {
      e.preventDefault();
      return;
    }
    if (keyDir(e.code, true)) { e.preventDefault(); return; }
    const isA = e.code === "Space" || e.code === "KeyX" || e.code === "KeyK";
    const isB = e.code === "KeyZ" || e.code === "KeyJ";
    const isStart = e.code === "Enter";
    if (isA) {
      e.preventDefault();
      keys.a = true;
      refreshPadVisuals();
      if (phase === "title" || phase === "dead" || phase === "win") startRun();
      else facingSlash();
    } else if (isB) {
      e.preventDefault();
      keys.b = true;
      refreshPadVisuals();
      if (phase === "title" || phase === "dead" || phase === "win") startRun();
      else padDodge();
    } else if (isStart) {
      e.preventDefault();
      if (phase === "title" || phase === "dead" || phase === "win") startRun();
    }
  });
  window.addEventListener("keyup", function (e) {
    if (keyDir(e.code, false)) { e.preventDefault(); return; }
    if (e.code === "Space" || e.code === "KeyX" || e.code === "KeyK") {
      keys.a = false; refreshPadVisuals(); e.preventDefault();
    } else if (e.code === "KeyZ" || e.code === "KeyJ") {
      keys.b = false; refreshPadVisuals(); e.preventDefault();
    }
  });
  window.addEventListener("resize", resize);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);

  document.getElementById("enterbtn").addEventListener("click", function (e) {
    e.stopPropagation();
    startRun();
  });
  overlay.addEventListener("click", function () {
    if (phase === "title") startRun();
  });

  function update(dt) {
    tick += dt;
    if (toastT > 0) {
      toastT -= dt;
      if (toastT <= 0) toastEl.classList.remove("show");
    }
    if (banner.t > 0) banner.t -= dt;
    shake = Math.max(0, shake - dt * 22);
    flash = Math.max(0, flash - dt * 3);

    if (embers.length < 22) {
      embers.push({
        x: rnd(0, W), y: rnd(0, H * 0.7),
        vy: -rnd(8, 22), vx: rnd(-6, 6),
        t: rnd(1.5, 4), r: rnd(1, 2)
      });
    }
    for (let i = embers.length - 1; i >= 0; i--) {
      const m = embers[i];
      m.x += m.vx * dt; m.y += m.vy * dt; m.t -= dt;
      if (m.t <= 0) embers.splice(i, 1);
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.t -= dt; p.vy += 2.4 * dt;
      if (p.t <= 0) parts.splice(i, 1);
    }
    for (let i = floats.length - 1; i >= 0; i--) {
      floats[i].y -= 0.85 * dt; floats[i].t -= dt;
      if (floats[i].t <= 0) floats.splice(i, 1);
    }
    gems.forEach(function (g) { g.t += dt; });
    if (chest && chest.t > 0) chest.t -= dt;
    titleMobs.forEach(function (m) { m.bob += dt; });

    if (phase !== "fight" && phase !== "loot") return;
    if (player.dead) return;

    player.slashCd = Math.max(0, player.slashCd - dt);
    player.slashAnim = Math.max(0, player.slashAnim - dt * 3.4);
    player.dodgeCd = Math.max(0, player.dodgeCd - dt);
    player.iframes = Math.max(0, player.iframes - dt);
    player.flash = Math.max(0, player.flash - dt);

    let moving = false;
    if (player.dodging > 0) {
      player.dodging -= dt;
      tryMove(player, player.x + player.vx * dt, player.y + player.vy * dt);
      moving = true;
    } else {
      const st = stickNow();
      if (st.on) {
        lastStick.x = st.x; lastStick.y = st.y;
        player.face = Math.atan2(st.y, st.x);
        player.flip = st.x < 0;
        if (!player.dash) {
          player.tx = player.x + st.x * 1.55;
          player.ty = player.y + st.y * 1.55;
        }
      } else if (stickWasOn && !player.dash) {
        player.tx = null;
        player.ty = null;
      }
      stickWasOn = st.on;
      if (pad.a || keys.a) facingSlash();
      if (pad.b || keys.b) padDodge();
      refreshPadVisuals();

      if (player.dash && player.dash.hp > 0) {
        player.tx = player.dash.x; player.ty = player.dash.y;
        const d = dist(player.x, player.y, player.dash.x, player.dash.y);
        if (d <= player.slashR) {
          doSlash(player.dash);
          player.dash = null;
          player.tx = null;
        }
      } else if (player.dash && player.dash.hp <= 0) {
        player.dash = null;
      }
      if (player.tx != null) {
        const dx = player.tx - player.x, dy = player.ty - player.y;
        const d = Math.hypot(dx, dy);
        const spd = player.dash ? player.speed * 2.6 : player.speed;
        if (d < 0.12) { player.x = player.tx; player.y = player.ty; player.tx = null; }
        else {
          tryMove(player, player.x + (dx / d) * spd * dt, player.y + (dy / d) * spd * dt);
          player.face = Math.atan2(dy, dx);
          player.flip = dx < 0;
          moving = true;
        }
      }
    }
    if (moving) player.walkT += dt;
    else player.walkT = 0;

    for (let i = gems.length - 1; i >= 0; i--) {
      if (dist(player.x, player.y, gems[i].x, gems[i].y) < 0.72) pickup(gems[i]);
    }
    if (phase === "loot" && exitGate && dist(player.x, player.y, exitGate.x, exitGate.y) < 0.95) {
      nextRoom();
      return;
    }

    if (phase !== "fight") return;

    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      e.bob += dt;
      e.flash = Math.max(0, e.flash - dt);
      const dx = player.x - e.x, dy = player.y - e.y;
      const d = Math.hypot(dx, dy) || 1;
      e.flip = dx < 0;

      if (e.type === "boss") {
        if (!e.slam) {
          e.slamT -= dt;
          if (e.slamT <= 0) {
            e.slam = { x: player.x, y: player.y, t: 0.75, r: 2.15 };
            e.slamT = 3;
          }
        } else {
          e.slam.t -= dt;
          if (e.slam.t <= 0) {
            shake = Math.max(shake, 11);
            flash = 0.16;
            burst(e.slam.x, e.slam.y, "#ef4444", 16);
            if (dist(player.x, player.y, e.slam.x, e.slam.y) < e.slam.r + 0.22) {

            hurtPlayer(e.dmg, player.x - e.slam.x, player.y - e.slam.y);
            }
            e.slam = null;
          }
        }
      }

      if (e.wind > 0) {
        e.wind -= dt;
        if (e.wind <= 0) {
          if (dist(player.x, player.y, e.x, e.y) < e.range + player.r + 0.18) {
            hurtPlayer(e.dmg, player.x - e.x, player.y - e.y);
          }
          e.atk = e.cd;
        }
      } else {
        e.atk = Math.max(0, e.atk - dt);
        if (d > e.range + player.r * 0.4) {
          tryMove(e, e.x + (dx / d) * e.speed * dt, e.y + (dy / d) * e.speed * dt);
        } else if (e.atk <= 0 && !e.slam) {
          e.wind = e.type === "boss" ? 0.38 : 0.28;
        }
      }
      resolve(e);
    }

    for (let i = 0; i < enemies.length; i++) {
      for (let j = i + 1; j < enemies.length; j++) {
        const a = enemies[i], b = enemies[j];
        const d2 = dist(a.x, a.y, b.x, b.y);
        const min = a.r + b.r - 0.06;
        if (d2 < min && d2 > 0.01) {
          const nx = (b.x - a.x) / d2, ny = (b.y - a.y) / d2;
          const push = (min - d2) * 0.5;
          tryMove(a, a.x - nx * push, a.y - ny * push);
          tryMove(b, b.x + nx * push, b.y + ny * push);
        }
      }
    }
  }

  function padBottom(rows, h) {
    const w = rows[0].length;
    const empty = new Array(w + 1).join(".").slice(0, w);
    const trimmed = rows.slice();
    while (trimmed.length && trimmed[trimmed.length - 1].indexOf("k") < 0 && trimmed[trimmed.length - 1].indexOf("R") < 0 && trimmed[trimmed.length - 1].indexOf("E") < 0) {
      trimmed.pop();
    }
    while (trimmed.length < h) trimmed.unshift(empty);
    return trimmed.slice(-h);
  }

  function blit(s, wx, wy, flip, doFlash) {
    if (!s) return;
    const sc = TILE / 16;
    const dw = s.w * sc, dh = s.h * sc;
    const px = sx(wx) - dw / 2;
    const py = sy(wy) - dh + sc * 2;
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    if (flip) {
      ctx.translate(sx(wx), 0);
      ctx.scale(-1, 1);
      ctx.translate(-sx(wx), 0);
    }
    ctx.drawImage(s.c, px, py, dw, dh);
    if (doFlash) {
      ctx.globalAlpha = 0.9;
      ctx.drawImage(s.f, px, py, dw, dh);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    return { px: px, py: py, dw: dw, dh: dh };
  }

  function footShadow(wx, wy, span) {
    const w = span * TILE;
    ctx.fillStyle = "rgba(0,0,0,0.42)";
    ctx.fillRect(sx(wx) - w * 0.5, sy(wy) - 2, w, 3);
    ctx.fillStyle = "rgba(0,0,0,0.22)";
    ctx.fillRect(sx(wx) - w * 0.38, sy(wy) - 1, w * 0.76, 2);
  }

  function drawHpPip(wx, wy, hp, max, above) {
    const w = Math.max(18, TILE * 0.95), h = 4;
    const x = sx(wx) - w / 2, y = sy(wy) - above;
    ctx.fillStyle = "#0a0606";
    ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
    ctx.fillStyle = "#3a1510";
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = "#e85d04";
    ctx.fillRect(x, y, w * clamp(hp / max, 0, 1), h);
  }

  function isBorder(tx, ty) {
    return tx === 0 || ty === 0 || tx === COLS - 1 || ty === ROWS - 1;
  }

  function tileVar(tx, ty) {
    return (tx * 13 + ty * 29) & 3;
  }

  function drawTileImg(img, tx, ty) {
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, sx(tx), sy(ty), TILE, TILE);
  }

  function drawCracks(tx, ty) {
    const h = (tx * 928371 + ty * 193829) >>> 0;
    if ((h & 7) > 4) return;
    const x = sx(tx), y = sy(ty);
    ctx.fillStyle = "rgba(0,0,0,0.28)";
    const x0 = x + (h % (TILE - 6)) + 2;
    const y0 = y + ((h >> 4) % (TILE - 6)) + 2;
    ctx.fillRect(x0, y0, 1, 4);
    ctx.fillRect(x0, y0 + 2, 3, 1);
    if ((h & 3) === 0) ctx.fillRect(x0 + 2, y0 + 2, 1, 3);
  }

  function drawBlood(tx, ty) {
    if (!THEME || (THEME._name !== "blood" && THEME._name !== "hell" && THEME._name !== "ash")) {
      const h = (tx * 7 + ty * 17) >>> 0;
      if ((h & 15) !== 0) return;
    }
    const h = (tx * 48271 + ty * 11909) >>> 0;
    if (THEME && THEME._name === "ember" && (h & 7) > 1) return;
    if (THEME && THEME._name === "moss" && (h & 7) > 0) return;
    const x = sx(tx), y = sy(ty);
    ctx.fillStyle = THEME && THEME._name === "moss" ? "rgba(40,70,20,0.35)" : "rgba(120,16,16,0.4)";
    const x0 = x + (h % (TILE - 5));
    const y0 = y + ((h >> 5) % (TILE - 5));
    ctx.fillRect(x0, y0, 3, 2);
    ctx.fillRect(x0 + 1, y0 - 1, 2, 3);
    ctx.fillRect(x0 + 2, y0 + 1, 2, 1);
  }

  function drawSlamZone(slam) {
    if (!slam) return;
    const k = 1 - slam.t / 0.75;
    const r = slam.r;
    const pulse = 0.35 + k * 0.55;
    for (let ty = 0; ty < ROWS; ty++) {
      for (let tx = 0; tx < COLS; tx++) {
        if (isSolidChar(MAP[ty][tx])) continue;
        const cx = tx + 0.5, cy = ty + 0.5;
        if (Math.hypot(cx - slam.x, cy - slam.y) > r) continue;
        ctx.fillStyle = "rgba(180,16,16," + (0.16 + pulse * 0.28) + ")";
        ctx.fillRect(sx(tx), sy(ty), TILE, TILE);
        ctx.fillStyle = "rgba(255,60,50," + (0.2 + pulse * 0.35) + ")";
        ctx.fillRect(sx(tx) + 1, sy(ty) + 1, TILE - 2, 2);
        ctx.fillRect(sx(tx) + 1, sy(ty) + TILE - 3, TILE - 2, 2);
        ctx.fillRect(sx(tx) + 1, sy(ty) + 1, 2, TILE - 2);
        ctx.fillRect(sx(tx) + TILE - 3, sy(ty) + 1, 2, TILE - 2);
      }
    }
  }

  function drawWallTile(tx, ty, pack) {
    drawTileImg(pack.wall[tileVar(tx, ty)], tx, ty);
    ctx.fillStyle = "rgba(255,220,180,0.08)";
    ctx.fillRect(sx(tx), sy(ty), TILE, 3);
    ctx.fillStyle = "rgba(0,0,0,0.28)";
    ctx.fillRect(sx(tx), sy(ty) + TILE - 3, TILE, 3);
    if (MAP[ty][tx] === "*") {
      const fr = ((tick * 8 + tx) | 0) % 2 === 0 ? spr.torch0 : spr.torch1;
      const flicker = ((tx * 3 + (tick * 11) | 0) % 2) ? spr.torch1 : spr.torch0;
      blit(flicker, tx + 0.5, ty + 0.95, false, false);
    }
  }

  function drawMapFloor() {
    const pack = tilesFor(THEME._name);
    for (let ty = 0; ty < ROWS; ty++) {
      for (let tx = 0; tx < COLS; tx++) {
        const ch = MAP[ty][tx];
        if (ch === "#" || ch === "*") continue;
        if (ch === "o") drawTileImg(pack.ritual, tx, ty);
        else if (ch === "~") drawTileImg(pack.rug, tx, ty);
        else if (ch === "+") drawTileImg(pack.grate, tx, ty);
        else if (ch === "D") {
          drawTileImg(pack.door, tx, ty);
          ctx.fillStyle = THEME.wall[2];
          ctx.fillRect(sx(tx), sy(ty) - TILE * 0.55, TILE, TILE * 0.55);
          ctx.fillStyle = THEME.wall[3];
          ctx.fillRect(sx(tx) + 2, sy(ty) - TILE * 0.45, TILE - 4, 3);
          ctx.fillStyle = "#080404";
          ctx.fillRect(sx(tx) + TILE * 0.22, sy(ty) - TILE * 0.35, TILE * 0.56, TILE * 1.15);
        }
        else if (ch === "P") drawTileImg(pack.floor[tileVar(tx, ty)], tx, ty);
        else {
          drawTileImg(pack.floor[tileVar(tx, ty)], tx, ty);
          drawCracks(tx, ty);
          drawBlood(tx, ty);
        }
      }
    }
    let minx = 99, miny = 99, maxx = 0, maxy = 0, found = 0;
    for (let ty = 0; ty < ROWS; ty++) {
      for (let tx = 0; tx < COLS; tx++) {
        if (MAP[ty][tx] !== "o") continue;
        found++;
        if (tx < minx) minx = tx; if (ty < miny) miny = ty;
        if (tx > maxx) maxx = tx; if (ty > maxy) maxy = ty;
      }
    }
    if (found > 4) {
      const cx = sx((minx + maxx + 1) * 0.5);
      const cy = sy((miny + maxy + 1) * 0.5);
      const r = Math.max(TILE, (maxx - minx + 1) * TILE * 0.42);
      ctx.strokeStyle = "rgba(220,36,36,0.55)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      for (let i = 0; i <= 5; i++) {
        const a = -Math.PI / 2 + i * Math.PI * 2 * 2 / 5;
        const x = cx + Math.cos(a) * r * 0.92;
        const y = cy + Math.sin(a) * r * 0.92;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }

  function drawBorderWalls() {
    const pack = tilesFor(THEME._name);
    for (let ty = 0; ty < ROWS; ty++) {
      for (let tx = 0; tx < COLS; tx++) {
        const ch = MAP[ty][tx];
        if ((ch === "#" || ch === "*") && isBorder(tx, ty) && ty !== ROWS - 1) {
          drawWallTile(tx, ty, pack);
        }
      }
    }
  }

  function drawLighting() {
    if (!lightCvs || lightCvs.width !== canvas.width || lightCvs.height !== canvas.height) {
      lightCvs = document.createElement("canvas");
      lightCvs.width = canvas.width;
      lightCvs.height = canvas.height;
      lightCtx = lightCvs.getContext("2d");
    }
    const g = lightCtx;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.imageSmoothingEnabled = true;
    g.clearRect(0, 0, W, H);
    g.fillStyle = "rgba(5,2,3,0.80)";
    g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = "destination-out";
    function punch(x, y, rad, str) {
      const grd = g.createRadialGradient(x, y, rad * 0.08, x, y, rad);
      grd.addColorStop(0, "rgba(0,0,0," + str + ")");
      grd.addColorStop(0.45, "rgba(0,0,0," + (str * 0.5) + ")");
      grd.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = grd;
      g.beginPath();
      g.arc(x, y, rad, 0, Math.PI * 2);
      g.fill();
    }
    for (let i = 0; i < torches.length; i++) {
      const tch = torches[i];
      const flick = 0.9 + Math.sin(tick * 9 + i * 1.7) * 0.08 + Math.sin(tick * 17 + i) * 0.04;
      punch(sx(tch.x), sy(tch.y + 0.2), TILE * 3.4 * flick, 0.95);
    }
    if (phase !== "title" && player.x != null) {
      punch(sx(player.x), sy(player.y - 0.4), TILE * 2.4, 0.7);
    }
    if (exitGate) punch(sx(exitGate.x), sy(exitGate.y), TILE * 2.1, 0.75);
    g.globalCompositeOperation = "source-over";
    ctx.drawImage(lightCvs, 0, 0, W, H);

    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < torches.length; i++) {
      const tch = torches[i];
      const flick = 0.55 + Math.sin(tick * 8 + i * 2.1) * 0.12;
      const x = sx(tch.x), y = sy(tch.y + 0.15);
      const rad = TILE * 2.2 * flick;
      const grd = ctx.createRadialGradient(x, y, 2, x, y, rad);
      grd.addColorStop(0, "rgba(255,160,50," + (0.22 * flick) + ")");
      grd.addColorStop(0.4, "rgba(232,93,4," + (0.10 * flick) + ")");
      grd.addColorStop(1, "rgba(232,93,4,0)");
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(x, y, rad, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function heroSprite() {
    if (player.slashAnim > 0.35) return spr.heroSlash;
    if (player.walkT > 0) {
      const f = ((player.walkT * 8) | 0) % 4;
      return f === 0 ? spr.heroW1 : f === 1 ? spr.heroW2 : f === 2 ? spr.heroW3 : spr.heroW4;
    }
    const bob = Math.sin(tick * 3) > 0.3;
    return bob ? spr.hero : spr.heroW4;
  }

  function drawHeroAt(wx, wy, flip, flashAmt, alpha, slashAmt) {
    ctx.save();
    if (alpha != null) ctx.globalAlpha = alpha;
    const ghost = player.iframes > 0 && ((tick * 20) | 0) % 2 === 0 && alpha == null;
    if (ghost) ctx.globalAlpha = 0.4;
    footShadow(wx, wy, 0.7);
    blit(heroSprite(), wx, wy, flip, flashAmt > 0);
    if (slashAmt > 0) {
      const fr = slashAmt > 0.66 ? spr.slash1 : slashAmt > 0.33 ? spr.slash2 : spr.slash3;
      const ox = flip ? -0.85 : 0.85;
      blit(fr, wx + ox, wy - 0.15, flip, false);
    }
    ctx.restore();
  }

  function drawPlayer() {
    if (player.x == null) return;
    drawHeroAt(player.x, player.y, player.flip, player.flash, null, player.slashAnim);
  }

  function drawEnemy(e) {
    if (e.slam) drawSlamZone(e.slam);
    footShadow(e.x, e.y, e.type === "boss" ? 1.35 : e.type === "brute" ? 1.05 : 0.7);
    let s = spr.slime1;
    if (e.type === "slime") s = Math.sin(e.bob * 6) > 0 ? spr.slime1 : spr.slime2;
    else if (e.type === "brute") {
      if (e.wind > 0) s = spr.bruteAtk;
      else if (e.atk > e.cd * 0.7) s = spr.brute;
      else s = ((e.bob * 4) | 0) % 2 ? spr.bruteW : spr.brute;
    } else {
      s = (e.slam && e.slam.t > 0.2) ? spr.bossSlam : spr.boss;
    }
    const hurt = e.flash > 0 || e.wind > 0;
    blit(s, e.x, e.y, e.flip, hurt && e.flash > 0);
    if (e.wind > 0 && e.type !== "boss") {
      ctx.globalAlpha = 0.55;
      blit(s, e.x, e.y, e.flip, true);
      ctx.globalAlpha = 1;
    }
    const above = (s.h * (TILE / 16)) + 6;
    drawHpPip(e.x, e.y, e.hp, e.maxhp, above);
  }

  function drawChest() {
    if (!chest) return;
    footShadow(chest.x, chest.y, 0.7);
    let s = spr.chestC;
    if (chest.open && chest.t > 0.2) s = spr.chestOpen;
    else if (chest.open) s = spr.chestO;
    blit(s, chest.x, chest.y, false, false);
    if (chest.open && chest.t > 0) {
      ctx.fillStyle = "rgba(251,191,36," + (chest.t * 0.55) + ")";
      ctx.fillRect(sx(chest.x) - TILE * 0.35, sy(chest.y) - TILE * 0.7, TILE * 0.7, TILE * 0.35);
    }
  }

  function drawGem(g) {
    const hop = g.hop ? Math.sin(Math.min(1, g.t / 0.35) * Math.PI) * 0.45 : 0;
    const bob = Math.sin(g.t * 5) * 0.08;
    footShadow(g.x, g.y, 0.4);
    const s = spr.gems[g.rarity] || spr.gems.common;
    blit(s, g.x, g.y - bob - hop, false, false);
  }

  function draw() {
    const ox = (Math.random() - 0.5) * shake;
    const oy = (Math.random() - 0.5) * shake;
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.translate(ox, oy);

    ctx.fillStyle = THEME ? THEME.fog : "#0a0706";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#080506";
    ctx.fillRect(0, 0, W, mapY);
    ctx.fillRect(0, mapY + mapH, W, H);

    if (MAP.length) {
      drawMapFloor();
      enemies.forEach(function (e) { if (e.slam) drawSlamZone(e.slam); });
      if (exitGate) {
        const pulse = 0.55 + Math.sin(tick * 6) * 0.45;
        ctx.fillStyle = "rgba(251,191,36," + (0.12 * pulse) + ")";
        ctx.fillRect(sx(exitGate.x) - TILE * 0.7, sy(exitGate.y) - TILE * 0.2, TILE * 1.4, TILE * 1.1);
        ctx.strokeStyle = "rgba(251,191,36," + (0.45 + 0.4 * pulse) + ")";
        ctx.lineWidth = 2;
        ctx.strokeRect(sx(exitGate.x) - TILE * 0.55, sy(exitGate.y) - TILE * 0.85, TILE * 1.1, TILE * 1.5);
        ctx.fillStyle = "#fbbf24";
        ctx.font = "700 10px ui-sans-serif, system-ui";
        ctx.textAlign = "center";
        ctx.fillText("NEXT", sx(exitGate.x), sy(exitGate.y) + TILE * 0.85);
      }
      drawBorderWalls();
    }

    const list = [];
    if (MAP.length) {
      const pack = tilesFor(THEME._name);
      for (let ty = 0; ty < ROWS; ty++) {
        for (let tx = 0; tx < COLS; tx++) {
          const ch = MAP[ty][tx];
          if (ch === "P") {
            list.push({ y: ty + 0.95, draw: function () {
              footShadow(tx + 0.5, ty + 0.95, 0.7);
              blit(spr.pillar, tx + 0.5, ty + 1.05, false, false);
            }});
          } else if ((ch === "#" || ch === "*") && (!isBorder(tx, ty) || ty === ROWS - 1)) {
            list.push({ y: ty + 0.98, draw: function () { drawWallTile(tx, ty, pack); } });
          }
        }
      }
    }
    if (chest) list.push({ y: chest.y, draw: drawChest });
    gems.forEach(function (g) { list.push({ y: g.y, draw: function () { drawGem(g); } }); });
    enemies.forEach(function (e) { list.push({ y: e.y, draw: function () { drawEnemy(e); } }); });
    titleMobs.forEach(function (m) {
      list.push({ y: m.y, draw: function () {
        footShadow(m.x, m.y, m.type === "brute" ? 1.05 : 0.7);
        const s = m.type === "brute" ? (((m.bob * 3) | 0) % 2 ? spr.bruteW : spr.brute)
          : (Math.sin(m.bob * 6) > 0 ? spr.slime1 : spr.slime2);
        blit(s, m.x, m.y, m.flip, false);
      }});
    });
    ghosts.forEach(function (gh) {
      list.push({ y: gh.y, draw: function () {
        drawHeroAt(gh.x, gh.y, gh.flip, 0, clamp(gh.t * 4, 0, 0.45), 0);
      }});
    });
    if (phase !== "title" && player.y != null) list.push({ y: player.y, draw: drawPlayer });
    else if (phase === "title" && player.y != null) list.push({ y: player.y, draw: drawPlayer });

    list.sort(function (a, b) { return a.y - b.y; });
    list.forEach(function (it) { it.draw(); });

    parts.forEach(function (p) {
      ctx.globalAlpha = clamp(p.t * 3, 0, 1);
      ctx.fillStyle = p.col;
      const s = Math.max(1, p.r);
      ctx.fillRect(sx(p.x) - s / 2, sy(p.y) - s / 2, s, s);
      ctx.globalAlpha = 1;
    });
    floats.forEach(function (f) {
      ctx.globalAlpha = clamp(f.t * 2, 0, 1);
      ctx.fillStyle = "#1a0a08";
      ctx.font = "800 14px ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.fillText(f.text, sx(f.x) + 1, sy(f.y) + 1);
      ctx.fillStyle = f.col;
      ctx.fillText(f.text, sx(f.x), sy(f.y));
      ctx.globalAlpha = 1;
    });

    if (banner.t > 0) {
      ctx.globalAlpha = clamp(banner.t * 2, 0, 0.92);
      const by = mapY + TILE * 1.6;
      ctx.fillStyle = "rgba(10,4,4,0.72)";
      ctx.fillRect(mapX + TILE, by - 22, mapW - TILE * 2, 32);
      ctx.fillStyle = "#3a2018";
      ctx.fillRect(mapX + TILE, by - 22, mapW - TILE * 2, 2);
      ctx.fillRect(mapX + TILE, by + 8, mapW - TILE * 2, 2);
      ctx.fillStyle = "#fff7ed";
      ctx.font = "800 26px ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.fillText(banner.text, W * 0.5, by + 4);
      ctx.globalAlpha = 1;
    }

    ctx.restore();

    if (MAP.length) drawLighting();

    embers.forEach(function (m) {
      ctx.globalAlpha = clamp(m.t, 0, 1) * 0.45;
      ctx.fillStyle = "#e85d04";
      ctx.fillRect(m.x, m.y, m.r, m.r);
      ctx.globalAlpha = 1;
    });

    if (flash > 0) {
      ctx.fillStyle = "rgba(255,50,36," + (flash * 0.28) + ")";
      ctx.fillRect(0, 0, W, H);
    }
    if (player.dodging > 0 && (phase === "fight" || phase === "loot")) {
      ctx.strokeStyle = "rgba(103,232,249,0.4)";
      ctx.lineWidth = 2;
      ctx.strokeRect(sx(player.x) - 16, sy(player.y) - 28, 32, 32);
    }
  }

  function loop(ts) {
    if (!last) last = ts;
    let dt = (ts - last) / 1000;
    last = ts;
    if (dt > 0.05) dt = 0.05;
    for (let i = ghosts.length - 1; i >= 0; i--) {
      ghosts[i].t -= dt;
      if (ghosts[i].t <= 0) ghosts.splice(i, 1);
    }
    update(dt);
    draw();
    pid = requestAnimationFrame(loop);
  }

  function showTitle() {
    phase = "title";
    buildMap(3);
    THEME = THEMES.ember;
    THEME._name = "ember";
    resetPlayer();
    player.x = spawnTile.x;
    player.y = spawnTile.y;
    titleMobs = [
      { type: "slime", x: COLS * 0.32, y: ROWS * 0.42, bob: 0.2, flip: false },
      { type: "brute", x: COLS * 0.68, y: ROWS * 0.40, bob: 1.4, flip: true }
    ];
    const b = bestRoom();
    const line = document.getElementById("bestline");
    if (line) line.textContent = b ? "Best room " + b : "No clears yet.";
    overlay.classList.remove("hidden");
    hud.classList.add("off");
    hint.style.opacity = "0.7";
    hpfill.style.transform = "scaleX(1)";
    hptext.textContent = "100 / 100";
    roomtext.textContent = "ROOM — / 8";
  }

  initSprites();
  initExtraSprites();
  resize();
  showTitle();
  pid = requestAnimationFrame(loop);
})();
  </script>
</body>
