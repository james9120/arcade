          ctx.fillRect(sx(tx) + TILE * 0.54 + gap, sy(ty) - TILE * 0.28, TILE * 0.28, TILE * 1.05);

          ctx.fillRect(sx(tx) + TILE * 0.79 + gap, sy(ty) - TILE * 0.28, 3, TILE * 1.05);
        } else if (ch === "P") drawTileImg(pack.floor[tileVar(tx, ty)], tx, ty);
        else {

        const a = 0.2 + 0.35 * Math.sin(tick * 14);
        ctx.strokeStyle = hz.type === "slime" ? "rgba(74,222,128," + a + ")" : "rgba(248,113,113," + a + ")";
        ctx.lineWidth = 2;

        ctx.fillStyle = "#fff1f2";
        ctx.fillRect(x + TILE * 0.48, y + TILE * 0.16, 2, 3);

  function drawLighting() {

      grd.addColorStop(0.45, "rgba(0,0,0," + (str * 0.5) + ")");

      grd.addColorStop(1, "rgba(232,93,4,0)");
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(x, y, rad, 0, Math.PI * 2);

  function heroSprite() {
    if (player.slashAnim > 0.35) return spr.heroSlash;

  function drawHeroAt(wx, wy, flip, flashAmt, alpha, slashAmt) {
    ctx.save();

    if (ghost) ctx.globalAlpha = 0.4;
    footShadow(wx, wy, 0.7);
    blit(heroSprite(), wx, wy, flip, flashAmt > 0);
    if (slashAmt > 0) {

      const ox = flip ? -0.85 : 0.85;
      blit(fr, wx + ox, wy - 0.15, flip, false, player.heavy > 0 ? 1.45 : 1);
      if (player.heavy > 0) blit(fr, wx + ox * 1.25, wy - 0.35, flip, false, 1.2);
    }
    if (player.charging) {

      const pulse = 0.45 + Math.sin(tick * (ready ? 14 : 8)) * 0.35;
      ctx.globalAlpha = pulse;
      blit(spr.star, wx + 0.38, wy - 0.95, false, false);

      ctx.fillStyle = ready ? "rgba(253,230,138,0.85)" : "rgba(251,191,36,0.55)";
      const cx = sx(wx), cy = sy(wy) - TILE * 0.85;

      ctx.fillRect(cx + 4, cy - 1, 2, 2);
      ctx.fillRect(cx - 5, cy, 2, 2);

  }
  function drawStatusIcons(wx, wy) {
    const icons = [];

    if (player.burn > 0) icons.push("#fb923c");
    if (player.slow > 0) icons.push("#94a3b8");
    if (player.cursed) icons.push("#a78bfa");
    if (!icons.length) return;
    const baseX = sx(wx) - (icons.length - 1) * 5;
    const baseY = sy(wy) - TILE * 1.22;
    for (let i = 0; i < icons.length; i++) {
      ctx.fillStyle = icons[i];
      ctx.fillRect(baseX + i * 10 - 2, baseY, 5, 5);
      ctx.fillStyle = "#1a0a08";

    }
  }
  function drawPlayer() {
    if (player.x == null) return;
    drawHeroAt(player.x, player.y, player.flip, player.flash, null, player.slashAnim);
    drawStatusIcons(player.x, player.y);
  }

  function enemySprite(e) {
    if (e.type === "slime") return Math.sin(e.bob * 6) > 0 ? spr.slime1 : spr.slime2;
    if (e.type === "bat") return Math.sin(e.bob * 10) > 0 ? spr.bat1 : spr.bat2;
    if (e.type === "spitter") return (e.wind > 0 || e.atk > e.cd * 0.75) ? spr.spit2 : spr.spit1;
    if (e.type === "knight" || e.type === "warden") return (e.wind > 0 || (e.slam && e.slam.t > 0.25)) ? spr.knight2 : spr.knight1;
    if (e.type === "bomber") return (e.boom > 0 || Math.sin(e.bob * 7) > 0) ? spr.bomber2 : spr.bomber1;
    if (e.type === "mimic") return Math.sin(e.bob * 5) > 0 ? spr.mimic : spr.chestC;
    if (e.type === "brute") {
      if (e.wind > 0) return spr.bruteAtk;
      if (e.atk > e.cd * 0.7) return spr.brute;
      return ((e.bob * 4) | 0) % 2 ? spr.bruteW : spr.brute;
    }
    if (e.type === "wisp") return e.glow ? spr.wisp2 : spr.wisp1;
    if (e.type === "golem") return (e.slam && e.slam.t > 0.2) ? spr.golemSlam : spr.golem;
    if (e.type === "boneking") return (e.slam && e.slam.t > 0.2) ? spr.bonekingSlam : spr.boneking;
    if (e.type === "ashwitch") return (e.wind > 0 || e.casting) ? spr.ashwitchCast : spr.ashwitch;
    return (e.slam && e.slam.t > 0.2) ? spr.bossSlam : spr.boss;
  }

  function drawShieldGleam(e, scale) {
    if (e.vuln > 0) return;
    const fx = Math.cos(e.face || 0), fy = Math.sin(e.face || 0);
    const gx = sx(e.x + fx * 0.42 * (scale || 1));
    const gy = sy(e.y - 0.38 + fy * 0.32);
    const gleam = 0.5 + Math.sin(tick * 9 + e.bob) * 0.4;
    ctx.save();
    ctx.fillStyle = "rgba(186, 214, 240, " + (0.55 + gleam * 0.4) + ")";
    ctx.fillRect(gx - 4, gy - 8, 8, 16);
    ctx.fillStyle = "rgba(255, 255, 255, " + (0.45 + gleam * 0.5) + ")";
    ctx.fillRect(gx - 2, gy - 6, 3, 5);
    ctx.fillRect(gx + 1, gy - 1, 2, 7);
    ctx.fillStyle = "rgba(125, 211, 252, " + (0.35 + gleam * 0.35) + ")";

    ctx.restore();
  }
  function drawEnemy(e) {
    if (e.slam) drawSlamZone(e.slam);
    if (e.type === "ashwitch" && e.casting && e.puddleX != null) {
      drawSlamZone({ x: e.puddleX, y: e.puddleY, t: Math.max(0.05, e.wind), dur: 0.5, r: 0.9 });
    }
    if (e.boom > 0) {
      const k = 1 - e.boom / 0.55;
      ctx.strokeStyle = "rgba(255,120,40," + (0.4 + k * 0.5) + ")";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sx(e.x), sy(e.y) - 6, TILE * (0.6 + k * 1.3), 0, Math.PI * 2);
      ctx.stroke();
    }
    const span = e.type === "boss" || e.type === "boneking" ? 1.35 : (e.type === "warden" || e.type === "golem") ? 1.25 : (e.type === "brute" || e.type === "knight" || e.type === "mimic") ? 1.05 : 0.7;
    footShadow(e.x, e.y, span);
    const s = enemySprite(e);
    const hurt = e.flash > 0 || e.wind > 0;
    const escale = e.type === "warden" ? 1.5 : (e.type === "boneking" ? 1.15 : (e.type === "golem" ? 1.2 : 1));
    blit(s, e.x, e.y, e.flip, hurt && e.flash > 0, escale);
    if (e.wind > 0 && e.type !== "boss") {
      ctx.globalAlpha = 0.55;
      blit(s, e.x, e.y, e.flip, true, escale);
      ctx.globalAlpha = 1;
    }
    if (e.type === "wisp" && e.glow) {
      ctx.strokeStyle = "rgba(196,181,253,0.7)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sx(e.x), sy(e.y) - TILE * 0.35, TILE * 0.42, 0, Math.PI * 2);
      ctx.stroke();
    }
    if (e.type === "knight" || e.type === "warden") drawShieldGleam(e, escale);
    if (e.elite) blit(spr.star, e.x, e.y - 1.15, false, false);
    const above = (s.h * (TILE / 16) * (e.type === "warden" ? 1.5 : 1)) + 6;
    drawHpPip(e.x, e.y, e.hp, e.maxhp, above);
  }

  function drawChest() {
    if (!chest) return;
    footShadow(chest.x, chest.y, 0.7);
    let s = spr.chestC;
    if (chest.open && chest.t > 0.2) s = spr.chestOpen;
    else if (chest.open) s = spr.chestO;
    blit(s, chest.x, chest.y, false, false);
    if (chest.open && chest.t > 0) {
      ctx.fillStyle = "rgba(251,191,36," + (chest.t * 0.55) + ")";
      ctx.fillRect(sx(chest.x) - TILE * 0.35, sy(chest.y) - TILE * 0.7, TILE * 0.7, TILE * 0.35);
    }
  }

  function drawGem(g) {
    const hop = g.hop ? Math.sin(Math.min(1, g.t / 0.35) * Math.PI) * 0.45 : 0;
    const bob = Math.sin(g.t * 5) * 0.08;
    footShadow(g.x, g.y, 0.4);
    const s = spr.gems[g.rarity] || spr.gems.common;
    blit(s, g.x, g.y - bob - hop, false, false);
  }

  function drawShopGood(g, i) {
    footShadow(g.x, g.y, 0.55);
    if (g.bought) {
      ctx.globalAlpha = 0.35;
      blit(spr.gems[g.item.rarity] || spr.gems.common, g.x, g.y, false, false);
      ctx.globalAlpha = 1;
      return;
    }
    const bob = Math.sin(tick * 4 + i) * 0.08;
    blit(spr.gems[g.item.rarity] || spr.gems.common, g.x, g.y - bob, false, false);
    if (shop && shop.sel === i) {
      ctx.strokeStyle = "#fbbf24";
      ctx.lineWidth = 2;
      ctx.strokeRect(sx(g.x) - TILE * 0.55, sy(g.y) - TILE * 1.15, TILE * 1.1, TILE * 1.35);
    }
    ctx.fillStyle = gold >= g.price ? "#fbbf24" : "#fda4af";
    ctx.font = "700 10px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    ctx.fillText(g.price + "G", sx(g.x), sy(g.y) + TILE * 0.35);
    ctx.fillStyle = "#e8d5c0";
    ctx.font = "700 9px ui-sans-serif, system-ui";
    ctx.fillText(g.item.name, sx(g.x), sy(g.y) + TILE * 0.58);
  }

  function drawShrineOpt(o, i) {
    footShadow(o.x, o.y, 0.7);
    blit(spr.shrine, o.x, o.y, false, false);
    if (shrine && shrine.sel === i && !shrine.used) {
      ctx.strokeStyle = "#fde68a";
      ctx.lineWidth = 2;
      ctx.strokeRect(sx(o.x) - TILE * 0.55, sy(o.y) - TILE * 1.1, TILE * 1.1, TILE * 1.3);
    }
    ctx.fillStyle = shrine && shrine.used ? "#6a5a50" : "#fde68a";
    ctx.font = "800 10px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    ctx.fillText(o.name, sx(o.x), sy(o.y) + TILE * 0.4);
  }

  function draw() {
    const ox = (Math.random() - 0.5) * shake;
    const oy = (Math.random() - 0.5) * shake;
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.translate(ox, oy);
    ctx.fillStyle = THEME ? THEME.fog : "#0a0706";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#080506";
    ctx.fillRect(0, 0, W, mapY);
    ctx.fillRect(0, mapY + mapH, W, H);

    if (MAP.length) {
      drawMapFloor();
      enemies.forEach(function (e) { if (e.slam) drawSlamZone(e.slam); });
      if (exitGate) {
        const pulse = 0.55 + Math.sin(tick * 6) * 0.45;
        ctx.fillStyle = "rgba(251,191,36," + (0.12 * pulse) + ")";
        ctx.fillRect(sx(exitGate.x) - TILE * 0.7, sy(exitGate.y) - TILE * 0.2, TILE * 1.4, TILE * 1.1);
        ctx.strokeStyle = "rgba(251,191,36," + (0.45 + 0.4 * pulse) + ")";
        ctx.lineWidth = 2;
        ctx.strokeRect(sx(exitGate.x) - TILE * 0.55, sy(exitGate.y) - TILE * 0.85, TILE * 1.1, TILE * 1.5);
        ctx.fillStyle = "#fbbf24";
        ctx.font = "700 10px ui-sans-serif, system-ui";
        ctx.textAlign = "center";
        ctx.fillText("NEXT", sx(exitGate.x), sy(exitGate.y) + TILE * 0.85);
      }
      drawBorderWalls();
    }

    const list = [];
    if (MAP.length) {
      const pack = tilesFor(THEME._name);
      for (let ty = 0; ty < ROWS; ty++) {
        for (let tx = 0; tx < COLS; tx++) {
          const ch = MAP[ty][tx];
          if (ch === "P") {
            list.push({ y: ty + 0.95, draw: function () {
              footShadow(tx + 0.5, ty + 0.95, 0.7);
              blit(spr.pillar, tx + 0.5, ty + 1.05, false, false);
            }});
          } else if ((ch === "#" || ch === "*") && (!isBorder(tx, ty) || ty === ROWS - 1)) {
            list.push({ y: ty + 0.98, draw: function () { drawWallTile(tx, ty, pack); } });
          }
        }
      }
    }
    if (chest) list.push({ y: chest.y, draw: drawChest });
    gems.forEach(function (g) { list.push({ y: g.y, draw: function () { drawGem(g); } }); });
    if (shop) shop.goods.forEach(function (g, i) { list.push({ y: g.y, draw: function () { drawShopGood(g, i); } }); });
    if (shop && shop.keeper) list.push({ y: shop.keeper.y, draw: function () {
      footShadow(shop.keeper.x, shop.keeper.y, 0.7);
      blit(spr.keeper, shop.keeper.x, shop.keeper.y, false, false);
    }});
    if (shrine) shrine.opts.forEach(function (o, i) { list.push({ y: o.y, draw: function () { drawShrineOpt(o, i); } }); });
    enemies.forEach(function (e) { list.push({ y: e.y, draw: function () { drawEnemy(e); } }); });
    titleMobs.forEach(function (m) {
      list.push({ y: m.y, draw: function () {
        footShadow(m.x, m.y, m.type === "brute" ? 1.05 : 0.7);
        const s = m.type === "brute" ? (((m.bob * 3) | 0) % 2 ? spr.bruteW : spr.brute)
          : (Math.sin(m.bob * 6) > 0 ? spr.slime1 : spr.slime2);
        blit(s, m.x, m.y, m.flip, false);
      }});
    });
    ghosts.forEach(function (gh) {
      list.push({ y: gh.y, draw: function () {
        drawHeroAt(gh.x, gh.y, gh.flip, 0, clamp(gh.t * 4, 0, 0.45), 0);
      }});
    });
    if (player.y != null) list.push({ y: player.y, draw: drawPlayer });
    list.sort(function (a, b) { return a.y - b.y; });
    list.forEach(function (it) { it.draw(); });

    puddles.forEach(function (pdl) {
      const a = 0.22 + 0.18 * Math.sin(tick * 8 + pdl.x);
      ctx.fillStyle = "rgba(232,93,4," + a + ")";
      const pr = pdl.r * TILE;
      ctx.fillRect(sx(pdl.x) - pr, sy(pdl.y) - pr * 0.45, pr * 2, pr * 0.9);
      ctx.fillStyle = "rgba(253,230,138," + (a + 0.1) + ")";
      ctx.fillRect(sx(pdl.x) - pr * 0.4, sy(pdl.y) - pr * 0.2, pr * 0.8, pr * 0.35);
    });
    bombs.forEach(function (b) {
      const k = 1 - b.t / 0.4;
      ctx.fillStyle = "#fb923c";
      ctx.fillRect(sx(b.x) - 4, sy(b.y) - 6, 8, 8);
      ctx.fillStyle = "#fde68a";
      ctx.fillRect(sx(b.x) - 2, sy(b.y) - 4, 4, 4);
      ctx.strokeStyle = "rgba(251,146,60," + (0.4 + k * 0.5) + ")";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sx(b.x), sy(b.y) - 2, TILE * (0.4 + k * 0.7), 0, Math.PI * 2);
      ctx.stroke();
    });
    shots.forEach(function (s) {
      if (s.wave) {
        ctx.fillStyle = "#7dd3fc";
        ctx.fillRect(sx(s.x) - 7, sy(s.y) - 4, 14, 8);
        ctx.fillStyle = "#e0f2fe";
        ctx.fillRect(sx(s.x) - 3, sy(s.y) - 2, 8, 4);
      } else if (s.burn) {
        ctx.fillStyle = "#fb923c";
        ctx.fillRect(sx(s.x) - 3, sy(s.y) - 3, 6, 6);
        ctx.fillStyle = "#fde68a";
        ctx.fillRect(sx(s.x) - 1, sy(s.y) - 1, 3, 3);
      } else {
        ctx.fillStyle = "#5eead4";
        ctx.fillRect(sx(s.x) - 3, sy(s.y) - 3, 6, 6);
        ctx.fillStyle = "#ecfdf5";
        ctx.fillRect(sx(s.x) - 1, sy(s.y) - 1, 3, 3);
      }
    });
    parts.forEach(function (p) {
      ctx.globalAlpha = clamp(p.t * 3, 0, 1);
      ctx.fillStyle = p.col;
      const s = Math.max(1, p.r);
      ctx.fillRect(sx(p.x) - s / 2, sy(p.y) - s / 2, s, s);
      ctx.globalAlpha = 1;
    });
    floats.forEach(function (f) {
      ctx.globalAlpha = clamp(f.t * 2, 0, 1);
      ctx.fillStyle = "#1a0a08";
      ctx.font = "800 14px ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.fillText(f.text, sx(f.x) + 1, sy(f.y) + 1);
      ctx.fillStyle = f.col;
      ctx.fillText(f.text, sx(f.x), sy(f.y));
      ctx.globalAlpha = 1;
    });
    if (combo >= 2 && (phase === "fight" || phase === "loot")) {
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = combo >= 5 ? "#fde68a" : "#e8d5c0";
      ctx.font = "800 16px ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.fillText("x" + combo + (combo >= 5 ? " COMBO" : ""), sx(player.x), sy(player.y) - TILE * 1.35);
      ctx.globalAlpha = 1;
    }
    if (banner.t > 0) {
      ctx.globalAlpha = clamp(banner.t * 2, 0, 0.92);
      const by = mapY + TILE * 1.6;
      ctx.fillStyle = "rgba(10,4,4,0.72)";
      ctx.fillRect(mapX + TILE, by - 22, mapW - TILE * 2, 32);
      ctx.fillStyle = "#3a2018";
      ctx.fillRect(mapX + TILE, by - 22, mapW - TILE * 2, 2);
      ctx.fillRect(mapX + TILE, by + 8, mapW - TILE * 2, 2);
      ctx.fillStyle = "#fff7ed";
      ctx.font = "800 26px ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.fillText(banner.text, W * 0.5, by + 4);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    if (MAP.length) drawLighting();
    embers.forEach(function (m) {
      ctx.globalAlpha = clamp(m.t, 0, 1) * 0.45;
      ctx.fillStyle = "#e85d04";
      ctx.fillRect(m.x, m.y, m.r, m.r);
      ctx.globalAlpha = 1;
    });
    if (flash > 0) {
      ctx.fillStyle = "rgba(" + (flashCol || "255,50,36") + "," + (flash * 0.28) + ")";
      ctx.fillRect(0, 0, W, H);
    }
    if (phase === "fight" || phase === "loot" || phase === "shop" || phase === "event") drawMinimap();
    if (!player.dead && player.maxhp && player.hp / player.maxhp < 0.3 &&
        (phase === "fight" || phase === "loot" || phase === "shop" || phase === "event")) {
      const a = 0.2 + 0.2 * (0.5 + 0.5 * Math.sin(tick * 7));
      ctx.strokeStyle = "rgba(220, 24, 24, " + a + ")";
      ctx.lineWidth = 10;
      ctx.strokeRect(5, 5, W - 10, H - 10);
      ctx.strokeStyle = "rgba(255, 70, 50, " + (a * 0.55) + ")";
      ctx.lineWidth = 4;
      ctx.strokeRect(13, 13, W - 26, H - 26);
    }
    if (player.dodging > 0 && (phase === "fight" || phase === "loot" || phase === "shop" || phase === "event")) {
      ctx.strokeStyle = "rgba(103,232,249,0.4)";
      ctx.lineWidth = 2;
      ctx.strokeRect(sx(player.x) - 16, sy(player.y) - 28, 32, 32);
    }
  }

  function drawMinimap() {
    if (!MAP.length || player.dead) return;
    const cell = 3;
    const pad = 3;
    const mw = COLS * cell + pad * 2;
    const mh = ROWS * cell + pad * 2 + 12;
    const deck = document.getElementById("gbsp");
    const bot = deck ? Math.max(140, deck.offsetHeight) : 168;
    const x = 8;
    const y = H - bot - mh - 6;
    ctx.fillStyle = "rgba(10,6,6,0.78)";
    ctx.fillRect(x, y, mw, mh);
    ctx.strokeStyle = "#5a3a20";
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, mw - 1, mh - 1);
    for (let ty = 0; ty < ROWS; ty++) {
      for (let tx = 0; tx < COLS; tx++) {
        const ch = MAP[ty][tx];
        let col = "#1a1210";
        if (ch === "." || ch === "S" || ch === "+" || ch === "~" || ch === "o") col = "#3a2a22";
        if (ch === "D") col = "#fbbf24";
        for (let hi = 0; hi < hazards.length; hi++) {
          if (hazards[hi].tx === tx && hazards[hi].ty === ty) col = hazards[hi].type === "slime" ? "#4ade80" : "#f87171";
        }
        if (secret && !secret.opened && secret.tx === tx && secret.ty === ty) col = "#a78bfa";
        ctx.fillStyle = col;
        ctx.fillRect(x + pad + tx * cell, y + pad + ty * cell, cell, cell);
      }
    }
    for (let i = 0; i < enemies.length; i++) {
      ctx.fillStyle = "#ef4444";
      ctx.fillRect(x + pad + Math.floor(enemies[i].x) * cell, y + pad + Math.floor(enemies[i].y) * cell, cell, cell);
    }
    if (player.x != null) {
      ctx.fillStyle = "#67e8f9";
      ctx.fillRect(x + pad + Math.floor(player.x) * cell, y + pad + Math.floor(player.y) * cell, cell, cell);
    }
    ctx.fillStyle = "#c4b4a4";
    ctx.font = "700 8px ui-sans-serif, system-ui";
    ctx.textAlign = "left";
    ctx.fillText((roomKind || "ROOM").toUpperCase(), x + pad, y + mh - 3);
    const pipY = y + mh - 8;
    const pip0 = x + mw - pad - 8 * 4;
    for (let i = 0; i < 8; i++) {
      ctx.fillStyle = i === ((depth - 1) % 8) ? "#e85d04" : "#3a2018";
      ctx.fillRect(pip0 + i * 4, pipY, 3, 3);
    }
  }

  function loop(ts) {
    if (!last) last = ts;
    let dt = (ts - last) / 1000;
    last = ts;
    if (dt > 0.05) dt = 0.05;
    if (hitstop > 0) {
      hitstop -= dt;
      if (hitstop < 0) hitstop = 0;
      draw();
      pid = requestAnimationFrame(loop);
      return;
    }
    for (let i = ghosts.length - 1; i >= 0; i--) {
      ghosts[i].t -= dt;
      if (ghosts[i].t <= 0) ghosts.splice(i, 1);
    }
    update(dt);
    draw();
    pid = requestAnimationFrame(loop);
  }

  function renderTitle() {
    phase = "title";
    overlay.classList.remove("hidden");
    hud.classList.add("off");
    hint.style.opacity = "0.7";
    const b = bestDepth();
    if (titleMode === "stats") {
      overlay.innerHTML =
        "<h2>STATS</h2>" +
        "<p class='statline'>RUNS · " + runStats.runs + "</p>" +
        "<p class='statline'>BEST DEPTH · " + Math.max(runStats.best, b) + "</p>" +
        "<p class='statline'>GOLD EARNED · " + runStats.gold + "</p>" +
        "<p class='statline'>KILLS · " + runStats.kills + "</p>" +
        "<p class='statline'>SECRETS · " + runStats.secrets + "</p>" +
        "<button class='btn btn-sm' id='backbtn' type='button'>BACK</button>";
      bindTitleButtons();
      return;
    }
    if (titleMode === "unlocks") {
      let rel = "";
      START_RELICS.forEach(function (r) {
        const on = unlocks.relic === r.id;
        const open = relicUnlocked(r.id);
        rel += "<button type='button' class='unlock-chip" + (on ? " on" : "") + (open ? "" : " lock") + "' data-relic='" + r.id + "'>" +
          (open ? r.name : r.name + " · " + r.need + " / " + r.cost + "s") + "</button>";
      });
      let wep = "";
      START_WEAPONS.forEach(function (w) {
        const on = unlocks.weapon === w.id;
        const open = weaponUnlocked(w.id);
        wep += "<button type='button' class='unlock-chip" + (on ? " on" : "") + (open ? "" : " lock") + "' data-wep='" + w.id + "'>" +
          (open ? w.name : w.name + " · d" + w.need) + "</button>";
      });
      overlay.innerHTML =
        "<h2>UNLOCKS</h2>" +
        "<p>Best depth " + b + " · Souls " + unlocks.souls + " · " + unlockCount() + "/" + unlockTotal() + "</p>" +
        "<p>Starting relic (tap to equip / buy early)</p>" +
        "<div class='unlock-grid'>" + rel + "</div>" +
        "<p>Starting weapon — unlock at depth 8 / 16 / 24</p>" +
        "<div class='unlock-grid'>" + wep + "</div>" +
        "<button class='btn btn-sm' id='backbtn' type='button'>BACK</button>";
      bindTitleButtons();
      return;
    }
    overlay.innerHTML =
      "<h1>SLASH PIT</h1>" +
      "<p>One thumb. Dash-strike. Grab loot. Don't get slammed.</p>" +
      "<p id='bestline'>" + (b ? "Best depth " + b : "No descents yet.") + " · Unlocks " + unlockCount() + "/" + unlockTotal() + " · Achs " + achCount() + "/" + ACH_DEFS.length + "</p>" +
      "<p id='seedline'>TAP TO ENTER rolls a seed · DAILY uses UTC date" + (b >= 16 ? " · DEEPER starts at 9" : "") + "</p>" +
      classRowHtml() +
      "<button class='btn' id='enterbtn' type='button'>TAP TO ENTER</button>" +
      "<div class='btn-row'><button class='btn btn-alt btn-sm' id='dailybtn' type='button'>DAILY</button>" +
      (b >= 16 ? "<button class='btn btn-alt btn-sm' id='deeperbtn' type='button'>DEEPER</button>" : "") +
      "<button class='btn btn-alt btn-sm' id='unlocksbtn' type='button'>UNLOCKS</button>" +
      "<button class='btn btn-alt btn-sm' id='statsbtn' type='button'>STATS</button>" +
      "<button class='btn btn-alt btn-sm' id='seedbtn' type='button'>SEED</button></div>";
    bindTitleButtons();
  }

  function classRowHtml() {
    let html = "<div class='unlock-grid'>";
    CLASSES.forEach(function (c) {
      const open = classUnlocked(c.id);
      const on = pickedClass === c.id;
      html += "<button type='button' class='unlock-chip" + (on ? " on" : "") + (open ? "" : " lock") + "' data-class='" + c.id + "'>" +
        (open ? c.name : c.name + " · d" + c.need) + "</button>";
    });
    html += "</div>";
    const def = classDef(pickedClass);
    html += "<p id='seedline'>" + esc(def.desc) + "</p>";
    return html;
  }

  function renderSeedPad() {
    titleMode = "seed";
    phase = "title";
    overlay.classList.remove("hidden");
    hud.classList.add("off");
    seedBuf = seedBuf || "";
    const keys = ["1","2","3","A","4","5","6","B","7","8","9","C","0","D","E","F"];
    let grid = "<div class='hexgrid'>";
    keys.forEach(function (k) {
      grid += "<button type='button' class='hexkey' data-hex='" + k + "'>" + k + "</button>";
    });
    grid += "<button type='button' class='hexkey' data-hex='DEL'>⌫</button>";
    grid += "<button type='button' class='hexkey go' data-hex='GO'>GO</button>";
    grid += "</div>";
    overlay.innerHTML =
      "<h2>SEED</h2>" +
      "<p>Type a hex seed · 8 digits</p>" +
      "<input id='seedin' type='text' maxlength='8' inputmode='text' autocomplete='off' autocapitalize='characters' spellcheck='false' value='" + esc(seedBuf) + "' />" +
      grid +
      "<div class='btn-row'><button class='btn btn-alt btn-sm' id='backbtn' type='button'>BACK</button></div>";
    bindTitleButtons();
    const inp = document.getElementById("seedin");
    if (inp) {
      inp.addEventListener("click", function (e) { e.stopPropagation(); });
      inp.addEventListener("input", function () {
        seedBuf = String(inp.value || "").replace(/[^0-9a-fA-F]/g, "").slice(0, 8).toUpperCase();
        inp.value = seedBuf;
      });
    }
    overlay.querySelectorAll("[data-hex]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        const k = el.getAttribute("data-hex");
        if (k === "GO") { confirmSeed(); return; }
        if (k === "DEL") seedBuf = seedBuf.slice(0, -1);
        else if (seedBuf.length < 8) seedBuf += k;
        const box = document.getElementById("seedin");
        if (box) box.value = seedBuf;
      });
    });
  }

  function confirmSeed() {
    const box = document.getElementById("seedin");
    if (box) seedBuf = String(box.value || seedBuf);
    const n = parseSeedHex(seedBuf);
    if (n == null) {
      showToast("TYPE A HEX SEED", "#fda4af");
      return;
    }
    startRun(n);
  }

  function showTitle() {
    titleMode = "main";
    buildMap(3, { layout: "chamber", theme: "ember" });
    THEME = THEMES.ember;
    THEME._name = "ember";
    resetPlayer();
    player.x = spawnTile.x;
    player.y = spawnTile.y;
    titleMobs = [
      { type: "slime", x: COLS * 0.32, y: ROWS * 0.42, bob: 0.2, flip: false },
      { type: "brute", x: COLS * 0.68, y: ROWS * 0.40, bob: 1.4, flip: true }
    ];
    const khp = classDef(pickedClass).hp;
    hpfill.style.transform = "scaleX(1)";
    hptext.textContent = khp + " / " + khp;
    goldtext.textContent = "0 G";
    combotext.textContent = "";
    roomtext.textContent = "DEPTH —";
    renderTitle();
  }

  loadMute();
  initSprites();
  initExtraSprites();
  resize();
  showTitle();
  pid = requestAnimationFrame(loop);
})();

  </script>
</body>
</html>
