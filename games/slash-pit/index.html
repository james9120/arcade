<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a0706" />
  <title>Slash Pit</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      background: #0a0706;
      color: #f3e8de;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #hud {
      position: fixed;
      left: 0; right: 0; top: 0;
      padding: calc(0.55rem + env(safe-area-inset-top, 0px)) 0.9rem 0.4rem;
      pointer-events: none;
      z-index: 2;
    }
    .hpwrap {
      height: 14px;
      border-radius: 99px;
      background: #1a1010;
      border: 1px solid #3a2018;
      overflow: hidden;
    }
    .hpfill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #9b1d20, #e85d04);
      transform-origin: left center;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 0.35rem;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #c4b4a4;
    }
    #hptext { font-variant-numeric: tabular-nums; }
    #toast {
      position: fixed;
      left: 50%;
      top: calc(4.1rem + env(safe-area-inset-top, 0px));
      transform: translateX(-50%) translateY(-8px);
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      background: rgba(20,10,8,0.88);
      border: 1px solid #5a3a20;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      opacity: 0;
      pointer-events: none;
      z-index: 3;
      white-space: nowrap;
      max-width: 92vw;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: opacity 0.12s linear, transform 0.12s ease;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem 1.25rem calc(2rem + env(safe-area-inset-bottom, 0px));
      background: rgba(6,3,3,0.72);
      z-index: 4;
    }
    #overlay.hidden { display: none; }
    #hud.off { visibility: hidden; }
    #overlay h1 {
      margin: 0;
      font-size: clamp(2.4rem, 12vw, 3.6rem);
      letter-spacing: 0.08em;
      line-height: 0.95;
      text-shadow: 0 0 24px #e85d0466, 0 4px 0 #3a0c08;
    }
    #overlay h2 {
      margin: 0;
      font-size: clamp(1.8rem, 9vw, 2.6rem);
      letter-spacing: 0.06em;
    }
    #overlay p {
      margin: 0.7rem 0 0;
      color: #c4b4a4;
      line-height: 1.45;
      max-width: 22rem;
    }
    #overlay .recap {
      margin-top: 0.85rem;
      font-size: 0.86rem;
      color: #e8d5c0;
      max-height: 28vh;
      overflow: auto;
      line-height: 1.55;
    }
    .btn {
      margin-top: 1.5rem;
      min-height: 3.3rem;
      min-width: 13.5rem;
      padding: 0.9rem 2rem;
      border: 0;
      border-radius: 999px;
      background: #e85d04;
      color: #1a0800;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 0.04em;
      touch-action: manipulation;
    }
    .btn:active { transform: scale(0.98); }
    #hint {
      position: fixed;
      left: 0; right: 0;
      bottom: calc(0.7rem + env(safe-area-inset-bottom, 0px));
      text-align: center;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #8a7060;
      pointer-events: none;
      z-index: 2;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="hpwrap"><div class="hpfill" id="hpfill"></div></div>
    <div class="row">
      <span id="hptext">100 / 100</span>
      <span id="roomtext">ROOM 1 / 8</span>
    </div>
  </div>
  <div id="toast"></div>
  <div id="hint">TAP FOE · TAP GROUND · SWIPE DODGE</div>
  <div id="overlay">
    <h1>SLASH PIT</h1>
    <p>One thumb. Dash-strike. Grab loot. Don't get slammed.</p>
    <p id="bestline"></p>
    <button class="btn" id="enterbtn" type="button">TAP TO ENTER</button>
  </div>
  <script>
(function () {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const hpfill = document.getElementById("hpfill");
  const hptext = document.getElementById("hptext");
  const roomtext = document.getElementById("roomtext");
  const toastEl = document.getElementById("toast");
  const overlay = document.getElementById("overlay");
  const hint = document.getElementById("hint");
  const hud = document.getElementById("hud");
  const BEST_KEY = "slashpit-best";

  const RARITY = {
    junk:   { w: 40, label: "JUNK",   color: "#c4c0b8" },
    common: { w: 35, label: "COMMON", color: "#86efac" },
    rare:   { w: 18, label: "RARE",   color: "#7dd3fc" },
    epic:   { w: 7,  label: "EPIC",   color: "#d8b4fe" }
  };
  const WEAPONS = [
    { r: "junk", name: "Rusty Nail", dmg: 3 },
    { r: "junk", name: "Bent Spike", dmg: 4 },
    { r: "junk", name: "Dull Shard", dmg: 3 },
    { r: "common", name: "Iron Fang", dmg: 6 },
    { r: "common", name: "Pit Knife", dmg: 7 },
    { r: "common", name: "Bone Spike", dmg: 6 },
    { r: "rare", name: "Blood Axe", dmg: 12 },
    { r: "rare", name: "Ember Cleaver", dmg: 11 },
    { r: "rare", name: "Widow Blade", dmg: 13 },
    { r: "epic", name: "Hellfang", dmg: 18 },
    { r: "epic", name: "Soul Reaver", dmg: 16 },
    { r: "epic", name: "Ash Reaper", dmg: 17 }
  ];
  const ARMORS = [
    { r: "junk", name: "Rag Wrap", hp: 8 },
    { r: "junk", name: "Scrap Plate", hp: 10 },
    { r: "junk", name: "Twine Vest", hp: 8 },
    { r: "common", name: "Iron Hide", hp: 16 },
    { r: "common", name: "Bone Mail", hp: 18 },
    { r: "common", name: "Pit Leather", hp: 15 },
    { r: "rare", name: "Ember Plate", hp: 28 },
    { r: "rare", name: "Blood Mail", hp: 30 },
    { r: "rare", name: "Scale Guard", hp: 26 },
    { r: "epic", name: "Pit Carapace", hp: 45 },
    { r: "epic", name: "Infernal Shell", hp: 42 },
    { r: "epic", name: "Void Mail", hp: 40 }
  ];
  const RELICS = [
    { r: "junk", name: "Frayed Charm", stat: "crit", v: 0.03 },
    { r: "junk", name: "Lucky Pebble", stat: "leech", v: 0.04 },
    { r: "junk", name: "Worn Anklet", stat: "speed", v: 12 },
    { r: "common", name: "Swift Band", stat: "speed", v: 28 },
    { r: "common", name: "Crit Tooth", stat: "crit", v: 0.06 },
    { r: "common", name: "Leech Chip", stat: "leech", v: 0.06 },
    { r: "rare", name: "Leech Stone", stat: "leech", v: 0.10 },
    { r: "rare", name: "Ghost Step", stat: "dodge", v: 0.18 },
    { r: "rare", name: "Ember Band", stat: "speed", v: 40 },
    { r: "epic", name: "Pit Crown", stat: "crit", v: 0.12 },
    { r: "epic", name: "Void Heart", stat: "leech", v: 0.16 },
    { r: "epic", name: "Ash Greaves", stat: "speed", v: 55 },
    { r: "epic", name: "Blink Dust", stat: "dodge", v: 0.28 }
  ];

  let W = 390, H = 844, dpr = 1;
  let arena = { x: 16, y: 90, w: 360, h: 640 };
  let phase = "title";
  let room = 1;
  let last = 0;
  let shake = 0;
  let flash = 0;
  let banner = { t: 0, text: "" };
  let toastT = 0;
  let pid = 0;

  const player = {};
  let enemies = [];
  let gems = [];
  let chest = null;
  let exitGate = null;
  let floats = [];
  let parts = [];
  let embers = [];
  let recap = [];
  let slots = { weapon: null, armor: null };

  const ptr = { down: false, x: 0, y: 0, sx: 0, sy: 0, t: 0, id: null };

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function pick(a) { return a[(Math.random() * a.length) | 0]; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function bestRoom() {
    try { return +localStorage.getItem(BEST_KEY) || 0; } catch (e) { return 0; }
  }
  function saveBest(n) {
    try {
      const p = bestRoom();
      if (n > p) localStorage.setItem(BEST_KEY, String(n));
    } catch (e) {}
  }

  function viewSize() {
    const vv = window.visualViewport;
    return { w: vv ? vv.width : window.innerWidth, h: vv ? vv.height : window.innerHeight };
  }

  function resize() {
    const v = viewSize();
    W = v.w; H = v.h;
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const top = 78 + (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("env(safe-area-inset-top)")) || 0);
    arena = { x: 18, y: Math.max(88, H * 0.11), w: W - 36, h: H - Math.max(88, H * 0.11) - 36 };
    if (phase === "fight" || phase === "loot") keepInArena();
  }

  function floorHalf(y) {
    const t = clamp((y - arena.y) / arena.h, 0, 1);
    return (arena.w * (0.36 + 0.50 * t)) * 0.5;
  }
  function clampToFloor(x, y) {
    const yy = clamp(y, arena.y + 22, arena.y + arena.h - 18);
    const cx = arena.x + arena.w * 0.5;
    const half = floorHalf(yy);
    return { x: clamp(x, cx - half, cx + half), y: yy };
  }
  function keepInArena() {
    const p = clampToFloor(player.x, player.y);
    player.x = p.x; player.y = p.y;
    enemies.forEach(function (e) {
      const c = clampToFloor(e.x, e.y);
      e.x = c.x; e.y = c.y;
    });
  }

  function resetPlayer() {
    const spawn = clampToFloor(arena.x + arena.w * 0.5, arena.y + arena.h * 0.82);
    Object.assign(player, {
      x: spawn.x, y: spawn.y, tx: null, ty: null,
      r: 16, hp: 100, maxhp: 100, dmg: 14,
      speed: 220, crit: 0.08, leech: 0,
      slashR: 70, slashCd: 0, slashAnim: 0,
      dodgeCd: 0, dodgeMax: 0.65, dodging: 0,
      iframes: 0.45, vx: 0, vy: 0, face: -Math.PI / 2,
      dash: null, flash: 0, dead: false
    });
    slots = { weapon: null, armor: null };
    recap = [];
  }

  function rollRarity(min) {
    const order = ["junk", "common", "rare", "epic"];
    const minI = min ? order.indexOf(min) : 0;
    let pool = [];
    let total = 0;
    for (let i = minI; i < order.length; i++) {
      const id = order[i];
      pool.push({ id: id, w: RARITY[id].w });
      total += RARITY[id].w;
    }
    let n = Math.random() * total;
    for (let i = 0; i < pool.length; i++) {
      n -= pool[i].w;
      if (n <= 0) return pool[i].id;
    }
    return pool[pool.length - 1].id;
  }

  function makeItem(min) {
    const r = rollRarity(min);
    const kind = pick(["weapon", "armor", "relic"]);
    const table = kind === "weapon" ? WEAPONS : kind === "armor" ? ARMORS : RELICS;
    const pool = table.filter(function (it) { return it.r === r; });
    const base = pick(pool.length ? pool : table);
    return Object.assign({ kind: kind, rarity: r }, base);
  }

  function itemBonus(it) {
    if (it.kind === "weapon") return "+" + it.dmg + " dmg";
    if (it.kind === "armor") return "+" + it.hp + " hp";
    if (it.stat === "speed") return "+" + it.v + " spd";
    if (it.stat === "crit") return "+" + Math.round(it.v * 100) + "% crit";
    if (it.stat === "leech") return "+" + Math.round(it.v * 100) + "% leech";
    if (it.stat === "dodge") return "-" + Math.round(it.v * 100) + "% dodge cd";
    return "";
  }

  function applyItem(it) {
    let used = true;
    if (it.kind === "weapon") {
      if (slots.weapon && it.dmg <= slots.weapon.dmg) {
        player.dmg += Math.max(1, (it.dmg * 0.4) | 0);
        used = "auto";
      } else {
        if (slots.weapon) player.dmg -= slots.weapon.dmg;
        player.dmg += it.dmg;
        slots.weapon = it;
      }
    } else if (it.kind === "armor") {
      if (slots.armor && it.hp <= slots.armor.hp) {
        const add = Math.max(2, (it.hp * 0.4) | 0);
        player.maxhp += add;
        player.hp += add;
        used = "auto";
      } else {
        const prev = slots.armor ? slots.armor.hp : 0;
        const diff = it.hp - prev;
        player.maxhp += diff;
        player.hp += Math.max(0, diff);
        slots.armor = it;
      }
    } else {
      if (it.stat === "speed") player.speed += it.v;
      if (it.stat === "crit") player.crit += it.v;
      if (it.stat === "leech") player.leech += it.v;
      if (it.stat === "dodge") player.dodgeMax = Math.max(0.28, player.dodgeMax * (1 - it.v));
    }
    recap.push(RARITY[it.rarity].label + " · " + it.name);
    showToast(RARITY[it.rarity].label + " · " + it.name + "  " + itemBonus(it), RARITY[it.rarity].color);
    return used;
  }

  function showToast(msg, color) {
    toastEl.textContent = msg;
    toastEl.style.color = color || "#f3e8de";
    toastEl.style.borderColor = color || "#5a3a20";
    toastEl.classList.add("show");
    toastT = 1.4;
  }

  function spawnGem(x, y, item) {
    const c = clampToFloor(x, y);
    gems.push({
      x: c.x, y: c.y, item: item, t: 0,
      color: RARITY[item.rarity].color
    });
  }

  function pickup(g) {
    applyItem(g.item);
    burst(g.x, g.y, g.color, 10);
    gems = gems.filter(function (x) { return x !== g; });
  }

  function enemyDef(type) {
    if (type === "slime") return { type: "slime", hp: 22, dmg: 8, speed: 72, r: 14, range: 28, cd: 0.9, color: "#4ade80", color2: "#166534" };
    if (type === "brute") return { type: "brute", hp: 48, dmg: 14, speed: 48, r: 20, range: 36, cd: 1.15, color: "#c2410c", color2: "#7c2d12" };
    return { type: "boss", hp: 220, dmg: 22, speed: 56, r: 34, range: 44, cd: 1.05, color: "#9b1d20", color2: "#450a0a", slam: 3 };
  }

  function spawnEnemy(type, x, y, fast) {
    const d = enemyDef(type);
    const c = clampToFloor(x, y);
    const e = Object.assign({}, d, {
      x: c.x, y: c.y, maxhp: d.hp, atk: 0, wind: 0,
      flash: 0, slamT: d.slam || 0, slam: null, bob: rnd(0, 6.2)
    });
    if (fast) e.speed *= 1.2;
    enemies.push(e);
  }

  function roomPlan(n) {
    if (n === 1 || n === 2) return { list: ["slime", "slime"], fast: false, chest: false };
    if (n === 3) return { list: ["slime", "slime", "brute"], fast: false, chest: true };
    if (n === 4) return { list: ["slime", "brute", "brute"], fast: false, chest: false };
    if (n === 5) return { list: ["slime", "slime", "brute", "brute"], fast: true, chest: false };
    if (n === 6) return { list: ["slime", "slime", "brute", "brute"], fast: true, chest: true };
    if (n === 7) return { list: ["brute", "brute", "brute"], fast: false, chest: false };
    return { list: ["boss"], fast: false, chest: false };
  }

  function startRoom(n) {
    room = n;
    phase = "fight";
    enemies = [];
    gems = [];
    chest = null;
    exitGate = null;
    const spawn = clampToFloor(arena.x + arena.w * 0.5, arena.y + arena.h * 0.82);
    player.x = spawn.x; player.y = spawn.y;
    player.tx = null; player.ty = null; player.dash = null;
    player.iframes = Math.max(player.iframes, 0.4);
    player.vx = 0; player.vy = 0;
    const plan = roomPlan(n);
    const count = plan.list.length;
    for (let i = 0; i < count; i++) {
      const ang = -Math.PI / 2 + (i - (count - 1) / 2) * 0.7;
      const rad = 70 + count * 8;
      spawnEnemy(
        plan.list[i],
        arena.x + arena.w * 0.5 + Math.cos(ang) * rad,
        arena.y + arena.h * 0.34 + Math.sin(ang) * 36,
        plan.fast
      );
    }
    if (plan.chest) {
      const side = n === 3 ? -1 : 1;
      const p = clampToFloor(arena.x + arena.w * 0.5 + side * arena.w * 0.28, arena.y + arena.h * 0.55);
      chest = { x: p.x, y: p.y, open: false, t: 0 };
    }
    banner = { t: 1.1, text: n === 8 ? "PIT LORD" : "ROOM " + n };
    syncHud();
  }

  function clearRoom() {
    phase = "loot";
    const cx = arena.x + arena.w * 0.5;
    spawnGem(cx + rnd(-30, 30), arena.y + arena.h * 0.48 + rnd(-20, 20), makeItem());
    if (Math.random() < 0.3) {
      spawnGem(cx + rnd(-50, 50), arena.y + arena.h * 0.42 + rnd(-16, 16), makeItem());
    }
    if (chest && !chest.open) {
      chest.open = true;
      chest.t = 0.5;
      spawnGem(chest.x, chest.y - 18, makeItem("rare"));
      burst(chest.x, chest.y, "#fbbf24", 14);
    }
    const g = clampToFloor(cx, arena.y + 36);
    exitGate = { x: g.x, y: g.y };
    banner = { t: 0.7, text: "CLEAR" };
  }

  function nextRoom() {
    gems.forEach(function (g) { applyItem(g.item); });
    gems = [];
    if (room >= 8) { winRun(); return; }
    startRoom(room + 1);
  }

  function killEnemy(e) {
    burst(e.x, e.y, e.color, e.type === "boss" ? 22 : 12);
    floats.push({ x: e.x, y: e.y - 10, t: 0.7, text: "POP", col: "#ffe8a3" });
    shake = Math.max(shake, e.type === "boss" ? 10 : 5);
    enemies = enemies.filter(function (x) { return x !== e; });
    if (e.type === "boss") {
      applyItem(Object.assign({ kind: "weapon", rarity: "epic" }, pick(WEAPONS.filter(function (i) { return i.r === "epic"; }))));
      applyItem(makeItem("rare"));
      winRun();
      return;
    }
    if (!enemies.length && phase === "fight") clearRoom();
  }

  function hurtPlayer(dmg, ox, oy) {
    if (player.iframes > 0 || player.dead) return;
    player.hp -= dmg;
    player.iframes = 0.35;
    player.flash = 0.18;
    flash = 0.12;
    shake = Math.max(shake, 7);
    const len = Math.hypot(ox, oy) || 1;
    player.x += (ox / len) * 28;
    player.y += (oy / len) * 28;
    const c = clampToFloor(player.x, player.y);
    player.x = c.x; player.y = c.y;
    player.dash = null;
    floats.push({ x: player.x, y: player.y - 22, t: 0.7, text: "" + dmg, col: "#fda4af" });
    if (player.hp <= 0) {
      player.hp = 0;
      player.dead = true;
      dieRun();
    }
    syncHud();
  }

  function doSlash(target) {
    if (player.slashCd > 0) return;
    player.slashCd = 0.28;
    player.slashAnim = 1;
    player.face = Math.atan2(target.y - player.y, target.x - player.x);
    const crit = Math.random() < player.crit;
    let dmg = player.dmg * (crit ? 1.6 : 1);
    dmg = Math.round(dmg);
    hitEnemy(target, dmg, crit);
    enemies.forEach(function (e) {
      if (e === target) return;
      if (dist(e.x, e.y, target.x, target.y) < 44) hitEnemy(e, Math.max(1, (dmg * 0.5) | 0), false);
    });
  }

  function hitEnemy(e, dmg, crit) {
    e.hp -= dmg;
    e.flash = 0.12;
    const ang = Math.atan2(e.y - player.y, e.x - player.x);
    e.x += Math.cos(ang) * 10;
    e.y += Math.sin(ang) * 10;
    const c = clampToFloor(e.x, e.y);
    e.x = c.x; e.y = c.y;
    if (player.leech > 0) {
      player.hp = Math.min(player.maxhp, player.hp + dmg * player.leech);
    }
    floats.push({
      x: e.x + rnd(-8, 8), y: e.y - e.r - 8, t: 0.75,
      text: crit ? dmg + "!" : "" + dmg,
      col: crit ? "#fde68a" : "#fff7ed"
    });
    burst(e.x, e.y, crit ? "#fde68a" : "#fb923c", crit ? 8 : 5);
    shake = Math.max(shake, crit ? 6 : 3);
    syncHud();
    if (e.hp <= 0) killEnemy(e);
  }

  function dashStrike(e) {
    player.dash = e;
    player.tx = e.x; player.ty = e.y;
    if (dist(player.x, player.y, e.x, e.y) <= player.slashR) doSlash(e);
  }

  function dodge(dx, dy) {
    if (player.dodgeCd > 0 || player.dead || phase === "title") return;
    const len = Math.hypot(dx, dy) || 1;
    player.vx = (dx / len) * 560;
    player.vy = (dy / len) * 560;
    player.iframes = Math.max(player.iframes, 0.22);
    player.dodgeCd = player.dodgeMax;
    player.dodging = 0.18;
    player.dash = null;
    player.tx = null;
    player.face = Math.atan2(dy, dx);
    burst(player.x, player.y, "#67e8f9", 6);
  }

  function syncHud() {
    const pct = player.maxhp ? clamp(player.hp / player.maxhp, 0, 1) : 0;
    hpfill.style.transform = "scaleX(" + pct + ")";
    hptext.textContent = Math.max(0, Math.ceil(player.hp)) + " / " + Math.ceil(player.maxhp);
    roomtext.textContent = "ROOM " + room + " / 8";
  }

  function startRun() {
    overlay.classList.add("hidden");
    hud.classList.remove("off");
    hint.style.opacity = "1";
    resetPlayer();
    startRoom(1);
    syncHud();
  }

  function dieRun() {
    phase = "dead";
    saveBest(room);
    hud.classList.add("off");
    hint.style.opacity = "0";
    overlay.classList.remove("hidden");
    overlay.innerHTML =
      "<h2>YOU DIED</h2>" +
      "<p>Room " + room + " / 8 · Best " + Math.max(room, bestRoom()) + "</p>" +
      (recap.length ? "<div class='recap'>" + recap.map(esc).join("<br>") + "</div>" : "<p>No loot this run.</p>") +
      "<button class='btn' id='again' type='button'>PLAY AGAIN</button>";
    document.getElementById("again").addEventListener("click", function (ev) {
      ev.stopPropagation();
      startRun();
    });
  }

  function winRun() {
    phase = "win";
    saveBest(8);
    hud.classList.add("off");
    hint.style.opacity = "0";
    overlay.classList.remove("hidden");
    overlay.innerHTML =
      "<h2>PIT CLEARED</h2>" +
      "<p>The Pit Lord is ash. Loot recap:</p>" +
      (recap.length ? "<div class='recap'>" + recap.map(esc).join("<br>") + "</div>" : "<p>Empty pockets, full glory.</p>") +
      "<button class='btn' id='again' type='button'>PLAY AGAIN</button>";
    document.getElementById("again").addEventListener("click", function (ev) {
      ev.stopPropagation();
      startRun();
    });
  }

  function esc(s) {
    return String(s).replace(/[&<>]/g, function (ch) {
      return ch === "&" ? "&amp;" : ch === "<" ? "&lt;" : "&gt;";
    });
  }

  function burst(x, y, col, n) {
    for (let i = 0; i < n; i++) {
      const a = rnd(0, Math.PI * 2);
      const s = rnd(40, 160);
      parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: rnd(0.25, 0.5), col: col, r: rnd(1.5, 3.2) });
    }
  }

  function tapAt(x, y) {
    if (phase !== "fight" && phase !== "loot") return;
    for (let i = gems.length - 1; i >= 0; i--) {
      if (dist(x, y, gems[i].x, gems[i].y) < 40) { pickup(gems[i]); return; }
    }
    if (phase === "loot" && exitGate && dist(x, y, exitGate.x, exitGate.y) < 54) {
      nextRoom();
      return;
    }
    if (phase === "fight") {
      let best = null, bd = 58;
      for (let i = 0; i < enemies.length; i++) {
        const d = dist(x, y, enemies[i].x, enemies[i].y) - enemies[i].r;
        if (d < bd) { bd = d; best = enemies[i]; }
      }
      if (best) { dashStrike(best); return; }
    }
    const c = clampToFloor(x, y);
    player.tx = c.x; player.ty = c.y;
    player.dash = null;
  }

  function onPtrDown(e) {
    if (ptr.id !== null && ptr.id !== e.pointerId) return;
    ptr.down = true; ptr.id = e.pointerId;
    ptr.x = ptr.sx = e.clientX; ptr.y = ptr.sy = e.clientY; ptr.t = performance.now();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  }
  function onPtrMove(e) {
    if (!ptr.down || e.pointerId !== ptr.id) return;
    ptr.x = e.clientX; ptr.y = e.clientY;
    e.preventDefault();
  }
  function onPtrUp(e) {
    if (e.pointerId !== ptr.id) return;
    const dx = e.clientX - ptr.sx, dy = e.clientY - ptr.sy;
    const dt = performance.now() - ptr.t;
    ptr.down = false; ptr.id = null;
    if (phase === "title") return;
    if (phase === "dead" || phase === "win") return;
    if (Math.hypot(dx, dy) > 36 && dt < 420) dodge(dx, dy);
    else tapAt(e.clientX, e.clientY);
    e.preventDefault();
  }

  canvas.addEventListener("pointerdown", onPtrDown, { passive: false });
  canvas.addEventListener("pointermove", onPtrMove, { passive: false });
  canvas.addEventListener("pointerup", onPtrUp, { passive: false });
  canvas.addEventListener("pointercancel", onPtrUp, { passive: false });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });

  document.getElementById("enterbtn").addEventListener("click", function (e) {
    e.stopPropagation();
    startRun();
  });
  overlay.addEventListener("click", function () {
    if (phase === "title") startRun();
  });

  function update(dt) {
    if (toastT > 0) {
      toastT -= dt;
      if (toastT <= 0) toastEl.classList.remove("show");
    }
    if (banner.t > 0) banner.t -= dt;
    shake = Math.max(0, shake - dt * 22);
    flash = Math.max(0, flash - dt * 3);

    if (embers.length < 18) {
      embers.push({
        x: rnd(0, W), y: rnd(0, H * 0.55),
        vy: -rnd(8, 22), vx: rnd(-6, 6),
        t: rnd(1.5, 4), r: rnd(0.8, 2.2)
      });
    }
    for (let i = embers.length - 1; i >= 0; i--) {
      const m = embers[i];
      m.x += m.vx * dt; m.y += m.vy * dt; m.t -= dt;
      if (m.t <= 0) embers.splice(i, 1);
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.t -= dt; p.vy += 80 * dt;
      if (p.t <= 0) parts.splice(i, 1);
    }
    for (let i = floats.length - 1; i >= 0; i--) {
      floats[i].y -= 28 * dt; floats[i].t -= dt;
      if (floats[i].t <= 0) floats.splice(i, 1);
    }
    gems.forEach(function (g) { g.t += dt; });
    if (chest && chest.t > 0) chest.t -= dt;

    if (phase !== "fight" && phase !== "loot") return;
    if (player.dead) return;

    player.slashCd = Math.max(0, player.slashCd - dt);
    player.slashAnim = Math.max(0, player.slashAnim - dt * 3.4);
    player.dodgeCd = Math.max(0, player.dodgeCd - dt);
    player.iframes = Math.max(0, player.iframes - dt);
    player.flash = Math.max(0, player.flash - dt);

    if (player.dodging > 0) {
      player.dodging -= dt;
      player.x += player.vx * dt;
      player.y += player.vy * dt;
      const c = clampToFloor(player.x, player.y);
      player.x = c.x; player.y = c.y;
    } else {
      if (player.dash && player.dash.hp > 0) {
        player.tx = player.dash.x; player.ty = player.dash.y;
        const d = dist(player.x, player.y, player.dash.x, player.dash.y);
        if (d <= player.slashR) {
          doSlash(player.dash);
          player.dash = null;
          player.tx = null;
        }
      } else if (player.dash && player.dash.hp <= 0) {
        player.dash = null;
      }
      if (player.tx != null) {
        const dx = player.tx - player.x, dy = player.ty - player.y;
        const d = Math.hypot(dx, dy);
        const spd = player.dash ? player.speed * 2.6 : player.speed;
        if (d < 4) { player.x = player.tx; player.y = player.ty; player.tx = null; }
        else {
          player.x += (dx / d) * spd * dt;
          player.y += (dy / d) * spd * dt;
          player.face = Math.atan2(dy, dx);
        }
        const c = clampToFloor(player.x, player.y);
        player.x = c.x; player.y = c.y;
      }
    }

    for (let i = gems.length - 1; i >= 0; i--) {
      if (dist(player.x, player.y, gems[i].x, gems[i].y) < 26) pickup(gems[i]);
    }
    if (phase === "loot" && exitGate && dist(player.x, player.y, exitGate.x, exitGate.y) < 38) {
      nextRoom();
      return;
    }

    if (phase !== "fight") return;

    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      e.bob += dt;
      e.flash = Math.max(0, e.flash - dt);
      const dx = player.x - e.x, dy = player.y - e.y;
      const d = Math.hypot(dx, dy) || 1;

      if (e.type === "boss") {
        if (!e.slam) {
          e.slamT -= dt;
          if (e.slamT <= 0) {
            e.slam = { x: player.x, y: player.y, t: 0.75, r: 78 };
            e.slamT = 3;
          }
        } else {
          e.slam.t -= dt;
          if (e.slam.t <= 0) {
            shake = Math.max(shake, 11);
            flash = 0.16;
            burst(e.slam.x, e.slam.y, "#ef4444", 16);
            if (dist(player.x, player.y, e.slam.x, e.slam.y) < e.slam.r + 8) {
              hurtPlayer(e.dmg, player.x - e.slam.x, player.y - e.slam.y);
            }
            e.slam = null;
          }
        }
      }

      if (e.wind > 0) {
        e.wind -= dt;
        if (e.wind <= 0) {
          if (dist(player.x, player.y, e.x, e.y) < e.range + player.r + 6) {
            hurtPlayer(e.dmg, player.x - e.x, player.y - e.y);
          }
          e.atk = e.cd;
        }
      } else {
        e.atk = Math.max(0, e.atk - dt);
        if (d > e.range + player.r * 0.4) {
          e.x += (dx / d) * e.speed * dt;
          e.y += (dy / d) * e.speed * dt;
        } else if (e.atk <= 0 && !e.slam) {
          e.wind = 0.28;
        }
      }
      const c = clampToFloor(e.x, e.y);
      e.x = c.x; e.y = c.y;
    }

    for (let i = 0; i < enemies.length; i++) {
      for (let j = i + 1; j < enemies.length; j++) {
        const a = enemies[i], b = enemies[j];
        const d = dist(a.x, a.y, b.x, b.y);
        const min = a.r + b.r - 2;
        if (d < min && d > 0.01) {
          const nx = (b.x - a.x) / d, ny = (b.y - a.y) / d;
          const push = (min - d) * 0.5;
          a.x -= nx * push; a.y -= ny * push;
          b.x += nx * push; b.y += ny * push;
        }
      }
    }
  }

  function drawBlob(x, y, r, color, color2, flashAmt, squash) {
    const sy = squash || 1;
    ctx.fillStyle = "rgba(0,0,0,0.48)";
    ctx.beginPath();
    ctx.ellipse(x, y + r * 0.62, r * 0.98, r * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();
    const g = ctx.createRadialGradient(x - r * 0.28, y - r * 0.55, r * 0.08, x, y - r * 0.08, r);
    g.addColorStop(0, flashAmt > 0 ? "#fff8f0" : shade(color, 1.25));
    g.addColorStop(1, flashAmt > 0 ? "#ffe4c8" : color2 || color);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(x, y - r * 0.18, r * 0.92, r * 1.02 * sy, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.12)";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function shade(hex, m) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = clamp((r * m) | 0, 0, 255); g = clamp((g * m) | 0, 0, 255); b = clamp((b * m) | 0, 0, 255);
    return "rgb(" + r + "," + g + "," + b + ")";
  }

  function drawFloor() {
    const ax = arena.x, ay = arena.y, aw = arena.w, ah = arena.h;
    const cx = ax + aw * 0.5;
    const topHalf = aw * 0.36 * 0.5;
    const botHalf = aw * 0.86 * 0.5;
    const tlx = cx - topHalf, trx = cx + topHalf;
    const blx = cx - botHalf, brx = cx + botHalf;
    const top = ay + 6, bot = ay + ah;

    const sky = ctx.createLinearGradient(0, 0, 0, ay + 8);
    sky.addColorStop(0, "#140808");
    sky.addColorStop(0.6, "#2a0f0a");
    sky.addColorStop(1, "#1a0c08");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = "#0c0706";
    ctx.fillRect(0, ay, W, H);

    ctx.beginPath();
    ctx.moveTo(0, ay + 10);
    ctx.lineTo(W * 0.18, ay - 30);
    ctx.lineTo(W * 0.32, ay + 14);
    ctx.lineTo(W * 0.5, ay - 48);
    ctx.lineTo(W * 0.68, ay + 10);
    ctx.lineTo(W * 0.84, ay - 26);
    ctx.lineTo(W, ay + 12);
    ctx.lineTo(W, 0);
    ctx.lineTo(0, 0);
    ctx.closePath();
    ctx.fillStyle = "#100808";
    ctx.fill();
    ctx.fillStyle = "rgba(232,93,4,0.08)";
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(tlx, top); ctx.lineTo(trx, top); ctx.lineTo(brx, bot); ctx.lineTo(blx, bot);
    ctx.closePath();
    const fg = ctx.createLinearGradient(0, top, 0, bot);
    fg.addColorStop(0, "#1a1010");
    fg.addColorStop(1, "#0e0a0a");
    ctx.fillStyle = fg;
    ctx.fill();
    ctx.strokeStyle = "#3a2218";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(tlx, top); ctx.lineTo(trx, top); ctx.lineTo(brx, bot); ctx.lineTo(blx, bot);
    ctx.clip();
    ctx.strokeStyle = "rgba(232,93,4,0.10)";
    ctx.lineWidth = 1;
    const rows = 8, cols = 7;
    for (let i = 0; i <= rows; i++) {
      const t = i / rows;
      const y = lerp(top, bot, t);
      const half = lerp(topHalf, botHalf, t);
      ctx.beginPath();
      ctx.moveTo(cx - half, y); ctx.lineTo(cx + half, y); ctx.stroke();
    }
    for (let j = 0; j <= cols; j++) {
      const u = j / cols;
      ctx.beginPath();
      ctx.moveTo(lerp(tlx, trx, u), top);
      ctx.lineTo(lerp(blx, brx, u), bot);
      ctx.stroke();
    }
    ctx.restore();

    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.beginPath();
    ctx.ellipse(cx, bot - 8, botHalf * 0.92, 18, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawHpPip(x, y, hp, max, r) {
    const w = r * 2.1, h = 4;
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(x - w / 2, y - r - 14, w, h);
    ctx.fillStyle = "#e85d04";
    ctx.fillRect(x - w / 2, y - r - 14, w * clamp(hp / max, 0, 1), h);
  }

  function draw() {
    const ox = (Math.random() - 0.5) * shake;
    const oy = (Math.random() - 0.5) * shake;
    ctx.save();
    ctx.translate(ox, oy);
    drawFloor();

    embers.forEach(function (m) {
      ctx.globalAlpha = clamp(m.t, 0, 1) * 0.55;
      ctx.fillStyle = "#e85d04";
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    });

    if (exitGate) {
      const pulse = 0.6 + Math.sin(performance.now() / 180) * 0.4;
      ctx.fillStyle = "rgba(232,93,4," + (0.16 * pulse) + ")";
      ctx.beginPath();
      ctx.ellipse(exitGate.x, exitGate.y + 6, 34, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(251,191,36," + (0.55 + 0.35 * pulse) + ")";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(exitGate.x, exitGate.y - 10, 22, 28, 0, Math.PI * 0.15, Math.PI - Math.PI * 0.15);
      ctx.stroke();
      ctx.fillStyle = "#fbbf24";
      ctx.font = "700 11px ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.fillText("NEXT", exitGate.x, exitGate.y + 22);
    }

    if (chest) {
      ctx.fillStyle = "rgba(0,0,0,0.4)";
      ctx.beginPath(); ctx.ellipse(chest.x, chest.y + 10, 16, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = chest.open ? "#92400e" : "#b45309";
      ctx.fillRect(chest.x - 12, chest.y - 8, 24, 16);
      ctx.fillStyle = "#fbbf24";
      ctx.fillRect(chest.x - 12, chest.y - 2, 24, 3);
      if (!chest.open) {
        ctx.fillStyle = "#78350f";
        ctx.fillRect(chest.x - 12, chest.y - 14, 24, 8);
      }
    }

    gems.forEach(function (g) {
      const bob = Math.sin(g.t * 5) * 3;
      ctx.fillStyle = "rgba(0,0,0,0.4)";
      ctx.beginPath(); ctx.ellipse(g.x, g.y + 8, 9, 4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.save();
      ctx.translate(g.x, g.y - 6 + bob);
      ctx.rotate(Math.PI / 4);
      ctx.shadowColor = g.color;
      ctx.shadowBlur = 12;
      ctx.fillStyle = g.color;
      ctx.fillRect(-6, -6, 12, 12);
      ctx.restore();
    });

    const drawList = enemies.slice();
    if (phase !== "title" && player.y != null) drawList.push({ y: player.y, draw: drawPlayer });
    drawList.sort(function (a, b) { return a.y - b.y; });
    drawList.forEach(function (e) {
      if (e.draw) e.draw();
      else drawEnemy(e);
    });

    parts.forEach(function (p) {
      ctx.globalAlpha = clamp(p.t * 3, 0, 1);
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    });
    floats.forEach(function (f) {
      ctx.globalAlpha = clamp(f.t * 2, 0, 1);
      ctx.fillStyle = f.col;
      ctx.font = "800 15px ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.fillText(f.text, f.x, f.y);
      ctx.globalAlpha = 1;
    });

    if (banner.t > 0) {
      ctx.globalAlpha = clamp(banner.t * 2, 0, 0.9);
      ctx.fillStyle = "#fff7ed";
      ctx.font = "800 28px ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.fillText(banner.text, W * 0.5, arena.y + arena.h * 0.18);
      ctx.globalAlpha = 1;
    }

    ctx.restore();
    if (flash > 0) {
      ctx.fillStyle = "rgba(255,60,40," + (flash * 0.28) + ")";
      ctx.fillRect(0, 0, W, H);
    }
    if (player.iframes > 0 && player.dodging > 0 && (phase === "fight" || phase === "loot")) {
      ctx.strokeStyle = "rgba(103,232,249,0.35)";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(player.x, player.y - 4, 22, 0, Math.PI * 2); ctx.stroke();
    }
  }

  function drawPlayer() {
    if (phase === "title") return;
    const ghost = player.iframes > 0 && ((performance.now() / 50) | 0) % 2 === 0;
    ctx.globalAlpha = ghost ? 0.45 : 1;
    drawBlob(player.x, player.y, player.r, player.flash > 0 ? "#fda4af" : "#67e8f9", "#0e7490", player.flash, 1);
    ctx.fillStyle = "#ecfeff";
    ctx.beginPath();
    ctx.arc(player.x + Math.cos(player.face) * 6, player.y - 6 + Math.sin(player.face) * 4, 2.2, 0, Math.PI * 2);
    ctx.fill();
    if (player.slashAnim > 0) {
      ctx.strokeStyle = "rgba(253,230,138," + player.slashAnim + ")";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(player.x, player.y - 4, player.slashR * 0.72, player.face - 1.05, player.face + 1.05);
      ctx.stroke();
      ctx.strokeStyle = "rgba(103,232,249," + (player.slashAnim * 0.7) + ")";
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawEnemy(e) {
    if (e.slam) {
      const k = 1 - e.slam.t / 0.75;
      ctx.fillStyle = "rgba(239,68,68," + (0.16 + k * 0.22) + ")";
      ctx.beginPath();
      ctx.ellipse(e.slam.x, e.slam.y + 6, e.slam.r, e.slam.r * 0.42, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(252,165,165," + (0.5 + k * 0.5) + ")";
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    const bob = e.type === "slime" ? 1 + Math.sin(e.bob * 6) * 0.08 : 1;
    const col = e.wind > 0 ? "#fecaca" : e.color;
    drawBlob(e.x, e.y, e.r, col, e.color2, e.flash, bob);
    if (e.type === "boss") {
      ctx.fillStyle = "#fbbf24";
      ctx.beginPath(); ctx.ellipse(e.x - 12, e.y - e.r - 4, 5, 10, -0.3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(e.x + 12, e.y - e.r - 4, 5, 10, 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fde68a";
      ctx.beginPath(); ctx.arc(e.x - 8, e.y - 8, 3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(e.x + 8, e.y - 8, 3, 0, Math.PI * 2); ctx.fill();
    }
    if (e.type === "slime") {
      ctx.fillStyle = "#052e16";
      ctx.beginPath(); ctx.arc(e.x - 4, e.y - 8, 2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(e.x + 4, e.y - 8, 2, 0, Math.PI * 2); ctx.fill();
    }
    drawHpPip(e.x, e.y, e.hp, e.maxhp, e.r);
  }

  function loop(ts) {
    if (!last) last = ts;
    let dt = (ts - last) / 1000;
    last = ts;
    if (dt > 0.05) dt = 0.05;
    update(dt);
    draw();
    pid = requestAnimationFrame(loop);
  }

  function showTitle() {
    phase = "title";
    const b = bestRoom();
    document.getElementById("bestline").textContent = b ? "Best room " + b : "No clears yet.";
    overlay.classList.remove("hidden");
    hud.classList.add("off");
    hint.style.opacity = "0.7";
    hpfill.style.transform = "scaleX(1)";
    hptext.textContent = "100 / 100";
    roomtext.textContent = "ROOM — / 8";
  }

  window.addEventListener("resize", resize);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", resize);
    window.visualViewport.addEventListener("scroll", function () {
      window.scrollTo(0, 0);
    });
  }
  resize();
  showTitle();
  pid = requestAnimationFrame(loop);
})();
  </script>
</body>
</html>
