<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f1115" />
  <title>Arcade</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --card: #1a1d24;
      --text: #f3f4f6;
      --muted: #9aa3b2;
      --accent: #7dd3fc;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: 2rem;
      letter-spacing: -0.03em;
    }
    p {
      margin: 0 0 1.75rem;
      color: var(--muted);
      line-height: 1.45;
    }
    .games {
      display: grid;
      gap: 0.85rem;
    }
    a.game {
      display: block;
      padding: 1.1rem 1.15rem;
      background: var(--card);
      border-radius: 1rem;
      color: inherit;
      text-decoration: none;
      min-height: 4.5rem;
    }
    a.game strong {
      display: block;
      font-size: 1.1rem;
    }
    a.game span {
      display: block;
      margin-top: 0.25rem;
      color: var(--muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Arcade</h1>
    <p>Tiny browser games for a phone. Tap one.</p>
    <div class="games" id="games">
      <a class="game" href="games/slash-pit/">
        <strong>Slash Pit</strong>
        <span>2.5D hack-and-slash crawler. Fast loot, no crafting.</span>
      </a>
    </div>
  </main>
</body>
</html>
