name: City Flow validation
on:
  push:
    branches: [feature/web-swing-city-flow]
    paths:
      - tests/_flow*
      - tests/web_swing_flow_checks.js
      - tests/web_swing_browser.py
      - .github/workflows/web-swing-flow-preview.yml
permissions:
  contents: read
concurrency:
  group: city-flow-preview
  cancel-in-progress: true
jobs:
  preview:
    if: github.ref == 'refs/heads/feature/web-swing-city-flow'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      CAPTURE_MOTION: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/web-swing-city-flow
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compose exact single-file candidate
        run: |
          python tests/_flow_build.py
          python tests/_flow_polish.py
          python tests/_flow_ui_checks.py
          test "$(git hash-object games/web-swing/index.html)" = 3fb3474a223cb2f4f23de77dbf733e124c33c80e
          python -c "from pathlib import Path; s=Path('games/web-swing/index.html').read_text(); Path('/tmp/web-swing.js').write_text(s.split('<script>')[1].split('</script>')[0])"
          node --check /tmp/web-swing.js
      - run: pip install playwright==1.55.0
      - run: playwright install --with-deps chromium webkit
      - run: python tests/web_swing_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-swing-city-flow-results
          path: test-results/
          retention-days: 7
      - name: Commit only validated game and tests to the feature branch
        if: success()
        run: |
          git fetch origin feature/web-swing-city-flow
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object games/web-swing/index.html)" = 3fb3474a223cb2f4f23de77dbf733e124c33c80e
          git add games/web-swing/index.html tests/web_swing_browser.py tests/web_swing_flow_checks.js
          git rm tests/_flow_animation.js tests/_flow_atmosphere.js tests/_flow_city.js tests/_flow_build.py tests/_flow_polish.py tests/_flow_ui_checks.py .github/workflows/web-swing-flow-preview.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Ship browser-validated City Flow controls, animation and living streets'
          git push origin HEAD:refs/heads/feature/web-swing-city-flow
