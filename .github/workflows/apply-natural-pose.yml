name: Apply Natural Spider-Man Pose
on:
  push:
    branches: [main]
    paths:
      - games/web-swing/natural_pose_patch.py
      - .github/workflows/apply-natural-pose.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply posture correction
        run: python3 games/web-swing/natural_pose_patch.py
      - name: Remove temporary files
        run: rm games/web-swing/natural_pose_patch.py .github/workflows/apply-natural-pose.yml
      - name: Commit corrected game
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Naturalize Spider-Man swing posture"
          git push origin HEAD:main
