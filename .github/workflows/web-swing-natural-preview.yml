name: Natural traversal validation
on:
  push:
    branches: [feature/web-swing-natural-tap-wallrun]
    paths:
      - tests/_natural*
      - tests/web_swing_natural_checks.js
      - .github/workflows/web-swing-natural-preview.yml
permissions:
  contents: read
concurrency:
  group: natural-traversal-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compose hash-guarded runtime and regression tests
        run: |
          python tests/_natural_build.py
          python -c "from pathlib import Path; s=Path('games/web-swing/index.html').read_text(); Path('/tmp/web-swing.js').write_text(s.split('<script>')[1].split('</script>')[0])"
          node --check /tmp/web-swing.js
      - run: pip install playwright==1.55.0
      - run: playwright install --with-deps chromium webkit
      - run: python tests/web_swing_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-swing-natural-traversal-results
          path: test-results/
          retention-days: 7
