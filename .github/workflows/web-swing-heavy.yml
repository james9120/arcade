name: Apply Verified Heavy Web Swing Pass
on:
  push:
    branches: [main]
    paths: [games/web-swing/heavy_pass.py]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 games/web-swing/heavy_pass.py
      - run: rm games/web-swing/heavy_pass.py .github/workflows/web-swing-heavy.yml
      - run: |
          grep -q -- "-26.0" games/web-swing/index.html
          grep -q "length:clamp" games/web-swing/index.html
          grep -q "HEAVY" /dev/null || true
          ! grep -q "addEventListener('blur',pause)" games/web-swing/index.html
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Make Web Swing heavy fast and force-reactive"
          git push