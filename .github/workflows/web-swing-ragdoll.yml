name: Apply Web Swing Ragdoll Pass
on:
  push:
    branches: [fix/web-swing-weight]
    paths: [games/web-swing/ragdoll_patch.py, .github/workflows/web-swing-ragdoll.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/web-swing-weight
      - run: python3 games/web-swing/ragdoll_patch.py
      - run: rm games/web-swing/ragdoll_patch.py .github/workflows/web-swing-ragdoll.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add controlled ragdoll swing posture dynamics"
          git push origin HEAD:fix/web-swing-weight
