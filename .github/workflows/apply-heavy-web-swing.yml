name: Apply Heavy Web Swing Pass
on:
  push:
    branches: [main]
    paths:
      - games/web-swing/heavy_pass.py
      - .github/workflows/apply-heavy-web-swing.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply heavy pass
        run: python3 games/web-swing/heavy_pass.py
      - name: Remove temporary transform files
        run: rm games/web-swing/heavy_pass.py .github/workflows/apply-heavy-web-swing.yml
      - name: Commit generated game
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Apply heavy Spider-Man swing physics and ragdoll tuning"
          git push origin HEAD:main
